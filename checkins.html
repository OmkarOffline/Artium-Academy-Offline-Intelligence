<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-ins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  :root{--display:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --bg:#F6F5F2;--border:#E4E1EA;--line:#EFEDF2;--ink:#1D1B22;--ink2:#3B3742;--muted:#6B6774;--faint:#9A96A3;
    --accent:#5B2A86;--accent-soft:#F2ECF8;--gold:#A8844F;--ok:#1F7A4D;--bad:#B42318;--done:#F1FAF4;
    --shadow:0 1px 2px rgba(31,26,36,.04),0 12px 28px -18px rgba(75,31,111,.28)}
  html,body{background:var(--bg)}
  body{font-family:var(--body);color:var(--ink2);-webkit-font-smoothing:antialiased;font-size:13.5px}
  .page{max-width:1700px;margin:0 auto;padding:22px 32px 48px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .eb{font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  h1{font:600 28px/1.15 var(--display);letter-spacing:-.01em;color:var(--ink)}
  .sub{font-size:14px;color:var(--muted);margin-top:4px}
  .updated{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.loading{background:var(--gold);animation:pulse 1s infinite}.dot.error{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--ink2);font:600 12.5px var(--display);cursor:pointer;white-space:nowrap}
  .btn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}.btn:disabled{opacity:.5;cursor:default}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover:not(:disabled){background:#4A2170;color:#fff}
  /* Month summary: small on purpose, the list is the page */
  .mo{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
  .mh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
  .mn{display:flex;align-items:center;gap:6px}.mn b{font:600 14px var(--display);color:var(--ink);min-width:118px;text-align:center}
  .mbtn{width:26px;height:26px;border:0;border-radius:8px;background:var(--bg);color:var(--ink2);font-size:15px;cursor:pointer}.mbtn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
  .mt{font-size:12.5px;color:var(--muted)}.mt b{color:var(--ink)}
  .trk{height:5px;background:#EEE8F6;border-radius:9px;margin:8px 0}.trk i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
  .mini{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}.mini b{color:var(--ink)}.mini .late b{color:var(--bad)}.mini .sep{flex:1}
  /* Tabs and centres */
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{border:1px solid var(--border);background:#fff;border-radius:99px;padding:7px 14px;font:600 12.5px var(--body);color:var(--ink2);cursor:pointer;white-space:nowrap}
  .pill:hover{background:var(--accent-soft)}.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .sp{flex:1}

  .dd{position:relative}
  .ddb{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 14px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);font:600 13px var(--body);cursor:pointer;box-shadow:0 1px 2px rgba(31,26,36,.04);transition:border-color .15s,box-shadow .15s}
  .ddb:hover{border-color:#CDBFE0}.ddb[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,42,134,.12)}
  .ddb .ddl{font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .ddb .ddv{color:var(--ink)}.ddb svg{color:var(--muted);transition:transform .15s}.ddb[aria-expanded="true"] svg{transform:rotate(180deg)}
  .ddb.on{background:var(--accent-soft);border-color:var(--accent)}.ddb.on .ddv,.ddb.on .ddl{color:var(--accent)}
  .ddm{position:absolute;top:calc(100% + 8px);right:0;min-width:220px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:6px;box-shadow:0 18px 40px -14px rgba(40,20,60,.28),0 2px 6px rgba(31,26,36,.06);z-index:30;max-height:340px;overflow:auto}
  .ddo{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;font:500 13px var(--body);color:var(--ink2);cursor:pointer}
  .ddo:hover{background:var(--accent-soft)}.ddo.sel{color:var(--accent);font-weight:700}.ddo svg{color:var(--accent)}
  .th{display:flex;align-items:center;gap:6px}
  .fb{display:inline-grid;place-items:center;width:22px;height:22px;border:0;border-radius:7px;background:none;color:#B9B3C4;cursor:pointer;opacity:.9}
  .fb:hover{background:var(--accent-soft);color:var(--accent)}.fb.on,.fb.srt{background:var(--accent);color:#fff}
  .fp{position:fixed;z-index:60;width:270px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 22px 48px -14px rgba(40,20,60,.34),0 2px 6px rgba(31,26,36,.06);padding:8px;font-family:var(--body);text-transform:none;letter-spacing:0}
  .fp .so{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
  .fp .so button{display:flex;align-items:center;gap:9px;border:0;background:none;padding:8px 8px;border-radius:8px;font:500 13px var(--body);color:var(--ink2);cursor:pointer;text-align:left}
  .fp .so button:hover{background:var(--accent-soft)}.fp .so button.on{color:var(--accent);font-weight:700}
  .fp input[type=search]{width:100%;height:34px;border:1px solid var(--border);border-radius:9px;padding:0 10px;font:400 13px var(--body);color:var(--ink);margin-bottom:6px}
  .fp input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,42,134,.12)}
  .fp .qa{display:flex;gap:14px;padding:2px 4px 6px}.fp .qa button{border:0;background:none;color:var(--accent);font:600 12px var(--body);cursor:pointer;padding:0}.fp .qa button:hover{text-decoration:underline}
  .fp .vl{max-height:230px;overflow:auto;border-top:1px solid var(--line);padding-top:4px}
  .fp label{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;font:500 13px var(--body);color:var(--ink2);cursor:pointer;text-transform:none;letter-spacing:0}
  .fp label:hover{background:var(--accent-soft)}.fp label input{accent-color:var(--accent);width:15px;height:15px;flex:none}
  .fp label span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fp label em{font-style:normal;font-size:11.5px;color:var(--faint)}
  .fp .fa{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
  .fp .fa .btn{height:32px}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
  .chips .cl{font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:2px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #D9CBEA;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:5px 6px 5px 12px;font:600 12px var(--body)}
  .chip button{border:0;background:rgba(91,42,134,.12);color:var(--accent);width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}.chip button:hover{background:var(--accent);color:#fff}
  .chips .ca{border:0;background:none;color:var(--muted);font:600 12px var(--body);cursor:pointer;text-decoration:underline}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:6px 14px 10px;box-shadow:var(--shadow);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1260px}
  th{text-align:left;font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.done td{background:var(--done)}
  td.nm b{color:var(--ink);font-weight:600}
  td a{color:inherit;text-decoration:none}td a:hover{color:var(--accent);text-decoration:underline}
  .day{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11.5px}
  .due{color:var(--muted);font-size:11px;margin-top:3px}.late{color:var(--bad);font-weight:600}
  .tx{width:280px;line-height:1.45;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
  .by{color:var(--ok);font-weight:700}.by small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
  .lnk{border:0;background:none;color:var(--accent);font:600 11px var(--body);cursor:pointer;padding:0;margin-top:3px}.lnk:hover{text-decoration:underline}
  .empty{padding:36px 8px;text-align:center;color:var(--muted)}
  .err{color:var(--bad);font-size:11px;margin-top:4px}
  /* Insights dialog */
  .ins-bg{position:fixed;inset:0;z-index:50;background:rgba(31,16,41,.38);backdrop-filter:blur(2px);display:grid;place-items:center;padding:24px}
  .ins-bg[hidden]{display:none}
  .ins{width:min(760px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:#fff;border-radius:24px;box-shadow:0 40px 80px -30px rgba(31,16,41,.6);overflow:hidden}
  .ins-head{position:relative;display:flex;justify-content:space-between;gap:16px;padding:24px 28px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FBF8FE,#fff)}
  .ins-head::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#C9A66B,var(--gold))}
  .ins-head h2{font:600 24px/1.2 var(--display);color:var(--ink)}
  .ins-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .ins-meta .sep{color:#D3CEDA}
  .ins-x{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .ins-x:hover{background:var(--accent-soft);color:var(--accent)}
  .ins-x svg,.rm svg,.link svg,.btn-add svg,.fu svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .ins-body{overflow-y:auto;padding:20px 28px 26px}
  .ins-h{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:4px 0 12px}
  .ins-h span{color:var(--muted);margin-left:4px}
  .ins-empty{font-size:13.5px;color:var(--faint);margin-bottom:18px}
  .conv{border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;background:#FCFBFD}
  .conv-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);margin-bottom:8px}
  .conv-top b{font:600 14px var(--display);color:var(--ink)}.conv-top .by{margin-left:auto;font-size:12px;color:var(--faint)}
  .conv ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .conv li{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline;font-size:13.5px;line-height:1.45}
  .conv li .ty{justify-self:start}
  .conv li b{display:block;color:var(--ink);font-weight:600}.conv li .nt{display:block;color:var(--ink2)}
  .ty{font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .ty.pos{background:#E5F4EC;color:var(--ok)}.ty.neg{background:#FDECEB;color:var(--bad)}.ty.req{background:#FBF1DC;color:#8A5A00}
  .fu{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px;color:var(--ink2)}
  .fu svg{color:var(--accent);margin-top:2px;flex:none}
  .btn-add{display:inline-flex;align-items:center;gap:8px;border:1px dashed #CDBFE0;background:#FBF8FE;color:var(--accent);border-radius:14px;padding:12px 18px;font:600 14px var(--body);cursor:pointer;width:100%;justify-content:center}
  .btn-add:hover{background:var(--accent-soft)}
  .frow{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
  .frow label{display:flex;flex-direction:column;gap:6px;font:600 11.5px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .frow label.grow{flex:1;min-width:220px}
  .frow input,.item select,.item textarea{font:400 14px var(--body);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px 11px;background:#fff;text-transform:none;letter-spacing:0}
  .frow input:focus,.item select:focus,.item textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,42,134,.12)}
  .seg{display:inline-flex;gap:2px;background:#F4F2F7;border-radius:10px;padding:3px}
  .seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font:600 12.5px var(--body);color:var(--ink2);cursor:pointer;text-transform:none;letter-spacing:0}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(31,26,36,.15)}
  .ty-seg button.pos[aria-pressed="true"]{background:#E5F4EC;color:var(--ok)}
  .ty-seg button.neg[aria-pressed="true"]{background:#FDECEB;color:var(--bad)}
  .ty-seg button.req[aria-pressed="true"]{background:#FBF1DC;color:#8A5A00}
  .items{display:flex;flex-direction:column;gap:10px}
  .item{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff}
  .item-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
  .item select{min-width:280px}
  .item textarea{width:100%;resize:vertical;line-height:1.45}
  .rm{margin-left:auto;width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center}
  .rm:hover{background:#FDECEB;color:var(--bad)}
  .link{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:10px 2px}
  .fu-box{margin-top:4px;border-top:1px solid var(--line);padding-top:4px}
  .fu-box.open .link{cursor:default;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .ins-msg{min-height:18px;font-size:13px;color:var(--bad);margin-top:6px}
  .ins-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .st{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);border-radius:999px;padding:3px 10px}
  .st.on{background:#E5F4EC;color:var(--ok)}.st.off{background:#F3F1F6;color:var(--muted)}
  .st i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .eyebrow{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .fam{display:block;margin-top:6px;font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 8px;line-height:1.4;max-width:260px}
  .fam b{color:var(--ink);font-weight:600}
  .fam em{font-style:normal;font-weight:700;color:#8A5A00;background:#FBF1DC;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
  #ins-fam{margin-top:8px}#ins-fam .fam{max-width:none;display:inline-block;margin:0 6px 4px 0}
  .conv.hl{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,42,134,.12)}
  .conv-top .lnk{padding:0;margin:0 0 0 4px;font-size:12px}
  .ins .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px -8px rgba(91,42,134,.6)}
  .ins .btn{height:auto;padding:9px 16px;border-radius:11px;font:600 13.5px var(--body)}.ins .btn.primary:hover:not(:disabled){background:#4A2170;color:#fff}
  .conv-top .by{color:var(--faint);font-weight:400}
  .ins-bg *{box-sizing:border-box}
  .rb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:10px;padding:7px 12px;font:700 12.5px var(--body);cursor:pointer;white-space:nowrap}.rb:hover{background:var(--accent-soft)}
  .hint{margin-top:8px;font-size:11.5px;color:var(--muted);background:#FBF4E8;border-radius:8px;padding:6px 8px;max-width:270px;line-height:1.4}
  .rins{width:290px;line-height:1.45}.rins div+div{margin-top:5px}.rins b{color:var(--ink);font-weight:600}
  .rins .tg{display:inline-block;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-right:5px}
  .rins .pos{background:#E5F4EC;color:var(--ok)}.rins .neg{background:#FDECEB;color:var(--bad)}.rins .req{background:#FBF1DC;color:#8A5A00}.rins .rsn{background:#EFE7F8;color:var(--accent)}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div><div class="eb">Check-ins</div><h1>Check-ins.</h1><div class="sub">Day 20, 45 and 80 calls to new learners.</div></div>
    <div class="updated"><span class="dot loading" id="dot"></span><span id="state">Loading.</span><button class="btn" type="button" id="refresh">Refresh</button></div>
  </div>
  <div class="mo">
    <div class="mh"><div class="mn"><button class="mbtn" id="mprev" aria-label="Previous month">‹</button><b id="mlabel">—</b><button class="mbtn" id="mnext" aria-label="Next month">›</button></div><div class="mt" id="mtot"></div></div>
    <div class="trk"><i id="mbar" style="width:0"></i></div>
    <div class="mini" id="mini"></div>
  </div>
  <div class="bar" id="tabs"></div>
  <div class="chips" id="chips" hidden></div>
  <div class="card"><table><thead id="thead"></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden></div></div>
</div>
<script>
const CENTRES=['Alwarpet','Thoraipakkam','Borewell Road'];
const DAYS=[20,45,80],LEAD=5,MISSED_AFTER=30,NODATE_WITHIN=100;
const START=new Date(2026,9,1);   // only admissions from 1 October 2026 are followed, so the journey starts forwards, not backwards
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function parseDate(str){
  if(!str)return null;const s=String(str).trim();
  const a=s.match(/^(\d{1,2})-([A-Za-z]+)-(\d{2,4})$/);
  if(a){const m=MON.findIndex(x=>x.toLowerCase()===a[2].slice(0,3).toLowerCase());const y=a[3].length===2?2000+ +a[3]:+a[3];if(m>=0)return new Date(y,m,+a[1]);}
  const b=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(b){const y=b[3].length===2?2000+ +b[3]:+b[3];return new Date(y,+b[2]-1,+b[1]);}
  const d=new Date(s);return isNaN(d)?null:d;
}
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const daysBetween=(a,b)=>Math.round((midnight(b)-midnight(a))/864e5);
const fmt=d=>d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
const fmtS=d=>d.getDate()+' '+MON[d.getMonth()];
const TODAY=midnight(new Date());
let ITEMS=[],NODATE=[],FAM=new Map(),BYJ=new Map(),BYP=new Map(),DONE={},INS=[],STAFF=[],ME={name:'',email:'',centre:'',canEdit:false};
let CEN='All',TAB='due',MONTH=TODAY.getFullYear()*12+TODAY.getMonth();
const KEEP=new Set();   // KEEP: rows marked done in this visit stay on the list, in green, until you change tab   // notes typed but not saved yet

const pack=v=>{const t=String(v||'').trim();if(!t||t.toLowerCase()==='not mentioned')return '';const n=parseFloat(t);return isFinite(n)&&/^[\d.\s]*(m|months?)?$/i.test(t)?n+(n===1?' month':' months'):t;};
const relOf=v=>{const t=String(v||'').trim();return /^(none|na|n\/a|-|)$/i.test(t)?'':t;};
const last10=v=>String(v||'').replace(/\D/g,'').slice(-10);
function buildFamilies(rowsByCentre){   // every admission, any date, any centre: who is linked to whom (Relationship + Learner ID of the 1st Joinee), or shares a phone number
  FAM=new Map();BYJ=new Map();BYP=new Map();
  CENTRES.forEach(c=>(rowsByCentre[c]||[]).forEach(r=>{
    const own=(r[2]||'').trim();if(own&&own!==c)return;
    const id=(r[3]||'').trim().toUpperCase(),name=(r[4]||'').trim();if(!id||!name)return;
    const j=(r[31]||'').trim().toUpperCase(),x={id,name,centre:c,phone:(r[7]||'').trim(),p10:last10(r[7]),rel:relOf(r[30]),joinee:/^[A-Z]{2,4}-\d+$/.test(j)?j:''};
    FAM.set(id,x);if(x.joinee){if(!BYJ.has(x.joinee))BYJ.set(x.joinee,[]);BYJ.get(x.joinee).push(x);}
    if(x.p10.length===10){if(!BYP.has(x.p10))BYP.set(x.p10,[]);BYP.get(x.p10).push(x);}
  }));
}
const cap1=t=>t?t.charAt(0).toUpperCase()+t.slice(1):'';
function relatives(id){
  const me=FAM.get(String(id||'').toUpperCase());if(!me)return[];
  const out=new Map(),add=(x,label)=>{if(!x||x.id===me.id||x.name.toLowerCase()===me.name.toLowerCase()||out.has(x.id))return;out.set(x.id,{x,label:cap1(label)||'Family'});};
  if(me.joinee)add(FAM.get(me.joinee),me.rel);                                   // the 1st joinee I am linked to
  (BYJ.get(me.id)||[]).forEach(x=>add(x,x.rel));                                  // learners linked to me as their 1st joinee
  if(me.joinee)(BYJ.get(me.joinee)||[]).forEach(x=>add(x,x.rel||me.rel));         // others linked to the same 1st joinee
  if(me.p10.length===10)(BYP.get(me.p10)||[]).forEach(x=>add(x,'Same phone'));
  return [...out.values()].slice(0,4);
}
let OPENIDS=null;
function famHTML(id){
  const open=OPENIDS||(OPENIDS=new Set(ITEMS.filter(dueNow).map(x=>String(x.id).toUpperCase())));
  return relatives(id).map(({x,label})=>`<span class="fam">${esc(label)}: <b>${esc(x.name)}</b>${x.phone&&x.p10!==last10((FAM.get(String(id).toUpperCase())||{}).phone)?' · '+esc(x.phone):''}${x.centre!==(FAM.get(String(id).toUpperCase())||{}).centre?' · '+esc(x.centre):''}${open.has(x.id)?'<em>Check-in due too</em>':''}</span>`).join('');
}
function build(rowsByCentre){
  buildFamilies(rowsByCentre);
  ITEMS=[];NODATE=[];
  CENTRES.forEach(c=>{
    if(ME.scoped&&c!==ME.centre)return;   // a centre's own team sees its own centre only
    (rowsByCentre[c]||[]).forEach(r=>{
      const own=(r[2]||'').trim();if(own&&own!==c)return;
      const name=(r[4]||'').trim(),adm=parseDate(r[0]);if(!name||!adm||adm<START)return;
      const L={centre:c,id:(r[3]||'').trim(),name,adm,fc:parseDate(r[22]),phone:(r[7]||'').trim(),age:(r[6]||'').trim(),course:(r[8]||'').trim(),level:(r[9]||'').trim(),pack:pack(r[12]),teacher:(r[29]||'').trim()};
      if(!L.fc){if(daysBetween(adm,TODAY)<=NODATE_WITHIN&&daysBetween(adm,TODAY)>=0)NODATE.push(L);return;}
      DAYS.forEach(n=>{
        const due=addDays(L.fc,n);
        ITEMS.push(Object.assign({day:n,due,key:c+'|'+(L.id||L.name.toLowerCase())+'|'+n},L));
      });
    });
  });
}
const isDone=it=>!!DONE[it.key];
const appears=it=>daysBetween(TODAY,it.due)<=LEAD;                 // 5 days before the checkpoint
const missed=it=>!isDone(it)&&daysBetween(it.due,TODAY)>MISSED_AFTER;
const dueNow=it=>!isDone(it)&&appears(it)&&!missed(it);
let FCM='',FILT={},SORT=null;
const inCen=it=>CEN==='All'||it.centre===CEN;
const inScope=it=>inCen(it)&&(FCM===''||(it.fc&&moIdx(it.fc)===FCM));   // centre, and the month of the first class
const moIdx=d=>d.getFullYear()*12+d.getMonth();

const doneMo=it=>{const d=DONE[it.key],t=d&&d.at?new Date(d.at):null;return t&&!isNaN(t)?moIdx(t):moIdx(it.due);};
const carried=it=>!isDone(it)&&moIdx(it.due)<moIdx(TODAY)&&daysBetween(it.due,TODAY)>0&&daysBetween(it.due,TODAY)<=MISSED_AFTER;
/* A month counts everything that was due in it, plus what was recorded in it from earlier months, plus (for this month) earlier calls that are still waiting. So a call is never lost from the count when it is recorded. */
const monthSet=(M,c)=>c.filter(it=>moIdx(it.due)===M||(isDone(it)&&doneMo(it)===M&&moIdx(it.due)<M)||(M===moIdx(TODAY)&&carried(it)));
function summary(){
  const mi=MONTH,mine=monthSet(mi,ITEMS.filter(inScope));
  const pct=(d,t)=>t?Math.round(d/t*100):0;
  const tot=mine.length,dn=mine.filter(isDone).length,cr=mine.filter(it=>moIdx(it.due)<mi).length;
  document.getElementById('mlabel').textContent=MFULL[mi%12]+' '+Math.floor(mi/12);
  document.getElementById('mtot').innerHTML=`<b>${tot}</b> scheduled &nbsp;·&nbsp; <b>${dn}</b> done &nbsp;·&nbsp; <b>${pct(dn,tot)}%</b> complete`;
  document.getElementById('mbar').style.width=pct(dn,tot)+'%';
  const per=DAYS.map(n=>{const a=mine.filter(x=>x.day===n),d=a.filter(isDone).length;return `<span>Day ${n} <b>${d} of ${a.length}</b> · ${pct(d,a.length)}%</span>`;}).join('');
  const due=ITEMS.filter(it=>inScope(it)&&dueNow(it)),over=due.filter(it=>daysBetween(it.due,TODAY)>0).length;
  document.getElementById('mini').innerHTML=per+(cr?`<span>Includes <b>${cr}</b> from earlier months</span>`:'')+`<span class="sep"></span><span>Due now <b>${due.length}</b></span><span class="late">Overdue <b>${over}</b></span><span>No first class date <b>${NODATE.filter(inCen).length}</b></span>`;
}
function tabsDef(){
  const c=ITEMS.filter(inScope),due=c.filter(dueNow);
  return [['due','Due',due.length],...DAYS.map(n=>['d'+n,'Day '+n,due.filter(x=>x.day===n).length]),
    ['done','Done',monthSet(MONTH,c).filter(isDone).length],['missed','Missed',c.filter(missed).length],['nodate','No first class date',NODATE.filter(inCen).length]];
}
const CHEV='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const TICK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function dd(id,label,val,opts,on,shown){
  const cur=opts.find(o=>String(o[0])===String(val)),sv=shown!==undefined?shown:(cur?cur[1]:'');
  return `<div class="dd" data-dd="${id}"><button type="button" class="ddb${on?' on':''}" aria-haspopup="listbox" aria-expanded="false"><span class="ddl">${label}</span><span class="ddv">${esc(sv)}</span>${CHEV}</button><div class="ddm" role="listbox" hidden>${opts.map(o=>`<button type="button" class="ddo${String(o[0])===String(val)?' sel':''}" role="option" data-v="${esc(o[0])}"><span>${esc(o[1])}</span>${String(o[0])===String(val)?TICK:''}</button>`).join('')}</div></div>`;
}
const DD={cen:v=>{CEN=v;try{localStorage.setItem('artium_ck_centre',CEN);}catch(x){}},fcm:v=>{FCM=v===''?'':+v;},more:v=>{TAB=v||'due';}};
function drawTabs(){
  const el=document.getElementById('tabs'),T=tabsDef(),cnt=Object.fromEntries(T.map(t=>[t[0],t[2]])),main=T.filter(t=>/^(due|d\d+|done)$/.test(t[0]));
  const fcs=[...new Set(ITEMS.filter(inCen).map(it=>moIdx(it.fc)))].sort((a,b)=>a-b);
  const fcOpts=[['','All months']].concat(fcs.map(m=>[m,MFULL[m%12]+' '+Math.floor(m/12)]));
  const moreOpts=[['','Main lists'],['missed','Missed ('+cnt.missed+')'],['nodate','No first class date ('+cnt.nodate+')']];
  el.innerHTML=main.map(t=>`<button type="button" class="pill" data-t="${t[0]}" aria-pressed="${TAB===t[0]}">${t[1]} (${t[2]})</button>`).join('')+'<span class="sp"></span>'+
    (ME.scoped?'':dd('cen','Centre',CEN,[['All','All centres']].concat(CENTRES.map(c=>[c,c])),false))+
    dd('fcm','First class',FCM,fcOpts,FCM!=='')+
    dd('more','More lists',/^(missed|nodate)$/.test(TAB)?TAB:'',moreOpts,/^(missed|nodate)$/.test(TAB),/^(missed|nodate)$/.test(TAB)?(TAB==='missed'?'Missed':'No first class date'):'')
}
function dueText(it){
  const g=daysBetween(it.due,TODAY);
  return g>0?`<div class="due late">Overdue by ${g} ${g===1?'day':'days'}</div>`:g===0?`<div class="due">Due today</div>`:`<div class="due">Due ${fmtS(it.due)}</div>`;
}
function cells(it){
  const cen=CEN==='All'?`<div class="due">${esc(it.centre)}</div>`:'';
  return `<td>${fmt(it.adm)}</td><td>${it.fc?fmt(it.fc):'—'}</td><td class="nm"><b>${esc(it.name)}</b>${cen}${famHTML(it.id)}</td><td>${it.phone?`<a href="tel:${esc(it.phone.replace(/[^0-9+]/g,''))}">${esc(it.phone)}</a>`:'—'}</td><td>${esc(it.age)||'—'}</td><td>${esc(it.course)||'—'}</td><td>${esc(it.level)||'—'}</td><td>${esc(it.pack)||'—'}</td><td>${esc(it.teacher)||'—'}</td>`;
}
const TYC={Positive:'pos',Concern:'neg',Request:'req',Reason:'rsn'};
const entriesOf=id=>{id=String(id||'').toUpperCase();return id?INS.filter(e=>e.ids.some(i=>String(i).toUpperCase()===id)):[];};
const dKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dShow=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:esc(s);};
function hint(it){   // someone already spoke to this learner lately (Focus Groups or an earlier check-in): avoid calling twice
  const lo=dKey(addDays(TODAY,-21)),e=entriesOf(it.id).filter(x=>x.date>=lo).sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at))[0];
  return e?`<div class="hint">Already spoken to on ${dShow(e.date)} by ${esc(e.byName||String(e.by).split('@')[0])} (${esc(e.how)}, ${esc(e.src||'Focus Groups')}).</div>`:'';
}
function insCell(it,d){
  const es=entriesOf(it.id).filter(x=>x.src==='Check-in Day '+it.day),e=es.length?{items:es.slice().sort((a,b)=>(a.date+a.at).localeCompare(b.date+b.at)).flatMap(x=>x.items)}:null,lines=e?e.items.map(i=>`<div><span class="tg ${TYC[i.type]||'neg'}">${esc(i.type)}</span>${i.type==='Reason'?`<b>${esc(i.theme)}.</b>`:`<b>${esc(i.theme)}.</b>`} ${esc(i.note)}</div>`).join(''):`<div>${esc(d.note)||'<span class="due">No notes.</span>'}</div>`;
  return `<div class="rins">${lines}</div><button class="lnk" data-view="${esc(it.key)}">Open conversation</button>`;
}
function row(it){
  const d=DONE[it.key];
  if(d){
    const at=d.at?new Date(d.at):null,when=at?fmtS(at)+', '+at.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'';
    return `<tr class="done">${cells(it)}<td><span class="day">Day ${it.day}</span><div class="due">Done ${esc(when)}</div></td><td>${insCell(it,d)}</td><td class="by">${esc(d.by)}<small>${esc(when)}</small><button class="lnk" data-rec="${esc(it.key)}">Record another insight</button></td></tr>`;
  }
  return `<tr>${cells(it)}<td><span class="day">Day ${it.day}</span>${dueText(it)}</td><td><button type="button" class="rb" data-rec="${esc(it.key)}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Record insights</button>${hint(it)}</td><td>—</td></tr>`;
}
const COLS=[['adm','Admission'],['fc','First class'],['name','Learner'],['phone','Phone'],['age','Age group'],['course','Course'],['level','Level'],['pack','Package'],['teacher','Teacher'],['day','Check-in'],['','Insights'],['by','Check-in by']];
const COLS_ND=[['adm','Admission'],['name','Learner'],['phone','Phone'],['age','Age group'],['course','Course'],['level','Level'],['pack','Package'],['teacher','Teacher'],['centre','Centre']];
const GET={adm:it=>fmt(it.adm),fc:it=>it.fc?fmt(it.fc):'—',name:it=>it.name,phone:it=>it.phone||'—',age:it=>it.age||'—',course:it=>it.course||'—',level:it=>it.level||'—',pack:it=>it.pack||'—',teacher:it=>it.teacher||'—',centre:it=>it.centre,day:it=>'Day '+it.day,by:it=>DONE[it.key]?DONE[it.key].by:'Not done yet'};
const RAW={adm:it=>+it.adm,fc:it=>it.fc?+it.fc:0,day:it=>it.day||0};
const sortVal=(k,it)=>RAW[k]?RAW[k](it):String(GET[k](it)).toLowerCase();
const cmpBy=(k,a,b)=>{const x=sortVal(k,a),y=sortVal(k,b);return typeof x==='number'?x-y:x.localeCompare(y,undefined,{numeric:true});};
const LABEL=Object.fromEntries(COLS.concat(COLS_ND).filter(c=>c[0]));
const FUN='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.5 7.5V19l-3 1.6v-8.1z"/></svg>';
const headHTML=cols=>'<tr>'+cols.map(([k,l])=>k?`<th><div class="th"><span>${l}</span><button type="button" class="fb${FILT[k]?' on':''}${SORT&&SORT.k===k?' srt':''}" data-f="${k}" aria-label="Filter and sort ${l}" title="Filter and sort">${FUN}</button></div></th>`:`<th>${l}</th>`).join('')+'</tr>';
function baseList(){
  if(TAB==='nodate')return NODATE.filter(inCen).sort((a,b)=>b.adm-a.adm);
  const c=ITEMS.filter(inScope),shown=it=>appears(it)&&(isDone(it)?daysBetween(it.due,TODAY)<=MISSED_AFTER:!missed(it));   // recorded check-ins stay in the list, in green
  let list;
  if(TAB==='due')list=c.filter(shown);
  else if(/^d\d+$/.test(TAB))list=c.filter(shown).filter(x=>'d'+x.day===TAB);
  else if(TAB==='done')list=monthSet(MONTH,c).filter(isDone);
  else list=c.filter(missed);
  list.sort(TAB==='done'?(a,b)=>String(DONE[b.key].at).localeCompare(String(DONE[a.key].at)):(a,b)=>a.due-b.due||a.name.localeCompare(b.name));
  return list;
}
function applyCols(list,cols,skip){
  const keys=cols.map(c=>c[0]).filter(Boolean);
  keys.forEach(k=>{if(k!==skip&&FILT[k])list=list.filter(it=>FILT[k].has(GET[k](it)));});
  if(!skip&&SORT&&keys.includes(SORT.k)){const d=SORT.d==='desc'?-1:1;list=list.slice().sort((a,b)=>d*cmpBy(SORT.k,a,b));}
  return list;
}
function draw(){
  OPENIDS=null;closeFp();summary();drawTabs();
  const head=document.getElementById('thead'),body=document.getElementById('rows'),empty=document.getElementById('empty');
  const nd=TAB==='nodate',cols=nd?COLS_ND:COLS;
  head.innerHTML=headHTML(cols);
  const list=applyCols(baseList(),cols);
  body.innerHTML=nd?list.map(L=>`<tr><td>${fmt(L.adm)}</td><td class="nm"><b>${esc(L.name)}</b>${famHTML(L.id)}</td><td>${L.phone?`<a href="tel:${esc(L.phone.replace(/[^0-9+]/g,''))}">${esc(L.phone)}</a>`:'—'}</td><td>${esc(L.age)||'—'}</td><td>${esc(L.course)||'—'}</td><td>${esc(L.level)||'—'}</td><td>${esc(L.pack)||'—'}</td><td>${esc(L.teacher)||'—'}</td><td>${esc(L.centre)}</td></tr>`).join(''):list.map(row).join('');
  const act=Object.keys(FILT).filter(k=>cols.some(c=>c[0]===k)),ch=document.getElementById('chips');
  ch.hidden=!act.length;
  ch.innerHTML=act.length?'<span class="cl">Filtered by</span>'+act.map(k=>{const v=[...FILT[k]];return `<span class="chip">${LABEL[k]}: ${esc(v.length<=2?v.join(', '):v.length+' selected')}<button type="button" data-fx="${k}" aria-label="Remove filter">×</button></span>`;}).join('')+'<button type="button" class="ca" data-fclear="1">Clear all</button>':'';
  empty.hidden=!!list.length;
  empty.textContent=act.length?'Nothing matches these filters.':{due:'Nothing is due right now.',done:'No check-ins are done for this month yet.',missed:'No missed check-ins.',nodate:'Everyone has a first class date.'}[TAB]||'Nothing is due for this checkpoint right now.';
}
/* Column filter: the same idea as a Google Sheet. Sort, search the values, tick the ones you want. */
let FP=null;
function closeFp(){if(FP){FP.remove();FP=null;}}
function openFp(btn,k){
  closeFp();
  const nd=TAB==='nodate',cols=nd?COLS_ND:COLS,pool=applyCols(baseList(),cols,k);
  const m=new Map();pool.forEach(it=>{const v=GET[k](it);if(!m.has(v))m.set(v,{n:0,it});m.get(v).n++;});
  const vals=[...m.keys()].sort((a,b)=>cmpBy(k,m.get(a).it,m.get(b).it));
  const sel=new Set(FILT[k]?[...FILT[k]].filter(v=>m.has(v)):vals);
  const dateCol=k==='adm'||k==='fc';
  FP=document.createElement('div');FP.className='fp';
  FP.innerHTML=`<div class="so"><button type="button" data-so="asc" class="${SORT&&SORT.k===k&&SORT.d==='asc'?'on':''}">${dateCol?'Oldest first':'Sort A to Z'}</button><button type="button" data-so="desc" class="${SORT&&SORT.k===k&&SORT.d==='desc'?'on':''}">${dateCol?'Newest first':'Sort Z to A'}</button></div>
    <input type="search" placeholder="Search ${LABEL[k].toLowerCase()}" aria-label="Search values"><div class="qa"><button type="button" data-qa="all">Select all</button><button type="button" data-qa="none">Clear</button></div>
    <div class="vl">${vals.map(v=>`<label data-v="${esc(v)}"><input type="checkbox" ${sel.has(v)?'checked':''}><span>${esc(v)}</span><em>${m.get(v).n}</em></label>`).join('')}</div>
    <div class="fa"><button type="button" class="btn" data-fc="no">Cancel</button><button type="button" class="btn pri" data-fc="ok">Apply</button></div>`;
  document.body.appendChild(FP);
  const r=btn.getBoundingClientRect();FP.style.top=Math.min(r.bottom+6,innerHeight-FP.offsetHeight-10)+'px';FP.style.left=Math.max(10,Math.min(r.left-10,innerWidth-290))+'px';
  const q=FP.querySelector('input[type=search]');q.focus();
  q.oninput=()=>{const t=q.value.toLowerCase();FP.querySelectorAll('.vl label').forEach(l=>l.hidden=!l.dataset.v.toLowerCase().includes(t));};
  FP.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.so){SORT={k,d:b.dataset.so};draw();}
    else if(b.dataset.qa){FP.querySelectorAll('.vl label').forEach(l=>{if(!l.hidden)l.querySelector('input').checked=b.dataset.qa==='all';});}
    else if(b.dataset.fc==='no')closeFp();
    else if(b.dataset.fc==='ok'){const on=new Set([...FP.querySelectorAll('.vl label')].filter(l=>l.querySelector('input').checked).map(l=>l.dataset.v));if(on.size===vals.length)delete FILT[k];else FILT[k]=on;draw();}
  };
}
document.addEventListener('click',e=>{
  const t=e.target;
  const ddb=t.closest('.ddb');
  document.querySelectorAll('.dd').forEach(d=>{const open=ddb&&d.contains(ddb)&&d.querySelector('.ddm').hidden;d.querySelector('.ddm').hidden=!open;d.querySelector('.ddb').setAttribute('aria-expanded',open?'true':'false');});
  const o=t.closest('.ddo');if(o){const id=o.closest('.dd').dataset.dd;DD[id](o.dataset.v);KEEP.clear();draw();return;}
  const f=t.closest('.fb');if(f){const again=FP&&FP.dataset.k===f.dataset.f;if(again)closeFp();else{openFp(f,f.dataset.f);FP.dataset.k=f.dataset.f;}return;}
  if(FP&&!t.closest('.fp'))closeFp();
  const x=t.closest('[data-fx]');if(x){delete FILT[x.dataset.fx];draw();return;}
  if(t.closest('[data-fclear]')){FILT={};SORT=null;draw();return;}
  const b=t.closest('button');if(!b)return;
  if(b.dataset.t){TAB=b.dataset.t;KEEP.clear();draw();}
  else if(b.dataset.rec||b.dataset.view){const it=ITEMS.find(x=>x.key===(b.dataset.rec||b.dataset.view));if(it)openRec(it,!!b.dataset.view);}
  else if(b.dataset.edit)startEdit(b.dataset.edit);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeFp();document.querySelectorAll('.ddm').forEach(m=>m.hidden=true);}});
document.getElementById('mprev').onclick=()=>{MONTH--;draw();};
document.getElementById('mnext').onclick=()=>{MONTH++;draw();};
document.getElementById('refresh').onclick=()=>{ArtiumAuth.freshUntil=Date.now()+15000;load();};

/* ── Recording the call: the same Learner insights dialog as Focus Groups. Saving it marks the check-in done, and the conversation shows in Focus Groups too. ── */
const THEMES=['Satisfaction with Teacher','Satisfaction with Staff','Communication with & from the Staff','Musical Progress','Performances & Events','Fees & Packages','Curriculum','Centre facilities','Other'];
const TYPES=[['Positive','pos'],['Concern','neg'],['Request','req']];
const itemHTML=i=>`<li><span class="ty ${TYC[i.type]||'neg'}">${esc(i.type)}</span><div><b>${esc(i.theme)}</b><span class="nt">${esc(i.note)}</span></div></li>`;
document.body.insertAdjacentHTML('beforeend',`<div class="ins-bg" id="ins" hidden><div class="ins" role="dialog" aria-modal="true" aria-labelledby="ins-name">
  <div class="ins-head"><div><div class="eyebrow" id="ins-eye">Learner insights</div><h2 id="ins-name"></h2><div class="ins-meta" id="ins-meta"></div><div id="ins-fam"></div></div>
    <button type="button" class="ins-x" id="ins-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ins-body"><div id="ins-hist"></div><div id="ins-form"></div></div></div></div>`);
let cur=null,draft=null,viewOnly=false,editId='',hl='';
const canEdit=e=>(e.by===ME.email||ME.canEdit)&&!e.items.some(i=>i.type==='Reason');
const blank=()=>({date:dKey(TODAY),with:'Parent',how:'Call',items:[{theme:'',type:'',note:''}],follow:{action:'',owner:'',due:''},showFollow:false});
function openRec(it,view){
  cur=it;viewOnly=!!view;draft=view?null:blank();editId='';hl=it.hl||'';
  document.getElementById('ins-eye').textContent=(it.day?'Check-in · Day '+it.day+' · ':'')+'Learner insights';
  document.getElementById('ins-name').textContent=it.name;
  document.getElementById('ins-meta').innerHTML=[esc(it.id),esc(it.centre),it.phone?esc(it.phone):'',esc(it.age),esc(it.course)].filter(Boolean).join('<span class="sep">·</span>');
  document.getElementById('ins-fam').innerHTML=famHTML(it.id);
  paintIns();document.getElementById('ins').hidden=false;document.body.style.overflow='hidden';
}
function closeIns(){if(draft&&draft.items.some(i=>i.note.trim())&&!editId&&!confirm('Close without saving this conversation?'))return;document.getElementById('ins').hidden=true;document.body.style.overflow='';cur=null;draft=null;editId='';}
function startEdit(id){
  const e=INS.find(x=>x.id===id);if(!e||!cur)return;
  draft={date:e.date,with:e.with,how:e.how,items:e.items.map(i=>({theme:i.theme,type:i.type,note:i.note})),follow:e.follow?{action:e.follow.action||'',owner:e.follow.owner||'',due:e.follow.due||''}:{action:'',owner:'',due:''},showFollow:!!e.follow};
  editId=id;paintIns();const f=document.getElementById('ins-form');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function paintIns(){
  const list=entriesOf(cur.id).slice().sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at));
  document.getElementById('ins-hist').innerHTML=list.length?`<div class="ins-h">Past conversations <span>${list.length}</span></div>`+list.map(e=>`<article class="conv${e.id===hl?' hl':''}">
      <div class="conv-top"><b>${dShow(e.date)}</b><span>${esc(e.with)} · ${esc(e.how)}</span>${e.src?`<span class="ty rsn">${esc(e.src)}</span>`:''}<span class="by">Logged by ${esc(e.byName||String(e.by).split('@')[0])}</span>${canEdit(e)?`<button type="button" class="lnk" data-edit="${esc(e.id)}">Edit</button>`:''}</div>
      <ul>${e.items.map(itemHTML).join('')}</ul>
      ${e.follow?`<div class="fu"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg><span><b>Follow-up:</b> ${esc(e.follow.action)}${e.follow.owner?' · '+esc(e.follow.owner):''}${e.follow.due?' · by '+dShow(e.follow.due):''}</span></div>`:''}
    </article>`).join(''):'<div class="ins-empty">No conversations logged yet.</div>';
  const f=document.getElementById('ins-form');
  if(!draft){f.innerHTML='';return;}
  const seg=(name,opts,val)=>`<div class="seg" data-f="${name}">${opts.map(o=>`<button type="button" data-v="${o}" aria-pressed="${o===val}">${o}</button>`).join('')}</div>`;
  f.innerHTML=`<div class="ins-h">${editId?'Edit conversation':'New conversation'}</div>
    <div class="frow"><label>Date<input type="date" id="f-date" value="${draft.date}" max="${dKey(TODAY)}"></label>
      <label>Spoke with${seg('with',['Parent','Learner','Both'],draft.with)}</label><label>How${seg('how',['Call','In centre','WhatsApp'],draft.how)}</label></div>
    <div class="items">${draft.items.map((it,i)=>`<div class="item" data-i="${i}">
      <div class="item-top"><select data-k="theme" aria-label="Theme"><option value="">Pick a theme</option>${THEMES.map(t=>`<option${t===it.theme?' selected':''}>${t}</option>`).join('')}</select>
        <div class="seg ty-seg" data-k="type">${TYPES.map(([t,c])=>`<button type="button" class="${c}" data-v="${t}" aria-pressed="${t===it.type}">${t}</button>`).join('')}</div>
        ${draft.items.length>1?`<button type="button" class="rm" data-rm="${i}" aria-label="Remove this insight"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`:''}</div>
      <textarea data-k="note" rows="2" placeholder="What did they say?">${esc(it.note)}</textarea></div>`).join('')}</div>
    <button type="button" class="link" id="f-more"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add another insight</button>
    <div class="fu-box${draft.showFollow?' open':''}"><button type="button" class="link" id="f-fu">${draft.showFollow?'Follow-up':'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add a follow-up (optional)'}</button>
      ${draft.showFollow?`<div class="frow"><label class="grow">What needs doing<input id="f-act" value="${esc(draft.follow.action)}" placeholder="e.g. Plan a student showcase next month"></label>
        <label>Owner<input id="f-own" list="staff-list" value="${esc(draft.follow.owner)}" placeholder="Name"></label><label>Due<input type="date" id="f-due" value="${draft.follow.due}"></label></div>
        <datalist id="staff-list">${STAFF.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`:''}</div>
    <div class="ins-msg" id="ins-msg"></div>
    <div class="ins-actions"><button type="button" class="btn" id="f-cancel">Cancel</button><button type="button" class="btn primary" id="f-save">${editId?'Save changes':'Save conversation'}</button></div>`;
  f.querySelectorAll('.seg[data-f]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{draft[g.dataset.f]=b.dataset.v;paintIns();}));
  f.querySelectorAll('.item').forEach(el=>{const it=draft.items[+el.dataset.i];
    el.querySelector('select').onchange=e=>it.theme=e.target.value;
    el.querySelector('textarea').oninput=e=>it.note=e.target.value;
    el.querySelectorAll('.ty-seg button').forEach(b=>b.onclick=()=>{it.type=b.dataset.v;paintIns();});
    const rm=el.querySelector('.rm');if(rm)rm.onclick=()=>{draft.items.splice(+rm.dataset.rm,1);paintIns();};});
  document.getElementById('f-date').onchange=e=>draft.date=e.target.value;
  document.getElementById('f-more').onclick=()=>{draft.items.push({theme:'',type:'',note:''});paintIns();const t=f.querySelectorAll('textarea');t[t.length-1].focus();};
  document.getElementById('f-fu').onclick=()=>{draft.showFollow=true;paintIns();};
  ['f-act','f-own','f-due'].forEach((id,k)=>{const el=document.getElementById(id);if(el)el.oninput=el.onchange=e=>draft.follow[['action','owner','due'][k]]=e.target.value;});
  document.getElementById('f-cancel').onclick=()=>{if(editId){editId='';draft=viewOnly?null:blank();paintIns();}else{draft=null;closeIns();}};
  document.getElementById('f-save').onclick=saveIns;
}
async function saveIns(){
  const msg=document.getElementById('ins-msg'),items=draft.items.filter(i=>i.note.trim());
  if(!cur.id){msg.textContent='This learner has no learner ID in the sheet, so the conversation cannot be saved.';return;}
  if(!items.length){msg.textContent='Write at least one insight.';return;}
  if(items.some(i=>!i.theme||!i.type)){msg.textContent='Pick a theme and Positive / Concern / Request for each insight.';return;}
  const b=document.getElementById('f-save');b.disabled=true;b.textContent='Saving…';
  try{
    if(editId){
      const old=INS.find(x=>x.id===editId)||{ids:[cur.id]};
      const j=await ArtiumAuth.call('editInsight',{entry:{id:editId,ids:old.ids,name:old.name||cur.name,centre:old.centre||cur.centre,date:draft.date,with:draft.with,how:draft.how,items,follow:draft.showFollow&&draft.follow.action.trim()?draft.follow:null}});
      if(!j||j.error)throw new Error(j&&j.error||'No answer from the data service');
      INS=j.insights||INS;editId='';draft=viewOnly?null:blank();paintIns();draw();return;
    }
    const j=await ArtiumAuth.call('checkinInsight',{centre:cur.centre,id:cur.id,learner:cur.name,day:cur.day,
      entry:{ids:[cur.id],name:cur.name,centre:cur.centre,date:draft.date,with:draft.with,how:draft.how,items,follow:draft.showFollow&&draft.follow.action.trim()?draft.follow:null}});
    if(!j||j.error)throw new Error(j&&j.error||'No answer from the data service');
    DONE=j.done||DONE;INS=j.ins||INS;KEEP.add(cur.key);draft=null;document.getElementById('ins').hidden=true;document.body.style.overflow='';cur=null;draw();
  }catch(e){msg.textContent='Could not save: '+(e.message==='not-allowed'?"only the person who recorded it can edit this conversation":e.message)+'.';b.disabled=false;b.textContent=editId?'Save changes':'Save conversation';}
}
window.openInsight=function(id,tries){   // from the notification bell: open the learner's conversations, with this one marked
  const e=INS.find(x=>x.id===id);
  if(!e){if((tries||0)<40)setTimeout(()=>window.openInsight(id,(tries||0)+1),500);return;}
  const m=String(e.src||'').match(/Day (\d+)/),L=ITEMS.concat(NODATE).find(x=>String(x.id).toUpperCase()===String(e.ids[0]).toUpperCase());
  openRec(L?Object.assign({},L,{day:m?+m[1]:'',hl:id}):{id:e.ids[0],name:e.name,centre:e.centre,phone:'',age:'',course:'',day:m?+m[1]:'',hl:id},true);
};
document.addEventListener('click',e=>{if(e.target.id==='ins'||e.target.closest('#ins-x'))closeIns();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('ins').hidden)closeIns();});
async function load(){
  const dot=document.getElementById('dot'),st=document.getElementById('state');dot.className='dot loading';st.textContent='Loading.';
  try{
    const [meta,...rows]=await Promise.all([ArtiumAuth.call('checkinsData',{})].concat(CENTRES.map(c=>ArtiumAuth.fetchRows(c,'Fresh Sales').then(r=>r.slice(2).filter(x=>x[0]&&x[0].toLowerCase()!=='date')).catch(()=>[]))));
    if(meta.error)throw new Error(meta.error==='not-allowed'?"You don't have access to this page":meta.error);
    DONE=meta.done||{};ME=meta;INS=meta.ins||[];STAFF=meta.staff||[];
    const by={};CENTRES.forEach((c,i)=>by[c]=rows[i]);build(by);
    if(!draw.once){draw.once=1;let s='';try{s=localStorage.getItem('artium_ck_centre')||'';}catch(x){}CEN=ME.scoped?ME.centre:(CENTRES.concat('All').includes(s)?s:'All');}
    draw();dot.className='dot';st.textContent='Up to date.';
    try{const p=sessionStorage.getItem('artium_open_insight');if(p){sessionStorage.removeItem('artium_open_insight');window.openInsight(p);}}catch(x){}
  }catch(e){dot.className='dot error';st.textContent='Could not load: '+e.message+'.';}
}
load();
</script>
</body>
</html>
