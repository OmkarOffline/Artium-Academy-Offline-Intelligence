<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month on Month Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/emblem-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="brand/emblem-64.png">
<link rel="apple-touch-icon" href="brand/emblem-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#dd30b1;--violet:#6601fd;--violet2:#4101f7;--purple:#7b2cf0;--deep:#2B0256;--navy:#01064c;--magenta:#ff319f;--lilac:#ECE7F8;
  --ink:#120e2b;--ink2:#4a4466;--ink3:#6a6488;--ink4:#7a7196;--line:#dcd5ee;--edge:#ece4ff;
  --tvbg:#f1eafe;--tvfg:#6b3fc7;--tpbg:#fde8f1;--tpfg:#b1286a;--tbbg:#eaf0ff;--tbfg:#2f4db8;--rose:#fce2e5;
  --ok:#1f7a4d;--okbg:#e6f5ec;--bad:#B4443A;
  --f:'Onest',system-ui,sans-serif;
  --sh:0 1px 2px rgba(18,14,43,.04),0 18px 40px -26px rgba(65,1,247,.35);
}
body{font-family:var(--f);background:#F6F3FC;color:var(--ink2);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.hero{background:radial-gradient(120% 140% at 85% -20%,#4101f7 0%,rgba(65,1,247,0) 55%),linear-gradient(135deg,#2B0256 0%,#160240 55%,#01064c 100%);padding:34px 48px 92px;color:#fff}
.hin{max-width:1504px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.eb{font:700 11px var(--f);letter-spacing:.18em;text-transform:uppercase;color:#cec8ea;margin-bottom:10px}
h1{font:800 46px/1.05 var(--f);letter-spacing:-.02em;background:linear-gradient(90deg,#FFFFFF 0%,#F1B6FA 45%,#9BB6FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font:400 16px/24px var(--f);color:#cec8ea;margin-top:10px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.upd{font-size:13px;color:#cec8ea;display:flex;align-items:center;gap:8px}.upd i{width:8px;height:8px;border-radius:50%;background:#4ade80}
.vt{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:4px}
.vt b{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;font:600 14px var(--f);color:#cec8ea}
.vt b.on{background:#fff;color:var(--violet2)}
.vt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.page{max-width:1600px;margin:-64px auto 0;padding:0 48px 64px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:var(--sh)}
.seg .c{padding:9px 20px 10px;border-radius:13px}.seg .c small{display:block;font:700 9.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);margin-bottom:3px}
.seg .c span{font:700 15px var(--f);color:var(--ink)}
.seg .c.on{background:linear-gradient(135deg,var(--violet),var(--violet2));box-shadow:0 8px 18px -10px rgba(65,1,247,.8)}.seg .c.on span{color:#fff}.seg .c.on small{color:#d9ccff}
.per{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:var(--sh)}
.per .t{display:inline-flex;background:#F4F1FB;border-radius:11px;padding:3px}.per .t b{padding:7px 13px;border-radius:9px;font:600 13px var(--f);color:var(--ink2)}.per .t b.on{background:#fff;color:var(--violet2);box-shadow:0 1px 3px rgba(18,14,43,.12)}
.per .m{width:34px;height:36px;border-radius:10px;background:#F4F1FB;display:grid;place-items:center;color:var(--ink2)}
.per .l{min-width:150px;text-align:center;font:700 15px var(--f);color:var(--ink)}
.sec{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.sh{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--edge)}
.sh b{font:800 19px var(--f);color:var(--ink);letter-spacing:-.01em}.sh span{font-size:13px;color:var(--ink4)}
.cv{margin-left:auto;width:30px;height:30px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink3);flex:none;background:#fff}
.cv svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.rw{padding:16px 24px 18px}.rw+.rw{border-top:1px solid var(--edge);background:linear-gradient(180deg,#FAF8FE,#fff)}
.rl{font:700 10.5px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4);margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.k{border:1px solid var(--edge);border-radius:16px;padding:15px 18px;background:#fff;min-height:112px;display:flex;flex-direction:column}
.k .t{font:600 13px var(--f);color:var(--ink3)}
.k .v{font:800 30px/1.1 var(--f);color:var(--ink);margin-top:8px;letter-spacing:-.02em}
.k .s{font-size:13px;color:var(--ink3);margin-top:auto;padding-top:10px}.k .s b{color:var(--ink)}.k .s .bd{color:var(--bad);font-weight:700}
.pg{margin-top:auto;padding-top:10px}.pg .x{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-bottom:7px}.pg .x b{color:var(--tvfg);font-weight:800}
.pg .tr{height:6px;border-radius:6px;background:#EEE8FB;overflow:hidden}.pg .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--purple),var(--pink))}
.k.rr{background:linear-gradient(140deg,#6601fd 0%,#4101f7 60%,#2B0256 130%);border:0;color:#fff;box-shadow:0 14px 30px -18px rgba(65,1,247,.9)}
.k.rr .t{color:#d9ccff}.k.rr .v{color:#fff}.k.rr .eq{font-size:12.5px;color:#cec8ea;margin-top:6px}
.k.rr .pg .x{color:#d9ccff}.k.rr .pg .x b{color:#fff}.k.rr .pg .tr{background:rgba(255,255,255,.2)}.k.rr .pg .tr i{background:linear-gradient(90deg,#F1B6FA,#fff)}
.wvb{padding:18px;display:flex;flex-direction:column;gap:14px;background:#FAF8FE}
.wc{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.wh{display:flex;align-items:center;gap:12px;padding:14px 18px}.wc:not(.closed) .wh{border-bottom:1px solid var(--edge)}
.lb{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;display:grid;place-items:center;font:800 12px var(--f);flex:none}
.wt{font:700 15.5px var(--f);color:var(--ink)}
.ws{display:flex;gap:16px;margin-left:14px;font-size:13px;color:var(--ink3)}.ws b{color:var(--ink);font-weight:700;margin-left:3px}
.wc:not(.closed) .ws{display:none}.wc.closed .wb{display:none}.wc.closed .cv{transform:rotate(-90deg)}
.wb table,table.lt{width:100%;border-collapse:collapse}
.wb th,.wb td{padding:11px 18px;text-align:right;border-bottom:1px solid #F1EDF9;font:400 14px var(--f);color:var(--ink2)}
.wb tr:last-child th,.wb tr:last-child td{border-bottom:0}
.wb thead th{padding:12px 18px 10px;background:#FBFAFE;border-bottom:1px solid var(--edge);vertical-align:bottom}
.wb thead th b{font:700 13px var(--f);color:var(--ink)}.wb thead th small{display:block;font:400 11.5px var(--f);color:var(--ink4);margin-top:2px}
.wb thead th em{display:inline-block;font:700 9.5px var(--f);font-style:normal;color:var(--tpfg);background:var(--tpbg);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.wb th[scope=row],.wb thead th:first-child{text-align:left;width:300px;white-space:nowrap;font-weight:500;color:var(--ink2)}
.wb .cw{background:#F8F4FF}.wb td.tt,.wb th.tt{background:#F4F1FB;font-weight:700;color:var(--ink)}
.wb tr.key th,.wb tr.key td{font-weight:700;color:var(--ink)}
.wb tr.acc td{color:var(--tvfg)}.wb tr.strong th,.wb tr.strong td{font-weight:800}.wb tr.strong th{color:var(--ink)}
.wb tr.tline th,.wb tr.tline td{border-top:1px solid var(--line)}
.wb tr.ytr th,.wb tr.ytr td{font-weight:600;color:var(--ink)}
.wb tr.grp2 th{text-align:left;padding:16px 18px 6px;font:700 10px var(--f);letter-spacing:.15em;text-transform:uppercase;color:var(--ink4);background:#fff;border-bottom:0}
.wb tr.wnr th,.wb tr.wnr td{color:var(--bad);background:#FDF3F4}.wb tr.wnr td.cw{background:#FBECEE}.wb tr.wnr td.tt{background:var(--rose);font-weight:700}
.wb tr.ytc th,.wb tr.ytc td{color:var(--ink2);background:#F5F4F8;font-weight:500}.wb tr.ytc td.cw{background:#EFEDF4}.wb tr.ytc td.tt{background:#EAE8F0;font-weight:700}
.dt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;vertical-align:1px}.dt.r{background:#D9665B}.dt.g{background:#9a94b3}
table.lt th{text-align:left;padding:13px 24px 11px;font:700 10.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);background:#FBFAFE;border-bottom:1px solid var(--edge)}
table.lt td{padding:15px 24px;border-bottom:1px solid #F1EDF9;font:400 14px var(--f);color:var(--ink2);vertical-align:top}
table.lt tr:last-child td{border-bottom:0}
table.lt td b{font-weight:700;color:var(--ink)}table.lt td small{display:block;font-size:12px;color:var(--ink4);margin-top:3px}
table.lt th,table.lt td{white-space:nowrap}table.lt td.ds{white-space:normal;max-width:440px;line-height:1.5;color:var(--ink)}table.lt td.ex{color:var(--tbfg);font-weight:600}
.tg{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:6px;font:800 10px var(--f);letter-spacing:.06em;vertical-align:1px}
.tg.ft{background:var(--tpbg);color:var(--tpfg)}.tg.rr{background:var(--tbbg);color:var(--tbfg)}
.sh .ct{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;font:800 12px var(--f)}
.ct.r{background:var(--rose);color:var(--bad)}.ct.b{background:var(--tbbg);color:var(--tbfg)}

button{font:inherit}
.seg .c{border:0;background:none;cursor:pointer;text-align:left}
.ct-btn{display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;border-radius:13px;padding:9px 20px 10px;cursor:pointer;white-space:nowrap;text-align:left}
.ct-btn small{display:block;font:700 9.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);margin-bottom:3px}
.ct-btn span{font:700 15px var(--f);color:var(--ink)}.ct-btn:hover{background:#F4F1FB}
.ct-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--violet),var(--violet2));box-shadow:0 8px 18px -10px rgba(65,1,247,.8)}.ct-btn[aria-pressed="true"] span{color:#fff}.ct-btn[aria-pressed="true"] small{color:#d9ccff}
.vt button{display:flex;align-items:center;gap:8px;padding:9px 18px;border:0;border-radius:10px;background:none;font:600 14px var(--f);color:#cec8ea;cursor:pointer}
.vt button[aria-pressed="true"]{background:#fff;color:var(--violet2)}
.per .t button{border:0;background:none;padding:7px 13px;border-radius:9px;font:600 13px var(--f);color:var(--ink2);cursor:pointer}.per .t button[aria-pressed="true"]{background:#fff;color:var(--violet2);box-shadow:0 1px 3px rgba(18,14,43,.12)}
.per .m{border:0;cursor:pointer;font-size:16px}.per .m:hover{background:var(--tvbg);color:var(--violet2)}
.range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}.range input{font:500 14px var(--f);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
#prange[hidden]{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}.dot.loading{background:#F1B6FA;animation:pulse 1s infinite}.dot.error{background:#ff6b6b}@keyframes pulse{50%{opacity:.35}}
.sh{width:100%;border:0;background:#fff;text-align:left;cursor:pointer;font:inherit}
.sec.closed .sb{display:none}.sec.closed .sh{border-bottom:0}.sec.closed>.sh .cv,.wc.closed .cv{transform:rotate(-90deg)}
.wh{width:100%;border:0;background:#fff;text-align:left;cursor:pointer;font:inherit}
.tw{overflow-x:auto}
.wb table{min-width:900px}table.lt{min-width:980px}
.empty{padding:28px 24px;text-align:center;color:var(--ink3);font-size:14px}.empty.big{padding:56px 24px;font-size:15px}
.mut{color:#C9C3DD}
.sec .sh span.ct{display:inline-grid}
@media (max-width:1100px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.hero{padding:24px 16px 80px}.hin{flex-direction:column;align-items:flex-start}.hr{align-items:flex-start}h1{font-size:32px}.page{padding:0 16px 48px}.bar{flex-direction:column;align-items:stretch;gap:12px}.seg{overflow-x:auto}.cards{grid-template-columns:1fr}.ws{display:none!important}}

.sh{display:flex;align-items:center;gap:12px}.sh .lb{color:#fff;font-size:12px}
.sh .st{display:flex;flex-direction:column;gap:2px;min-width:0}.sh .st b{font:800 19px var(--f);color:var(--ink);letter-spacing:-.01em}
.sh .nt{font:400 13px var(--f);color:var(--ink3)}
.strip .sh .st{flex-direction:row;align-items:baseline;gap:12px;flex-wrap:wrap}
.cards.c6{grid-template-columns:repeat(6,1fr)}.cards.c5{grid-template-columns:repeat(5,1fr)}
#next:disabled{opacity:.35;cursor:default}
/* Tables: calm to read — one background and ink; lilac only for subtotals and the total column; solid violet for the bottom line */
table.calm{width:100%;min-width:760px;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.calm th,table.calm td{padding:11px 18px;text-align:right;white-space:nowrap;border-bottom:1px solid #F1EDF9;font:400 14px var(--f);color:var(--ink2);background:#fff}
table.calm thead th{font:600 13px var(--f);color:var(--ink);border-bottom:1px solid var(--line);vertical-align:bottom}
table.calm thead th small{display:block;font:500 11px var(--f);color:var(--ink4);margin-top:3px}
table.calm thead th em{font:500 11px var(--f);font-style:normal;color:var(--ink4);margin-left:6px}
table.calm th[scope=row],table.calm thead th:first-child{position:sticky;left:0;z-index:2;text-align:left;width:270px;min-width:270px;max-width:270px}
table.calm .at{position:sticky;left:270px;z-index:2;min-width:132px}
table.calm .at{background:#FAF8FE;border-right:1px solid var(--edge);color:var(--ink);font-weight:600}
table.calm thead th.at{background:#FAF8FE}
table.calm tr.mut th,table.calm tr.mut td{color:var(--ink3)}
table.calm tr.child th{padding-left:52px;font-size:13px;color:var(--ink3)}table.calm tr.child td{font-size:13px;color:var(--ink3)}
table.calm tr.sum th,table.calm tr.sum td{background:#F5F0FF;font-weight:700;color:var(--ink)}
table.calm tr.sum td.at{background:#EFE7FE}table.calm tr.sum td:not(.at){color:#4101f7}
table.calm tr.net th,table.calm tr.net td{background:#4f0ef9;color:#fff;font-weight:800;font-size:15.5px;padding-top:15px;padding-bottom:15px;border:0}
table.calm tr.net td.at{background:#3a00db;border-right:1px solid rgba(255,255,255,.25)}
table.calm tr.grp2 th{text-align:left;font:800 10.5px var(--f);letter-spacing:.15em;text-transform:uppercase;color:var(--violet2);padding-top:18px;border-bottom:0;position:static}
table.calm tr.grp2 th>span{position:sticky;left:18px}
table.calm tr.grp2 th>span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#6601fd,#dd30b1);margin-right:8px;vertical-align:1px}
table.calm tbody tr:not(.net):not(.grp2):hover th,table.calm tbody tr:not(.net):not(.grp2):hover td{background:#F7F4FD}
table.calm tr.has{cursor:pointer}
table.calm tr.net .op{color:#fff}
table.calm .gn{color:var(--ok);font-weight:600}table.calm .ls{color:var(--bad);font-weight:600}
table.calm .pill{display:inline-block;min-width:46px;text-align:center;padding:2px 9px;border-radius:999px;font:700 12.5px var(--f)}
table.calm .pill.lo{background:var(--rose);color:var(--bad)}table.calm .pill.mid{background:#FFF1D6;color:#8A5A00}table.calm .pill.hi{background:var(--okbg);color:var(--ok)}table.calm .pill.top{background:var(--tbbg);color:var(--tbfg)}
table.calm .op{display:inline-block;width:22px;color:var(--violet2);font:700 15px var(--f)}
table.calm .bn{display:inline-block;min-width:30px;text-align:right;color:var(--ink);font-weight:600}
table.calm .bp{display:inline-block;min-width:46px;margin-left:6px;text-align:right;font:500 12px var(--f);color:var(--ink4)}
table.calm .bz{color:#C9C3DD}
table.calm tr.btot th,table.calm tr.btot td{border-top:1px solid var(--line);font-weight:700;color:var(--ink)}table.calm tr.btot td.at{color:var(--ink)}
.tgl{display:inline-grid;place-items:center;width:20px;height:20px;margin:0 8px 0 -4px;border-radius:6px;background:#F1EAFE;color:#6b3fc7;vertical-align:-4px}
.tgl svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}.tgl.on svg{transform:rotate(90deg)}
.fnote{padding:12px 24px 16px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--edge)}
@media (max-width:1280px){.cards.c6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1100px){.cards.c5{grid-template-columns:repeat(3,1fr)}}
.per .t button{white-space:nowrap}
.bar{flex-wrap:wrap;row-gap:12px}
table.calm td.at{box-shadow:8px 0 10px -8px rgba(18,14,43,.14)}
table.calm tr.ref td{color:var(--ink2)}table.calm tr.ref td .ng{color:#B4443A}
@media (max-width:760px){.cards.c6,.cards.c5{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="hero"><div class="hin"><div><h1>Month on Month Dashboard</h1><div class="sub" id="psub"></div></div>
<div class="hr"><div class="upd"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div></div></div></div>
<div class="page">
<div class="bar"><nav class="seg" id="centre-toggle" aria-label="Centre"></nav>
<div class="per"><div class="t" id="span" role="group" aria-label="Period shown"><button type="button" data-n="3" aria-pressed="false">3M</button><button type="button" data-n="6" aria-pressed="true">6M</button><button type="button" data-n="12" aria-pressed="false">12M</button><button type="button" data-n="all" aria-pressed="false">All</button><button type="button" data-n="qoq" aria-pressed="false">Q-o-Q</button></div>
<button class="m" id="prev" aria-label="Earlier">‹</button><div class="l" id="mlabel">—</div><button class="m" id="next" aria-label="Later">›</button></div></div>
<div id="out"></div>
</div>
<script>
const CENTRES=[{city:'Chennai',name:'Alwarpet'},{city:'Chennai',name:'Thoraipakkam'},{city:'Bangalore',name:'Borewell Road'}];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const NOW=new Date(),CUR=NOW.getFullYear()+'-'+String(NOW.getMonth()+1).padStart(2,'0');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Indian digit grouping: 1,23,45,678
const grp=v=>{const s=String(Math.round(Math.abs(v)));if(s.length<=3)return s;let h=s.slice(0,-3),out=[];while(h.length>2){out.unshift(h.slice(-2));h=h.slice(0,-2);}if(h)out.unshift(h);return out.join(',')+','+s.slice(-3);};
const num=v=>v==null||!isFinite(v)?'–':(v<0?'-':'')+grp(v);
const inr=v=>v==null||!isFinite(v)?'–':(v<0?'-':'')+'₹'+grp(v);
const pctf=v=>v==null||!isFinite(v)?'–':Math.round(v)+'%';
const lab=m=>MON[+m.slice(5)-1]+"'"+m.slice(2,4);
const full=m=>MONTH_FULL[+m.slice(5)-1]+' '+m.slice(0,4);
const addM=(m,k)=>{let y=+m.slice(0,4),mo=+m.slice(5)-1+k;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+String(mo+1).padStart(2,'0');};
const CHEV='<span class="cv" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>';

let DATA=null,TARGETS={};
let selCentre=(()=>{try{const v=localStorage.getItem('artium_mom_centre');return CENTRES.some(c=>c.name===v)?v:'All';}catch(e){return'All';}})();
let span=(()=>{try{const v=localStorage.getItem('artium_mom_span');return['3','6','12','all','qoq'].includes(v)?v:'6';}catch(e){return'6';}})();
let endM=CUR;
let FOLD=(()=>{try{return JSON.parse(localStorage.getItem('artium_mom_fold')||'{}')||{};}catch(e){return{};}})();
const fold=(k,d=false)=>k in FOLD?FOLD[k]:d;
const setFold=(k,v)=>{FOLD[k]=v;try{localStorage.setItem('artium_mom_fold',JSON.stringify(FOLD));}catch(e){}};

/* Monthly totals for the selected centre(s): {month: {fs:[n,amt], rn, ex, in, ot, rf, leads, spend, due}} */
function merged(){
  const out={},cs=selCentre==='All'?CENTRES.map(c=>c.name):[selCentre];
  cs.forEach(c=>{const M=(DATA[c]||{}).months||{};Object.keys(M).forEach(m=>{const o=out[m]=out[m]||{};
    Object.keys(M[m]).forEach(k=>{const v=M[m][k];if(Array.isArray(v)){const t=o[k]=o[k]||[0,0];t[0]+=v[0];t[1]+=v[1];}else o[k]=(o[k]||0)+v;});});});
  return out;
}
/* Indian financial year: Q1 Apr–Jun, Q2 Jul–Sep, Q3 Oct–Dec, Q4 Jan–Mar */
const qStart=m=>{const y=+m.slice(0,4),mo=+m.slice(5);const s=mo>=4?Math.floor((mo-4)/3)*3+4:1;return y+'-'+String(s).padStart(2,'0');};
const qEnd=q=>{const e=addM(qStart(q),2);return e<CUR?e:CUR;};
const qName=m=>{const y=+m.slice(0,4),mo=+m.slice(5),fy=mo>=4?y:y-1;return'Q'+(mo>=4?Math.floor((mo-4)/3)+1:4)+' FY'+String(fy).slice(2)+'-'+String(fy+1).slice(2);};
const qSpan=m=>{const e=addM(m,2);return MON[+m.slice(5)-1]+' – '+MON[+e.slice(5)-1]+' '+e.slice(0,4);};
/* The columns shown, latest first: each is one month, or one quarter in Q-o-Q */
function cols(all){
  const known=Object.keys(all).filter(m=>m<=endM).sort(),first=known[0]||endM,r=[];
  if(span==='qoq'){
    for(let q=qStart(endM);q>=qStart(first);q=addM(q,-3)){const ms=[0,1,2].map(k=>addM(q,k)).filter(m=>m<=endM);
      r.push({lab:qName(q),sub:qSpan(q),ms,cur:ms.indexOf(CUR)>=0,name:qName(q)});}
    return r;}
  const n=span==='all'?null:+span;
  for(let m=endM,i=0;(n?i<n:m>=first);m=addM(m,-1),i++)r.push({lab:lab(m),ms:[m],cur:m===CUR,name:full(m)});
  return r;
}

/* ── Rows of a table: [label, per-month values, total, options] ── */
function table(cs,rows){
  let h='<div class="tw"><table class="calm"><thead><tr><th></th><th class="at">Total</th>'+cs.map(c=>`<th>${c.lab}${c.cur?'<em>So far</em>':''}${c.sub?`<small>${c.sub}</small>`:''}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    if(r.h){h+=`<tr class="grp2"><th colspan="${cs.length+2}"><span>${r.h}</span></th></tr>`;return;}
    if(r.hide)return;
    const tog=r.kids?`<span class="tgl${fold('k_'+r.key,true)?'':' on'}"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>`:'';
    h+=`<tr class="${r.cls||''}${r.kids?' has':''}"${r.kids?` data-k="k_${r.key}"`:''}><th scope="row">${tog}${r.l}</th><td class="at">${r.f(r.t)}</td>`+r.v.map(x=>`<td>${r.f(x)}</td>`).join('')+'</tr>';
    if(r.kids&&!fold('k_'+r.key,true))r.kids.forEach(k=>{h+=`<tr class="child ${k.cls||''}"><th scope="row">${k.l}</th><td class="at">${k.f(k.t)}</td>`+k.v.map(x=>`<td>${k.f(x)}</td>`).join('')+'</tr>';});
  });
  return h+'</tbody></table></div>';
}
function section(key,n,title,note,body){
  return`<section class="sec${fold(key)?' closed':''}" data-s="${key}"><button type="button" class="sh"><span class="lb">${n}</span><span class="st"><b>${title}</b><span class="nt">${note}</span></span>${CHEV}</button><div class="sb">${body}</div></section>`;
}

function render(){

  document.getElementById('mlabel').textContent='to '+(span==='qoq'?qName(endM):full(endM));

  const ratio=(a,b)=>a.map((x,i)=>b[i]?x/b[i]:null);
  const row=(l,k,i,f,cls,extra)=>Object.assign({l,v:series(k,i),t:total(k,i),f,cls},extra||{});
  const atv=(l,k,cls)=>({l,v:ratio(series(k,1),series(k,0)),t:total(k,0)?total(k,1)/total(k,0):null,f:inr,cls:cls||'mut'});
  const sumS=(...ks)=>cs0.map(c=>c.ms.reduce((s,m)=>s+ks.reduce((t,k)=>t+get(m,k,1),0),0)),sumT=(...ks)=>ks.reduce((s,k)=>s+total(k,1),0);

  /* At a glance: the last month in the range, against that month's targets (Targets page) */
  const m=endM,cs=selCentre==='All'?CENTRES.map(c=>c.name):[selCentre],isQ=span==='qoq';
  /* Q-o-Q: the whole quarter so far, against the targets of all three of its months */
  const gM=isQ?[0,1,2].map(k=>addM(qStart(m),k)).filter(x=>x<=m):[m],tM=isQ?[0,1,2].map(k=>addM(qStart(m),k)):[m];

  const T=(...keys)=>{let n=0;const r=keys.map(()=>0);cs.forEach(c=>tM.forEach(x=>{const t=(TARGETS[x]||{})[c];if(t&&keys.every(k=>t[k]!=null)){n++;keys.forEach((k,i)=>r[i]+=t[k]);}}));return n?r:null;};
  const netM=['fs','rn','ex','in','ot'].reduce((s,k)=>s+getG(k,1),0)-getG('rf',1);
  const card=(t,v,target,f,note,inv)=>{
    if(inv&&target>0&&v!=null){const d=Math.round((v/target-1)*100);return`<div class="k"><div class="t">${t}</div><div class="v">${f(v)}</div><div class="pg"><div class="x"><span>Target – ${f(target)}</span><b>${d===0?'On target':Math.abs(d)+'% '+(d>0?'above':'below')}</b></div></div></div>`;}
    if(target&&target>0){const p=v/target*100;return`<div class="k"><div class="t">${t}</div><div class="v">${f(v)}</div><div class="pg"><div class="x"><span>Target – ${f(target)}</span><b>${Math.round(p)}%</b></div><div class="tr"><i style="width:${Math.min(100,p)}%"></i></div></div></div>`;}
    return`<div class="k"><div class="t">${t}</div><div class="v">${f(v)}</div>${note?`<div class="s">${note}</div>`:''}</div>`;};
  const tC=T('fscol','rncol'),tA=T('conv'),tR=T('renewed'),tL=T('leads'),tS=T('spend','leads');
  const leadsM=getG('leads'),spendM=getG('spend'),dueM=getG('due');
  const tAF=T('fscol','conv'),tAR=T('rncol','renewed'),fsN=getG('fs',0),rnN=getG('rn',0);

  /* 1 · Collections */
  const coach=sumS('fs','rn'),other=sumS('ex','in','ot'),totC=sumS('fs','rn','ex','in','ot'),refund=series('rf',1).map(x=>-x),net=totC.map((x,i)=>x+refund[i]);

    row('Collections – Renewals','rn',1,inr),row('No. of renewals','rn',0,num),atv('ATV – Renewals','rn'),
    {l:'Net collections – Coaching fees',v:coach,t:sumT('fs','rn'),f:inr,cls:'sum'},
    {l:'Fresh Sales : Renewals',v:ratio(series('fs',1),series('rn',1)),t:total('rn',1)?total('fs',1)/total('rn',1):null,f:v=>v==null||!isFinite(v)?'–':v.toFixed(2)+' : 1',cls:'mut'},

    {h:'Total'},{l:'Total collections',v:totC,t:sumT('fs','rn','ex','in','ot'),f:inr,cls:'sum'},

  const missing=cs.filter(c=>!((DATA[c]||{}).tabs||[]).length);
  /* 2 · Discounts: gross coaching fees, the discount given and what is left, for fresh sales and renewals */
  const pc=v=>v==null||!isFinite(v)?'–':v.toFixed(1)+'%';
  const dPct=(...ks)=>({v:cs0.map((c,i)=>{const g=ks.reduce((s,k)=>s+series(k,0)[i],0),d=ks.reduce((s,k)=>s+series(k,1)[i],0);return g?d/g*100:null;}),
    t:(()=>{const g=ks.reduce((s,k)=>s+total(k,0),0),d=ks.reduce((s,k)=>s+total(k,1),0);return g?d/g*100:null;})()});
  const netS=k=>series(k,0).map((g,i)=>g-series(k,1)[i]);
  const op=(sym,t)=>`<span class="op">${sym}</span>${t}`;   // the sum is read down the left: gross − discount = net coaching fees + enrollment fee = net collections

  const note=missing.length?`<div class="fnote">${missing.join(' and ')} ${missing.length>1?'do':'does'} not record exam fees, instrument sales, other income or refunds yet${hasOther?', so those rows cover the other centres only':''}.</div>`:'';

  /* 3 · Fresh sales breakdown: admissions split by course, level, age group, gender and package length (each row's number and its share of that month's admissions) */
  const base=series('fs',0),baseT=total('fs',0);
  const keysOf=pre=>{const s={};allM.forEach(mm=>Object.keys(all[mm]||{}).forEach(k=>{if(k.indexOf(pre+'|')===0)s[k.slice(pre.length+1)]=1;}));return Object.keys(s);};

  const byTotal=(a,b)=>b.t-a.t||a.k.localeCompare(b.k),fixed=list=>(a,b)=>{const i=list.indexOf(a.k),j=list.indexOf(b.k);return (i<0?99:i)-(j<0?99:j)||byTotal(a,b);};

    const r=bRows(g[1],g[2],g[3]);if(r.length){B.push({h:g[0]});r.forEach(x=>B.push(x));}});

  const opened=n=>{const ms=Object.keys(((DATA[n]||{}).months)||{}).filter(x=>x>=LFIRST&&((DATA[n].months[x].lN||0)+(DATA[n].months[x].lG||0))>0).sort();return ms[0]||CUR;};

  out.innerHTML=`<section class="sec strip${fold('glance')?' closed':''}" data-s="glance"><button type="button" class="sh"><span class="st"><b>${isQ?qName(m):full(m)} at a glance</b><span class="nt">${gM.indexOf(CUR)>=0?'so far, ':''}against this ${isQ?'quarter':'month'}'s targets</span></span>${CHEV}</button><div class="sb">${strip}</div></section>`

async function load(){
  render();
  try{
    const j=await ArtiumAuth.call('mom',{});if(j.error)throw new Error(j.error==='not-allowed'?'You do not have access to this page.':j.error);
    DATA=j.mom||{};
    ArtiumAuth.call('targets',{}).then(t=>{if(t&&t.targets){TARGETS=t.targets;render();}}).catch(()=>{});
    const t=new Date();
    document.getElementById('updated').textContent='Updated '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('dot').className='dot';render();
  }catch(e){document.getElementById('updated').textContent='Error — '+e.message;document.getElementById('dot').className='dot error';}
}
load();
</script>
</body>
</html>
