<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Execs Call</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/emblem-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="brand/emblem-64.png">
<link rel="apple-touch-icon" href="brand/emblem-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --pink:#dd30b1;--violet:#6601fd;--violet2:#4101f7;--purple:#7b2cf0;
  --ink:#120e2b;--ink2:#4a4466;--ink3:#6a6488;--ink4:#7a7196;--line:#dcd5ee;--edge:#ece4ff;
  --tvbg:#f1eafe;--tvfg:#6b3fc7;--bad:#B4443A;
  --f:'Onest',system-ui,sans-serif;
  --sh:0 1px 2px rgba(18,14,43,.04),0 18px 40px -26px rgba(65,1,247,.35);
}
body{font-family:var(--f);background:#F6F3FC;color:var(--ink2);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit}
.hero{background:radial-gradient(120% 140% at 85% -20%,#4101f7 0%,rgba(65,1,247,0) 55%),linear-gradient(135deg,#2B0256 0%,#160240 55%,#01064c 100%);padding:34px 48px 92px;color:#fff}
.hin{max-width:1504px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
h1{font:800 46px/1.05 var(--f);letter-spacing:-.02em;background:linear-gradient(90deg,#FFFFFF 0%,#F1B6FA 45%,#9BB6FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.sub{font:400 16px/24px var(--f);color:#cec8ea;margin-top:6px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.upd{font-size:13px;color:#cec8ea;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}.dot.loading{background:#F1B6FA;animation:pulse 1s infinite}.dot.error{background:#ff8a80}
@keyframes pulse{50%{opacity:.35}}
.vt{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:4px}
.vt button{border:0;background:none;padding:9px 18px;border-radius:10px;font:600 14px var(--f);color:#cec8ea;cursor:pointer}
.vt button[aria-pressed="true"]{background:#fff;color:var(--violet2)}
.page{max-width:1600px;margin:-64px auto 0;padding:0 48px 64px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:var(--sh);max-width:100%;overflow-x:auto;scrollbar-width:none}
.sp{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;background:none;padding:9px 18px 10px;border-radius:13px;cursor:pointer;white-space:nowrap;text-align:left}
.sp small{font:700 9.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink4)}
.sp span{font:700 15px var(--f);color:var(--ink)}
.sp:hover{background:#F4F1FB}
.sp[aria-pressed="true"]{background:linear-gradient(135deg,var(--violet),var(--violet2));box-shadow:0 8px 18px -10px rgba(65,1,247,.8)}
.sp[aria-pressed="true"] span{color:#fff}.sp[aria-pressed="true"] small{color:#d9ccff}
.sp .rm{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--ink3);font:700 10px/18px var(--f);text-align:center;box-shadow:0 1px 3px rgba(18,14,43,.2)}
.addsp{border:1.5px dashed #CDBDF7;background:none;border-radius:13px;padding:0 16px;font:700 13.5px var(--f);color:var(--violet2);cursor:pointer;margin-left:4px;white-space:nowrap}
.br{display:flex;gap:12px;align-items:center}
.per{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:var(--sh)}
.mb{width:34px;height:36px;border:0;border-radius:10px;background:#F4F1FB;display:grid;place-items:center;color:var(--ink2);font-size:18px;cursor:pointer}
.mb:disabled{opacity:.35;cursor:default}
.pl{min-width:200px;text-align:center;font:700 15px var(--f);color:var(--ink)}.pl small{display:block;font:500 11.5px var(--f);color:var(--ink4)}
.pres{display:flex;align-items:center;gap:8px;height:50px;padding:0 20px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;font:700 14px var(--f);box-shadow:0 12px 24px -14px rgba(65,1,247,.9);cursor:pointer}
.pres svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.pres:disabled{opacity:.5;cursor:default}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--violet2);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:14px;color:var(--ink2)}
.note b{color:var(--ink)}
.sbar{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px;gap:12px}
.sbar .who{font:500 13px var(--f);color:var(--ink3)}.sbar .who b{color:var(--ink);font-weight:700}
.snav{display:flex;align-items:center;gap:10px;font:700 13px var(--f);color:var(--ink)}
.snav .mb{width:32px;height:32px;background:#fff;border:1px solid var(--line)}
/* The slide: 1600 × 900, scaled to fit */
.stage{position:relative;width:100%;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(18,14,43,.45);background:#fff}
.slide{width:1600px;height:900px;position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;padding:52px 64px 0;gap:30px}
.s-eb{font:800 15px var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--violet2)}
.s-h{font:800 54px/1.05 var(--f);letter-spacing:-.02em;color:var(--ink);margin-top:12px}
.s-wk{font:500 20px var(--f);color:var(--ink3);margin-top:10px}
.logo{display:flex;align-items:center;gap:12px;flex:none}.logo i{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#6601fd,#4101f7 55%,#dd30b1);display:grid;place-items:center;font:800 22px var(--f);font-style:normal;color:#fff}
.logo b{display:block;font:800 20px var(--f);color:var(--ink)}.logo small{display:block;font:500 13px var(--f);color:var(--ink4)}
.s-b{flex:1;display:flex;gap:36px;padding:34px 64px 0;min-height:0}
.s-f{display:flex;justify-content:space-between;align-items:center;padding:20px 64px 28px;font:500 15px var(--f);color:var(--ink4)}
.s-f .dots{display:flex;gap:6px}.s-f .dots i{width:26px;height:6px;border-radius:6px;background:#E6DEFB}.s-f .dots i.on{background:linear-gradient(90deg,var(--purple),var(--pink))}
.tx{flex:0 0 560px;border-radius:26px;background:linear-gradient(160deg,#F7F2FF,#fff 60%);border:1.5px solid var(--edge);padding:34px 38px;display:flex;flex-direction:column;overflow:hidden}
.tg{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--tvbg);color:var(--tvfg);font:700 15px var(--f)}
.tx h3{font:800 34px/1.15 var(--f);color:var(--ink);margin-top:18px;letter-spacing:-.01em}
.tx ul{margin-top:18px;padding-left:24px}.tx li{font:400 21px/1.5 var(--f);color:var(--ink2);margin-bottom:12px}.tx li b{color:var(--ink);font-weight:700}
.mg{flex:1;display:grid;gap:22px;min-width:0;min-height:0}
.md{position:relative;border-radius:24px;overflow:hidden;background:#F1ECFC;min-height:0}
.md img,.md video,.md iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.md img{object-fit:cover}.md.contain img{object-fit:contain}
.md video{object-fit:contain;background:#000}
.md .ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;font:600 18px var(--f);color:var(--ink4);text-align:center}
.md.empty{border:3px dashed #CDBDF7;background:#FBF9FF}.md.empty .ph{color:var(--violet2)}
.md.vthumb{background:linear-gradient(135deg,#2B0256,#4101f7)}.md.vthumb .ph{color:#fff}
.md .play{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;margin:0 auto}
.md .play svg{width:34px;height:34px;fill:var(--violet2);margin-left:6px}
/* update cards (as on Key Updates) */
.cards{flex:1;display:grid;gap:24px;min-height:0}
.u{border-radius:24px;border:1.5px solid var(--edge);background:linear-gradient(160deg,#F7F2FF,#fff 55%);padding:28px 32px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.u h3{font:800 28px/1.2 var(--f);color:var(--ink);margin-top:14px}
.u .tg{font-size:14px;padding:5px 12px}
.u ul{margin-top:12px;padding-left:22px}.u li{font:400 19px/1.45 var(--f);color:var(--ink2);margin-bottom:6px}.u li b{color:var(--ink)}
/* update cards: each takes the height of its text, in two columns; a slide that is too full continues on the next one */
.flow{flex:1;display:flex;gap:24px;align-items:flex-start;align-self:flex-start;min-width:0}
.flow .fcol{flex:1;display:flex;flex-direction:column;gap:22px;min-width:0}
.flow .u{overflow:visible}.flow .u h3{font-size:calc(28px*var(--z,1))}.flow .u li{font-size:calc(19px*var(--z,1))}
.flow .meter{margin-top:0}
.s-h .cont{font:600 24px var(--f);letter-spacing:0;color:var(--ink4);margin-left:12px}
.logo img{display:block;height:46px;width:auto}
.spill{margin-top:10px;font:500 13px var(--f);color:var(--ink3)}
.meter{margin-top:auto;padding-top:14px;display:flex;align-items:flex-end;gap:18px}
.meter .n{font:800 34px/1 var(--f);color:var(--ink)}.meter .n small{font:600 18px var(--f);color:var(--ink4)}
.meter .bw{flex:1}.meter .bw div{display:flex;justify-content:space-between;font:600 15px var(--f);color:var(--ink3);margin-bottom:8px}.meter .bw div b{color:var(--tvfg)}
.meter .tr{height:10px;border-radius:10px;background:#EEE8FB;overflow:hidden}.meter .tr i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--purple),var(--pink))}
.s-empty{flex:1;display:grid;place-items:center;font:500 26px var(--f);color:var(--ink4);border:3px dashed var(--edge);border-radius:26px;margin-bottom:6px}
/* Edit view */
.ed{display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;align-items:start}
.rail{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.rt{font:700 10.5px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4);padding:4px 4px 0}
.th{border-radius:14px;border:1.5px solid var(--edge);padding:6px;background:#fff;cursor:pointer;text-align:left}
.th:hover{border-color:#CDBDF7}.th.on{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(65,1,247,.12)}
.th .mini{width:200px;height:112.5px;position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--edge)}
.th .mini .slide{transform:scale(.125)}
.th small{display:flex;justify-content:space-between;gap:6px;font:600 12px var(--f);color:var(--ink2);padding:7px 3px 2px}.th small em{font-style:normal;color:var(--ink4);font-weight:600}
.th.off .mini{opacity:.45}
.addsl{border:1.5px dashed #CDBDF7;background:none;border-radius:14px;padding:14px;font:700 13.5px var(--f);color:var(--violet2);cursor:pointer}
.form{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);margin-top:18px;padding:20px 24px}
.fh{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--edge);margin-bottom:18px;flex-wrap:wrap}
.fh b{font:800 17px var(--f);color:var(--ink)}.fh span{font-size:13px;color:var(--ink4)}
.fh .sp2{margin-left:auto}
.ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font:700 14px var(--f)}
.ic:disabled{opacity:.35;cursor:default}.ic.del{color:var(--bad)}
.chk{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--f);color:var(--ink2);cursor:pointer;margin-right:6px}
.chk input{width:16px;height:16px;accent-color:#4101f7}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fc{display:flex;flex-direction:column;gap:14px;min-width:0}
.fl{display:flex;flex-direction:column;gap:7px;font:600 12.5px var(--f);color:var(--ink2)}
.fl small{font-weight:500;color:var(--ink4)}
.in,.fl select,.fl textarea{height:42px;border:1px solid var(--line);border-radius:12px;background:#F6F3FC;padding:0 12px;font:500 14px var(--f);color:var(--ink);width:100%}
.fl textarea{height:132px;padding:10px 12px;line-height:1.5;resize:vertical}
.in:focus,.fl select:focus,.fl textarea:focus{outline:none;border-color:var(--violet2);box-shadow:0 0 0 3px rgba(65,1,247,.12);background:#fff}
.row{display:flex;gap:10px;align-items:center}.row .in.num{width:90px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{border-radius:14px;border:1.5px dashed #CDBDF7;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--violet2);font:700 13px var(--f);background:#FBF9FF;padding:10px;text-align:center}
.slot button.up{border:0;background:none;color:var(--violet2);font:700 13.5px var(--f);cursor:pointer}
.slot small{font:500 11.5px var(--f);color:var(--ink4)}
.slot.full{border:1px solid var(--line);background:#fff;align-items:stretch;justify-content:flex-start;padding:8px}
.slot .pv{height:96px;border-radius:10px;overflow:hidden;position:relative;background:#F1ECFC}
.slot .pv img{width:100%;height:100%;object-fit:cover;display:block}
.slot .pv .vi{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#2B0256,#4101f7);color:#fff;font:700 13px var(--f)}
.slot .nm{font:600 12px var(--f);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;margin-top:6px}
.slot .ctl{display:flex;gap:6px;align-items:center;margin-top:6px}
.slot .ctl select{flex:1;height:30px;border:1px solid var(--line);border-radius:8px;background:#F6F3FC;font:500 12px var(--f);color:var(--ink);padding:0 6px;min-width:0}
.slot .ctl .ic{width:30px;height:30px;font-size:12px}
.prog{width:100%;height:6px;border-radius:6px;background:#EEE8FB;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--pink))}
.card-e{border:1px solid var(--edge);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#FCFBFF}
.card-e .row .in{flex:1}
.card-e textarea{height:92px}
.addc{border:1.5px dashed #CDBDF7;background:none;border-radius:12px;padding:12px;font:700 13.5px var(--f);color:var(--violet2);cursor:pointer}
.save{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;gap:10px;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -20px rgba(18,14,43,.45);padding:12px 16px}
.save span{margin-right:auto;font:500 13.5px var(--f);color:var(--ink2)}.save .msg{color:var(--bad)}
.btn{height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;font:700 13.5px var(--f);color:var(--ink);cursor:pointer}
.btn.pri{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;border:0}.btn:disabled{opacity:.5;cursor:default}
.ro{padding:40px;text-align:center;font-size:15px;color:var(--ink3);background:#fff;border:1px solid var(--line);border-radius:22px}
/* template picker and small dialogs */
.ov{position:fixed;inset:0;z-index:50;background:rgba(18,14,43,.5);display:grid;place-items:center;padding:20px}
.dlg{width:min(1080px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:26px;padding:28px 30px 26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.dlg h3{font:800 24px var(--f);color:var(--ink)}.dlg p{font-size:14px;color:var(--ink3);margin-top:6px}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
.tp{border:1.5px solid var(--edge);border-radius:18px;padding:10px 10px 12px;background:#fff;cursor:pointer;text-align:left}
.tp:hover{border-color:#CDBDF7}.tp[aria-pressed="true"]{border-color:var(--violet2);box-shadow:0 0 0 4px rgba(65,1,247,.12)}
.tp .pv{height:128px;border-radius:12px;background:#FAF8FE;padding:10px;display:flex;gap:7px}
.tp .pv .t{flex:0 0 42%;border-radius:8px;background:#E9E0FD;padding:10px 9px;display:flex;flex-direction:column;gap:6px}.tp .pv .t i{height:6px;border-radius:4px;background:#C9B5FA}.tp .pv .t i:first-child{width:60%;background:#9B7BF5;height:8px}
.tp .pv .g{flex:1;display:grid;gap:7px}.tp .pv .g div{border-radius:8px;display:grid;place-items:center}
.tp .pv .g svg{width:22px;height:22px;fill:#fff;opacity:.9}
.tp b{display:block;font:700 14px var(--f);color:var(--ink);margin-top:10px}.tp small{display:block;font-size:12px;color:var(--ink4);margin-top:3px}
.dlg .ft{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.dlg.sm{width:440px}.dlg.sm .in{margin-top:16px}
/* Presenting */
body.fs{overflow:hidden;background:#0b0820}
body.fs .hero,body.fs .bar,body.fs .note,body.fs .sbar,body.fs .ed,body.fs #ro{display:none!important}
body.fs .page{margin:0;padding:0;max-width:none}
body.fs .stage{position:fixed;inset:0;width:auto;height:auto!important;border-radius:0;box-shadow:none;background:#0b0820}
.fsb{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:6px;background:rgba(18,14,43,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:6px;color:#fff;font:600 13px var(--f);transition:opacity .3s;max-width:calc(100vw - 40px);overflow-x:auto}
.fsb.idle{opacity:0;pointer-events:none}
.fsb button{border:0;background:none;color:#cec8ea;padding:8px 14px;border-radius:11px;font:600 13px var(--f);cursor:pointer;white-space:nowrap}
.fsb button em{font-style:normal;opacity:.7;margin-left:6px;font-size:12px}
.fsb button.on{background:#fff;color:var(--violet2)}
.fsb .nv{background:rgba(255,255,255,.1);color:#fff}
.fsb .sep{width:1px;height:24px;background:rgba(255,255,255,.18);margin:0 6px;flex:none}
@media (max-width:1100px){.ed{grid-template-columns:1fr}.rail{position:static;flex-direction:row;overflow-x:auto;max-height:none}.th{flex:none}.fg{grid-template-columns:1fr}.tpls{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.hero{padding:24px 16px 80px}.hin{flex-direction:column;align-items:flex-start}.hr{align-items:flex-start}h1{font-size:32px}.page{padding:0 16px 48px}.br{flex-wrap:wrap}}

/* Collections Overview slide (scoped) */
.cs{flex:1;min-height:0;display:flex;flex-direction:column;padding:34px 48px 30px;background:#F6F5F2;--display:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--bg:#F6F5F2;--border:#E4E1EA;--line:#EFEDF2;--ink:#1D1B22;--ink2:#3B3742;--muted:#6B6774;--faint:#9A96A3;--ghost:#B3AFBB;--accent:#5B2A86;--accent-soft:#F2ECF8;--gold:#A8844F;--ok:#1F7A4D;--bad:#B42318;--warn:#9A6200;font-family:var(--body)}
.cs h1{font:700 40px/1.05 var(--display);color:var(--ink);letter-spacing:-.01em;background:none;-webkit-background-clip:border-box;background-clip:border-box;padding:0}
.cs .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.cs .eb{font:700 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.cs h1{font:700 40px/1.05 var(--display);color:var(--ink);letter-spacing:-.01em}
.cs .sub{font:500 16px var(--body);color:var(--muted);margin-top:6px}
.cs .prog{text-align:right}
.cs .prog b{display:block;font:600 15px var(--display);color:var(--ink2)}

.cs tr.net td.t{color:#E3D3F3}tr.net td.r{color:#CDB8E3}

</style>

<body>
<div class="hero"><div class="hin"><div><h1>Execs Call</h1><div class="sub" id="psub"></div></div>
  <div class="hr"><div class="upd"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div>
  <div class="vt" id="vt" role="group" aria-label="View" hidden><button type="button" data-v="show" aria-pressed="true">Slideshow</button><button type="button" data-v="edit" aria-pressed="false">Edit</button></div></div></div></div>
<div class="page">
  <div class="bar"><nav class="seg" id="subs" aria-label="Sub-pages" hidden></nav>
    <div class="br"><div class="per"><button class="mb" id="prev" aria-label="Previous month">‹</button><div class="pl" id="wlabel">—<small>Month</small></div><button class="mb" id="next" aria-label="Next month">›</button></div>
      <button class="pres" id="present" type="button"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Present all</button></div></div>
  <div class="note" id="note" hidden></div>
  <div class="sbar" id="sbar"><span class="who" id="who"></span><span class="snav" id="snav"><button class="mb" id="sprev" aria-label="Previous slide">‹</button><span id="slabel">—</span><button class="mb" id="snext" aria-label="Next slide">›</button></span></div>
  <div id="showwrap"><div class="stage" id="stage"><div class="slide" id="slide"></div></div></div>
  <div class="ed" id="ed" hidden></div>
</div>
<div class="fsb" id="fsb" hidden></div>
<div id="dlg"></div>

<script>
const MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TAGS=['Academics','Learner Experience','Finance','Hiring','Marketing','Operations','People Management','Product / Tech','Social Media','Design & Content','Teacher Experience'];
const CITY={Alwarpet:'Chennai',Thoraipakkam:'Chennai','Borewell Road':'Bangalore'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* Templates: [name, short description, text box?, kind, fewest, most] */
const TPL={upd:['Updates','Up to 4 update cards, as on Key Updates.',0,'',0,0],t1p:['Text and 1 photo','One text box beside a photo.',1,'image',1,1],t2p:['Text and 2 photos','One text box beside two photos.',1,'image',2,2],
  t1v:['Text and 1 video','One text box beside a video.',1,'video',1,1],t2v:['Text and 2 videos','One text box beside two videos.',1,'video',2,2],
  ponly:['Photos only','2 to 4 photos, with a title.',0,'image',2,4],vonly:['Videos only','2 to 4 videos, with a title.',0,'video',2,4]};
const TPL_ORDER=['upd','t1p','t2p','t1v','t2v','ponly','vonly'];

/* The deck is kept per month. The Collections Overview slide follows the same month and "data up to" day as the Collections Overview page. */
const NOW=new Date(),YDAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-1);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),mkey=iso;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const THIS_WEEK=new Date(YDAY.getFullYear(),YDAY.getMonth(),1);
const lastDay=(y,m)=>y===YDAY.getFullYear()&&m===YDAY.getMonth()?YDAY.getDate():dim(y,m);
let WEEK=THIS_WEEK,UPTO_SET=null;
try{const p=JSON.parse(localStorage.getItem('artium_execs_period')||'null');
  if(p&&p.y*12+p.m<=YDAY.getFullYear()*12+YDAY.getMonth()){WEEK=new Date(p.y,p.m,1);UPTO_SET={y:p.y,m:p.m,d:p.d};}}catch(e){}
const upto=()=>{const y=WEEK.getFullYear(),m=WEEK.getMonth();return UPTO_SET&&UPTO_SET.y===y&&UPTO_SET.m===m?Math.max(1,Math.min(UPTO_SET.d,lastDay(y,m))):lastDay(y,m);};
const keepPeriod=()=>{try{localStorage.setItem('artium_execs_period',JSON.stringify({y:WEEK.getFullYear(),m:WEEK.getMonth(),d:upto()}));}catch(e){}};
const wkShort=w=>MONTH_FULL[w.getMonth()]+' '+w.getFullYear(),wkLong=wkShort,wkSlide=wkShort;
const fmtW=k=>{const [y,m]=k.split('-').map(Number);return MONTH_FULL[m-1]+' '+y;};
const upLabel=()=>{const u=upto(),y=WEEK.getFullYear(),m=WEEK.getMonth();return u>=dim(y,m)?'Full month':'Collections up to '+u+' '+MON[m];};
const adapt=j=>({month:j.month,pages:[{id:'deck',name:'Execs Call',fixed:true,canEdit:!!j.canEdit}],decks:{deck:{slides:j.slides||[],carried:j.carried,by:j.by,at:j.at}},canManage:false});

/* ── State ── */
let DATA=null,SUB='deck',VIEW='show',SL=0;
let DRAFT=null,DIRTY=false,SEL=-1,busy=false,UPLOADING=0,PICK=null;
const pageOf=id=>(DATA&&DATA.pages.find(p=>p.id===id))||null;
const deckOf=id=>(DATA&&DATA.decks[id])||{slides:[]};
const canAny=()=>!!DATA&&(DATA.canManage||DATA.pages.some(p=>p.canEdit));
const shown=sl=>[{tpl:'coll',id:'coll'}].concat(sl.filter(s=>!s.hide).flatMap(spill));
/* An update slide that is too full: first the text gets a little smaller (down to 88%), then the cards that still don't fit
   move to a next slide marked "(continued)". A card longer than a whole slide is split between its lines. */
const SPILL=new Map();let MEAS=null;
function fitsAt(s){
  if(!MEAS){const d=document.createElement('div');d.style.cssText='position:fixed;left:-20000px;top:0;width:1600px;height:900px;visibility:hidden;pointer-events:none';
    d.innerHTML='<div class="slide"></div>';document.body.appendChild(d);MEAS=d.firstChild;}
  MEAS.innerHTML=slideHtml({name:''},s,0,2);
  const b=MEAS.querySelector('.s-b'),f=MEAS.querySelector('.flow');
  return !f||f.offsetHeight<=b.clientHeight-4;
}
function spill(s){
  if(s.tpl!=='upd')return[s];
  const key=JSON.stringify(s);if(SPILL.has(key))return SPILL.get(key);
  const cs=(s.cards||[]).filter(c=>c.title||(c.lines||[]).length),Z=[1,.94,.88];
  let out=null;
  for(const z of Z){const t=Object.assign({},s,{z});if(fitsAt(t)){out=[t];break;}}
  if(!out){
    const parts=[];let cur=[];
    const ok=cards=>fitsAt(Object.assign({},s,{cards,z:1}));
    const queue=cs.slice();
    while(queue.length){
      const c=queue.shift();
      if(ok(cur.concat(c))){cur.push(c);continue;}
      if(cur.length){parts.push(cur);cur=[];queue.unshift(c);continue;}
      // one card alone is too long: keep as many of its lines as fit, the rest continues
      const L=c.lines||[];let k=L.length-1;
      while(k>1&&!ok([Object.assign({},c,{lines:L.slice(0,k),of:null})]))k--;
      parts.push([Object.assign({},c,{lines:L.slice(0,Math.max(1,k)),of:null})]);
      if(L.length>Math.max(1,k))queue.unshift(Object.assign({},c,{title:(c.title||'')+' (continued)',lines:L.slice(Math.max(1,k))}));
    }
    if(cur.length)parts.push(cur);
    out=parts.map((p,i)=>Object.assign({},s,{cards:p,z:1,cont:i>0}));
  }
  SPILL.set(key,out);return out;
}

/* ── Photos and videos ── */
const LOCAL={},IMG={};
async function loadImg(id){
  if(IMG[id])return;IMG[id]='…';
  try{const j=await ArtiumAuth.call('execsDeckMedia',{id});if(j.error)throw new Error(j.error);IMG[id]='data:'+j.mime+';base64,'+j.data;}
  catch(e){IMG[id]='x';}
  paint();
}
const PLAY='<div class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div>';
function media(m,k,kind,thumb){
  if(!m)return`<div class="md empty"><div class="ph">${kind==='video'?'Video':'Photo'} ${k+1}</div></div>`;
  const fit=m.fit==='contain'?' contain':'';
  if(m.kind==='video'){
    if(thumb)return`<div class="md vthumb"><div class="ph">${PLAY}</div></div>`;
    if(LOCAL[m.id])return`<div class="md"><video src="${LOCAL[m.id]}" controls playsinline></video></div>`;
    return`<div class="md"><iframe src="https://drive.google.com/file/d/${encodeURIComponent(m.id)}/preview" allow="autoplay; fullscreen" allowfullscreen title="Video ${k+1}"></iframe></div>`;
  }
  const src=LOCAL[m.id]||(IMG[m.id]&&IMG[m.id].length>2?IMG[m.id]:'');
  if(src)return`<div class="md${fit}"><img src="${src}" alt=""></div>`;
  if(IMG[m.id]==='x')return`<div class="md"><div class="ph">This photo couldn't be loaded.</div></div>`;
  loadImg(m.id);return`<div class="md"><div class="ph">Loading the photo…</div></div>`;
}
// How the photos or videos share the space: one fills it; two sit side by side, or one above the other when both are wide;
// three: one large beside two; four: two by two
function grid(ms,n,withText){
  if(n===1)return'';
  if(n===2){const wide=ms.filter(Boolean).length===2&&ms.every(m=>(+m.w||16)/(+m.h||9)>=1.25);return wide&&withText?'grid-template-rows:1fr 1fr':'grid-template-columns:1fr 1fr';}
  if(n===3)return'grid-template-columns:1.45fr 1fr;grid-template-rows:1fr 1fr';
  return'grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr';
}
const line=t=>{const m=String(t).match(/^([^:.]{1,28}):\s*(.*)$/);return m?`<b>${esc(m[1])}:</b> ${esc(m[2])}`:esc(t);};
function cardHtml(c){
  const of=+c.of||0,done=+c.done||0,pct=of?Math.round(done/of*100):0;
  return`<div class="u">${c.tag?`<span class="tg">${esc(c.tag)}</span>`:''}<h3>${esc(c.title||'Untitled update')}</h3><ul>${(c.lines||[]).map(l=>`<li>${line(l)}</li>`).join('')}</ul>
    ${of?`<div class="meter"><div class="n">${done.toLocaleString('en-IN')}<small> / ${of.toLocaleString('en-IN')}</small></div><div class="bw"><div><span>${esc(c.unit||'')}</span><b>${pct}%</b></div><div class="tr"><i style="width:${Math.min(100,pct)}%"></i></div></div></div>`:''}</div>`;
}
/* One slide, 1600 × 900 */
function slideHtml(page,s,i,n,thumb){
  if(s.tpl==='coll')return collSlide(!!s.edit&&!thumb);
  const T=TPL[s.tpl]||TPL.upd;
  const title=s.title||(s.tpl==='upd'?'Updates':'Untitled slide');
  let body;
  if(s.tpl==='upd'){const cs=(s.cards||[]).filter(c=>c.title||(c.lines||[]).length);
    const h=cs.length===1?1:Math.ceil(cs.length/2),cols=cs.length===1?[cs]:[cs.slice(0,h),cs.slice(h)];
    body=cs.length?`<div class="flow" style="--z:${s.z||1}">${cols.map(c=>`<div class="fcol">${c.map(cardHtml).join('')}</div>`).join('')}</div>`
      :`<div class="s-empty">Add update cards to this slide.</div>`;}
  else{
    const ms=[],cnt=Math.max(T[4],Math.min(T[5],(s.media||[]).length+(thumb?0:0)));
    for(let k=0;k<Math.max(cnt,(s.media||[]).length);k++)ms.push((s.media||[])[k]||null);
    const shownMs=VIEW==='edit'||thumb?ms:ms.filter(Boolean);
    const big=shownMs.length===3?'grid-row:1/3;':'';
    const mg=shownMs.length?`<div class="mg" style="${grid(shownMs,shownMs.length,T[2])}">${shownMs.map((m,k)=>k===0&&big?media(m,k,T[3],thumb).replace('class="md','style="'+big+'" class="md'):media(m,k,T[3],thumb)).join('')}</div>`:'';
    const tx=T[2]?`<div class="tx">${s.tag?`<span class="tg">${esc(s.tag)}</span>`:''}${s.head?`<h3>${esc(s.head)}</h3>`:''}<ul>${(s.lines||[]).map(l=>`<li>${line(l)}</li>`).join('')}</ul></div>`:'';
    body=tx+mg||`<div class="s-empty">Nothing on this slide yet.</div>`;
  }
  const dots=n>1&&n<=14?`<span class="dots">${Array.from({length:n},(_,k)=>`<i${k===i?' class="on"':''}></i>`).join('')}</span>`:n>1?`<span>${i+1} of ${n}</span>`:'';
  return`<div class="s-top"><div><div class="s-eb">Execs Call · Offline Centres</div><div class="s-h">${esc(title)}${s.cont?'<span class="cont">(continued)</span>':''}</div><div class="s-wk">${wkSlide(WEEK)}</div></div>
    <div class="logo"><img src="brand/lockup-violet.png" alt="Artium Academy" width="130" height="46"></div></div>
    <div class="s-b">${body}</div><div class="s-f"><span>Artium Academy · Offline.</span>${dots}</div>`;
}

/* ── Rendering ── */
function renderSubs(){return;
  const el=document.getElementById('subs');if(!DATA){el.innerHTML='';return;}
  const edit=VIEW==='edit';
  el.innerHTML=DATA.pages.map(p=>`<button type="button" class="sp" data-sub="${esc(p.id)}" aria-pressed="${p.id===SUB}"><small>${p.id==='key'?'All centres':p.centre?(CITY[p.id]||'Centre'):'Added'}</small><span>${esc(p.name)}</span>${edit&&DATA.canManage&&!p.fixed?`<i class="rm" data-rm="${esc(p.id)}" title="Remove this sub-page">✕</i>`:''}</button>`).join('')
    +(edit&&DATA.canManage?'<button type="button" class="addsp" id="addsp">+ Sub-page</button>':'');
}
function render(){
  document.getElementById('psub').textContent=wkLong(WEEK);
  document.getElementById('wlabel').innerHTML=wkShort(WEEK)+'<small>'+upLabel()+'</small>';
  document.getElementById('next').disabled=WEEK>=THIS_WEEK;
  const vt=document.getElementById('vt');vt.hidden=!canAny();
  vt.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===VIEW));
  if(DATA&&!pageOf(SUB))SUB=DATA.pages[0].id;
  renderSubs();
  const edit=VIEW==='edit',page=pageOf(SUB),deck=deckOf(SUB),note=document.getElementById('note');
  document.getElementById('present').disabled=!DATA;
  // brought forward from an earlier week
  note.hidden=!(DATA&&deck.carried&&(edit?page&&page.canEdit&&!DIRTY:true));
  if(DATA&&deck.carried)note.innerHTML=edit?`These are the slides from <b>${fmtW(deck.carried)}</b>, brought forward. Change what's new and press Save to keep them for this month.`
    :`Nothing has been saved for this month yet, so these are the slides from <b>${fmtW(deck.carried)}</b>.`;
  document.getElementById('showwrap').hidden=edit;document.getElementById('sbar').hidden=edit;document.getElementById('ed').hidden=!edit;
  if(edit)renderEditor();else renderShow();
}
function renderShow(){
  const page=pageOf(SUB),sl=page?shown(deckOf(SUB).slides):[];
  SL=Math.max(0,Math.min(SL,sl.length-1));
  const d=deckOf(SUB);
  document.getElementById('who').innerHTML=!DATA?'':page.name+(d.by&&!d.carried?` · last saved by <b>${esc(d.by)}</b>${d.at?' on '+new Date(d.at).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):''}`:'');
  document.getElementById('snav').hidden=sl.length<2;
  document.getElementById('slabel').textContent=`Slide ${SL+1} of ${sl.length}`;
  document.getElementById('sprev').disabled=SL<=0;document.getElementById('snext').disabled=SL>=sl.length-1;
  const el=document.getElementById('slide');
  if(!DATA)el.innerHTML='<div class="s-empty" style="margin:60px">Loading…</div>';
  else if(!sl.length)el.innerHTML=slideHtml(page,{tpl:'none',title:page.name},0,0).replace(/<div class="s-b">[\s\S]*?<\/div><div class="s-f">/,`<div class="s-b"><div class="s-empty">No slides for ${esc(page.name)} this week${page.canEdit?' yet. Switch to Edit to add them':''}.</div></div><div class="s-f">`);
  else el.innerHTML=slideHtml(page,sl[SL],SL,sl.length);
  fit();
}
function paint(){if(document.body.classList.contains('fs'))presentPaint();else if(VIEW==='edit')renderEditor();else renderShow();}

/* ── Edit view ── */
const TAGOPTS=v=>`<option value="">No tag</option>`+TAGS.map(t=>`<option${t===v?' selected':''}>${esc(t)}</option>`).join('');
function startDraft(){DRAFT=JSON.parse(JSON.stringify(deckOf(SUB).slides||[]));DIRTY=false;SEL=Math.min(SEL,Math.max(0,DRAFT.length-1));}
function renderEditor(){
  const ed=document.getElementById('ed'),page=pageOf(SUB);
  if(!DATA){ed.innerHTML='';return;}
  if(!page.canEdit){ed.innerHTML=`<div class="ro" id="ro" style="grid-column:1/-1">You can view the Execs Call deck but not edit it. Switch to Slideshow to see it.</div>`;return;}
  if(!DRAFT)startDraft();
  const n=DRAFT.length,s=DRAFT[SEL];
  const rail=`<div class="rail"><div class="rt">Execs Call · ${n+1} slide${n===0?'':'s'}</div>`
    +`<button type="button" class="th${SEL===-1?' on':''}" data-sel="-1"><div class="mini"><div class="slide">${slideHtml(page,{tpl:'coll'},0,n+1,true)}</div></div><small>1. Collections Overview<em>${SEL===-1?'Editing':'Fixed'}</em></small></button>`
    +DRAFT.map((x,i)=>`<button type="button" class="th${i===SEL?' on':''}${x.hide?' off':''}" data-sel="${i}"><div class="mini"><div class="slide">${slideHtml(page,x,i+1,n+1,true)}</div></div><small>${i+2}. ${esc(TPL[x.tpl][0])}<em>${x.hide?'Hidden':i===SEL?'Editing':''}</em></small></button>`).join('')
    +`<button type="button" class="addsl" id="addsl">+ Add a slide</button></div>`;
  let main;
  if(SEL===-1)main=collEditMain(page,n);
  else if(!s)main=`<div class="ro">No other slides yet. Press <b>+ Add a slide</b> to add one after Collections Overview.</div>`;
  else{
    const T=TPL[s.tpl];
    let f=`<div class="fh"><b>Slide ${SEL+2}</b><span>${esc(T[0])}</span><span class="sp2"></span>

/* Upload: photos are resized to at most 2400 px first; everything goes to Drive in 8 MB pieces */
function pickFile(s){
  const T=TPL[s.tpl];if((s.media||[]).length>=T[5])return;
  const inp=document.createElement('input');inp.type='file';inp.accept=T[3]==='video'?'video/*':'image/*';
  inp.onchange=()=>{const f=inp.files[0];if(f)upload(s,f);};inp.click();
}
const dims=(f,kind)=>new Promise(res=>{const u=URL.createObjectURL(f);
  if(kind==='video'){const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>res({w:v.videoWidth||16,h:v.videoHeight||9,url:u});v.onerror=()=>res({w:16,h:9,url:u});v.src=u;}
  else{const im=new Image();im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight,url:u,img:im});im.onerror=()=>res({w:16,h:9,url:u});im.src=u;}});
async function shrink(f,d){
  if(!d.img||/gif|svg/.test(f.type)||Math.max(d.w,d.h)<=2400&&f.size<1.5e6)return{blob:f,w:d.w,h:d.h};
  const k=Math.min(1,2400/Math.max(d.w,d.h)),w=Math.round(d.w*k),h=Math.round(d.h*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(d.img,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.88));return{blob:blob||f,w,h};
}
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).replace(/^data:[^,]*,/,''));r.onerror=rej;r.readAsDataURL(blob);});
async function upload(s,f){
  const T=TPL[s.tpl],kind=/^video\//.test(f.type)?'video':/^image\//.test(f.type)?'image':null;
  if(kind!==T[3]){alert(T[3]==='video'?'This slide needs a video.':'This slide needs a photo.');return;}
  if(f.size>300*1024*1024){alert('That file is larger than 300 MB. Trim the video or export it smaller, then try again.');return;}
  UPLOADING++;s._up={pct:0,text:'Getting ready…'};renderEditor();
  try{
    const d=await dims(f,kind),{blob,w,h}=kind==='image'?await shrink(f,d):{blob:f,w:d.w,h:d.h};
    const type=blob.type||f.type,size=blob.size,name=f.name.replace(/\.[^.]+$/,'')+(blob===f?(f.name.match(/\.[^.]+$/)||[''])[0]:'.jpg');
    const st=await ArtiumAuth.call('execsDeckUploadStart',{file:{name,type,size}});if(st.error)throw new Error(st.error);
    let off=0,res=null;
    while(off<size){
      const end=Math.min(size,off+st.chunk),data=await b64(blob.slice(off,end));
      res=await ArtiumAuth.call('execsDeckUploadChunk',{id:st.upload,offset:off,data});if(res.error)throw new Error(res.error);
      off=res.done?size:res.next;
      s._up={pct:Math.round(off/size*100),text:'Uploading '+Math.round(off/size*100)+'% of '+(size/1048576).toFixed(1)+' MB…'};if(cur()===s)renderEditor();
    }
    LOCAL[res.id]=d.url;s.media=(s.media||[]).concat({id:res.id,kind,w,h,name:f.name,fit:'cover'}).slice(0,T[5]);DIRTY=true;
  }catch(err){alert('The upload stopped: '+err.message+'.');}
  delete s._up;UPLOADING--;renderEditor();
}

let SEQ=[],POS=0,idleT=null;

document.getElementById('present').onclick=async()=>{

const CH=()=>Object.keys(EDIT).length;
const TYPED=['exN','exAmt','insN','insAmt','rfN','rfAmt'];
const typed=(c,k)=>{const e=EDIT[c+'|'+k];if(e!==undefined)return e===''?null:e;const t=((COLL[collKey()]||{}).typed||{})[c]||{};return t[k]!=null?t[k]:null;};
function centreFigures(c){
  const d=COLL[collKey()]||{},a=(d.actuals||{})[c]||{adm:0,fs:0,rn:0,rc:0},t=(d.targets||{})[c]||{};
  const tv=k=>t[k]!=null?t[k]:null,V={adm:[tv('conv'),a.adm],fs:[tv('fscol'),a.fs],rn:[tv('renewed'),a.rn],rc:[tv('rncol'),a.rc]};
  TYPED.forEach(k=>V[k]=[typed(c,k+'T')||0,typed(c,k+'A')||0]);
  return V;
}
const addN=(...xs)=>xs.some(x=>x!=null)?xs.reduce((s,x)=>s+(x||0),0):null;
const pairOf=(f,...ks)=>[0,1].map(i=>f(...ks.map(k=>k[i])));
function derived(V){
  V.coach=pairOf(addN,V.fs,V.rc);V.other=pairOf(addN,V.exAmt,V.insAmt);V.gross=pairOf(addN,V.coach,V.other);
  V.net=pairOf((g,r)=>g==null&&r==null?null:(g||0)-(r||0),V.gross,V.rfAmt);
  V.atvF=[V.fs[0]!=null&&V.adm[0]?V.fs[0]/V.adm[0]:null,V.adm[1]?V.fs[1]/V.adm[1]:0];
  V.atvR=[V.rc[0]!=null&&V.rn[0]?V.rc[0]/V.rn[0]:null,V.rn[1]?V.rc[1]/V.rn[1]:0];
  return V;
}
function allFigures(){
  const F={};CENTRES.forEach(c=>F[c]=derived(centreFigures(c)));
  const T={};['adm','fs','rn','rc',...TYPED].forEach(k=>T[k]=[0,1].map(i=>addN(...CENTRES.map(c=>F[c][k][i]))));
  F.Total=derived(T);return F;
}
function daysOf(){const n=dim(WEEK.getFullYear(),WEEK.getMonth()),u=upto();return{n,gone:u,full:u>=n};}
const CROWS=[
  {l:'No. of Admissions',k:'adm'},{l:'Collections – Fresh Sales',k:'fs'},{l:'ATV – Fresh Sales',k:'atvF',atv:1},0,
  {l:'No. of Renewals',k:'rn'},{l:'Collections – Renewals',k:'rc'},{l:'ATV – Renewals',k:'atvR',atv:1},0,
  {l:'Gross Collections – Coaching',k:'coach',cls:'sum'},0,
  {l:'No. of Exam Registrations',k:'exN',typed:1},{l:'Collections – Exam Fees',k:'exAmt',typed:1},
  {l:'No. of Instruments Sold',k:'insN',typed:1},{l:'Collections – Instrument Sales',k:'insAmt',typed:1},0,
  {l:'Gross Collections – Total',k:'gross',cls:'sum'},0,
  {l:'No. of Refunds',k:'rfN',typed:1},{l:'Outflow from Refunds',k:'rfAmt',typed:1},0,
  {l:'Net Collections – Total',k:'net',cls:'net'}];
/* The slide itself; with edit on, the exam, instrument and refund figures become boxes */
function collSlide(edit){
  const D=daysOf(),m=WEEK.getMonth(),y=WEEK.getFullYear(),d=COLL[collKey()];
  const head=`<div class="top"><div><div class="eb">Execs Call · Offline Centres</div><h1>Collections Overview</h1><div class="sub">${MONTH_FULL[m]} ${y}</div></div>
    <div class="prog"><b>${D.full?'Full month':'Up to '+D.gone+' '+MONTH_FULL[m].slice(0,3)+' · '+D.gone+' of '+D.n+' days'}</b><div class="pb"><i style="width:${D.gone/D.n*100}%"></i></div></div></div>`;
  const foot='<div class="foot">Artium Academy · Offline.</div>';
  if(!d||d.error)return`<div class="cs">${head}<div class="tw"><table><tbody><tr><td class="p" style="height:60px">${d&&d.error?'The collections figures could not be loaded ('+esc(d.error)+').':'Loading…'}</td></tr></tbody></table></div>${foot}</div>`;
  const F=allFigures(),G=[...CENTRES,'Total'],rr=v=>v==null?null:D.gone?v/D.gone*D.n:null;
  let h='<thead><tr class="c"><th></th>'+G.map(g=>`<th class="gap"></th><th colspan="${SHOWRR?3:2}" class="${g==='Total'?'tot':''}"><span>${g}</span></th>`).join('')+
    '</tr><tr class="s"><th>Particulars</th>'+G.map(()=>'<th class="gap"></th><th class="t">Target</th><th class="a">Actuals</th>'+(SHOWRR?'<th>Run-rate</th>':'')).join('')+'</tr></thead><tbody>';
  CROWS.forEach(r=>{
    if(!r){h+=`<tr class="sec"><td colspan="${SHOWRR?17:13}"></td></tr>`;return;}
    h+=`<tr class="${r.cls||'rw'}"><td class="p">${r.l}</td>`+G.map((g,i)=>{
      const v=F[g][r.k],tt=g==='Total'?' tt':'',last=i===G.length-1?' last':'';
      const box=(j,cls)=>{const k=r.k+(j?'A':'T'),val=typed(g,k),ch=EDIT[g+'|'+k]!==undefined;
        return`<td class="ti ${cls}${tt}"><input inputmode="numeric" data-c="${esc(g)}" data-k="${k}" value="${val==null?'':val}" class="${ch?'ch':''}" aria-label="${esc(g)} · ${r.l} · ${j?'actual':'target'}"></td>`;};
      const t=edit&&r.typed&&g!=='Total'?box(0,'t'):`<td class="t${tt}">${fmt(v[0])}</td>`;
      const a=edit&&r.typed&&g!=='Total'?box(1,'a'):`<td class="a${tt}${SHOWRR?'':last}">${fmt(v[1])}</td>`;
      return`<td class="gap"></td>${t}${a}`+(SHOWRR?`<td class="r${tt}${last}">${r.atv?'<span class="na">NA</span>':fmt(rr(v[1]))}</td>`:'');}).join('')+'</tr>';});
  const T=F.Total,band=p=>p<70?'lo':p<90?'mid':'hi';
  const K=[['Collections – Total',T.net,1],['Coaching',T.coach],['Other',T.other],['Fresh Sales',T.fs],['Renewals',T.rc],['No. of Admissions',T.adm],['No. of Renewals',T.rn]];
  const cards=K.map(([l,v,hero])=>{const r=rr(v[1]),p=v[0]&&r!=null?Math.round(r/v[0]*100):null;
    return`<div class="k${hero?' kh':''}"><small>${l}</small><b>${fmt(v[1]||0)}</b><div class="vs">${v[0]?'of '+fmt(v[0])+' target':'No target set'}</div><div class="rr">${p==null||!SHOWRR?'&nbsp;':`<em class="${band(p)}">${p}%</em> of target`}</div></div>`;}).join('');
  return`<div class="cs">${head}<div class="cards">${cards}</div><div class="tw"><table>${h}</tbody></table></div>${foot}</div>`;
}
async function loadColl(){
  const k=collKey();
  try{const j=await ArtiumAuth.call('collections',{month:mkey(WEEK),upto:upto()});COLL[k]=j.error?{error:j.error==='not-allowed'?'no access':j.error}:j;}
  catch(err){COLL[k]={error:err.message};}
  if(k===collKey()&&DATA)paint();
}
/* Editing the Collections slide: the period and the typed figures */
function collEditMain(page,n){
  const y=WEEK.getFullYear(),m=WEEK.getMonth(),p2=x=>String(x).padStart(2,'0');
  return`<div><div class="stage" id="estage"><div class="slide" id="eslide">${slideHtml(page,{tpl:'coll',edit:true},0,n+1)}</div></div></div>
  <div class="form" id="form"><div class="fh"><b>Slide 1</b><span>Collections Overview · always the first slide</span><span class="sp2"></span>
    <label class="chk">Data up to <input type="date" class="in" id="cupto" style="width:auto;height:34px;margin-left:6px" min="${mkey(WEEK)}-01" max="${mkey(WEEK)}-${p2(lastDay(y,m))}" value="${mkey(WEEK)}-${p2(upto())}"></label>
    <button class="btn" id="clatest" type="button" style="height:34px">Latest</button>
    <label class="chk">Run-rate <select class="in" id="crr" style="width:auto;height:34px;margin-left:6px"><option value="1"${SHOWRR?' selected':''}>Show</option><option value="0"${SHOWRR?'':' selected'}>Hide</option></select></label></div>
    <p class="spill" style="display:block;margin:0">Everything on this slide comes from the receipts sheets and the Targets page, except exam registrations, instruments and refunds. Type those into the boxes on the slide, then press Save.</p></div>`;
}
function collRefresh(){
  if(!document.querySelector('.save')){renderEditor();return;}
  const el=document.getElementById('eslide');if(el)el.innerHTML=collSlide(true);
  const th=document.querySelector('.th[data-sel="-1"] .slide');if(th)th.innerHTML=collSlide(false);
  document.getElementById('save-n').textContent=UPLOADING?'Wait for the upload to finish before saving.':'Changes not saved yet.';
}
document.getElementById('ed').addEventListener('input',e=>{
  const i=e.target.closest('#eslide input[data-k]');if(!i)return;
  const c=i.dataset.c,k=i.dataset.k,raw=i.value.replace(/[^0-9]/g,'');
  if(raw!==i.value)i.value=raw;
  const t=((COLL[collKey()]||{}).typed||{})[c]||{},was=t[k]!=null?String(t[k]):'';
  if(raw===was)delete EDIT[c+'|'+k];else EDIT[c+'|'+k]=raw===''?'':+raw;
  const pos=i.selectionStart;collRefresh();
  const again=document.querySelector(`#eslide input[data-c="${CSS.escape(c)}"][data-k="${k}"]`);if(again){again.focus();try{again.setSelectionRange(pos,pos);}catch(err){}}
});
document.getElementById('ed').addEventListener('keydown',e=>{
  const i=e.target.closest('#eslide input[data-k]');if(!i||(e.key!=='Enter'&&e.key!=='ArrowDown'&&e.key!=='ArrowUp'))return;
  const all=[...document.querySelectorAll('#eslide input[data-k]')],col=all.filter(x=>x.dataset.c===i.dataset.c&&x.dataset.k.slice(-1)===i.dataset.k.slice(-1)),at=col.indexOf(i);
  const to=col[at+(e.key==='ArrowUp'?-1:1)];if(to){e.preventDefault();to.focus();to.select();}
});
function setUpto(d){
  if(CH()&&!confirm('You have figures that aren\'t saved. Change the period without saving them?')){renderEditor();return;}
  EDIT={};UPTO_SET={y:WEEK.getFullYear(),m:WEEK.getMonth(),d:d};keepPeriod();loadColl();renderEditor();
}
document.getElementById('ed').addEventListener('change',e=>{
  if(e.target.id==='cupto'){const m=String(e.target.value).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)setUpto(Math.min(+m[3],lastDay(+m[1],+m[2]-1)));}
  if(e.target.id==='crr'){SHOWRR=e.target.value==='1';try{localStorage.setItem('artium_execs_rr',SHOWRR?'1':'0');}catch(err){}renderEditor();}
});
document.getElementById('ed').addEventListener('click',e=>{if(e.target.id==='clatest')setUpto(lastDay(WEEK.getFullYear(),WEEK.getMonth()));});

/* Scale the 1600 × 900 slide to the space it has */
function fit(){
  const fs=document.body.classList.contains('fs');
  const one=(st,sl)=>{if(!st||!sl)return;let s,ox=0,oy=0;
    if(fs&&st.id==='stage'){s=Math.min(innerWidth/1600,innerHeight/900);ox=(innerWidth-1600*s)/2;oy=(innerHeight-900*s)/2;}
    else{const w=st.clientWidth;s=w/1600;
      if(st.id==='stage'){const top=st.getBoundingClientRect().top+scrollY,room=innerHeight-top-24;if(900*s>room&&room>320){s=room/900;ox=(w-1600*s)/2;}}
      st.style.height=(900*s)+'px';}
    sl.style.transform=`translate(${ox}px,${oy}px) scale(${s})`;};
  one(document.getElementById('stage'),document.getElementById('slide'));
  one(document.getElementById('estage'),document.getElementById('eslide'));
}
addEventListener('resize',fit);

function stamp(){const t=new Date();document.getElementById('updated').textContent='Updated '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});document.getElementById('dot').className='dot';}
async function load(){
  const k=iso(WEEK);DATA=null;DRAFT=null;DIRTY=false;EDIT={};render();
  document.getElementById('dot').className='dot loading';document.getElementById('updated').textContent='Loading…';
  loadColl();
  try{const j=await ArtiumAuth.call('execsDeck',{month:k});if(k!==iso(WEEK))return;if(j.error)throw new Error(j.error==='not-allowed'?'you don\'t have access to this page':j.error);DATA=adapt(j);stamp();}
  catch(err){document.getElementById('updated').textContent='Error: '+err.message;document.getElementById('dot').className='dot error';}
  render();
}
window.load=load;
// the site's refresh button and automatic refresh wait while editing, with unsaved changes, or while a file uploads
window.artiumBusy=()=>VIEW==='edit'||DIRTY||CH()>0||UPLOADING>0||document.body.classList.contains('fs');
addEventListener('beforeunload',e=>{if(DIRTY||CH()||UPLOADING){e.preventDefault();e.returnValue='';}});
document.fonts&&document.fonts.ready.then(()=>{SPILL.clear();fit();if(DATA&&VIEW!=='edit')paint();});
load();
</script>
