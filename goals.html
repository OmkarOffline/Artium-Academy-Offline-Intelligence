<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/emblem-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="brand/emblem-64.png">
<link rel="apple-touch-icon" href="brand/emblem-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="goalform.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  :root{--display:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --bg:#F6F3FC;--border:#E4E1EA;--line:#EFEDF2;--ink:#1D1B22;--ink2:#3B3742;--muted:#6B6774;--faint:#9A96A3;--ghost:#B3AFBB;
    --accent:#4101f7;--accent-soft:#F2ECF8;--gold:#7a7196;--ok:#1F7A4D;--ok-soft:#E5F4EC;--bad:#B42318;
    --shadow:0 1px 2px rgba(31,26,36,.04),0 12px 28px -18px rgba(75,31,111,.28)}
  body{background:var(--bg);font-family:var(--body);color:var(--ink2);-webkit-font-smoothing:antialiased}
  .page{max-width:1500px;margin:0 auto;padding:36px 48px 64px}
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:24px}
  .eyebrow{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  h1{font:600 38px/1.15 var(--display);letter-spacing:-.015em;color:var(--ink)}
  .subtitle{font-size:15px;color:var(--muted);margin-top:6px}
  .updated{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.loading{background:var(--gold);animation:pulse 1s infinite}.dot.error{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}
  .centre-toggle{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:5px;box-shadow:var(--shadow);margin-bottom:18px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .ct-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:0;background:none;border-radius:13px;padding:9px 20px 10px;cursor:pointer;white-space:nowrap;text-align:left}
  .ct-btn small{font:700 9.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .ct-btn span{font:600 15px/1.2 var(--display);color:var(--ink2)}
  .ct-btn:hover{background:var(--accent-soft)}
  .ct-btn[aria-pressed="true"]{background:var(--accent);box-shadow:0 6px 16px -8px rgba(65,1,247,.6)}.ct-btn[aria-pressed="true"] span{color:#fff}.ct-btn[aria-pressed="true"] small{color:#d9ccff}
  .hr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .period{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:6px;box-shadow:var(--shadow);flex-wrap:wrap}
  .seg{display:inline-flex;gap:2px;background:#F4F2F7;border-radius:11px;padding:3px}
  .seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font:600 12.5px var(--body);color:var(--ink2);cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(31,26,36,.15)}
  .mbtn{width:32px;height:34px;border:0;border-radius:10px;background:var(--bg);color:var(--ink2);font-size:16px;cursor:pointer}.mbtn:hover{background:var(--accent-soft);color:var(--accent)}
  .mlabel{min-width:130px;text-align:center;font:600 15px var(--display);color:var(--ink)}
  .range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .range input{font:500 14px var(--body);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:6px 9px}
  .by{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .k{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);min-width:110px}
  .k small{display:block;font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .k b{font:600 22px/1.3 var(--display);color:var(--ink)}.k em{font:500 12px var(--body);font-style:normal;color:var(--muted);margin-left:4px}
  .card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:980px}
  th{text-align:left;padding:11px 14px;background:#F7F4FD;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr{cursor:pointer}tbody tr:hover td{background:#FCFBFE}tr.sel td{background:#F6F0FC}
  tbody tr:last-child td{border-bottom:0}
  td b{display:block;font:600 14px var(--display);color:var(--ink)}td small{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
  td.nw{white-space:nowrap}
  .ontime{color:var(--ok)!important;font-weight:600}.late{color:var(--bad)!important;font-weight:600}
  .pb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}.pb span{width:70px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}
  .gl{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px 4px 9px;font:600 12px var(--body);white-space:nowrap}
  .gl i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .gl.tbp{background:#FDECEB;color:#B42318}.gl.inp{background:#FBF1DC;color:#9A6200}.gl.cmp{background:var(--ok-soft);color:var(--ok)}.gl.draft{background:#EFE7F8;color:#4101f7}
  .vbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
  .vgrp{display:flex;align-items:center;gap:8px}
  .vl{font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  /* Filters card and dropdowns (same as Course Performance) */
  .filters{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);margin-bottom:26px}
  .filters-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;cursor:pointer;user-select:none}
  .filters-head .t{display:flex;align-items:center;gap:10px;font:600 16px var(--display);color:var(--ink)}
  .filters-head .t svg{color:var(--accent)}
  .f-badge{background:var(--accent-soft);color:var(--accent);font:600 12px var(--body);border-radius:999px;padding:3px 10px}
  .f-badge.on{background:var(--accent);color:#fff}
  .f-chev{width:32px;height:32px;border-radius:999px;background:#fff;border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;transition:transform .2s}
  .filters.closed .f-chev{transform:rotate(-90deg)}
  .filters.closed .filters-body{display:none}
  .filters-body{border-top:1px solid var(--line);padding:18px 22px 20px}
  .f-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
  .f-group{display:flex;flex-direction:column;gap:6px}
  .f-group label{font:600 12px var(--body);color:var(--ink2)}
  .f-group select{height:42px;border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:0 12px;font:500 14px var(--body);color:var(--ink);cursor:pointer}
  .f-group select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(65,1,247,.12)}
  .f-group select.set{background:var(--accent-soft);border-color:#E0D4EE;color:var(--accent);font-weight:600}
  .f-clear{margin-top:14px;border:0;background:none;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:0}
  .f-clear:disabled{color:var(--ghost);cursor:default}
  .ms{position:relative;display:flex;flex-direction:column;gap:6px}
  .ms>label{font:600 12px var(--body);color:var(--ink2)}
  .ms>button{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:0 12px;font:500 14px var(--body);color:var(--ink);cursor:pointer;text-align:left;width:100%}
  .ms>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ms>button svg{flex:none;color:var(--muted)}
  .ms>button:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(65,1,247,.12)}
  .ms.set>button{background:var(--accent-soft);border-color:#E0D4EE;color:var(--accent);font-weight:600}
  .ms .pop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 40px -18px rgba(31,16,41,.35);padding:6px}
  .ms .pop label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);cursor:pointer}
  .ms .pop label:hover{background:var(--accent-soft)}
  .ms .pop input{width:16px;height:16px;accent-color:#4101f7}
  .ms .pop .pf{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:4px;padding:6px 6px 2px}
  .ms .pop .pf button{border:0;background:none;color:var(--accent);font:600 12.5px var(--body);cursor:pointer}
  .filters:not(.closed){position:relative;z-index:5}
  .filters-body{overflow:visible}
  .f-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  @media (max-width:900px){.f-grid{grid-template-columns:1fr}}
  .ms .pop{max-height:340px;overflow:auto}
  .ms .pop .n{margin-left:auto;font-size:11.5px;color:var(--faint)}
  .tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px}
  .tagbar .vl{margin-right:4px}
  .tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 6px 5px 12px;font:600 12.5px var(--body);color:var(--ink2);cursor:pointer}
  .tg span{font-size:11px;color:var(--muted);background:#F3F1F6;border-radius:999px;padding:1px 7px}
  .tg:hover{border-color:#CDBFE0}.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.tg[aria-pressed="true"] span{background:rgba(255,255,255,.2);color:#fff}
  .tgc{border:0;background:none;color:var(--accent);font:600 12.5px var(--body);cursor:pointer;margin-left:4px}
  .tchip{display:inline-block;font:600 11px var(--body);color:#7A5A22;background:#F6EEDF;border-radius:6px;padding:2px 7px;margin-right:6px}
  /* List view */
  table.gt{min-width:900px}
  table.gt td{padding:14px 16px;vertical-align:middle}
  table.gt th{padding:12px 16px}
  .gt-g{min-width:300px;max-width:460px}
  .gt-g b{display:block;font:600 14.5px/1.4 var(--display);color:var(--ink)}
  .gt-m{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin-top:5px;font-size:12px;color:var(--faint)}
  .gt-c{display:flex;flex-direction:column;gap:5px}
  .cd{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);white-space:nowrap}
  .cd i{width:8px;height:8px;border-radius:50%;background:#B3AFBB;flex:none}
  .cd.tbp i{background:#B42318}.cd.inp i{background:#C98A1B}.cd.cmp i{background:#1F7A4D}
  .cd em{font-style:normal;font-size:12px;color:var(--faint)}
  tr.gh td{background:#FAF8FC;padding:10px 16px;font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);cursor:default}
  tr.gh td i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
  tr.gh td span{margin-left:8px;font:600 11px var(--body);letter-spacing:0;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:999px;padding:1px 7px}
  tbody tr.gh:hover td{background:#FAF8FC}
  .ring.sm{width:38px;height:38px}.ring.sm span{width:30px;height:30px;font-size:10.5px}
  /* Goal cards, grouped by what needs attention */
  .gsec{margin-bottom:22px}
  .gsec h3{display:flex;align-items:center;gap:9px;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 4px 10px}
  .gsec h3 i{width:9px;height:9px;border-radius:50%}
  .gsec h3 span{font:600 11.5px var(--body);letter-spacing:0;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:999px;padding:1px 8px}
  .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px}
  .gc{position:relative;display:flex;gap:16px;align-items:stretch;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px 18px 16px 22px;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
  .gc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#B42318}
  .gc.inp::before{background:#C98A1B}.gc.cmp::before{background:#1F7A4D}.gc.draft::before{background:#8D6BB5}
  .gc:hover{transform:translateY(-2px);box-shadow:0 18px 34px -22px rgba(75,31,111,.45);border-color:#DCCFEA}
  .gc.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(65,1,247,.14),var(--shadow)}
  .gc-main{flex:1;min-width:0}
  .gc-t{font:600 15.5px/1.35 var(--display);color:var(--ink)}
  .gc-src{font-size:12px;color:var(--faint);margin-top:3px}
  .gc-cen{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .cp{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 4px 3px 9px;font:600 12px var(--body);background:#F4F2F7;color:var(--ink2)}
  .cp>i{width:8px;height:8px;border-radius:50%;background:#B3AFBB}
  .cp.tbp>i{background:#B42318}.cp.inp>i{background:#C98A1B}.cp.cmp>i{background:#1F7A4D}
  .cp.cmp{background:var(--ok-soft);color:var(--ok)}
  .avs{display:inline-flex}
  .avs b{width:22px;height:22px;border-radius:50%;background:#8D6BB5;color:#fff;font:700 9.5px/22px var(--body);text-align:center;border:2px solid #fff;margin-left:-6px}
  .avs b:first-child{margin-left:0}.avs b:nth-child(2){background:#5B7BC4}.avs b:nth-child(3){background:#b07cf7}
  .avs b img,.av img,.bav i img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.av,.avs b{overflow:hidden}
  .mav{display:inline-flex;flex:none;vertical-align:middle;margin:0 2px}.mav i{width:20px;height:20px;border-radius:50%;overflow:hidden;color:#fff;display:grid;place-items:center;font:600 8.5px var(--body);font-style:normal;box-shadow:0 0 0 2px #fff;margin-left:-5px}.mav i:first-child{margin-left:0}.mav img{width:100%;height:100%;object-fit:cover;display:block}
  .wav{display:flex;align-items:center;gap:9px}.wav .mav i{width:26px;height:26px;font-size:10px}
  .avs b.none{background:#E4E1EA;color:var(--muted)}
  .gc-side{flex:none;width:150px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px;text-align:right}
  .due{font:600 12px/1.35 var(--body);color:var(--muted)}
  .due.bad{color:#B42318}.due.warn{color:#9A6200}.due.ok{color:var(--ok)}.due.mut{color:var(--faint);font-weight:500}
  .ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(#1F7A4D calc(var(--p)*1%),#EEEAF2 0);display:grid;place-items:center}
  .ring span{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font:600 11.5px var(--display);color:var(--ink)}
  .rl{font-size:11px;color:var(--faint);margin-top:-4px}
  @media (max-width:640px){.glist{grid-template-columns:1fr}.gc-side{width:110px}}
  /* Goals | Tasks */
  .kind{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:5px;box-shadow:var(--shadow);margin-bottom:18px}
  .kind button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;border-radius:12px;padding:9px 22px 10px;cursor:pointer;text-align:left}
  .kind button{font:600 16px var(--display);color:var(--ink2)}.kind small{font:600 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .kind button[aria-pressed="true"]{background:var(--accent);box-shadow:0 6px 16px -8px rgba(65,1,247,.6);color:#fff}.kind button[aria-pressed="true"] small{color:#d9ccff}
  .tk-row{display:grid;grid-template-columns:minmax(0,1fr) 240px 160px 150px 210px 70px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .tk-row:last-child{border-bottom:0}.tk-row.hl{background:#F6F0FC}
  .tk-row b{display:block;font:600 15px/1.35 var(--display);color:var(--ink)}
  .tk-row .ds{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tk-row .src{display:inline-block;margin-top:5px;font:600 11.5px var(--body);color:var(--accent)}
  .tk-row .who{font-size:13.5px;color:var(--ink2)}.tk-row .who small{display:block;font-size:12px;color:var(--faint)}
  /* Board: one header row of statuses, columns as soft wells, compact cards */
  .board{--colbg:#EFEDE9}
  .bhead,.lrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .bhead{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 10px}
  .bh{display:flex;align-items:center;gap:9px;padding:0 6px}
  .bh b{font:600 13.5px var(--body);color:var(--ink)}
  .bh span{font:500 13px var(--body);color:var(--faint)}
  .bh .bplus{margin-left:auto;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .bh .bplus:hover{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(31,26,36,.08)}
  .bcol{background:var(--colbg);border-radius:14px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:8px;transition:background .15s,box-shadow .15s}
  .bcol.over{background:#E9E1F3;box-shadow:inset 0 0 0 1.5px #CDB8E6}
  .lane2{margin-top:6px}.lane2 .bcol{min-height:72px}
  .lh{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:12px 6px 10px;cursor:pointer;text-align:left;font:600 13.5px var(--body);color:var(--ink)}
  .lh svg{color:var(--faint);transition:transform .15s}.lane2.shut .lh svg{transform:rotate(-90deg)}.lane2.shut .lrow{display:none}
  .lh i{width:8px;height:8px;border-radius:3px}.lh span{font-weight:500;color:var(--faint)}
  .lh::after{content:"";flex:1;height:1px;background:#E6E2DC;margin-left:6px}
  .bc{position:relative;background:#fff;border:1px solid #E7E4EA;border-radius:11px;padding:12px 13px 11px;box-shadow:0 1px 2px rgba(31,26,36,.05);
    display:flex;flex-direction:column;gap:7px;transition:border-color .15s,box-shadow .15s}
  .bc:hover{border-color:#D6CEE0;box-shadow:0 4px 14px -6px rgba(31,26,36,.18)}
  .bc[draggable="true"]{cursor:grab}.bc.drag{opacity:.35}.bc.hl{border-color:var(--accent);box-shadow:0 0 0 3px rgba(65,1,247,.12)}
  .bct{display:flex;gap:9px;align-items:flex-start}
  .bsi{position:relative;flex:none;width:16px;height:16px;margin-top:2px;display:grid;place-items:center;border-radius:50%}
  .bsi select{position:absolute;inset:-4px;opacity:0;cursor:pointer;width:24px;height:24px}
  .bsi:hover{box-shadow:0 0 0 4px #F1EDF5}
  .bc h4{font:600 14px/1.42 var(--body);color:var(--ink);letter-spacing:-.005em}
  .bc.done h4{color:var(--muted);text-decoration:line-through;text-decoration-color:#C9C4CF}
  .bd{font-size:12.5px;line-height:1.5;color:var(--muted);margin:-2px 0 0 25px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bp{display:flex;flex-wrap:wrap;gap:5px;margin-left:25px}.bp:empty{display:none}

  .tdlg .sh.del{font-size:13px;color:var(--ink2);flex-wrap:wrap}.tdlg .sh.del button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 10px;font:600 12.5px var(--body);color:var(--ink2)}

  .via{font-style:normal;font-size:11.5px;color:var(--faint);font-weight:500}
  .sbl li.sgh{padding:10px 6px 4px;gap:10px;background:none!important}.sbl li.sgh b{font:800 13.5px var(--body);color:var(--ink)}.sbl li.sgh small{margin-left:0}

  .tdlg .sr .in{padding:8px 10px}

  .tk-row .sl{display:block;font-size:12px;color:var(--faint);margin-top:2px}.tk-row .sl.warn{color:#9A6200}

  .btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--ink2);font:600 13px var(--display);cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--accent-soft);color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.55;cursor:default}
  .desc{margin-top:14px;padding:14px 16px;border-radius:12px;background:#FAF8FC;border-left:3px solid #C9B6DE;font-size:14px;line-height:1.65;color:var(--ink2)}
  .desc p{margin:0 0 8px}.desc p:last-child,.desc ul:last-child{margin-bottom:0}.desc h3{font:600 17px/1.35 var(--display);color:var(--ink);margin:12px 0 6px}.desc h3:first-child{margin-top:0}.desc ul{margin:0 0 8px;padding-left:22px}.desc li{margin:2px 0}

  /* ── Artium brand (Colours & Typography): Onest, violet and pink on a deep-navy header band ── */
  :root{
    --display:'Onest',system-ui,sans-serif;--body:'Onest',system-ui,sans-serif;
    --bg:#F6F3FC;--card:#fff;--border:#dcd5ee;--line:#ece4ff;
    --ink:#120e2b;--ink2:#4a4466;--muted:#6a6488;--faint:#7a7196;--ghost:#b9b2cf;
    --accent:#4101f7;--accent-soft:#f1eafe;--gold:#7a7196;
    --shadow:0 1px 2px rgba(18,14,43,.04),0 18px 40px -26px rgba(65,1,247,.35);
    --violet:#6601fd;--violet2:#4101f7;--purple:#7b2cf0;--pink:#dd30b1;
  }
  html,body{overflow-x:hidden}
  body{background:#F6F3FC;font-family:var(--body);font-variant-numeric:tabular-nums}
  .page{position:relative;z-index:0;padding-top:34px}
  .page-header{position:relative;align-items:flex-end}
  .page-header::before{content:"";position:absolute;z-index:-1;left:calc(50% - 50vw);width:100vw;top:-34px;bottom:calc(-1 * var(--band,62px));
    background:radial-gradient(120% 140% at 85% -20%,#4101f7 0%,rgba(65,1,247,0) 55%),linear-gradient(135deg,#2B0256 0%,#160240 55%,#01064c 100%)}
  .page-header .eyebrow,.page-header .subtitle{display:none}
  .page-header h1{font:800 46px/1.05 var(--display);letter-spacing:-.02em;padding-bottom:4px;
    background:linear-gradient(90deg,#FFFFFF 0%,#F1B6FA 45%,#9BB6FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .page-header .updated{color:#cec8ea}
  .page-header .dot{background:#4ade80}.page-header .dot.loading{background:#F1B6FA}.page-header .dot.error{background:#ff8a80}
  /* Centre toggle and segmented buttons: brand violet */
  .ct-btn small{color:var(--faint)}
  .ct-btn span{font-weight:700;color:var(--ink)}
  .ct-btn:hover{background:#F4F1FB}
  .ct-btn[aria-pressed="true"]{background:linear-gradient(135deg,#6601fd,#4101f7);box-shadow:0 8px 18px -10px rgba(65,1,247,.8)}
  .ct-btn[aria-pressed="true"] small{color:#d9ccff}
  .seg button[aria-pressed="true"]{color:var(--violet2)}
  h2,h3{font-family:var(--display)}
  /* Goals: brand tags and cards */
  .tchip{color:#6b3fc7;background:#f1eafe}
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><div class="eyebrow">Planner</div><h1>Goals</h1><div class="subtitle" id="subtitle">Goals centre by centre, with their subtasks and updates</div></div>
    <div class="hr"><div class="updated"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div>
      <button class="btn pri" type="button" id="newgoal" hidden style="height:42px;padding:0 18px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New goal</button></div>
  </header>
  <div class="kind" id="kind"><button type="button" data-k="goals" aria-pressed="true">Goals<small>Long-term</small></button><button type="button" data-k="tasks" aria-pressed="false">Tasks<small id="tcount">Short-term, one-time</small></button></div>
  <section class="filters closed" id="fbox">
    <div class="filters-head" id="fhead">
      <div class="t"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Filters<span class="f-badge" id="f-badge">All optional</span></div>
      <span class="f-chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>
    <div class="filters-body">
      <div class="f-grid" id="fsel"></div>
      <button class="f-clear" id="fclr" type="button" disabled>Clear filters</button>
    </div>
  </section>
  <div class="bar">
    <div class="period">
      <div class="seg" id="mode"><button type="button" data-m="month" aria-pressed="true">Month</button><button type="button" data-m="range" aria-pressed="false">Date range</button></div>
      <span id="pmonth" style="display:flex;align-items:center;gap:6px"><button class="mbtn" id="prev" aria-label="Previous month">‹</button><span class="mlabel" id="mlabel">—</span><button class="mbtn" id="next" aria-label="Next month">›</button></span>
      <span id="prange" class="range" hidden><input type="date" id="from" aria-label="From"> to <input type="date" id="to" aria-label="To"></span>
    </div>
    <div class="by">Show goals <div class="seg" id="basis"><button type="button" data-b="active" aria-pressed="true">Active</button><button type="button" data-b="created" aria-pressed="false">Created</button><button type="button" data-b="completed" aria-pressed="false">Completed</button></div> in this period</div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="vbar"><div class="vgrp"><span class="vl">View</span><div class="seg" id="view"><button type="button" data-v="list" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px;margin-right:5px"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>List</button><button type="button" data-v="cards" aria-pressed="false">▦ Cards</button></div></div>
    <div class="vgrp"><span class="vl">Group by</span><div class="seg" id="groupby"><button type="button" data-g="status" aria-pressed="true">Status</button><button type="button" data-g="tag" aria-pressed="false">Tag</button><button type="button" data-g="none" aria-pressed="false">None</button></div></div></div>
  <div id="t"><div class="card empty">Loading…</div></div>
  <div class="card det" id="det" hidden></div>
  <div id="tasksv" hidden></div>
  <div id="twin"></div>
  <div id="tvwin"></div>
</div>

<script>
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ST={tbp:'To be picked',inp:'In progress',cmp:'Completed'};
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW=new Date(),TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const day=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const fromIso=s=>{if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s);};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtD=d=>d?d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==NOW.getFullYear()?' '+d.getFullYear():''):'—';
const days=(a,b)=>Math.round((day(b)-day(a))/864e5);
const ago=s=>{const d=new Date(s),m=Math.round((Date.now()-d)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':m<2880?'Yesterday':fmtD(d);};
let G=[],ACT=[],INITS={},STAFF=[],CAN=false,ME='',CENTRES=['Alwarpet','Thoraipakkam','Borewell Road'],SEL=null;
const TAGS=['Academics','Learner Experience','Finance','Hiring','Marketing','Operations','People Management','Product / Tech','Social Media','Design & Content','Teacher Experience'];
let VIEW='list',GROUP='status',TAGF=[];
try{const v=JSON.parse(localStorage.getItem('artium_goals_view')||'{}');if(v.view)VIEW=v.view;if(v.group)GROUP=v.group;}catch(e){}
const saveView=()=>{try{localStorage.setItem('artium_goals_view',JSON.stringify({view:VIEW,group:GROUP}));}catch(e){}};
let CSEL=[],PSEL=[],OPEN_F=null;
const inC=c=>!CSEL.length||CSEL.includes(c);
const csOf=g=>Object.keys(g.centres||{}).filter(inC);
let mode='month',basis='active',viewY=NOW.getFullYear(),viewM=NOW.getMonth(),rFrom=null,rTo=null,FILES=[];

function period(){if(mode==='month')return{a:new Date(viewY,viewM,1),b:new Date(viewY,viewM+1,0),label:MONTH_FULL[viewM]+' '+viewY};
  const a=rFrom||new Date(viewY,viewM,1),b=rTo||new Date(viewY,viewM+1,0);return{a,b,label:fmtD(a)+' – '+fmtD(b)};}
// With one centre chosen, a goal's status, completion and progress are that centre's
const cv=g=>{if(!CSEL.length)return{status:g.status,completed:g.completed};const C=csOf(g).map(c=>g.centres[c]);if(!C.length)return{status:g.status,completed:g.completed};
  if(C.every(x=>x.s==='cmp')){const d=C.map(x=>x.done).filter(Boolean).sort();return{status:'cmp',completed:d.length?d[d.length-1]:null};}
  return{status:C.some(x=>x.s==='inp'||x.s==='cmp')?'inp':'tbp',completed:null};};
const ownerOf=g=>csOf(g).some(c=>(g.centres[c].owners||[]).some(o=>PSEL.includes(o.email)));
const created=g=>day(new Date(g.created)),completed=g=>{const c=cv(g).completed;return c?day(new Date(c)):null;},target=g=>fromIso(g.target);
const pairs=g=>{let t=0,d=0;const cs=Object.keys(g.centres||{}).filter(inC);(g.tasks||[]).forEach(k=>cs.forEach(c=>{t++;if((k.s||{})[c]==='cmp')d++;}));if(!(g.tasks||[]).length)cs.forEach(c=>{t++;if(g.centres[c].s==='cmp')d++;});return{t,d};};
const canSet=(g,c)=>CAN||(g.centres[c]&&(g.centres[c].owners||[]).some(p=>p.email===ME));
const canPost=g=>CAN||Object.values(g.centres||{}).some(C=>(C.owners||[]).some(p=>p.email===ME));
const whereOf=g=>{const i=INITS[g.init];return i?i.path+' › '+i.n:'';};

function render(){
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  document.querySelectorAll('#basis button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.b===basis));
  document.getElementById('pmonth').style.display=mode==='month'?'flex':'none';document.getElementById('prange').hidden=mode!=='range';
  const P=period();document.getElementById('mlabel').textContent=P.label;
  if(mode==='range'){document.getElementById('from').value=iso(P.a);document.getElementById('to').value=iso(P.b);}
  const inP=d=>d&&d>=P.a&&d<=P.b;
  document.getElementById('subtitle').textContent=!CSEL.length?'Goals across all centres, with their subtasks and updates':'Goals for '+CSEL.join(', ')+' — status, completion and progress are worked out for '+(CSEL.length===1?'this centre':'these centres');
  document.getElementById('newgoal').hidden=!CAN;
  const list=G.filter(g=>csOf(g).length).filter(g=>!TAGF.length||(g.tags||[]).some(t=>TAGF.includes(t))).filter(g=>!PSEL.length||ownerOf(g)).filter(g=>basis==='created'?inP(created(g)):basis==='completed'?inP(completed(g)):(created(g)<=P.b&&(!completed(g)||completed(g)>=P.a)))
    .sort((a,b)=>(a.draft-b.draft)||({inp:0,tbp:1,cmp:2}[cv(a).status]-{inp:0,tbp:1,cmp:2}[cv(b).status])||(target(a)||9e15)-(target(b)||9e15));
  const live=list.filter(g=>!g.draft),cnt=s=>live.filter(g=>cv(g).status===s).length,done=live.filter(g=>completed(g));
  const avg=done.length?Math.round(done.reduce((s,g)=>s+days(created(g),completed(g)),0)/done.length):null;
  const onTime=done.filter(g=>target(g)&&completed(g)<=target(g)).length,withT=done.filter(g=>target(g)).length;
  document.getElementById('chips').innerHTML=[['Goals',live.length],['To be picked',list.filter(t=>t.status==='tbp').length],['In progress',list.filter(t=>t.status==='inp').length],['Completed',cnt('cmp')],
    ['Average time to complete',avg==null?'—':avg+(avg===1?' day':' days')],['Completed on time',withT?onTime+' of '+withT:'—']]
    .map(([l,v])=>`<div class="k"><small>${l}</small><b>${v}</b></div>`).join('');
  document.querySelectorAll('#view button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===VIEW));
  document.querySelectorAll('#groupby button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===GROUP));
  renderFilters();
  const t=document.getElementById('t');
  if(!list.length){t.innerHTML=`<div class="card empty">No goals ${basis==='created'?'created':basis==='completed'?'completed':'open'} in ${esc(P.label)}${TAGF.length||CSEL.length||PSEL.length?' with these filters':''}.${CAN?' Use <b>New goal</b>, or make one from a Desired state line on the Offline Centres page.':''}</div>`;}
  else{
    const grp=g=>{const s=cv(g).status,tg=target(g);if(g.draft)return'draft';if(s==='cmp')return'cmp';if(tg&&tg<TODAY)return'late';return s;};
    let groups;
    if(GROUP==='status')groups=[['late','Past target','#B42318'],['inp','In progress','#C98A1B'],['tbp','To be picked','#B42318'],['draft','Yet to email','#8D6BB5'],['cmp','Completed','#1F7A4D']].map(([k,l,c])=>[l,c,list.filter(g=>grp(g)===k)]);
    else if(GROUP==='tag')groups=(TAGF.length?TAGS.filter(x=>TAGF.includes(x)):TAGS).map(tg=>[tg,'#7a7196',list.filter(g=>(g.tags||[]).includes(tg))]).concat([['No tag','#B3AFBB',list.filter(g=>!(g.tags||[]).length)]]);
    else groups=[[null,null,list]];
    groups=groups.filter(x=>x[2].length);
    if(VIEW==='cards')t.innerHTML=groups.map(([l,c,L])=>`<section class="gsec">${l?`<h3><i style="background:${c}"></i>${esc(l)}<span>${L.length}</span></h3>`:''}<div class="glist">${L.map(gcard).join('')}</div></section>`).join('');
    else t.innerHTML=`<div class="card"><div class="tw"><table class="gt"><thead><tr><th>Goal</th><th>Centres</th><th>Due</th><th>Progress</th><th>Status</th></tr></thead><tbody>${groups.map(([l,c,L])=>(l?`<tr class="gh"><td colspan="5"><i style="background:${c}"></i>${esc(l)}<span>${L.length}</span></td></tr>`:'')+L.map(grow).join('')).join('')}</tbody></table></div></div>`;
  }
  renderDet();
}
const PH=e=>{try{return(window.ArtiumAuth&&ArtiumAuth.photo&&ArtiumAuth.photo(e))||'';}catch(err){return'';}};
const phImg=e=>{const u=PH(e);return u?`<img src="${esc(u)}" alt="">`:'';};
const mav=os=>os.length?`<span class="mav">${os.slice(0,3).map(o=>`<i style="background:${avc(o.email)}">${phImg(o.email)||esc(initials(o.name||o.email))}</i>`).join('')}</span>`:'';
const ini=n=>String(n||'?').split(/[\s.@]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
function dueOf(g){const c=completed(g),tg=target(g);
  if(g.draft)return[tg?'Target '+fmtD(tg):'No target yet','mut'];
  if(c){const d=tg?days(c,tg):null;return['Done '+fmtD(c)+(d==null?'':d>0?' · '+d+(d===1?' day':' days')+' early':d===0?' · on the day':' · '+(-d)+(-d===1?' day':' days')+' late'),d!=null&&d<0?'bad':'ok'];}
  if(tg){const d=days(TODAY,tg);return[d<0?(-d)+(-d===1?' day':' days')+' past target':d===0?'Due today':'Due '+fmtD(tg)+' · in '+d+(d===1?' day':' days'),d<0?'bad':d<=3?'warn':''];}
  return['No target date','mut'];}
const tagChips=g=>(g.tags||[]).map(t=>`<span class="tchip">${esc(t)}</span>`).join('');
function grow(g){
  const p=pairs(g),cs=Object.keys(g.centres||{}).filter(inC),[due,dc]=dueOf(g),pc=p.t?Math.round(p.d/p.t*100):0,s=cv(g).status;
  return`<tr class="${SEL===g.id?'sel':''}" data-g="${g.id}"><td class="gt-g"><b>${esc(g.title)}</b><div class="gt-m">${tagChips(g)}<span>${whereOf(g)?esc(whereOf(g)):'Standalone goal'}</span></div></td>
    <td><div class="gt-c">${cs.map(k=>{const C=g.centres[k],st=g.draft?'':C.s||'tbp',ow=C.owners||[];return`<span class="cd ${st}" title="${esc(k)}${st?' — '+ST[st]:''} · ${esc(ow.map(o=>o.name||o.email).join(', ')||'no owner yet')}"><i></i>${esc(k)}${mav(ow)}<em>${esc(ow.map(o=>(o.name||o.email).split(' ')[0]).join(', ')||'—')}</em></span>`;}).join('')}</div></td>
    <td class="nw"><span class="due ${dc}">${due}</span></td>
    <td>${g.draft?'<span class="due mut">—</span>':`<span class="ring sm" style="--p:${pc}"><span>${p.d}/${p.t}</span></span>`}</td>
    <td>${g.draft?'<span class="gl draft"><i></i>Yet to email</span>':`<span class="gl ${s}"><i></i>${ST[s]}</span>`}</td></tr>`;
}
function gcard(g){
  const c=completed(g),tg=target(g),p=pairs(g),cs=Object.keys(g.centres||{}).filter(inC),s=cv(g).status;
  const[due,dc]=dueOf(g);
  const pc=p.t?Math.round(p.d/p.t*100):0;
  return`<button type="button" class="gc ${g.draft?'draft':s}${SEL===g.id?' sel':''}" data-g="${g.id}">
    <div class="gc-main"><div class="gc-t">${esc(g.title)}</div><div class="gc-src">${tagChips(g)}${whereOf(g)?esc(whereOf(g)):'Standalone goal'} · created ${fmtD(created(g))}</div>
      <div class="gc-cen">${cs.map(k=>{const C=g.centres[k],st=g.draft?'':C.s||'tbp',ow=C.owners||[];
        return`<span class="cp ${st}" title="${esc(k)}${st?' — '+ST[st]:''}${ow.length?' · '+esc(ow.map(o=>o.name||o.email).join(', ')):' · no owner yet'}"><i></i>${esc(k)}<span class="avs">${ow.length?ow.slice(0,3).map(o=>`<b>${phImg(o.email)||esc(ini(o.name||o.email))}</b>`).join(''):'<b class="none">?</b>'}</span></span>`;}).join('')}</div></div>
    <div class="gc-side"><span class="due ${dc}">${due}</span>
      ${g.draft?'<span class="gl draft"><i></i>Yet to email</span>':`<span class="ring" style="--p:${pc}"><span>${p.d}/${p.t}</span></span><span class="rl">${(g.tasks||[]).length?'steps done':'centres done'}</span>`}</div></button>`;
}
function stSel(g,task,c,s){
  return canSet(g,c)?`<select class="ss ${s}" data-st="${g.id}|${task||''}|${esc(c)}">${Object.keys(ST).map(k=>`<option value="${k}"${k===s?' selected':''}>${ST[k]}</option>`).join('')}</select>`:`<span class="gl ${s}"><i></i>${ST[s]}</span>`;
}
function renderDet(){
  const el=document.getElementById('det'),g=G.find(x=>x.id===SEL);
  if(!g){el.hidden=true;return;}el.hidden=false;
  const cs=Object.keys(g.centres||{}).filter(inC),c=completed(g),tg=target(g),tasks=g.tasks||[];
  let mx=`<table class="mx"><thead><tr><th>${tasks.length?'Subtask':'Centre'}</th>${cs.map(k=>`<th>${esc(k)}<span class="own" style="text-transform:none;letter-spacing:0">${esc((g.centres[k].owners||[]).map(o=>o.name||o.email).join(', '))}</span></th>`).join('')}</tr></thead><tbody>`;
  if(tasks.length){mx+=tasks.map(t=>`<tr><td class="t">${esc(t.title)}${t.due?`<small>Due ${fmtD(fromIso(t.due))}</small>`:''}</td>${cs.map(k=>`<td>${g.draft?'—':stSel(g,t.id,k,(t.s||{})[k]||'tbp')}</td>`).join('')}</tr>`).join('');
    mx+=`<tr class="cen"><td class="t">Centre status</td>${cs.map(k=>`<td><span class="gl ${g.centres[k].s}"><i></i>${ST[g.centres[k].s]}</span></td>`).join('')}</tr>`;}
  else mx+=`<tr><td class="t">Status</td>${cs.map(k=>`<td>${g.draft?'—':stSel(g,'',k,g.centres[k].s)}</td>`).join('')}</tr>`;
  mx+='</tbody></table>';
  const acts=ACT.filter(a=>a.goal===g.id).slice().reverse();
  const feed=acts.map(a=>{
    const who=esc(a.name||a.by.split('@')[0]);
    if(a.kind==='update')return`<div class="upd"><span class="av">${phImg(a.by)||esc((a.name||a.by).charAt(0).toUpperCase())}</span><div class="tx">${esc(a.text)}<small>${who} · ${ago(a.at)}</small>${a.files&&a.files.length?`<div class="files">${a.files.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${f.image?'🖼':'📎'} ${esc(f.name)}</a>`).join('')}</div>`:''}</div></div>`;
    if(a.kind==='status'){let x={};try{x=JSON.parse(a.text);}catch(e){}return`<div class="sys"><b>${who}</b> set ${x.task?'<b>'+esc(x.what)+'</b>':'the status'} for ${esc(x.centre)} to <b>${ST[x.s]||''}</b> · ${ago(a.at)}</div>`;}
    return`<div class="sys"><b>${who}</b> ${esc(a.text.charAt(0).toLowerCase()+a.text.slice(1))} · ${ago(a.at)}</div>`;}).join('');
  el.innerHTML=`<div class="det-top"><div><h2>${esc(g.title)}</h2><div class="from">${whereOf(g)?'From <b>'+esc(whereOf(g))+'</b><br>':''}Created ${fmtD(created(g))}${g.createdByName?' by '+esc(g.createdByName):''} · Target ${tg?fmtD(tg):'not set'} · ${c?'Completed '+(CSEL.length===1?'at '+esc(CSEL[0])+' ':'')+fmtD(c)+' in '+days(created(g),c)+' days':g.draft?'Saved, not emailed to the stakeholders yet':'Open for '+days(created(g),TODAY)+' days'}</div></div>
      <div style="display:flex;gap:8px;align-items:flex-start">${g.draft?'<span class="gl draft"><i></i>Yet to email</span>':`<span class="gl ${cv(g).status}"><i></i>${ST[cv(g).status]}</span>`}${CAN&&g.draft?'<button class="btn pri" type="button" id="sendmail">✉ Email stakeholders</button>':''}${CAN?'<button class="btn" type="button" id="edit">Edit goal</button>':''}<button class="btn" type="button" id="closeDet" aria-label="Close">✕</button></div></div>
    ${(g.tags||[]).length?`<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">${tagChips(g)}</div>`:''}
    ${g.desc?`<div class="desc rich">${GoalForm.descHtml(g.desc)}</div>`:''}
    <div class="grid2"><div><div class="lab">${tasks.length?'Subtasks by centre':'Centres'}</div>${mx}</div>
      <div><div class="lab">Updates</div><div class="feed">${feed||'<div class="sys" style="padding-left:0">No updates yet.</div>'}</div>
      ${canPost(g)&&!g.draft?`<div class="post"><textarea id="ptext" placeholder="Write an update…"></textarea><div class="att" id="patt"></div>
        <div class="row"><label class="btn" style="height:32px">📎 Add photos or files<input type="file" id="pfile" multiple hidden></label><span class="msg" id="pmsg"></span><span class="sp"></span><button class="btn pri" type="button" id="post" style="height:32px">Post update</button></div></div>`:''}</div></div>`;
  FILES=[];
}
/* Files: photos are shrunk to 1600px before upload */
function readFile(f){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=()=>rej(new Error('Couldn\'t read '+f.name));
  if(/^image\/(jpeg|png|webp)$/.test(f.type)){r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({name:f.name.replace(/\.\w+$/,'')+'.jpg',type:'image/jpeg',data:c.toDataURL('image/jpeg',.85)});};im.onerror=()=>res({name:f.name,type:f.type,data:r.result});im.src=r.result;};}
  else r.onload=()=>res({name:f.name,type:f.type||'application/octet-stream',data:r.result});
  r.readAsDataURL(f);});}
document.getElementById('det').addEventListener('change',async e=>{
  const x=e.target;
  if(x.id==='pfile'){for(const f of x.files){if(f.size>8*1024*1024){document.getElementById('pmsg').textContent=f.name+' is over 8 MB.';continue;}if(FILES.length<6)FILES.push(f);}x.value='';
    document.getElementById('patt').innerHTML=FILES.map((f,i)=>`<span class="chip">${esc(f.name)}<button type="button" data-rf="${i}">✕</button></span>`).join('');return;}
  if(x.dataset.st){const[id,task,centre]=x.dataset.st.split('|');x.disabled=true;
    try{await ArtiumAuth.call('goalStatus',{id,task,centre,s:x.value});await load(true);}catch(err){alert('Couldn\'t save: '+err.message);x.disabled=false;}}
});
document.getElementById('det').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='closeDet'){SEL=null;render();return;}
  if(b.dataset.rf!=null){FILES.splice(+b.dataset.rf,1);document.getElementById('patt').innerHTML=FILES.map((f,i)=>`<span class="chip">${esc(f.name)}<button type="button" data-rf="${i}">✕</button></span>`).join('');return;}
  if(b.id==='sendmail'){const g=G.find(x=>x.id===SEL),cs=Object.keys(g.centres||{});
    const miss=!GoalForm.descText(g.desc)?'Add a goal description first — it goes into the email.':cs.some(c=>!(g.centres[c].owners||[]).length)?'Every centre needs an owner before emailing.':'';
    if(miss){alert(miss);return;}
    if(!confirm('Email '+cs.map(c=>(g.centres[c].owners||[]).map(o=>o.name||o.email).join(', ')).join(', ')+' about this goal now?'))return;
    b.disabled=true;try{await ArtiumAuth.call('saveGoal',{goal:{...g,draft:false}});await load(true);}catch(err){alert('Couldn\'t send: '+err.message);b.disabled=false;}return;}
  if(b.id==='edit'){const g=G.find(x=>x.id===SEL),i=INITS[g.init];GoalForm.open({goal:g,init:i?{id:g.init,n:i.n,path:i.path,dept:''}:null,staff:STAFF,onSaved:()=>load(true)});return;}
  if(b.id==='post'){const text=document.getElementById('ptext').value.trim(),m=document.getElementById('pmsg');
    if(!text&&!FILES.length){m.textContent='Write an update or add a file.';return;}
    b.disabled=true;m.textContent=FILES.length?'Uploading…':'';
    try{const files=await Promise.all(FILES.map(readFile));await ArtiumAuth.call('goalUpdate',{id:SEL,text,files});await load(true);}
    catch(err){m.textContent='Couldn\'t post: '+err.message;b.disabled=false;}}
});
document.getElementById('t').addEventListener('click',e=>{const r=e.target.closest('[data-g]');if(!r)return;SEL=SEL===r.dataset.g?null:r.dataset.g;render();if(SEL)setTimeout(()=>document.getElementById('det').scrollIntoView({behavior:'smooth',block:'start'}),50);});
document.getElementById('view').onclick=e=>{const b=e.target.closest('button');if(b){VIEW=b.dataset.v;saveView();render();}};

/* ── Filters: tags, centre and POC; pick any number of each. Empty = everything. ── */

      <div><div class="lab">Updates</div><div class="feed">${feed||'<div class="sys" style="padding-left:0">No updates yet.</div>'}</div>
      ${can?`<div class="post"><textarea id="ttext" placeholder="Write an update, e.g. what was discussed or decided…"></textarea><div class="att" id="tatt"></div>
        <div class="row"><label class="btn" style="height:32px">📎 Add photos or files<input type="file" id="tfile" multiple hidden></label><span class="msg" id="tmsg"></span><span class="sp"></span><button class="btn pri" type="button" id="tpost" style="height:32px">Post update</button></div></div>`:''}</div></div></div></div>`;
  const ta=document.getElementById('ttext');if(ta&&draft){ta.value=draft;}
  drawTatt();
}
/* Write an update straight from the board: a small window, the update goes into the task */
function quickUpd(id){const t=TASKS.find(x=>x.id===id);if(!t)return;TV=id;TFILES=[];
  document.getElementById('tvwin').innerHTML=`<div class="tscrim" data-tvx><div class="tdlg" role="dialog" aria-label="Write an update"><div class="dh"><h2>Write an update</h2><button class="x" data-tvc>×</button></div>
    <div class="db"><div class="sys" style="padding:0;font-size:13.5px">On <b>${esc(t.title)}</b></div>
      <div class="post" style="margin-top:0"><textarea id="ttext" placeholder="What was discussed or decided…" style="min-height:120px"></textarea><div class="att" id="tatt"></div>
        <div class="row"><label class="btn" style="height:32px">📎 Add photos or files<input type="file" id="tfile" multiple hidden></label><span class="msg" id="tmsg"></span><span class="sp"></span><button class="btn pri" type="button" id="tpost" data-quick="1" style="height:32px">Post update</button></div></div></div></div></div>`;
  setTimeout(()=>{const a=document.getElementById('ttext');if(a)a.focus();},30);}
function drawTatt(){const a=document.getElementById('tatt');if(a)a.innerHTML=TFILES.map((f,i)=>`<span class="chip">${esc(f.name)}<button type="button" data-trf="${i}">✕</button></span>`).join('');}
document.getElementById('tvwin').addEventListener('click',async e=>{
  if(e.target.closest('[data-tvc]')||e.target.matches('[data-tvx]')){TV=null;document.getElementById('tvwin').innerHTML='';return;}
  const r=e.target.closest('[data-trf]');if(r){TFILES.splice(+r.dataset.trf,1);drawTatt();return;}
  const b=e.target.closest('#tpost');if(!b)return;
  const text=document.getElementById('ttext').value.trim(),m=document.getElementById('tmsg');
  if(!text&&!TFILES.length){m.textContent='Write an update or add a file.';return;}
  b.disabled=true;m.textContent=TFILES.length?'Uploading…':'';
  try{const files=await Promise.all(TFILES.map(readFile));await ArtiumAuth.call('taskUpdate',{id:TV,text,files});document.getElementById('ttext').value='';TFILES=[];await load(true);
    if(b.dataset.quick){TV=null;document.getElementById('tvwin').innerHTML='';}else drawTV();}
  catch(err){m.textContent='Couldn\'t post: '+err.message+'.';b.disabled=false;}
});
document.getElementById('tvwin').addEventListener('change',e=>{
  if(e.target.id==='tfile'){const m=document.getElementById('tmsg');for(const f of e.target.files){if(f.size>8*1024*1024){m.textContent=f.name+' is over 8 MB.';continue;}if(TFILES.length<6)TFILES.push(f);}e.target.value='';drawTatt();return;}
  const b=e.target.closest('[data-sub]');if(b){const [id,sub]=b.dataset.sub.split('|'),t=TASKS.find(x=>x.id===id),x=t&&(t.subs||[]).find(y=>y.id===sub);if(x){x.s=b.value;x.done=b.value==='cmp';render();drawTV();}
    tcall('taskSub',{id,sub,s:b.value}).then(drawTV);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&TV){TV=null;document.getElementById('tvwin').innerHTML='';}});
window.openTask=id=>{KIND='tasks';TSEL=id;CSEL=[];PSEL=[];render();setTimeout(()=>{const r=document.getElementById('task-'+id);if(r)r.scrollIntoView({behavior:'smooth',block:'center'});if(TASKS.some(x=>x.id===id))taskView(id);},80);};
load();
</script>
</body>
