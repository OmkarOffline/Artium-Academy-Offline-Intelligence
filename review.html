<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Offline Review</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/emblem-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="brand/emblem-64.png">
<link rel="apple-touch-icon" href="brand/emblem-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --pink:#dd30b1;--violet:#6601fd;--violet2:#4101f7;--purple:#7b2cf0;
  --ink:#120e2b;--ink2:#4a4466;--ink3:#6a6488;--ink4:#7a7196;--line:#dcd5ee;--edge:#ece4ff;
  --tvbg:#f1eafe;--tvfg:#6b3fc7;--bad:#B4443A;
  --f:'Onest',system-ui,sans-serif;
  --sh:0 1px 2px rgba(18,14,43,.04),0 18px 40px -26px rgba(65,1,247,.35);
}
body{font-family:var(--f);background:#F6F3FC;color:var(--ink2);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit}
/* ── The page: the Home look, soft colour clouds behind dark headings ── */
html,body{background:#FBF8FF}
.studio{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.studio i{position:absolute;border-radius:50%;filter:blur(64px)}
.studio .k1{width:640px;height:640px;left:-160px;top:-280px;background:#F1B6FA;opacity:.7}
.studio .k2{width:600px;height:600px;right:-140px;top:-220px;background:#9BB6FF;opacity:.65}
.studio .k3{width:500px;height:500px;right:26%;top:110px;background:#FFC9B0;opacity:.45}
.hero,.page{position:relative;z-index:1}
.hero{padding:40px 48px 0}
.hin{max-width:1504px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.kk{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:9px 16px 9px 14px;font:700 12.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);box-shadow:0 10px 30px -18px rgba(65,1,247,.5)}
.kk .dot{width:8px;height:8px}
h1{font:800 64px/1 var(--f);letter-spacing:-2.4px;color:#01073C;margin-top:22px}
h1 em{font-style:normal;background:linear-gradient(90deg,#4101F7 0%,#DD30B1 60%,#F5906F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.sub{font:500 18px/26px var(--f);color:var(--ink2);margin-top:12px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 4px rgba(61,220,151,.18)}.dot.loading{background:#F5906F;box-shadow:none;animation:pulse 1s infinite}.dot.error{background:#B0204F;box-shadow:none}
@keyframes pulse{50%{opacity:.35}}
.vt{display:inline-flex;gap:3px;background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:5px;box-shadow:0 0 0 1px rgba(255,255,255,.8),0 18px 40px -24px rgba(1,7,60,.35)}
.vt button{border:0;background:none;padding:9px 16px;border-radius:13px;font:600 13.5px var(--f);color:var(--ink2);cursor:pointer}
.vt button[aria-pressed="true"]{background:#fff;color:#01073C;box-shadow:0 10px 22px -14px rgba(1,7,60,.4)}
.page{max-width:1600px;margin:0 auto;padding:30px 48px 64px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;background:rgba(239,234,249,.85);border-radius:22px;padding:6px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.sp{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;background:none;padding:10px 22px 12px;border-radius:17px;cursor:pointer;white-space:nowrap;text-align:left}
.sp small{font:700 9.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.sp span{font:700 15px var(--f);color:#01073C}
.sp:hover{background:rgba(255,255,255,.55)}
.sp[aria-pressed="true"]{background:#fff;box-shadow:0 1px 2px rgba(1,7,60,.06),0 14px 30px -18px rgba(201,80,42,.55)}
.sp[aria-pressed="true"] small{color:#A8431E}
.sp[aria-pressed="true"]::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#C9502A,#F5906F)}
.sp .rm{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--ink3);font:700 10px/18px var(--f);text-align:center;box-shadow:0 1px 3px rgba(18,14,43,.2)}
.addsp{border:1.5px dashed #CDBDF7;background:none;border-radius:15px;padding:0 16px;font:700 13.5px var(--f);color:var(--violet2);cursor:pointer;margin-left:4px;white-space:nowrap}
.br{display:flex;gap:12px;align-items:center}
.per{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px;box-shadow:0 0 0 1.5px #E6DEFB,0 12px 26px -18px rgba(65,1,247,.5)}
.mb{width:36px;height:36px;border:0;border-radius:50%;background:#F4EEFF;display:grid;place-items:center;color:var(--violet2);font:700 18px var(--f);cursor:pointer}
.mb:disabled{opacity:.35;cursor:default}
.pl{min-width:190px;text-align:center;font:700 14.5px var(--f);color:#01073C}.pl small{display:block;font:500 11px var(--f);color:var(--ink4)}
.pres{display:flex;align-items:center;gap:9px;height:50px;padding:0 22px;border:0;border-radius:999px;background:linear-gradient(135deg,#4101F7,#DD30B1);color:#fff;font:700 14.5px var(--f);box-shadow:0 14px 28px -12px rgba(102,1,253,.7);cursor:pointer}
.pres svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.pres:disabled{opacity:.5;cursor:default}
.note{background:rgba(255,255,255,.9);border-radius:16px;padding:12px 16px;margin-bottom:14px;font-size:14px;color:var(--ink2);box-shadow:inset 4px 0 0 #4101F7,0 12px 26px -20px rgba(65,1,247,.5)}
.note b{color:#01073C}
.sbar{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 14px;gap:12px}
.sbar .who{font:500 13.5px var(--f);color:var(--ink3)}.sbar .who b{color:#01073C;font-weight:700}
.snav{display:flex;align-items:center;gap:10px;font:700 13.5px var(--f);color:#01073C}
.snav .mb{width:34px;height:34px;background:#fff;box-shadow:0 0 0 1.5px #E6DEFB}
/* slide thumbnails under the slideshow */
.strip{display:flex;gap:14px;margin:20px auto 0;width:fit-content;max-width:100%;overflow-x:auto;padding:4px 4px 8px;scrollbar-width:thin}
.strip button{flex:none;width:176px;height:99px;border:0;padding:0;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;background:#fff;box-shadow:0 0 0 1.5px #E6DEFB}
.strip button.on{box-shadow:0 0 0 3px #4101F7}
.strip .slide{transform:scale(.11)}
/* The slide: 1600 × 900, scaled to fit */
.stage{position:relative;width:100%;margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 2px 4px rgba(1,7,60,.04),0 50px 90px -50px rgba(65,1,247,.55);background:#FBF8FF}
.slide{width:1600px;height:900px;position:absolute;left:0;top:0;transform-origin:0 0;background:#FBF8FF;display:flex;flex-direction:column;overflow:hidden}
.slide>.cl{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.slide>.c1{width:720px;height:720px;left:-260px;top:-380px;background:#F1B6FA;opacity:.7}
.slide>.c2{width:680px;height:680px;right:-240px;top:-360px;background:#9BB6FF;opacity:.65}
.slide>.c3{width:520px;height:520px;right:22%;top:-300px;background:#FFC9B0;opacity:.5}
.slide>.c4{width:620px;height:620px;left:30%;bottom:-520px;background:#C9B5FF;opacity:.35}
.s-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:40px 70px 0;gap:30px}
.s-eb{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.78);border-radius:999px;padding:10px 20px 10px 16px;font:700 14px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);box-shadow:0 12px 30px -18px rgba(65,1,247,.5)}
.s-eb i{width:9px;height:9px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 5px rgba(61,220,151,.18)}.s-eb b{color:#4101F7}
.s-h{font:800 62px/1 var(--f);letter-spacing:-2.4px;color:#01073C}
.s-h em{font-style:normal;background:linear-gradient(90deg,#4101F7 0%,#DD30B1 60%,#F5906F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.s-wk{font:500 21px var(--f);color:var(--ink3);margin-top:12px}
.logo{display:flex;align-items:center;gap:12px;flex:none}
.logo img{display:block;height:44px;width:auto}
.s-b{position:relative;flex:1;display:flex;gap:34px;padding:28px 70px 0;min-height:0}
.s-f{position:relative;display:flex;justify-content:space-between;align-items:center;padding:20px 70px 28px;font:600 15px var(--f);color:var(--ink4)}
.s-f .dots{display:flex;gap:7px}.s-f .dots i{width:28px;height:6px;border-radius:6px;background:rgba(65,1,247,.12)}.s-f .dots i.on{width:44px;background:linear-gradient(90deg,#4101F7,#DD30B1)}
/* text box */
.tx{flex:0 0 560px;border-radius:32px;background:rgba(255,255,255,.9);padding:38px 42px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 4px rgba(1,7,60,.04),0 34px 60px -36px rgba(65,1,247,.45)}
.tg{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#EEE8FE;color:#4101F7;font:700 15px var(--f)}
.tx h3{font:800 38px/1.12 var(--f);letter-spacing:-1px;color:#01073C;margin-top:20px}
.tx ul{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:12px}
.tx li{position:relative;padding-left:24px;font:400 22px/1.45 var(--f);color:var(--ink2)}.tx li b{color:#01073C;font-weight:700}
.tx li.bul::before{content:"";position:absolute;left:0;top:13px;width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#4101F7,#DD30B1)}
.tx .big{margin-top:auto;display:flex;align-items:baseline;gap:12px;padding-top:24px;border-top:1.5px solid #F1EDF9}
.tx .big b{font:800 64px/1 var(--f);letter-spacing:-2px;background:linear-gradient(90deg,#4101F7,#DD30B1);-webkit-background-clip:text;background-clip:text;color:transparent}.tx .big span{font:600 19px/1.3 var(--f);color:var(--ink3)}
/* photos and videos */
.mg{flex:1;display:grid;gap:24px;min-width:0;min-height:0}
.md{position:relative;border-radius:30px;overflow:hidden;background:#F1ECFC;min-height:0;border:6px solid #fff;box-shadow:0 34px 60px -36px rgba(1,7,60,.45)}
.md img,.md video,.md iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.md img{object-fit:cover}.md.contain img{object-fit:contain}
.md video{object-fit:contain;background:#000}
.md .ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;font:600 18px var(--f);color:var(--ink4);text-align:center}
.md.empty{border:3px dashed #CDBDF7;background:rgba(255,255,255,.7);box-shadow:none}.md.empty .ph{color:var(--violet2)}
.md.vthumb{background:linear-gradient(135deg,#4101F7,#DD30B1)}.md.vthumb .ph{color:#fff}
/* a photo or video with a shape: as large as its space allows, centred in it */
.mdo{position:relative;min-height:0;min-width:0;display:grid;place-items:center;container-type:size}
.mdo>.md{aspect-ratio:16/9;width:min(100cqw,calc(100cqh * 16 / 9));height:auto}
.mdo.o-p>.md{aspect-ratio:9/16;width:min(100cqw,calc(100cqh * 9 / 16))}
.mdo.o-s>.md{aspect-ratio:1/1;width:min(100cqw,100cqh)}
.mdo.o-q>.md{aspect-ratio:3/4;width:min(100cqw,calc(100cqh * 3 / 4))}
.tx.fl{flex:1 1 0;min-width:0}
.s-b.fxb{container-type:size;align-items:center}
.fxb>.mg{flex:0 0 auto;width:min(calc((100cqh - var(--gv)) * var(--r) + var(--gh)),calc(100cqw - 594px));height:min(100cqh,calc((100cqw - 594px - var(--gh)) / var(--r) + var(--gv)))}
.fxb>.tx{align-self:center;min-height:min(100cqh,calc((100cqw - 594px - var(--gh)) / var(--r) + var(--gv)));max-height:100cqh}
.slot select.shp{width:100%;height:30px;border:1px solid var(--line);border-radius:8px;background:#F6F3FC;font:500 12px var(--f);color:var(--ink);padding:0 6px;margin-top:6px}
.md .play{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;margin:0 auto}
.md .play svg{width:34px;height:34px;fill:var(--violet2);margin-left:6px}
/* update cards: each takes the height of its text, in two columns; a slide that is too full continues on the next one */
.cards{flex:1;display:grid;gap:24px;min-height:0}
.u{position:relative;border-radius:30px;background:rgba(255,255,255,.9);padding:26px 32px 28px;display:flex;flex-direction:column;overflow:hidden;min-height:0;box-shadow:0 2px 4px rgba(1,7,60,.04),0 34px 60px -36px rgba(65,1,247,.45)}
.u .top{display:flex;align-items:center;gap:14px}
.u .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.u .ico svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.u .tg{font-size:14px;padding:6px 14px}
.u h3{font:800 28px/1.16 var(--f);letter-spacing:-.6px;color:#01073C;margin-top:0}
/* the card's function sits right after its title */
.u h3 .tg{display:inline-flex;vertical-align:middle;margin:-4px 0 0 14px;letter-spacing:0;font-size:14px;padding:6px 14px;position:relative;top:-1px}
.u ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.u li{position:relative;padding-left:22px;font:400 19px/1.4 var(--f);color:var(--ink2)}.u li b{color:#01073C;font-weight:700}
.u li.bul::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:3px;background:var(--acc);opacity:.85}
.flow{flex:1;display:flex;gap:22px;align-items:flex-start;align-self:flex-start;min-width:0}
.flow .fcol{flex:1;display:flex;flex-direction:column;gap:22px;min-width:0}
.flow .u{overflow:visible}.flow .u h3{font-size:calc(28px*var(--z,1))}.flow .u li{font-size:calc(19px*var(--z,1))}
.flow .meter{margin-top:16px}
.s-h .cont{font:600 24px var(--f);letter-spacing:0;color:var(--ink4);margin-left:12px;-webkit-text-fill-color:var(--ink4)}
.spill{margin-top:10px;font:500 13px var(--f);color:var(--ink3)}
.meter{margin-top:auto;padding-top:14px;display:flex;align-items:flex-end;gap:20px}
.meter .n{font:800 38px/1 var(--f);letter-spacing:-1px;color:#01073C}.meter .n small{font:600 19px var(--f);color:var(--ink4);letter-spacing:0}
.meter .bw{flex:1}.meter .bw div{display:flex;justify-content:space-between;font:600 15px var(--f);color:var(--ink3);margin-bottom:9px}.meter .bw div b{font-weight:800;color:var(--accd)}
.meter .tr{height:12px;border-radius:12px;background:rgba(65,1,247,.08);overflow:hidden}.meter .tr i{display:block;height:100%;border-radius:12px;background:var(--accg)}
/* one colour per card, from the Home stickers */
.a0{--acc:#4101F7;--accd:#4101F7;--accg:linear-gradient(90deg,#4101F7,#6601FD)}.a0 .ico{background:linear-gradient(135deg,#4101F7,#6601FD)}.a0 .tg{background:#EEE8FE;color:#4101F7}
.a1{--acc:#DD30B1;--accd:#A3187F;--accg:linear-gradient(90deg,#DD30B1,#F17AD0)}.a1 .ico{background:linear-gradient(135deg,#DD30B1,#F17AD0)}.a1 .tg{background:#FCEAF7;color:#A3187F}
.a2{--acc:#C9502A;--accd:#A8431E;--accg:linear-gradient(90deg,#C9502A,#F5906F)}.a2 .ico{background:linear-gradient(135deg,#C9502A,#F5906F)}.a2 .tg{background:#FFF1EA;color:#A8431E}
.a3{--acc:#2F4DB8;--accd:#2F4DB8;--accg:linear-gradient(90deg,#2F4DB8,#7C9BFF)}.a3 .ico{background:linear-gradient(135deg,#2F4DB8,#7C9BFF)}.a3 .tg{background:#EAF0FF;color:#2F4DB8}
.s-empty{flex:1;display:grid;place-items:center;font:500 26px var(--f);color:var(--ink4);border:3px dashed #E6DEFB;border-radius:30px;margin-bottom:6px;background:rgba(255,255,255,.5)}
/* The opener for Present: the sub-page's name, the stickers swirl away, then the first slide arrives (about 3 seconds) */
.istage{position:fixed;inset:0;z-index:40;background:#FBF8FF;animation:iOut .5s ease 2.9s forwards}
.istage .slide{background:#FBF8FF}
.istage .ttl{position:absolute;left:0;right:0;top:330px;text-align:center;animation:ttlOut .8s cubic-bezier(.6,0,.4,1) 2.05s forwards}
.istage .ttl h2{font:800 170px/.92 var(--f);letter-spacing:-8px;color:#01073C;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.istage .ttl h2 em{font-style:normal;background:linear-gradient(90deg,#4101F7 0%,#DD30B1 60%,#F5906F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.istage .ttl .city{font:700 22px var(--f);letter-spacing:.42em;text-transform:uppercase;color:var(--ink3);margin-top:26px;animation:rise .8s cubic-bezier(.2,.8,.2,1) .15s both}
.istage .orbit{position:absolute;left:800px;top:450px;width:0;height:0;animation:spin 1.5s cubic-bezier(.55,0,.35,1) 1.35s forwards}
.istage .ok{position:absolute;animation:pop .7s cubic-bezier(.2,1.4,.4,1) var(--d) both}
.istage .stk{display:grid;place-items:center;box-shadow:0 34px 56px -28px rgba(1,7,60,.45);transform:rotate(var(--r));animation:bob 1.6s ease-in-out infinite alternate}
.istage .stk svg{width:52%;height:52%;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{to{transform:translateY(-10px) rotate(calc(var(--r) + 4deg))}}
@keyframes spin{0%{transform:rotate(0) scale(1);opacity:1}70%{opacity:1}100%{transform:rotate(220deg) scale(.08);opacity:0}}
@keyframes ttlOut{to{transform:scale(1.12);opacity:0;filter:blur(10px)}}
@keyframes iOut{to{opacity:0;visibility:hidden}}
body.fs.intro #stage .slide{opacity:0;animation:inS .75s cubic-bezier(.2,.8,.2,1) 2.65s forwards}
@keyframes inS{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.istage{display:none}body.fs.intro #stage .slide{opacity:1;animation:none}}
/* The text editor: a small toolbar (bold, italics, underline) over a box that shows the formatting */
.rtw{display:flex;flex-direction:column;gap:0}
.rtb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:#fff;padding:6px}
.rtb button{height:30px;min-width:32px;padding:0 10px;border:0;border-radius:8px;background:none;font:600 13px var(--f);color:var(--ink2);cursor:pointer}
.rtb button:hover{background:#F1ECFC}.rtb button.on{background:#E8E0FF;color:var(--violet2)}
.rtb .bb,.rtb .bh{font-weight:800}.rtb .sep{width:1px;height:20px;background:var(--line);margin:0 4px}.rtb .bl{display:grid;place-items:center}.rtb .bl svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.rtb .bl svg circle{fill:currentColor;stroke:none}
.rte ul{margin:0;padding-left:22px}.rte li{margin:0}.rte h1{letter-spacing:0}.rtb .bi{font-style:italic;font-family:Georgia,serif}.rtb .bu{text-decoration:underline}
.rte{min-height:132px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:0 0 12px 12px;background:#F6F3FC;padding:10px 12px;font:400 14px/1.5 var(--f);color:var(--ink);outline:none;white-space:pre-wrap;word-break:break-word}
.card-e .rte{min-height:92px}
.rte:focus{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(65,1,247,.12);background:#fff}
.rte h1{font:600 16px/1.5 var(--f);margin:0;color:var(--ink)}.rte div,.rte p{margin:0}
.rte:empty:before{content:attr(data-ph);color:var(--ink4)}
/* formatted lines on the slides: plain text, bullet points ("- "), a heading ("# "), a gap, italics and underline */
.s-b li.sp{height:.9em;padding:0}.s-b li.sp::before{display:none}

<div class="hero"><div class="hin"><div><div class="kk"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div><h1>Weekly Offline <em>Review.</em></h1><div class="sub" id="psub"></div></div>

<script>
const MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TAGS=['Academics','Learner Experience','Finance','Hiring','Marketing','Operations','People Management','Product / Tech','Social Media','Design & Content','Teacher Experience'];
const CITY={Alwarpet:'Chennai',Thoraipakkam:'Chennai','Borewell Road':'Bangalore'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* Templates: [name, short description, text box?, kind, fewest, most] */
const TPL={upd:['Updates','Up to 4 update cards, as on Key Updates.',0,'',0,0],t1p:['Text and 1 photo','One text box beside a photo.',1,'image',1,1],t2p:['Text and 2 photos','One text box beside two photos.',1,'image',2,2],
  t1v:['Text and 1 video','One text box beside a video.',1,'video',1,1],t2v:['Text and 2 videos','One text box beside two videos.',1,'video',2,2],
  ponly:['Photos only','2 to 4 photos, with a title.',0,'image',2,4],vonly:['Videos only','2 to 4 videos, with a title.',0,'video',2,4],
  cii:['Challenge, Insight, Initiative','One topic: the challenge or objective, what we learnt and what we did.',0,'',0,0]};
const TPL_ORDER=['upd','cii','t1p','t2p','t1v','t2v','ponly','vonly'];

/* Weeks run Friday to Thursday, named by their Friday */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const friday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()-5+7)%7));return x;};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const THIS_WEEK=friday(new Date());
let WEEK=THIS_WEEK;
const wkShort=w=>{const e=addD(w,6);return w.getMonth()===e.getMonth()?`${w.getDate()} – ${e.getDate()} ${MON[e.getMonth()]} ${e.getFullYear()}`:`${w.getDate()} ${MON[w.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]} ${e.getFullYear()}`;};
const wkLong=w=>{const e=addD(w,6);return`Friday ${w.getDate()}${w.getMonth()!==e.getMonth()?' '+MONTH_FULL[w.getMonth()]:''} to Thursday ${e.getDate()} ${MONTH_FULL[e.getMonth()]} ${e.getFullYear()}`;};
const wkSlide=w=>{const e=addD(w,6);return`Week of ${w.getDate()}${w.getMonth()!==e.getMonth()?' '+MONTH_FULL[w.getMonth()]:''} to ${e.getDate()} ${MONTH_FULL[e.getMonth()]} ${e.getFullYear()}`;};
const fmtW=k=>{const [y,m,d]=k.split('-').map(Number);return`${d} ${MON[m-1]} ${y}`;};

/* ── State ── */
let DATA=null,SUB=(()=>{try{return localStorage.getItem('artium_review_sub')||'key';}catch(e){return'key';}})(),VIEW='show',SL=0;
let SUBSET=false,DRAFT=null,DIRTY=false,SEL=0,busy=false,UPLOADING=0,PICK=null;
const pageOf=id=>(DATA&&DATA.pages.find(p=>p.id===id))||null;
const deckOf=id=>(DATA&&DATA.decks[id])||{slides:[]};
const canAny=()=>!!DATA&&(DATA.canManage||DATA.pages.some(p=>p.canEdit));
const shown=sl=>sl.filter(s=>!s.hide).flatMap(spill);
/* An update slide that is too full: first the text gets a little smaller (down to 88%), then the cards that still don't fit
   move to a next slide marked "(continued)". A card longer than a whole slide is split between its lines. */
const SPILL=new Map();let MEAS=null;
function fitsAt(s){
  if(!MEAS){const d=document.createElement('div');d.style.cssText='position:fixed;left:-20000px;top:0;width:1600px;height:900px;visibility:hidden;pointer-events:none';
    d.innerHTML='<div class="slide"></div>';document.body.appendChild(d);MEAS=d.firstChild;}
  MEAS.innerHTML=slideHtml({name:''},s,0,2);
  const b=MEAS.querySelector('.s-b'),f=MEAS.querySelector('.flow');
  if(s.tpl==='cii'){const ci=MEAS.querySelector('.ci');return !ci||([...MEAS.querySelectorAll('.ic2')].every(x=>x.scrollHeight<=x.clientHeight+2)&&ci.scrollHeight<=b.clientHeight+2);}
  return !f||f.offsetHeight<=b.clientHeight-4;
}
function spill(s){
  if(s.tpl==='cii'){const key=JSON.stringify(s);if(SPILL.has(key))return SPILL.get(key);let out=null;
    for(const z of [1,.94,.88]){const t=Object.assign({},s,{z});if(fitsAt(t)){out=[t];break;}}
    out=out||[Object.assign({},s,{z:.88})];SPILL.set(key,out);return out;}
  if(s.tpl!=='upd')return[s];
  const key=JSON.stringify(s);if(SPILL.has(key))return SPILL.get(key);
  const cs=(s.cards||[]).filter(c=>c.title||(c.lines||[]).length),Z=[1,.94,.88];
  let out=null;
  for(const z of Z){const t=Object.assign({},s,{z});if(fitsAt(t)){out=[t];break;}}
  if(!out){
    const parts=[];let cur=[];
    const ok=cards=>fitsAt(Object.assign({},s,{cards,z:1}));
    const queue=cs.slice();
    while(queue.length){
      const c=queue.shift();
      if(ok(cur.concat(c))){cur.push(c);continue;}
      if(cur.length){parts.push(cur);cur=[];queue.unshift(c);continue;}
      // one card alone is too long: keep as many of its lines as fit, the rest continues
      const L=c.lines||[];let k=L.length-1;
      while(k>1&&!ok([Object.assign({},c,{lines:L.slice(0,k),of:null})]))k--;
      parts.push([Object.assign({},c,{lines:L.slice(0,Math.max(1,k)),of:null})]);
      if(L.length>Math.max(1,k))queue.unshift(Object.assign({},c,{title:(c.title||'')+' (continued)',lines:L.slice(Math.max(1,k))}));
    }
    if(cur.length)parts.push(cur);
    out=parts.map((p,i)=>Object.assign({},s,{cards:p,z:1,cont:i>0}));
  }
  SPILL.set(key,out);return out;
}

/* ── Photos and videos ── */
const LOCAL={},IMG={};
async function loadImg(id){
  if(IMG[id])return;IMG[id]='…';
  try{const j=await ArtiumAuth.call('reviewMedia',{id});if(j.error)throw new Error(j.error);IMG[id]='data:'+j.mime+';base64,'+j.data;}
  catch(e){IMG[id]='x';}
  paint();

const cur=()=>DRAFT&&DRAFT[SEL];

function refreshCanvas(){const page=pageOf(SUB),s=cur();const el=document.getElementById('eslide');if(el&&s)el.innerHTML=slideHtml(page,s,SEL,DRAFT.length);spillNote();
  const th=document.querySelector(`.th[data-sel="${SEL}"] .slide`);if(th&&s)th.innerHTML=slideHtml(page,s,SEL,DRAFT.length,true);

document.getElementById('ed').addEventListener('input',e=>{
  const s=cur();if(!s)return;const t=e.target,v=t.value;
  if(t.classList&&t.classList.contains('rte')){if(e.inputType==='insertText'&&e.data===' ')autoList(t);const ls=fromEd(t);
    if(t.dataset.cf){s.cards[+t.closest('[data-c]').dataset.c].lines=ls;}else s[t.dataset.f]=ls;
    touch();refreshCanvas();return;}
  if(t.dataset.f){const f=t.dataset.f;
    if(f==='lines')s.lines=v.split('\n').map(x=>x.trim()).filter(String);else if(f==='show'){s.hide=!t.checked;touch();renderEditor();return;}else s[f]=v;}
  else if(t.dataset.cf){const c=s.cards[+t.closest('[data-c]').dataset.c],f=t.dataset.cf;
    if(f==='lines')c.lines=v.split('\n').map(x=>x.trim()).filter(String);

document.getElementById('ed').addEventListener('click',async e=>{
  const th=e.target.closest('[data-sel]');if(th){SEL=+th.dataset.sel;renderEditor();return;}
  if(e.target.id==='addsl'){addSlide();return;}
  if(e.target.id==='discard'){if(DIRTY&&!confirm('Discard your changes?'))return;startDraft();render();return;}
  if(e.target.id==='go'){save();return;}
  const ld=e.target.closest('[data-lead]');if(ld){const s=cur();if(s){s.lead=ld.dataset.lead;touch();renderEditor();}return;}
  const b=e.target.closest('[data-a]');if(!b)return;const s=cur(),a=b.dataset.a;
  if(a==='up'&&SEL>0){DRAFT.splice(SEL,1);DRAFT.splice(SEL-1,0,s);SEL--;}
  else if(a==='down'&&SEL<DRAFT.length-1){DRAFT.splice(SEL,1);DRAFT.splice(SEL+1,0,s);SEL++;}
  else if(a==='del'){if(!confirm('Delete slide '+(SEL+1)+'?'))return;DRAFT.splice(SEL,1);SEL=Math.max(0,SEL-1);}
  else if(a==='addc'){s.cards=(s.cards||[]).concat({title:'',tag:'',lines:[],done:null,of:null,unit:''}).slice(0,4);}
  else if(a==='delc'){s.cards.splice(+b.closest('[data-c]').dataset.c,1);}
  else if(a==='unmedia'||a==='mleft'||a==='mright'){const k=+b.closest('[data-k]').dataset.k,m=s.media[k];s.media.splice(k,1);if(a==='mleft')s.media.splice(k-1,0,m);if(a==='mright')s.media.splice(k+1,0,m);}
  else if(a==='pick'){pickFile(s);return;}
  else return;

});

/* Adding a slide: choose a template first (every sub-page, All centres included, has all of them) */

  if(!tpl){PICK=SUB==='key'?'upd':'t1p';renderPicker();return;}
  const s={id:uid('S'),tpl,title:'',head:'',tag:'',lines:[],hide:false};
  if(tpl==='upd')s.cards=[{title:'',tag:'',lines:[],done:null,of:null,unit:''}];else if(tpl==='cii'){s.lead='challenge';s.c1=[];s.c2=[];s.c3=[];}else s.media=[];
  DRAFT.splice(DRAFT.length?SEL+1:0,0,s);SEL=DRAFT.length===1?0:SEL+1;touch();renderEditor();
  setTimeout(()=>{const t=document.querySelector('#form [data-f="title"]');if(t)t.focus();},30);
}

    <div class="tpls">${TPL_ORDER.map(k=>`<button type="button" class="tp" data-tpl="${k}" aria-pressed="${PICK===k}"><div class="pv">${PV[k][0]?'<div class="t"><i></i><i></i><i></i><i></i></div>':''}<div class="g" style="${PV[k][1]}">${PV[k][2]}</div></div><b>${TPL[k][0]}</b><small>${TPL[k][1]}</small></button>`).join('')}</div>
    <div class="ft"><button class="btn" type="button" data-x>Cancel</button><button class="btn pri" type="button" data-ok>Add this slide</button></div></div></div>`;

/* Upload: photos are resized to at most 2400 px first; everything goes to Drive in 8 MB pieces */
function pickFile(s){
  const T=TPL[s.tpl];if((s.media||[]).length>=T[5])return;
  const inp=document.createElement('input');inp.type='file';inp.accept=T[3]==='video'?'video/*':'image/*';
  inp.onchange=()=>{const f=inp.files[0];if(f)upload(s,f);};inp.click();
}
const dims=(f,kind)=>new Promise(res=>{const u=URL.createObjectURL(f);
  if(kind==='video'){const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>res({w:v.videoWidth||16,h:v.videoHeight||9,url:u});v.onerror=()=>res({w:16,h:9,url:u});v.src=u;}
  else{const im=new Image();im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight,url:u,img:im});im.onerror=()=>res({w:16,h:9,url:u});im.src=u;}});
async function shrink(f,d){
  if(!d.img||/gif|svg/.test(f.type)||Math.max(d.w,d.h)<=2400&&f.size<1.5e6)return{blob:f,w:d.w,h:d.h};
  const k=Math.min(1,2400/Math.max(d.w,d.h)),w=Math.round(d.w*k),h=Math.round(d.h*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(d.img,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.88));return{blob:blob||f,w,h};
}
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).replace(/^data:[^,]*,/,''));r.onerror=rej;r.readAsDataURL(blob);});
async function upload(s,f){
  const T=TPL[s.tpl],kind=/^video\//.test(f.type)?'video':/^image\//.test(f.type)?'image':null;
  if(kind!==T[3]){alert(T[3]==='video'?'This slide needs a video.':'This slide needs a photo.');return;}
  if(f.size>300*1024*1024){alert('That file is larger than 300 MB. Trim the video or export it smaller, then try again.');return;}
  UPLOADING++;s._up={pct:0,text:'Getting ready…'};renderEditor();
  try{
    const d=await dims(f,kind),{blob,w,h}=kind==='image'?await shrink(f,d):{blob:f,w:d.w,h:d.h};
    const type=blob.type||f.type,size=blob.size,name=f.name.replace(/\.[^.]+$/,'')+(blob===f?(f.name.match(/\.[^.]+$/)||[''])[0]:'.jpg');
    const st=await ArtiumAuth.call('reviewUploadStart',{file:{name,type,size}});if(st.error)throw new Error(st.error);
    let off=0,res=null;
    while(off<size){
      const end=Math.min(size,off+st.chunk),data=await b64(blob.slice(off,end));
      res=await ArtiumAuth.call('reviewUploadChunk',{id:st.upload,offset:off,data});if(res.error)throw new Error(res.error);
      off=res.done?size:res.next;
      s._up={pct:Math.round(off/size*100),text:'Uploading '+Math.round(off/size*100)+'% of '+(size/1048576).toFixed(1)+' MB…'};if(cur()===s)renderEditor();
    }
    LOCAL[res.id]=d.url;s.media=(s.media||[]).concat({id:res.id,kind,w,h,name:f.name,fit:'cover',o:shapeOf(w,h)}).slice(0,T[5]);DIRTY=true;
  }catch(err){alert('The upload stopped: '+err.message+'.');}
  delete s._up;UPLOADING--;renderEditor();
}

/* Save one sub-page's slides for this week */
async function save(){
  if(busy||UPLOADING)return;busy=true;renderEditor();
  const slides=DRAFT.map(({_up,...x})=>x);
  try{const j=await ArtiumAuth.call('saveReview',{week:iso(WEEK),sub:SUB,slides});if(j.error)throw new Error(j.error==='not-allowed'?'you can\'t edit this sub-page':j.error);
    DATA=j;stamp();busy=false;startDraft();render();}
  catch(err){busy=false;renderEditor();const m=document.getElementById('msg');if(m)m.textContent='Couldn\'t save: '+err.message+'.';}
}

/* Sub-pages: switch, add (editors with rights to All), remove the added ones */
const leaveOk=()=>!DIRTY||confirm('You have changes that aren\'t saved. Leave without saving them?');
document.getElementById('subs').addEventListener('click',async e=>{
  if(e.target.id==='addsp'){askName();return;}
  const rm=e.target.closest('[data-rm]');
  if(rm){e.stopPropagation();const p=pageOf(rm.dataset.rm);if(!confirm('Remove the sub-page "'+p.name+'"? Its slides stay saved in the sheet.'))return;
    savePages(DATA.pages.filter(x=>!x.fixed&&x.id!==p.id));return;}
  const b=e.target.closest('[data-sub]');if(!b||b.dataset.sub===SUB)return;
  if(!leaveOk())return;SUB=b.dataset.sub;try{localStorage.setItem('artium_review_sub',SUB);}catch(e){}SL=0;SEL=0;DRAFT=null;DIRTY=false;render();
});
function askName(){
  document.getElementById('dlg').innerHTML=`<div class="ov" id="ov"><div class="dlg sm" role="dialog" aria-label="Add a sub-page"><h3>Add a sub-page</h3><p>It appears after the centres, every week, with its own slides.</p>
    <input class="in" id="spname" maxlength="40" placeholder="e.g. Head Office"><div class="ft"><button class="btn" type="button" data-x>Cancel</button><button class="btn pri" type="button" id="spok">Add</button></div></div></div>`;
  const i=document.getElementById('spname');i.focus();
  const go=()=>{const n=i.value.trim();if(!n)return;closeDlg();savePages(DATA.pages.filter(x=>!x.fixed).concat({id:uid('P'),name:n}));};
  document.getElementById('spok').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go();};
}
async function savePages(list){
  try{const j=await ArtiumAuth.call('saveReviewPages',{week:iso(WEEK),pages:list.map(p=>({id:p.id,name:p.name}))});if(j.error)throw new Error(j.error);DATA=j;stamp();render();}
  catch(err){alert('Couldn\'t change the sub-pages: '+err.message+'.');}
}

/* Views, weeks and slides */
document.getElementById('vt').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.v===VIEW)return;if(VIEW==='edit'&&!leaveOk())return;VIEW=b.dataset.v;DRAFT=null;DIRTY=false;render();};
const moveWeek=d=>{if(!leaveOk())return;WEEK=addD(WEEK,7*d);SL=0;SEL=0;load();};
document.getElementById('prev').onclick=()=>moveWeek(-1);document.getElementById('next').onclick=()=>moveWeek(1);
const step=d=>{SL+=d;renderShow();};
document.getElementById('strip').onclick=e=>{const b=e.target.closest('[data-sl]');if(b){SL=+b.dataset.sl;renderShow();}};
document.getElementById('sprev').onclick=()=>step(-1);document.getElementById('snext').onclick=()=>step(1);

/* ── Presenting: every sub-page in order, as one deck ── */
let SEQ=[],POS=0,idleT=null;
function buildSeq(){SEQ=[];DATA.pages.forEach(p=>{const sl=shown(deckOf(p.id).slides);sl.forEach((s,i)=>SEQ.push({p,s,i,n:sl.length}));});}
function presentPaint(){
  const el=document.getElementById('slide'),x=SEQ[POS];
  el.innerHTML=x?slideHtml(x.p,x.s,x.i,x.n):'<div class="s-empty" style="margin:60px">No slides this week.</div>';
  const pages=DATA.pages.filter(p=>shown(deckOf(p.id).slides).length);
  document.getElementById('fsb').innerHTML=pages.map(p=>{const n=shown(deckOf(p.id).slides).length,on=x&&x.p.id===p.id;
    return`<button type="button" data-go="${esc(p.id)}" class="${on?'on':''}">${esc(p.name)}<em>${on?(x.i+1)+' of '+n:n}</em></button>`;}).join('')
    +`<span class="sep"></span><button type="button" class="nv" data-step="-1">‹ Previous</button><button type="button" class="nv" data-step="1">Next ›</button><button type="button" class="nv" data-exit>Exit (Esc)</button>`;
  fit();
}
document.getElementById('present').onclick=async()=>{
  if(!DATA)return;if(VIEW==='edit'){if(!leaveOk())return;VIEW='show';DRAFT=null;DIRTY=false;render();}
  buildSeq();if(!SEQ.length){alert('There are no slides for this week yet.');return;}
  // start at the slide on screen
  const k=SEQ.findIndex(x=>x.p.id===SUB&&x.i===SL);POS=k>=0?k:0;
  try{await document.documentElement.requestFullscreen();}catch(e){}
  document.body.classList.add('fs');document.getElementById('fsb').hidden=false;wake();presentPaint();playIntro(SEQ[POS].p);
};
// The opener: the sub-page's name (Offline Overview for All centres) with its city, the stickers circle in and vanish, then the slide arrives
const STK=[['<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>','linear-gradient(135deg,#DD30B1,#F17AD0)',170,'34px',12,'#fff'],
  ['<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>','linear-gradient(135deg,#4101F7,#6601FD)',130,'50%',-10,'#fff'],
  ['<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 6v7M10 6v7M14 6v7M18 6v7"/>','linear-gradient(135deg,#C9502A,#F5906F)',150,'34px',-6,'#fff'],
  ['<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 5.9L12 16.4 6.7 19.3l1.2-5.9L3.4 9.3l6-.7z"/>','#fff',92,'28px',18,'#4101F7'],
  ['<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/>','#fff',84,'26px',-14,'#DD30B1'],
  ['<path d="M19 3l2 2-6 6"/><path d="M13 9a4 4 0 0 0-5.6.4L4 13a3.5 3.5 0 0 0 5 5l3.6-3.4A4 4 0 0 0 13 9z"/><circle cx="9.5" cy="14.5" r="1.3"/>','linear-gradient(135deg,#2F4DB8,#7C9BFF)',110,'32px',8,'#fff']];
let introT=null,AC=null;
// The swoosh as the opener gives way to the first slide: a short breath of noise swept through a filter, made in the browser (no sound file)
function swoosh(delay){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+delay,len=0.9,buf=AC.createBuffer(1,Math.round(AC.sampleRate*len),AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(4200,t+0.42);bp.frequency.exponentialRampToValueAtTime(900,t+len);
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.55,t+0.32);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    const pan=AC.createStereoPanner?AC.createStereoPanner():null;
    src.connect(bp);bp.connect(g);if(pan){pan.pan.setValueAtTime(-0.6,t);pan.pan.linearRampToValueAtTime(0.6,t+len);g.connect(pan);pan.connect(AC.destination);}else g.connect(AC.destination);
    src.start(t);src.stop(t+len);SW=src;
  }catch(e){}
}
let SW=null;
function playIntro(p){
  const name=p.id==='key'?'Offline Overview':p.name,city=p.id==='key'?'All centres':CITY[p.name]||'Artium Academy';
  const ring=STK.map(([ic,bg,sz,rad,rot,col],i)=>{const a=(-150+i*60+(i%2?10:-8))*Math.PI/180,x=640*Math.cos(a),y=330*Math.sin(a);
    return`<div class="ok" style="left:${Math.round(x-sz/2)}px;top:${Math.round(y-sz/2)}px;--d:${(i*.08).toFixed(2)}s"><div class="stk" style="width:${sz}px;height:${sz}px;border-radius:${rad};background:${bg};--r:${rot}deg"><svg viewBox="0 0 24 24" style="stroke:${col}">${ic}</svg></div></div>`;}).join('');
  const words=esc(name).split(' '),last=words.pop();
  document.getElementById('intro').innerHTML=`<div class="istage" id="istage"><div class="slide" id="islide"><i class="cl c1"></i><i class="cl c2"></i><i class="cl c3"></i><i class="cl c4"></i>
    <div class="s-top"><div><div class="s-eb"><i></i>Weekly Offline Review · <b>${esc(wkShort(WEEK))}</b></div></div><div class="logo"><img src="brand/lockup-violet.png" alt="Artium Academy" width="125" height="44"></div></div>
    <div class="orbit">${ring}</div><div class="ttl"><h2 style="${name.length>12?'font-size:'+Math.max(96,Math.round(170*12/name.length))+'px;letter-spacing:-5px':''}">${words.length?words.join(' ')+' ':''}${last}<em>.</em></h2><div class="city">${esc(city)}</div></div></div></div>`;
  document.body.classList.add('intro');fit();swoosh(2.3);
  clearTimeout(introT);introT=setTimeout(endIntro,3500);
}
function endIntro(){clearTimeout(introT);if(SW){try{SW.stop();}catch(e){}SW=null;}document.body.classList.remove('intro');document.getElementById('intro').innerHTML='';}
function leaveFs(){if(!document.body.classList.contains('fs'))return;endIntro();document.body.classList.remove('fs');document.getElementById('fsb').hidden=true;
  const x=SEQ[POS];if(x){SUB=x.p.id;SL=x.i;}render();}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)leaveFs();});
document.getElementById('intro').addEventListener('click',endIntro);
const pstep=d=>{POS=Math.max(0,Math.min(SEQ.length-1,POS+d));presentPaint();};
document.getElementById('fsb').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){const k=SEQ.findIndex(x=>x.p.id===g.dataset.go);if(k>=0){POS=k;presentPaint();}return;}
  const s=e.target.closest('[data-step]');if(s){pstep(+s.dataset.step);return;}
  if(e.target.closest('[data-exit]')){if(document.fullscreenElement)document.exitFullscreen();else leaveFs();}
});
function wake(){const b=document.getElementById('fsb');b.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>b.classList.add('idle'),2500);}
document.addEventListener('mousemove',()=>{if(document.body.classList.contains('fs'))wake();});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||''))return;
  if(document.getElementById('ov')){if(e.key==='Escape')closeDlg();return;}
  const fs=document.body.classList.contains('fs');
  const fwd=e.key==='ArrowRight'||e.key==='PageDown'||(fs&&e.key===' '),back=e.key==='ArrowLeft'||e.key==='PageUp';
  if(fs&&document.body.classList.contains('intro')&&e.key!=='Escape'){e.preventDefault();endIntro();return;}
  if(fs){if(fwd){e.preventDefault();pstep(1);}if(back){e.preventDefault();pstep(-1);}if(e.key==='Escape'&&!document.fullscreenElement)leaveFs();return;}
  if(VIEW==='show'&&(fwd||back)){e.preventDefault();step(fwd?1:-1);}
});

/* Scale the 1600 × 900 slide to the space it has */
function fit(){
  const fs=document.body.classList.contains('fs');
  const one=(st,sl)=>{if(!st||!sl)return;let s,ox=0,oy=0;
    if(fs&&(st.id==='stage'||st.id==='istage')){st.style.width='';s=Math.min(innerWidth/1600,innerHeight/900);ox=(innerWidth-1600*s)/2;oy=(innerHeight-900*s)/2;}
    else{if(st.id==='stage')st.style.width='';const w=st.clientWidth;s=w/1600;
      // when the screen is short, the slide gets smaller and its frame narrows with it, centred
      if(st.id==='stage'){const top=st.getBoundingClientRect().top+scrollY,room=innerHeight-top-24;if(900*s>room&&room>320){s=room/900;st.style.width=(1600*s)+'px';}}
      st.style.height=(900*s)+'px';}
    sl.style.transform=`translate(${ox}px,${oy}px) scale(${s})`;};
  one(document.getElementById('stage'),document.getElementById('slide'));
  one(document.getElementById('estage'),document.getElementById('eslide'));
  one(document.getElementById('istage'),document.getElementById('islide'));
}
addEventListener('resize',fit);
// full screen takes a moment to settle: size the slide again once it has
document.addEventListener('fullscreenchange',()=>{fit();requestAnimationFrame(fit);setTimeout(fit,300);});

function stamp(){const t=new Date();document.getElementById('updated').textContent='Updated '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});document.getElementById('dot').className='dot';}
async function load(){
  const k=iso(WEEK);DATA=null;DRAFT=null;DIRTY=false;render();
  document.getElementById('dot').className='dot loading';document.getElementById('updated').textContent='Loading…';
  try{const j=await ArtiumAuth.call('review',{week:k});if(k!==iso(WEEK))return;if(j.error)throw new Error(j.error==='not-allowed'?'you don\'t have access to this page':j.error);DATA=j;stamp();}
  catch(err){document.getElementById('updated').textContent='Error: '+err.message;document.getElementById('dot').className='dot error';}
  render();
}
window.load=load;
// the site's refresh button and automatic refresh wait while editing, with unsaved changes, or while a file uploads
window.artiumBusy=()=>VIEW==='edit'||DIRTY||UPLOADING>0||document.body.classList.contains('fs');
addEventListener('beforeunload',e=>{if(DIRTY||UPLOADING){e.preventDefault();e.returnValue='';}});
document.fonts&&document.fonts.ready.then(()=>{SPILL.clear();fit();if(DATA&&VIEW!=='edit')paint();});
load();
</script>
</body>
