<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --display:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --bg:#F6F5F2;--card:#fff;--border:#E4E1EA;--line:#EFEDF2;
    --ink:#1D1B22;--ink2:#3B3742;--muted:#6B6774;--faint:#9A96A3;--ghost:#C9C5CF;
    --accent:#5B2A86;--accent-soft:#F2ECF8;--gold:#A8844F;
    --ok:#1F7A4D;--bad:#B42318;
    --shadow:0 1px 2px rgba(31,26,36,.04),0 12px 28px -18px rgba(75,31,111,.28);
  }
  body{background:var(--bg);font-family:var(--body);color:var(--ink2);-webkit-font-smoothing:antialiased}
  .page{max-width:1600px;margin:0 auto;padding:36px 48px 64px}

  /* Header */
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:26px}
  .eyebrow{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  h1{font:600 38px/1.15 var(--display);letter-spacing:-.015em;color:var(--ink)}
  .subtitle{font-size:15px;color:var(--muted);margin-top:6px}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .updated{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .dot.loading{background:var(--gold);animation:pulse 1s infinite}
  .dot.error{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}
  .controls{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:8px;box-shadow:var(--shadow)}
  .month-btn{width:36px;height:38px;border:0;border-radius:12px;background:var(--bg);color:var(--ink2);font-size:18px;cursor:pointer;display:grid;place-items:center}
  .month-btn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
  .month-btn:disabled{opacity:.35;cursor:default}
  .month-label{min-width:150px;text-align:center;font:600 15px var(--display);color:var(--ink)}

  /* Centre toggle */
  .centre-toggle{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:5px;box-shadow:var(--shadow);margin-bottom:22px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .centre-toggle::-webkit-scrollbar{display:none}
  .ct-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:0;background:none;border-radius:13px;padding:9px 20px 10px;cursor:pointer;white-space:nowrap;text-align:left;transition:background .15s}
  .ct-btn small{font:700 9.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .ct-btn span{font:600 15px/1.2 var(--display);color:var(--ink2)}
  .ct-btn:hover{background:var(--accent-soft)}
  .ct-btn[aria-pressed="true"]{background:var(--accent);box-shadow:0 6px 16px -8px rgba(91,42,134,.6)}
  .ct-btn[aria-pressed="true"] span{color:#fff}
  .ct-btn[aria-pressed="true"] small{color:#E9CF9E}
  .ct-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Grid: metrics and month figures stay put on the left; dates scroll sideways, latest first */
  .grid-wrap{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto;scrollbar-width:thin}
  table{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:0 14px;height:44px;white-space:nowrap;text-align:right;border-bottom:1px solid #F4F2EF;background:#fff}
  thead th{height:auto;padding:14px 14px 12px;font:600 13px/1.2 var(--display);color:var(--ink);border-bottom:1px solid var(--border);background:#fff;vertical-align:bottom}
  thead th small{display:block;font:500 11px var(--body);color:var(--faint);margin-top:3px}
  .m{position:sticky;left:0;z-index:2;text-align:left;min-width:252px;width:252px;font-weight:400;color:var(--ink2)}
  .s{position:sticky;z-index:2;min-width:104px;width:104px;background:#FCFBF9}
  .s1{left:252px}.s2{left:356px}.s3{left:460px}.s4{left:564px;min-width:122px;width:122px;box-shadow:8px 0 12px -10px rgba(43,24,64,.25);border-right:1px solid var(--border)}
  thead .m,thead .s{background:#F7F5F1}
  thead .m{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .d{min-width:88px;color:var(--ink2)}
  td.zero{color:#D6D2DB}
  .off{background:#FBFAF7!important}thead .off{background:#F7F4EE!important;color:var(--faint)}thead .off small:after{content:' · off'}
  .today{background:#FAF6FE!important}thead .today{background:#F3ECFB!important;color:var(--accent)}
  thead .today small{color:var(--accent)}
  tr.grp td{height:40px;background:#F5F1F9!important;border-top:10px solid #fff;border-bottom:1px solid #E9E1F3;box-shadow:none!important}
  tr.grp td.m{font:700 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#5B2A86}
  tbody tr.grp:first-child td{border-top:0}
  .gh{display:inline-flex;align-items:center;gap:10px}.gh i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#fff;color:var(--accent)}
  .gh i svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .gh small{font:500 11.5px var(--body);letter-spacing:0;text-transform:none;color:#9C86B5;margin-left:2px}
  tr.tot td{font-weight:600}tr.tot td.m{color:var(--accent)}
  .neg{color:var(--bad)}.pos{color:var(--ok)}
  /* premium details */
  td .tv{display:block;line-height:1.2}
  .lgbar{position:relative;display:inline-block;width:30px;height:6px;border-radius:6px;background:#EEE8F5;margin-right:7px;vertical-align:1px}.lgbar i{position:absolute;left:0;top:0;bottom:0;width:45%;border-radius:6px;background:var(--accent)}.lgbar b{position:absolute;left:60%;top:-3px;width:2px;height:12px;background:var(--ink2)}
  td .prog{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:6px}
  td .prog em{font:600 11px/1 var(--body);font-style:normal;color:var(--accent);min-width:28px;text-align:right}
  td .trk{position:relative;display:block;width:64px;height:6px;border-radius:6px;background:#EEE8F5}
  td .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#9466C9,var(--accent))}
  td .trk b{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;border-radius:1px;background:var(--ink2)}
  td .tp{position:absolute;right:14px;bottom:9px;width:58px;height:3px;border-radius:3px;background:#ECE6F3;overflow:hidden}td .tp i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8E5CC2,var(--accent))}
  td.s1 b{display:inline}
  td .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:600;font-size:12.5px}
  td.neg .pill{background:#FDF0EE;color:var(--bad)}td.pos .pill{background:#ECF6F0;color:var(--ok)}
  td.d.ht{background-image:linear-gradient(rgba(91,42,134,calc(var(--h)*.11)),rgba(91,42,134,calc(var(--h)*.11)))}
  tr.has td.s2.sbar,tr.sub td.s2.sbar{text-align:left;padding:0 16px;box-shadow:8px 0 12px -10px rgba(43,24,64,.25);border-right:1px solid var(--border)}
  .stack{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;max-width:300px}.stack i{display:block;min-width:3px}
  .bar{display:block;height:6px;border-radius:4px;background:#F0ECF5;max-width:300px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
  i.sw{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:10px;vertical-align:1px}
  tr.sub td.m{padding-left:40px}
  tr.subh td.m{padding-left:40px;padding-top:6px}
  tr.stot td{background:#fff}tr.stot td.m{padding-left:58px}
  td .na{color:var(--faint);font-size:12px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
  .legend span{display:inline-flex;align-items:center;gap:6px}.sq{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
  .notes{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.6}
  .notes b{color:var(--ink2);font-weight:600}
  .ast{color:var(--gold);font-weight:700;margin-left:1px}
  .empty{padding:48px;text-align:center;color:var(--muted)}

  @media (max-width:900px){.page{padding:24px 16px 48px}.page-header{align-items:flex-start}.header-right{align-items:flex-start}h1{font-size:28px}
    .m{min-width:170px;width:170px}.s{min-width:92px;width:92px}.s1{left:170px}.s2{left:262px}.s3{left:354px}.s4{left:446px}}
  /* first-glance summary */
  .sumbox{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .sumhead{display:flex;align-items:center;gap:18px;width:100%;padding:15px 20px;border:0;background:none;cursor:pointer;text-align:left}
  .sumhead .st{font:600 15px var(--display);color:var(--ink)}
  .sumline{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.sumline b{color:var(--ink);font-weight:600;margin-left:5px}
  .sumhead .chev{margin-left:auto;width:16px;height:16px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  .sumbox.open .chev{transform:rotate(180deg)}.sumbox.open .sumline{visibility:hidden}
  .sumbox:not(.open) .kpis{display:none}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--line)}
  .kpi:nth-child(5n+1){border-left:0}.kpi:nth-child(n+6){border-top:1px solid var(--line)}
  .kpi b em{font:500 14px var(--body);color:var(--faint);font-style:normal}
  .kpi{padding:16px 20px 15px;border-left:1px solid var(--line)}
  .kpi small{display:block;font:600 12px var(--body);color:var(--muted)}
  .kpi b{display:block;font:600 26px/1.15 var(--display);color:var(--ink);margin-top:5px;font-variant-numeric:tabular-nums}
  .kpi .bar{height:5px;border-radius:3px;background:#F1EEF5;margin-top:10px;overflow:hidden}.kpi .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .kpi span{display:block;font-size:12px;color:var(--faint);margin-top:6px}
  @media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-left:0;border-top:1px solid var(--line)}}
  /* % cells: the figure, with the numbers under it */
  td .pf{display:block;font-weight:600;line-height:1.15}td .nd{display:block;font:500 11px var(--body);color:var(--faint);margin-top:1px}
  tr.ratio td{height:48px}
  td.pmuted{color:#D6D2DB}
  /* Lead journey: button and window */
  .jbtn{margin-left:14px;border:1px solid #DCCDEE;background:#fff;color:var(--accent);font:600 12px var(--body);letter-spacing:0;text-transform:none;border-radius:999px;padding:4px 11px;cursor:pointer;vertical-align:middle}
  .jbtn:hover{background:var(--accent);color:#fff}
  .jdlg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(29,20,40,.5);backdrop-filter:blur(2px)}
  .jc{width:100%;max-width:980px;max-height:86vh;display:flex;flex-direction:column;background:#fff;border-radius:20px;box-shadow:0 30px 70px -20px rgba(30,15,45,.55);overflow:hidden}
  .jh{display:flex;justify-content:space-between;gap:16px;padding:20px 22px 10px}.jh h3{font:600 19px var(--display);color:var(--ink)}.jh p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
  .jx{flex:none;width:34px;height:34px;border:0;border-radius:10px;background:var(--bg);font-size:20px;color:var(--muted);cursor:pointer}
  .jf{display:flex;gap:6px;flex-wrap:wrap;padding:4px 22px 12px;border-bottom:1px solid var(--line)}
  .jf button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font:600 12.5px var(--body);color:var(--ink2);cursor:pointer}
  .jf button span{font-weight:500;color:var(--faint)}.jf button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.jf button[aria-pressed="true"] span{color:#E3D3F3}
  .jb{overflow:auto;padding:0 22px 16px}
  .jt{width:100%;min-width:0;border-collapse:collapse}
  .jt th,.jt td{position:static!important;background:none!important;padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font:400 13.5px var(--body);color:var(--ink2);white-space:nowrap;height:auto;box-shadow:none!important}
  .jt th{font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);position:sticky!important;top:0;background:#fff!important}
  .jt td b{display:block;font-weight:600;color:var(--ink)}.jt td small{display:block;font-size:11.5px;color:var(--faint)}.jt .mut{color:#C9C5CF}
  /* Period picker */
  .seg{display:inline-flex;gap:2px;background:var(--bg);border-radius:12px;padding:3px}
  .seg button{border:0;background:none;border-radius:9px;padding:8px 14px;font:600 13px var(--body);color:var(--ink2);cursor:pointer}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(31,26,36,.15)}
  .range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .range[hidden],#pmonth[hidden]{display:none}
  .range input{height:38px;padding:0 10px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--ink);font:500 13.5px var(--body)}
  .quick{display:flex;gap:4px;margin-left:4px}.quick button{border:0;font:600 12px var(--body);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:6px 10px;cursor:pointer}
  .quick button:hover{background:#E8DCF5}
  #pmonth{display:flex;align-items:center;gap:6px}
  th.d.first-of,td.d.first-of{box-shadow:inset 1px 0 0 #E4DED5}
  /* Rows that open, detail rows, % rows */
  tr.has td.m{cursor:pointer;user-select:none}tr.has td.m b{font-weight:600}
  .tg{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--bg);color:var(--muted);margin:0 8px 0 -4px;vertical-align:middle;transition:transform .15s,background .15s}
  .tg svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  tr.has:hover .tg{background:var(--accent-soft);color:var(--accent)}tr.has.open .tg{background:var(--accent);color:#fff;transform:rotate(90deg)}
  tr.sub td{height:34px;font-size:12.5px;color:var(--muted);background:#FDFCFE}tr.sub td.m{padding-left:46px;color:var(--muted);font-weight:400}tr.sub td.s1 b{font-weight:400;color:var(--muted)}
  tr.sub td.s{background:#FAF8FC}
  tr.has td.s1,tr.has td.d{padding-right:62px}   /* the breakdown's headline number sits above its lines' numbers, past the share slot */
  td em.sh{display:inline-block;width:42px;text-align:left;font:500 11px var(--body);font-style:normal;color:var(--faint);margin-left:6px}
  tr.stot td{border-top:1px solid var(--border);color:var(--ink2)}tr.stot td.m{font-weight:600;color:var(--ink2)}tr.sub.stot td.s1 b{font-weight:600;color:var(--ink2)}
  tr.subh td{height:28px;background:#FDFCFE;border-bottom:0}tr.subh td.m{padding-left:44px;font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  tr.subh td.s{background:#FAF8FC}
  tr.ratio td{height:36px;font-size:12.5px;color:var(--muted);background:#fff}tr.ratio td.m{color:var(--muted);font-weight:400}tr.ratio td .pf{font-weight:500;color:var(--ink2)}
  tr.ratio td.m:before{content:"%";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#F3F1F6;color:var(--faint);font:700 10px var(--body);margin-right:8px}
  tr.ratio td.s{background:#FCFBF9}
  tr.rp td{height:38px;padding-top:10px;vertical-align:bottom;background:#fff;border-bottom:0}tr.rp td.m{font-weight:600;color:var(--ink)}
  tr.rp td.m:before{content:"%";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font:700 10px var(--body);margin-right:8px;vertical-align:-1px}
  tr.ratio.rs td.m{padding-left:46px}tr.ratio.rs td.m:before{display:none}
  tr.head td{height:50px;font-size:15px;font-weight:600;color:var(--ink)}tr.head td.m{font:600 15px var(--display);color:var(--ink)}tr.head td.s1 b{font-size:15.5px;font-weight:700}
  tr.head td.zero{font-weight:400}
  /* level 2: ordinary rows */
  tbody tr:not(.head):not(.grp) td.s1 b{font-weight:500}
  /* level 3: supporting rows (ATV, detail and % rows) are quieter */
  tr.minor td,tr.minor td.m{color:var(--muted);font-size:13px}tr.minor td.s1 b{font-weight:400;color:var(--muted)}
  .s.hide{display:none}
  .ast{color:var(--gold);font-weight:700;margin-left:1px}
  table.rng .s1{box-shadow:8px 0 12px -10px rgba(43,24,64,.25);border-right:1px solid var(--border)}
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <div class="eyebrow" id="eyebrow">All centres</div>
      <h1>Daily Tracker</h1>
      <div class="subtitle">Day-by-day numbers, today first</div>
    </div>
    <div class="header-right">
      <div class="updated"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div>
      <div class="controls">
        <div class="seg" id="mode"><button type="button" data-m="month" aria-pressed="true">Month</button><button type="button" data-m="range" aria-pressed="false">Date range</button></div>
        <div id="pmonth"><button class="month-btn" id="prev" aria-label="Previous month">‹</button><div class="month-label" id="month-label">—</div><button class="month-btn" id="next" aria-label="Next month">›</button></div>
        <div class="range" id="prange" hidden><input type="date" id="from" aria-label="From"><span>to</span><input type="date" id="to" aria-label="To">
          <div class="quick"><button type="button" data-q="7">Last 7 days</button><button type="button" data-q="14">Last 14 days</button><button type="button" data-q="month">This month</button></div></div>
      </div>
    </div>
  </header>
  <nav class="centre-toggle" id="centre-toggle" aria-label="Centre"></nav>
  <section class="sumbox" id="sumbox"><button type="button" class="sumhead" id="sumhead" aria-expanded="false"><span class="st">Summary</span><span class="sumline" id="sumline"></span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="kpis" id="kpis"></div></section>
  <div class="grid-wrap">
    <div class="scroll" id="sc"><table id="grid"></table></div>
    <div class="legend"><span><i class="sq" style="background:#EBE0F7"></i>Today (so far)</span><span><i class="sq" style="background:#F2EEE7"></i>Monday (weekly off)</span><span>Latest date first · scroll right for earlier dates</span><span>% rows: that day's figure, with the numbers under it</span><span><i class="lgbar"><i></i><b></b></i>Share of the month's target reached; the dark mark is where it should be by today</span></div>
  </div>
  <div class="notes" id="notes"></div>
</div>

<script>
const CENTRES=[{city:'Chennai',name:'Alwarpet'},{city:'Chennai',name:'Thoraipakkam'},{city:'Bangalore',name:'Borewell Road'}];
const OFF_DAY=1;
const LEAD_FROM=20261101;   // the lead list starts on 1 November 2026; before that, leads are the ads tracker's daily counts   // Monday: centres are closed; left out of RR
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtN=v=>(v<0?'−':'')+Math.round(Math.abs(v)).toLocaleString('en-IN');
const fmtR=v=>'₹'+fmtN(v);
const fmtP=v=>Math.round(v)+'%';
const fmtC=v=>{const a=Math.abs(v);return a>=1e5?'₹'+(v/1e5).toFixed(a>=1e6?1:2).replace(/\.?0+$/,'')+'L':a>=1e3?'₹'+(v/1e3).toFixed(1).replace(/\.0$/,'')+'K':'₹'+Math.round(v);};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const fromYmd=k=>new Date(Math.floor(k/10000),Math.floor(k/100)%100-1,k%100);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;};

/* ── State ── */

/* ── Matching, per centre ──
   A visit is matched to that person's appointments (same phone number) booked on or before the visit day:
     expected that day → "expected today"; only an earlier expected date → "expected earlier"; only a later one → "expected later";
     no appointment → direct walk-in. A centre without an appointments sheet uses the visit sheet's Visit Type instead (booked / walk-in).
   A fresh sale is matched to the latest visit with the same phone number on or before the payment (3 days' grace for late entries). */
function prep(name){
  const t=TR&&TR[name];if(!t)return null;
  // Appointments: the centre's own Appointments tab plus those booked by Futwork (no booking date there yet: 0).
  // A Futwork booking already in the centre's tab (same phone, same visit date) counts once.
  const own=t.appts;
  const fw=(t.futwork||[]).filter(f=>f[1]&&!(own||[]).some(a=>a[2]===f[2]&&a[1]===f[1])).map(f=>Object.assign([f[0],f[1],f[2],''],{fw:1,name:f[3]}));
  const appts=own||fw.length?(own||[]).concat(fw):null,byPhone=new Map();
  (appts||[]).forEach(a=>{if(a[2]){(byPhone.get(a[2])||byPhone.set(a[2],[]).get(a[2])).push(a);}});
  const visits=t.visits.map(v=>{const [d,p,type]=v;let kind=null;
    if(appts){const mine=(byPhone.get(p)||[]).filter(a=>a[0]<=d&&a[1]);
      if(mine.some(a=>a[1]===d))kind='today';else if(mine.some(a=>a[1]<d&&diff(a[1],d)<=90))kind='earlier';else if(mine.some(a=>a[1]>d))kind='later';}
    // no appointment found: a walk-in, or, for a centre without its own Appointments tab, what the visit sheet's Visit Type says
    if(!kind)kind=type===1?'booked':type===0?'walk':own?'walk':'unknown';
    return{d,p,kind};});
  const vByPhone=new Map();visits.forEach(v=>{if(v.p)(vByPhone.get(v.p)||vByPhone.set(v.p,[]).get(v.p)).push(v);});
  const fresh=t.fresh.map(f=>{const [d,p,amt]=f;const v=(vByPhone.get(p)||[]).filter(x=>x.d<=addDays(d,3)).sort((a,b)=>b.d-a.d)[0]||null;if(v)v.paid=1;
    return{d,amt,v,journey:!v?'nolog':v.kind==='walk'?'walk':v.kind==='unknown'?'unknown':'appt',when:!v?'nolog':v.d>=d?'same':'earlier'};});
  // show-up: each appointment expected on a day counts as shown if that person visited between booking and 30 days after the expected day
  const show=(appts||[]).filter(a=>a[1]).map(a=>({e:a[1],came:(vByPhone.get(a[2])||[]).some(v=>v.d>=a[0]&&v.d<=addDays(a[1],30)),onDay:(vByPhone.get(a[2])||[]).some(v=>v.d===a[1])}));
  // The lead list (from LEAD_FROM): each lead is followed through to an appointment (same lead ID or phone, booked on or after the day it came in),
  // a visit and a payment (same phone, on or after that day). Each appointment is also tagged with when its lead came in.
  const LL=t.leadList&&t.leadList.length?t.leadList:null,leads=[];
  if(LL){
    const byId=new Map(),byPh=new Map();
    LL.forEach(([d,p,id,nm])=>{const l={d,p,id,name:nm||'',centre:name};leads.push(l);if(id)byId.set(id,l);if(p&&(!byPh.has(p)||byPh.get(p).d>d))byPh.set(p,l);});
    const fByPh=new Map();t.fresh.forEach(f=>{if(f[1])(fByPh.get(f[1])||fByPh.set(f[1],[]).get(f[1])).push(f[0]);});
    leads.forEach(l=>{
      const ap=(appts||[]).filter(a=>(a[0]||a[1])>=l.d&&((l.id&&a[3]===l.id)||(l.p&&a[2]===l.p))).sort((a,b)=>(a[0]||a[1])-(b[0]||b[1]))[0];
      l.appt=!!ap;l.apptD=ap?(ap[0]||0):0;l.apptE=ap?ap[1]:0;l.fw=ap?!!ap.fw:false;
      const vd=(vByPhone.get(l.p)||[]).filter(v=>v.d>=l.d).map(v=>v.d).sort()[0],pd=(fByPh.get(l.p)||[]).filter(d=>d>=l.d).sort()[0];
      l.visit=!!(l.p&&vd);l.visitD=vd||0;l.paid=!!(l.p&&pd);l.paidD=pd||0;});
    (appts||[]).forEach(a=>{if(!a[0])return;const l=(a[3]&&byId.get(a[3]))||(a[2]&&byPh.get(a[2]))||null;a.src=!l||l.d>a[0]?'none':l.d===a[0]?'today':'earlier';});
  }
  return{t,visits,fresh,show,appts,hasAppts:!!appts,hasBooked:!!own||fw.some(a=>a[0]),hasFw:fw.length>0,fwNoDate:fw.length>0&&!fw.some(a=>a[0]),leads:LL?leads:null};
}

/* Daily series for one centre over the given days (yyyymmdd list, oldest first) */
function series(name,days){
  const P=PREP[name];if(!P)return null;
  const idx=new Map(days.map((k,i)=>[k,i])),z=()=>days.map(()=>0),S={};
  ['leads','appts','exp','vis','vToday','vEarlier','vLater','vWalk','vBooked','vUnknown','conv','cAppt','cWalk','cUnknown','cNolog','cSame','cEarlier','fs','fc','rn','rc','showE','showC','apptVis','vPaid','due','L','LA','LV','LC','aToday','aEarlier','aNone','kA','kV','kC','kAV','apR'].forEach(k=>S[k]=z());
  const put=(k,d,n=1)=>{const i=idx.get(d);if(i!=null)S[k][i]+=n;};
  const end=days[days.length-1];
  if(P.leads){P.leads.forEach(l=>{put('L',l.d);if(l.appt)put('LA',l.d);if(l.visit)put('LV',l.d);if(l.paid)put('LC',l.d);
    // cohort: of the leads that came in that day, who booked, visited and paid by the end of the period
    const kA=l.appt&&(!l.apptD||l.apptD<=end),kV=l.visitD&&l.visitD<=end,kC=l.paidD&&l.paidD<=end;
    if(kA)put('kA',l.d);if(kV)put('kV',l.d);if(kC)put('kC',l.d);if(kA&&kV)put('kAV',l.d);});}
  P.t.leads.forEach(([d,n])=>{if(!(P.leads&&d>=LEAD_FROM))put('leads',d,n);});   // ads tracker before the lead list starts
  if(P.leads)P.leads.forEach(l=>{if(l.d>=LEAD_FROM)put('leads',l.d);});
  if(P.hasAppts){P.appts.forEach(a=>{if(a[1])put('exp',a[1]);put('apR',a[0]||a[1]);if(!a[0])return;put('appts',a[0]);if(P.leads)put(a.src==='today'?'aToday':a.src==='earlier'?'aEarlier':'aNone',a[0]);});P.show.forEach(s=>{put('showE',s.e);if(s.came)put('showC',s.e);});}
  const VK={today:'vToday',earlier:'vEarlier',later:'vLater',walk:'vWalk',booked:'vBooked',unknown:'vUnknown'};
  P.visits.forEach(v=>{put('vis',v.d);put(VK[v.kind],v.d);if(v.paid)put('vPaid',v.d);if(['today','earlier','later'].includes(v.kind))put('apptVis',v.d);});
  P.fresh.forEach(f=>{put('conv',f.d);put('fs',f.d);put('fc',f.d,f.amt);put({appt:'cAppt',walk:'cWalk',unknown:'cUnknown',nolog:'cNolog'}[f.journey],f.d);if(f.when==='same')put('cSame',f.d);else if(f.when==='earlier')put('cEarlier',f.d);});
  P.t.renew.forEach(([d,a,end])=>{put('rn',d);put('rc',d,a);if(end)put('due',end);});
  P.t.fresh.forEach(f=>{if(f[3])put('due',f[3]);});   // memberships ending that day: renewals due
  S.tc=S.fc.map((v,i)=>v+S.rc[i]);
  S.hasAppts=P.hasAppts;S.hasBooked=P.hasBooked;S.hasLeads=P.t.leads.length>0||!!P.leads;S.hasList=!!P.leads;
  return S;
}

    {h:'Time of payment'},{id:'cSame',label:'Spot payments: visited today, paid today'},{id:'cEarlier',label:'Follow-up payments: visited earlier, paid today'},{id:'cNolog',label:'Paid, visit not logged',opt:1},{total:['cSame','cEarlier','cNolog']}]},

function period(){
  if(mode==='month'){const a=new Date(viewY,viewM,1),last=new Date(viewY,viewM+1,0);const b=ymd(last)>TODAY?now:last;return{a,b,label:MONTH_FULL[viewM]+' '+viewY,month:true,full:last};}
  const a=rFrom||new Date(now.getFullYear(),now.getMonth(),now.getDate()-13),b=rTo||now;return{a,b:b>now?now:b,label:'',month:false};
}
function render(){
  const P=period();
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  document.getElementById('pmonth').hidden=mode!=='month';document.getElementById('prange').hidden=mode==='month';
  document.getElementById('month-label').textContent=MONTH_FULL[viewM]+' '+viewY;
  document.getElementById('next').disabled=viewY===now.getFullYear()&&viewM===now.getMonth();
  if(mode==='range'){document.getElementById('from').value=iso(P.a);document.getElementById('to').value=iso(P.b);}
  document.getElementById('eyebrow').textContent=selCentre==='All'?'All centres':selCentre+' · '+CENTRES.find(c=>c.name===selCentre).city;
  document.querySelectorAll('.ct-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===selCentre));
  const grid=document.getElementById('grid'),notes=document.getElementById('notes');
  if(!loaded){grid.innerHTML='<tr><td class="empty">Loading…</td></tr>';notes.innerHTML='';return;}
  if(P.a>now){grid.innerHTML='<tr><td class="empty">This month hasn\'t started yet.</td></tr>';notes.innerHTML='';return;}
  // days, oldest first (for running figures); shown newest first
  const days=[];for(let d=new Date(P.a);d<=P.b;d.setDate(d.getDate()+1))days.push(ymd(d));
  const ORD=days.map((_,i)=>i).reverse();
  const list=selCentre==='All'?CENTRES:CENTRES.filter(c=>c.name===selCentre);
  const per=list.map(c=>({c,S:series(c.name,days),T:P.month?((TARGETS[monthKey(viewY,viewM)]||{})[c.name]||{}):{}})).filter(p=>p.S);
  const ok=need=>per.filter(p=>!need||(need==='appts'?p.S.hasAppts:need==='booked'?p.S.hasBooked:need==='leads'?p.S.hasLeads:need==='list'?p.S.hasList:p.S.hasAppts&&p.S.hasLeads));
  const add=(id,ps)=>days.map((_,i)=>ps.reduce((s,p)=>s+p.S[id][i],0));
  const tot=a=>a.reduce((s,v)=>s+v,0),cum=a=>{let c=0;return a.map(v=>c+=v);};
  // month view: run-rate over working days (Mondays off) and targets
  const work=k=>fromYmd(k).getDay()!==OFF_DAY;
  const cur=P.month&&viewY===now.getFullYear()&&viewM===now.getMonth();
  let gone=days.filter(work).length,all=0;if(P.month){for(let d=new Date(P.a);d<=P.full;d.setDate(d.getDate()+1))if(d.getDay()!==OFF_DAY)all++;}
  const tgt=keys=>{const has=per.filter(p=>keys.every(k=>p.T[k]!=null));return has.length?{v:has.reduce((s,p)=>s+keys.reduce((a,k)=>a+p.T[k],0),0),has,all:has.length===per.length}:null;};
  const missing=[];
  const isOff=i=>!work(days[i]),isToday=i=>days[i]===TODAY,first=i=>days[i]%100===1&&i!==0;
  const cell=(i,txt,cls='',ht=0)=>`<td class="d ${isOff(i)?'off':''} ${isToday(i)?'today':''} ${first(i)?'first-of':''} ${cls}${ht?' ht':''}"${ht?` style="--h:${ht.toFixed(2)}"`:''}>${txt}</td>`;
  const sc=(so,t,rr,gap)=>`<td class="s s1">${String(so).startsWith('<span class="pf')?so:'<b>'+String(so).replace('<span class="tp"','</b><span class="tp"')+(String(so).includes('class="tp"')?'':'</b>')}</td>`+(P.month?`<td class="s s2">${t}</td><td class="s s3">${rr}</td><td class="s s4 ${gap&&gap.v<0?'neg':gap&&gap.v>0?'pos':''}">${gap?gap.t:''}</td>`:'');
  const blank=()=>`<td class="s s1"></td>`+(P.month?'<td class="s s2"></td><td class="s s3"></td><td class="s s4"></td>':'');
  const NR='<span class="na">Not recorded</span>';
  let h='<thead><tr><th class="m">Metric</th><th class="s s1">'+(P.month?(cur?'Month so far':'Month'):'Period total')+'</th>'+(P.month?'<th class="s s2">Target</th><th class="s s3">RR</th><th class="s s4">Surplus / Deficit</th>':'');
  for(const i of ORD){const dt=fromYmd(days[i]);h+=`<th class="d ${isOff(i)?'off':''} ${isToday(i)?'today':''} ${first(i)?'first-of':''}">${dt.getDate()} ${MON[dt.getMonth()]}<small>${isToday(i)?'Today':WD[dt.getDay()]}</small></th>`;}
  h+='</tr></thead><tbody>';
  const fm=(k,v)=>k==='money'?fmtR(v):fmtN(v);
  const line=(r,label,a,cls,ps)=>{  // a count or money row
    const so=tot(a);let t='',rr='',gap=null;
    const keys=r.tkeys||(r.tkey?[r.tkey]:null);
    if(P.month&&keys){const T=tgt(keys);if(T){t=fm(r.kind,T.v)+(T.all?'':'<sup class="ast">*</sup>');if(!T.all)missing.push(r.label);
      const mine=tot(add(r.src||r.id,T.has.filter(p=>ps.includes(p))));gap={v:mine-T.v,t:(mine-T.v>0?'+':'')+fm(r.kind,mine-T.v)};}
      if(cur&&gone)rr=fm(r.kind,so/gone*all);}
    const mx=Math.max(...a),T0=P.month&&keys?tgt(keys):null;
    const val=fm(r.kind,so);
    if(T0&&T0.v){const done=so/T0.v*100,pace=cur&&all?gone/all*100:100;
      t=`<span class="tv">${t}</span><span class="prog" title="${Math.round(done)}% of the target reached; the mark shows where the month should be by today"><span class="trk"><i style="width:${Math.min(100,done)}%"></i><b style="left:${Math.min(100,pace)}%"></b></span><em>${Math.round(done)}%</em></span>`;}
    if(gap)gap.t=`<span class="pill">${gap.t}</span>`;
    return`<tr class="${cls}"><td class="m">${label}</td>`+sc(val,t,rr,gap)+ORD.map(i=>cell(i,a[i]?(r.kind==='money'?`<span title="${fmtR(a[i])}">${fmtC(a[i])}</span>`:fmtN(a[i])):'–',a[i]?'':'zero',a[i]&&mx?a[i]/mx:0)).join('')+'</tr>';
  };
  ROWS.forEach(r=>{
    if(r.g){const gi=GI[r.g]||['',''];h+=`<tr class="grp"><td class="m"><span class="gh"><i><svg viewBox="0 0 24 24">${gi[0]}</svg></i>${r.g}<small>${gi[1]}</small></span>${r.journey?'<button type="button" class="jbtn" id="jbtn">See each lead ›</button>':''}</td>${blank()}<td colspan="${days.length}"></td></tr>`;return;}
    if(r.pair){
      h+=`<tr class="rp"><td class="m">${r.label}</td>${blank()}<td colspan="${days.length}"></td></tr>`;
      const coh=P.month?(cur?"This month's cohort":"That month's cohort"):"This period's cohort";
      r.pair.forEach((q,k)=>{
        const ps=ok(q.need),lab=k?'Overall':coh;
        if(!ps.length){h+=`<tr class="ratio rs"><td class="m" title="${esc(q.tip)}">${lab}</td>`+sc(NR,'','',null)+ORD.map(i=>cell(i,'–','zero')).join('')+'</tr>';return;}
        const an=add(q.num,ps),ad=add(q.den,ps),tn=tot(an),td=tot(ad),so=td?tn/td*100:null;
        const pc=(n,d)=>`<span class="pf">${fmtP(n/d*100)}</span><span class="nd">${fmtN(n)} / ${fmtN(d)}</span>`;
        let t='',gap=null;
        if(P.month&&q.tn){const both=per.filter(p=>p.T[q.tn]!=null&&p.T[q.td]!=null),nu=both.reduce((s,p)=>s+p.T[q.tn],0),de=both.reduce((s,p)=>s+p.T[q.td],0);
          if(both.length&&de){const tv=nu/de*100;t=fmtP(tv);if(so!=null)gap={v:so-tv,t:`<span class="pill">${(so-tv>0?'+':'−')+Math.abs(so-tv).toFixed(1)+' pts'}</span>`};}}
        h+=`<tr class="ratio rs"><td class="m" title="${esc(q.tip)}">${lab}</td>`+sc(so!=null?pc(tn,td):'–',t,'',gap)
          +ORD.map(i=>ad[i]?cell(i,pc(an[i],ad[i])):cell(i,'–','zero')).join('')+'</tr>';
      });
      return;}
    const ps=ok(r.need);
    if(!ps.length){h+=`<tr class="${r.kind==='ratio'?'ratio':''}"><td class="m">${r.label}</td>`+sc(NR,'','',null)+ORD.map(i=>cell(i,'–','zero')).join('')+'</tr>';return;}
    if(r.kind==='count'||r.kind==='money'){
      const a=add(r.src||r.id,ps),opn=r.open&&OPEN.includes(r.open);
      const lab=r.open?`<span class="tg"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span><b>${r.label}</b>`:r.label;
      h+=line(r,lab,a,(r.head?'head ':'')+(r.open?'has '+(opn?'open':''):''),ps).replace('<tr ',r.open?`<tr data-open="${r.open}" `:'<tr ');
      if(P.month&&r.subs){   // the headline row: its first section as one stacked bar
        const sec=[];for(const x of r.subs){if(x.total)break;if(!x.h)sec.push(x);}
        const tt=sec.reduce((acc,x)=>acc+tot(add(x.id,ps)),0);
        const segs=sec.map((x,k)=>{const v=tot(add(x.id,ps));return v&&tt?`<i style="flex:${v};background:${SEG[k%SEG.length]}" title="${esc(x.label)}: ${v}"></i>`:'';}).join('');
        h=h.replace(/<td class="s s2"><\/td><td class="s s3"><\/td><td class="s s4[^"]*"><\/td>(?![\s\S]*<td class="s s2"><\/td><td class="s s3">)/,`<td class="s s2 sbar" colspan="3">${tt?`<span class="stack">${segs}</span>`:''}</td>`);
      }
      if(opn){
        // each section's total: the sum of its lines; a line's share is of that total
        const secTot=k=>{const t=r.subs.slice(k).find(x=>x.total);return t?t.total.reduce((acc,id)=>acc.map((v,i)=>v+add(id,ps)[i]),days.map(()=>0)):a;};
        const sh=(n,d)=>`<em class="sh">${n&&d?(n/d*100).toFixed(1)+'%':''}</em>`;
        r.subs.forEach((s,k)=>{
          if(s.h){h+=`<tr class="subh"><td class="m">${s.h}</td>${blank()}<td colspan="${days.length}"></td></tr>`;return;}
          if(s.total){const b=secTot(k);h+=`<tr class="sub stot"><td class="m">Total</td><td class="s s1"><b>${fmtN(tot(b))}</b>${sh(0,0)}</td>`+(P.month?'<td class="s s2 sbar" colspan="3"></td>':'')
            +ORD.map(i=>cell(i,b[i]?fmtN(b[i])+sh(0,0):'–'+sh(0,0),b[i]?'':'zero')).join('')+'</tr>';return;}
          const b=add(s.id,ps);if(s.opt&&!tot(b))return;const T=secTot(k);
          let ix=0;for(let j=k-1;j>=0&&!r.subs[j].h&&!r.subs[j].total;j--)ix++;
          const col=SEG[ix%SEG.length],pct=tot(T)?tot(b)/tot(T)*100:0;
          h+=`<tr class="sub"><td class="m"><i class="sw" style="background:${col}"></i>${s.label}</td><td class="s s1"><b>${fmtN(tot(b))}</b>${sh(tot(b),tot(T))}</td>`+(P.month?`<td class="s s2 sbar" colspan="3"><span class="bar"><i style="width:${pct}%;background:${col}"></i></span></td>`:'')
            +ORD.map(i=>cell(i,b[i]?fmtN(b[i])+sh(b[i],T[i]):'–'+sh(0,0),b[i]?'':'zero')).join('')+'</tr>';
        });}
    }else if(r.kind==='ratio'){
      const an=add(r.num,ps),ad=add(r.den,ps),tn=tot(an),td=tot(ad),so=td?tn/td*100:null;
      const pc=(n,d)=>`<span class="pf">${fmtP(n/d*100)}</span><span class="nd">${fmtN(n)} / ${fmtN(d)}</span>`;
      let t='',gap=null;
      if(P.month&&r.tn){const both=per.filter(p=>p.T[r.tn]!=null&&p.T[r.td]!=null),nu=both.reduce((s,p)=>s+p.T[r.tn],0),de=both.reduce((s,p)=>s+p.T[r.td],0);
        if(both.length&&de){const tv=nu/de*100;t=fmtP(tv);if(so!=null)gap={v:so-tv,t:`<span class="pill">${(so-tv>0?'+':'−')+Math.abs(so-tv).toFixed(1)+' pts'}</span>`};}}
      h+=`<tr class="ratio"><td class="m"${r.tip?` title="${esc(r.tip)}"`:''}>${r.label}</td>`+sc(so!=null?pc(tn,td):'–',t,'',gap)
        +ORD.map(i=>r.periodOnly?cell(i,'','pmuted'):ad[i]?cell(i,pc(an[i],ad[i])):cell(i,'–','zero')).join('')+'</tr>';
    }else if(r.kind==='atv'){
      const nu=add(r.num,ps),de=add(r.den,ps),so=tot(de)?tot(nu)/tot(de):null;let t='',gap=null;
      if(P.month){const both=per.filter(p=>p.T[r.tn]!=null&&p.T[r.td]!=null),n2=both.reduce((s,p)=>s+p.T[r.tn],0),d2=both.reduce((s,p)=>s+p.T[r.td],0);
        if(both.length&&d2){const tv=n2/d2;t=fmtR(tv);if(so!=null)gap={v:so-tv,t:`<span class="pill">${(so-tv>0?'+':'')+fmtR(so-tv)}</span>`};}}
      h+=`<tr class="${r.minor?'minor':''}"><td class="m">${r.label}</td>`+sc(so!=null?fmtR(so):'–',t,'',gap)+ORD.map(i=>de[i]?cell(i,`<span title="${fmtR(nu[i]/de[i])}">${fmtC(nu[i]/de[i])}</span>`):cell(i,'–','zero')).join('')+'</tr>';
    }
  });
  // first-glance summary: the period's headline numbers, against target in Month view
  const card=(l,v,sub,bar)=>`<div class="kpi"><small>${l}</small><b>${v}</b>${bar!=null?`<div class="bar"><i style="width:${Math.max(0,Math.min(100,bar))}%"></i></div>`:''}<span>${sub}</span></div>`;
  const sp=P.month?(cur?'this month so far':'this month'):'in this period';
  const kc=(l,id,keys,need,money)=>{const ps=ok(need);if(!ps.length)return card(l,'–','Not recorded',null);const v=tot(add(id,ps)),T=P.month&&keys?tgt(keys):null;
    return card(l,money?fmtR(v):fmtN(v),T?`${Math.round(v/T.v*100)}% of ${money?fmtR(T.v):fmtN(T.v)} target`:sp,T?v/T.v*100:null);};
  const rnN=tot(add('rn',per)),dueN=tot(add('due',per)),eff=dueN?rnN/dueN*100:null,colT=tot(add('tc',per));
  document.getElementById('kpis').innerHTML=[kc('Leads registered','leads',['leads'],'leads'),kc('Appointments scheduled in '+(P.month?'this month':'this period'),'appts',['appts'],'booked'),kc('Centre visits','vis',['visits']),kc('Conversions','conv',['conv']),kc('Collections – Fresh Sales','fc',['fscol'],null,1),
    card('Renewals',`${fmtN(rnN)}<em> of ${fmtN(dueN)} due</em>`,'renewals paid · memberships ending',null),
    card('Renewal collection efficiency',eff==null?'–':Math.round(eff)+'%','renewed ÷ due',eff),
    kc('Collections – Renewals','rc',['rncol'],null,1),kc('Total collections','tc',['fscol','rncol'],null,1)].join('')+'<div class="kpi"></div>';
  document.getElementById('sumline').innerHTML=[['Leads',fmtN(tot(add('leads',ok('leads'))))],['Visits',fmtN(tot(add('vis',per)))],['Conversions',fmtN(tot(add('conv',per)))],['Renewals',fmtN(rnN)+(dueN?' of '+fmtN(dueN):'')],['Collected',fmtR(colT)]].map(([l,v])=>`<span>${l}<b>${v}</b></span>`).join('');
  grid.className=P.month?'':'rng';
  grid.innerHTML=h.split('{p}').join(P.month?'this month':'this period')+'</tbody>';
  document.getElementById('sc').scrollLeft=0;
  const jb=document.getElementById('jbtn');if(jb)jb.onclick=()=>journeyDialog(P,list.map(c=>c.name));
  grid.querySelectorAll('tr[data-open]').forEach(tr=>tr.onclick=()=>{const k=tr.dataset.open;OPEN=OPEN.includes(k)?OPEN.filter(x=>x!==k):OPEN.concat(k);try{localStorage.setItem('artium_daily_open',JSON.stringify(OPEN));}catch(e){}render();});
  // Notes, in plain words
  const msgs=[];
  if(P.month&&!TARGETS[monthKey(viewY,viewM)])msgs.push(`<b>No targets set for ${MONTH_FULL[viewM]} ${viewY}.</b> Add them on the Targets page.`);
  else if(missing.length)msgs.push(`<sup class="ast">*</sup>Not every centre has a target for ${[...new Set(missing)].join(', ')}, so the target and surplus / deficit cover only the centres that do.`);
  const noA=per.filter(p=>!p.S.hasAppts).map(p=>p.c.name);
  if(noA.length)msgs.push(`<b>${noA.join(', ')}:</b> no appointments sheet, so ${noA.length>1?'they are':'it is'} left out of appointments, visits expected and show-up; ${noA.length>1?'their':'its'} visits are split by the visit sheet's Visit Type.`);
  if(per.some(p=>PREP[p.c.name]&&PREP[p.c.name].fwNoDate))msgs.push('<b>Futwork appointments</b> have no booking date yet, so they count in visits expected, the visit split and the lead journey, but not in appointments scheduled; in the ratios they count on their visit date.');
  const noL=per.filter(p=>!p.S.hasLeads).map(p=>p.c.name);
  if(noL.length)msgs.push(`<b>${noL.join(', ')}:</b> no leads in the ads tracker for this period.`);
  msgs.push('Leads: from 1 November 2026, every lead in the lead list (all sources); before that, the Meta and Google ads tracker. Ratios: the cohort follows the leads registered in the period (in each day\'s column, the leads that came in that day) and counts what they did by the end of the period; overall compares the period\'s totals. Visits, appointments and fresh sales are matched by phone number or lead ID.');
  notes.innerHTML=msgs.join('<br>');
}

/* Each lead that came in during the period, followed by mobile number: when they booked, visited and paid */
function journeyDialog(P,names){
  const a=ymd(P.a),b=ymd(P.b),L=[];names.forEach(n=>{const pr=PREP[n];if(pr&&pr.leads)pr.leads.forEach(l=>{if(l.d>=a&&l.d<=b)L.push(l);});});
  L.sort((x,y)=>y.d-x.d||x.name.localeCompare(y.name));
  const F=[['all','All',()=>true],['nobook','Not booked yet',l=>!l.appt&&!l.visit&&!l.paid],['bookednv','Booked, not visited',l=>l.appt&&!l.visit&&!l.paid],['visitednp','Visited, not paid',l=>l.visit&&!l.paid],['paid','Paid',l=>l.paid]];
  let f='all';
  const d=k=>{if(!k)return'<span class="mut">—</span>';const t=fromYmd(k);return t.getDate()+' '+MON[t.getMonth()];};
  const box=document.createElement('div');box.className='jdlg';box.setAttribute('role','dialog');box.setAttribute('aria-label','Lead journey');
  const draw=()=>{const fn=F.find(x=>x[0]===f)[2],xs=L.filter(fn);
    box.innerHTML=`<div class="jc"><div class="jh"><div><h3>Lead journey</h3><p>${pl(L.length,'lead')} that came in from ${d(a)} to ${d(b)}${names.length===1?' at '+esc(names[0]):''}. Matched by mobile number across the lead list, appointments (the centre's and Futwork's), centre visits and Fresh Sales.</p></div><button type="button" class="jx" aria-label="Close">×</button></div>
      <div class="jf">${F.map(([k,l,fn2])=>`<button type="button" data-f="${k}" aria-pressed="${f===k}">${l}<span>${L.filter(fn2).length}</span></button>`).join('')}</div>
      <div class="jb"><table class="jt"><thead><tr><th>Lead came in</th><th>Name</th>${names.length>1?'<th>Centre</th>':''}<th>Mobile</th><th>Appointment</th><th>Visited</th><th>Paid</th></tr></thead><tbody>
      ${xs.map(l=>`<tr><td>${d(l.d)}</td><td><b>${esc(l.name)||'—'}</b><small>${esc(l.id)}</small></td>${names.length>1?`<td>${esc(l.centre)}</td>`:''}<td>${l.p.length===10?l.p.slice(0,5)+' '+l.p.slice(5):'—'}</td>
        <td>${l.appt?(l.apptD?'Booked '+d(l.apptD):'Booked')+(l.apptE?`<small>for ${d(l.apptE)}${l.fw?' · Futwork':''}</small>`:''):'<span class="mut">—</span>'}</td><td>${d(l.visitD)}</td><td>${d(l.paidD)}</td></tr>`).join('')||`<tr><td colspan="7" class="mut" style="padding:20px 8px">No leads here.</td></tr>`}
      </tbody></table></div></div>`;
    box.querySelector('.jx').onclick=close;box.querySelectorAll('.jf button').forEach(x=>x.onclick=()=>{f=x.dataset.f;draw();});};
  const close=()=>{box.remove();document.removeEventListener('keydown',key);},key=e=>{if(e.key==='Escape')close();};
  box.onclick=e=>{if(e.target===box)close();};document.addEventListener('keydown',key);
  draw();document.body.appendChild(box);
}
const pl=(n,w)=>n+' '+w+(n===1?'':'s');

/* ── Controls ── */
let SUMOPEN=(()=>{try{return localStorage.getItem('artium_daily_sum')==='open';}catch(e){return false;}})();
const sumbox=document.getElementById('sumbox');sumbox.classList.toggle('open',SUMOPEN);
document.getElementById('sumhead').onclick=()=>{SUMOPEN=!SUMOPEN;sumbox.classList.toggle('open',SUMOPEN);document.getElementById('sumhead').setAttribute('aria-expanded',SUMOPEN);try{localStorage.setItem('artium_daily_sum',SUMOPEN?'open':'closed');}catch(e){}};
document.getElementById('centre-toggle').innerHTML=[{name:'All',label:'All centres',city:CENTRES.length+' centres'}].concat(CENTRES.map(c=>({name:c.name,label:c.name,city:c.city})))
  .map(o=>`<button class="ct-btn" data-c="${o.name}" aria-pressed="false"><small>${o.city}</small><span>${o.label}</span></button>`).join('');
document.querySelectorAll('.ct-btn').forEach(b=>b.onclick=()=>{selCentre=b.dataset.c;try{localStorage.setItem('artium_daily_centre',selCentre);}catch(e){}render();});
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render();});
document.getElementById('prev').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--;}render();};
document.getElementById('next').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++;}render();};
['from','to'].forEach(id=>document.getElementById(id).onchange=e=>{const d=fromIso(e.target.value);if(!d)return;if(id==='from')rFrom=d;else rTo=d;if(rFrom&&rTo&&rFrom>rTo)[rFrom,rTo]=[rTo,rFrom];render();});
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{const q=b.dataset.q;rTo=new Date(now);
  if(q==='month')rFrom=new Date(now.getFullYear(),now.getMonth(),1);else rFrom=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(+q-1));render();});

async function load(){
  render();
  try{
    const [j,tg]=await Promise.all([ArtiumAuth.call('tracker',{}),ArtiumAuth.call('targets',{}).catch(()=>null)]);
    TR=j.tracker||{};TARGETS=tg&&tg.targets||{};PREP={};CENTRES.forEach(c=>PREP[c.name]=prep(c.name));loaded=true;
    const t=new Date();
    document.getElementById('updated').textContent='Updated '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('dot').className='dot';
    render();
  }catch(e){document.getElementById('updated').textContent='Error — '+e.message;document.getElementById('dot').className='dot error';}
}
load();
</script>
