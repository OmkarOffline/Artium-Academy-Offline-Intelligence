<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Centres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --display:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --bg:#F6F5F2;--border:#E4E1EA;--line:#EFEDF2;
    --ink:#1D1B22;--ink2:#3B3742;--muted:#6B6774;--faint:#9A96A3;--ghost:#B3AFBB;
    --accent:#5B2A86;--accent-soft:#F2ECF8;--gold:#A8844F;
    --ok:#1F7A4D;--ok-soft:#E5F4EC;--warn:#9A6200;--warn-soft:#FBF1DC;--bad:#B42318;--bad-soft:#FDECEB;
    --shadow:0 1px 2px rgba(31,26,36,.04),0 12px 28px -18px rgba(75,31,111,.28);
  }
  body{background:var(--bg);font-family:var(--body);color:var(--ink2);-webkit-font-smoothing:antialiased}
  .page{max-width:1600px;margin:0 auto;padding:36px 48px 64px}

  /* Header */
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:30px}
  .eyebrow{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  h1{font:600 38px/1.15 var(--display);letter-spacing:-.015em;color:var(--ink)}
  .subtitle{font-size:15px;color:var(--muted);margin-top:6px}

  /* Department toggle (same style as the centre toggle on the other pages) */
  .dept-toggle{display:flex;flex-wrap:wrap;gap:6px 4px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:8px;box-shadow:var(--shadow);margin-bottom:26px}
  .dt-btn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:0;background:none;border-radius:13px;padding:13px 18px 13px;cursor:pointer;white-space:nowrap;text-align:left;transition:background .15s}
  .dt-btn small{font:600 11.5px/1 var(--body);color:var(--gold)}
  .dt-btn span{font:600 14.5px/1.2 var(--display);color:var(--ink2)}
  .dt-btn:hover{background:var(--accent-soft)}
  .dt-btn[aria-pressed="true"]{background:var(--accent);box-shadow:0 6px 16px -8px rgba(91,42,134,.6)}
  .dt-btn[aria-pressed="true"] span{color:#fff}
  .dt-btn[aria-pressed="true"] small{color:#E9CF9E}
  .dt-btn.empty span{color:var(--faint)}
  .dt-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Department summary */
  .summary{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:14px;margin-bottom:26px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px 20px;box-shadow:inset 0 3px 0 var(--gold),var(--shadow)}
  .stat .l{font:700 10.5px/1.4 var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font:600 28px/1.2 var(--display);color:var(--ink);margin-top:8px}
  .stat .bar{height:6px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}
  .stat .bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}

  /* Folder = section tray with show/hide */
  .tray{background:linear-gradient(180deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.45) 100%);border:1px solid #E9E5EE;border-radius:28px;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 48px -36px rgba(75,31,111,.25);padding:6px 24px 20px;margin-bottom:22px}
  .tray-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 2px 12px;cursor:pointer;user-select:none}
  .tray-title{position:relative;padding-left:16px;font:600 21px/1.3 var(--display);letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:10px}
  .tray-title::before{content:"";position:absolute;left:0;top:50%;width:4px;height:22px;transform:translateY(-50%);border-radius:4px;background:linear-gradient(180deg,#C9A66B 0%,var(--gold) 100%)}
  .emoji{font-size:19px;line-height:1}
  .meta{display:flex;align-items:center;gap:10px}
  .badge{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .chev{width:32px;height:32px;border-radius:999px;background:#fff;border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;transition:transform .2s;flex:none}
  .closed>.tray-head .chev,.closed>.sub-head .chev{transform:rotate(-90deg)}
  .closed>.tray-body,.closed>.sub-body{display:none}

  /* Sub-folder inside a section */
  .sub{margin-top:10px}
  .sub-head{display:flex;align-items:center;gap:12px;padding:12px 2px 10px;cursor:pointer;user-select:none}
  .sub-title{display:flex;align-items:center;gap:8px;font:700 11.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  .sub-title .emoji{font-size:14px}
  .sub-head .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(168,132,79,.45) 0%,rgba(168,132,79,.18) 45%,rgba(168,132,79,0) 100%)}
  .sub-head .chev{width:26px;height:26px}
  .sub .sub{margin-left:18px}

  /* Initiative cards */
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:4px}
  .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px 20px 16px;box-shadow:var(--shadow)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .card h3{font:600 16px/1.35 var(--display);color:var(--ink)}
  .status{font:600 11.5px var(--body);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .status.done{color:var(--ok);background:var(--ok-soft)}
  .status.prog{color:var(--warn);background:var(--warn-soft)}
  .status.none{color:var(--muted);background:#EEEDF0}
  .prog{display:flex;align-items:center;gap:10px;margin:12px 0 14px}
  .prog .bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;border-radius:6px}
  .prog b{font:600 13px var(--display);color:var(--ink);min-width:38px;text-align:right}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
  .link{font:600 11px var(--body);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px}
  .block{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .block h4{font:700 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .block h4::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .block.ds h4{color:#5B2A86}.block.cs h4{color:#9A6200}.block.pa h4{color:#1F7A4D}
  .block ul{padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
  .block li{margin:3px 0}
  .empty-note{padding:26px 4px;color:var(--faint);font-size:14px}
  .empty-dept{background:#fff;border:1px dashed var(--border);border-radius:18px;padding:40px;text-align:center;color:var(--muted);font-size:15px}

  @media (max-width:1000px){.cards{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
  @media (max-width:640px){.page{padding:24px 16px 48px}h1{font-size:28px}.tray{padding:4px 12px 14px;border-radius:22px}.tray-title{font-size:18px}}
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <div class="eyebrow" id="eyebrow">Department</div>
      <h1>Offline Centres</h1>
      <div class="subtitle">Initiatives and progress, department by department</div>
    </div>
  </header>
  <nav class="dept-toggle" id="dept-toggle" aria-label="Department"></nav>
  <div id="content"></div>
</div>

<script>
/* Linked initiatives (shown as tags on a card) */
const DEPS={"blh": "Batch operations → Leave / Holiday intimation", "clh": "Product / Tech → Communication → Leave / Holiday intimations", "lp_clarity": "Landing pages → Clarity Recordings", "lp_design": "Landing pages → Design", "te_training": "Teacher Experience → Training (upcoming)", "ac_aiqual": "Academic Counsellor → AI-led lead qualification"};

/* Departments → folders (s / kids) → initiatives (i).
   Each initiative: n = name, pct = progress, ds = desired state, cs = current state, pa = plan ahead, rb/do = linked initiatives */
const D=[{"n": "Academics", "k": "acad", "s": [{"n": "Academic strategy", "e": "🗺️", "i": []}, {"n": "Academic operations", "e": "📚", "i": []}, {"n": "Examinations & certifications", "e": "🏅", "i": []}]}, {"n": "Customer Support", "k": "cs", "s": []}, {"n": "Finance", "k": "fin", "s": []}, {"n": "Hiring", "k": "hiring", "s": []}, {"n": "Learner Experience", "k": "le", "s": [{"n": "Performance opportunities", "e": "🎤", "kids": [{"n": "Artium Superstar", "e": "⭐", "i": [{"n": "Auditions", "pct": 100, "ds": ["Offline learners can discover and participate in Artium Superstar auditions just like their online counterparts, creating a unified and aspirational experience across all centres."], "cs": ["Offline learners can submit audition clips through the same platform as online learners. The feature is fully built and live."], "pa": []}]}, {"n": "Talent Development Programme (TDP)", "e": "🌱", "i": [{"n": "Scouting", "pct": 20, "ds": ["Every offline centre has a structured, teacher-led process to identify high-potential learners and recommend them to the TDP team for audition and selection."], "cs": ["Learners have been informally identified through the Chennai online showcase. Jaydeep is part of the TDP team and supports this process."], "pa": ["Educate offline teachers on TDP eligibility criteria and what to look for in high-potential learners.", "Build a structured pipeline for teacher-led identification and recommendation.", "TDP team to audition and evaluate recommended learners."]}]}, {"n": "Teacher Community Showcase", "e": "🎭", "i": [{"n": "Preparation", "pct": 15, "ds": ["Every learner performing in the Teacher Community Showcase is well-prepared — with the right song, consistent rehearsal check-ins, and a teacher who has the skills and experience to guide a stage-ready performance."], "cs": ["Learners dress appropriately for stage performance. However, not all teachers have stage performance experience, there is no common Artium stage performance curriculum, and song selection and rehearsal check-ins are not yet standardised."], "pa": ["Build a common Artium stage performance course to upskill teachers on guiding learners for live performance.", "Standardise song selection criteria and introduce periodic rehearsal check-ins as part of showcase preparation."]}, {"n": "Performance & feedback", "pct": 25, "ds": ["Every showcase performance is held at a premium external venue, followed by a structured feedback session that helps learners improve and parents feel proud of their child's progress."], "cs": ["Performances have been piloted at both centres. Parents have expressed a preference for external venues, citing a better atmosphere. No structured feedback mechanism or continuous improvement loop is in place yet."], "pa": ["Identify and finalise suitable external venues for future showcases.", "Design and implement a structured post-performance feedback framework for learners and parents.", "Build a continuous improvement loop to act on feedback across showcase cycles."]}]}]}, {"n": "In-class experience", "e": "🎼", "i": []}, {"n": "Out-class experience", "e": "🌟", "i": []}]}, {"n": "Marketing", "k": "mkt", "s": [{"n": "Digital marketing", "e": "📱", "kids": [{"n": "Landing pages", "e": "🖥️", "i": [{"n": "Landing to Conversion", "pct": 10, "ds": ["Artium has two high-performing landing pages — one for paid campaign traffic with a fast-loading, registration-first design, and one for organic and Google paid traffic with richer brand information — both consistently converting at 12–18%."], "cs": ["A single Webflow BAT page currently exists. It is not in a desirable state and was last updated in October 2025."], "pa": ["Build a dedicated landing page for paid campaign traffic — prioritise fastest load speed and a registration-first layout.", "Build a separate landing page for organic and Google paid traffic — include more illustrative brand information.", "Target conversion rate of 12–18% for both pages.", "Discuss next steps and timelines with the product team."]}, {"n": "Clarity Recordings", "pct": 5, "ds": ["The landing page pre-loads key information above the fold, loads at maximum speed, and guides visitors smoothly towards registration, resulting in a low bounce rate and high conversion."], "cs": ["The bounce rate on the current landing page is high. Users are clicking on maestro images expecting more information to load, which is not happening."], "pa": ["Undertake a thorough Clarity recordings study and document findings for the product team.", "Ensure key information is pre-loaded and visible on the first view without scrolling.", "Prioritise maximum page load speed as a technical requirement."]}, {"n": "Design", "pct": 10, "ds": ["The landing page fully reflects Artium's brand identity — featuring maestros, key products and services, urgency-creation elements, and a design language consistent with the online world."], "cs": ["A landing page exists but lacks desirable brand elements and does not reflect current brand guidelines."], "pa": ["Redesign the landing page to align with Artium's full brand guidelines.", "Include key products, services, maestros, and ambassadors prominently.", "Use the online world landing page as a reference.", "Incorporate urgency-creation elements.", "Conduct a competitor website study to inform the design direction."]}]}, {"n": "Meta", "e": "📣", "kids": [{"n": "Lead Generation & Analysis", "e": "📊", "i": [{"n": "Lead capturing", "pct": 60, "ds": ["Every lead generated through Meta is captured accurately, with only the most relevant fields collected, and flows seamlessly into Salesforce for immediate follow-up."], "cs": ["The Meta lead form is running successfully. CPL has been reduced to under ₹100, down from ₹400–₹500 previously. Landing page campaigns are currently paused due to poor results."], "pa": ["Resume landing page campaigns once Clarity Recordings and Design initiatives are complete.", "Ensure the Meta lead form captures only the most relevant fields to minimise bounce."], "rb": ["lp_clarity", "lp_design"]}, {"n": "Full-funnel tracking", "pct": 30, "ds": ["The marketing team has complete visibility of every lead's journey — from the moment they enter through a Meta campaign to the point they convert into a paying learner — with all key metrics tracked and visible on a single dashboard."], "cs": ["All lead information is flowing consistently into Salesforce. However, centre visits are not yet being updated by the sales operations team, making full-funnel tracking incomplete."], "pa": ["Sales operations team to begin updating centre visit data in Salesforce consistently.", "Build a full-funnel dashboard on Salesforce or Mixpanel tracking lead volume, lead-to-visit %, and visit-to-conversion %.", "Ensure campaign name, ad-set name, and creative name are captured per lead for attribution."]}, {"n": "Channel-wise ROAS", "pct": 0, "ds": ["The marketing team can view the Return on Ad Spend (ROAS) for every Meta campaign and channel directly on Salesforce, enabling data-driven budget allocation."], "cs": ["Channel-wise ROAS tracking has not yet been set up. Salesforce does not currently reflect payment data or marketing spend."], "pa": ["Discuss implementation approach with the product team.", "Configure Salesforce to reflect payments received from each paying customer.", "Capture marketing budget spend on Salesforce to enable ROAS calculation.", "Make Meta channel-wise ROAS visible directly on the Salesforce dashboard."]}]}]}, {"n": "Google", "e": "🔍", "kids": [{"n": "Google My Business Profile", "e": "📍", "i": [{"n": "Profile optimisation standards", "pct": 40, "ds": ["Every Artium offline centre has a fully optimised Google My Business profile, built to a consistent standard — with all fields completed, photos and videos uploaded, testimonials collected, and the right keywords in place to maximise discoverability."], "cs": ["The Google My Business profiles for existing centres are fully optimised. However, a formal standard checklist that can be replicated for new centres does not yet exist."], "pa": ["Request the standard optimisation checklist from the Google expert in the marketing team.", "Ensure the checklist covers all fields — photos, videos, testimonials, brand videos, and ideal keywords.", "Use the checklist as the go-to reference whenever a new centre is onboarded."]}]}]}]}, {"n": "BTL marketing", "e": "🎪", "i": [{"n": "Lamp Posts", "pct": 20, "ds": ["Artium partners with a marketing agency to execute lamp-post campaigns that improve brand visibility around each centre.", "Strategic locations are identified based on learner demographics, traffic patterns, and local catchment areas to maximise reach.", "Campaigns are executed for a predefined duration, and their impact is measured using clearly defined success metrics such as lead registrations, centre visits, or admissions.", "The findings are used to refine future campaigns and improve return on investment."], "cs": ["Conducted a pilot lamp-post campaign for the Alwarpet centre.", "The campaign did not generate the expected business outcomes."], "pa": ["Identify and partner with a marketing agency that can recommend high-impact lamp-post locations based on local market insights.", "Define campaign success metrics and the observation period before launching future campaigns.", "Run the next pilot using the revised location strategy and evaluate its performance before scaling to other centres."]}, {"n": "Pamphlet Distribution", "pct": 100, "ds": ["Pamphlet distribution campaigns are executed at strategically selected locations around every centre, including high-footfall areas, residential communities, educational institutions, and commercial establishments.", "Distribution partners are identified based on reach, reliability, and cost-effectiveness while remaining within the allocated budget.", "Every pamphlet includes a QR code to enable end-to-end tracking of campaign performance.", "The initiative consistently improves brand awareness and drives lead registrations, centre visits, and admissions."], "cs": ["Conducted multiple pamphlet distribution campaigns across centres.", "Identified relevant locations, facilities, and high-footfall areas for every centre.", "Partnered with distribution agencies within the allocated budget.", "Every pamphlet includes a QR code to track campaign performance.", "Previous campaigns have delivered strong results in terms of brand awareness, lead generation, and conversions."], "pa": []}]}]}, {"n": "Operations", "k": "ops", "s": [{"n": "Batch operations", "e": "📅", "i": [{"n": "Calendar view of all batches", "pct": 85, "ds": ["Centre heads and teachers have a clear, real-time calendar view of all batches across the centre — filterable by teacher, course, and age group — with the ability to manage students, create or delete batches, and transfer students seamlessly."], "cs": ["A full calendar view across all teachers is available, with filtered views by teacher, course, and age group. Centre heads can click into any batch to view, add, or remove students, create and delete batches, and transfer students one-by-one between batches and teachers."], "pa": ["Build bulk transfer functionality for students — critical for scenarios where a teacher resigns and an entire batch needs to be reassigned.", "Make the calendar view accessible on the teacher dashboard as well."]}, {"n": "Onboarding form for new joinees", "pct": 15, "ds": ["Every new learner joining an Artium offline centre completes a structured onboarding form that captures all relevant information and automatically populates their learner profile, making it accessible to teachers, centre heads, and the operations team from day one."], "cs": ["The form fields and questions have been designed and finalised. The feature has not yet been picked up by the product team."], "pa": ["Product team to pick up and build the onboarding form.", "Set up the link sharing and tablet handoff flow for in-centre use.", "Map submitted form data directly to the student's backend profile.", "Make the profile accessible to all relevant stakeholders."]}, {"n": "Leave intimation / Skip class", "pct": 0, "ds": ["Learners can skip a class with a single tap up to one hour before it begins, with automatic notifications sent to the teacher and admin so they can plan accordingly."], "cs": ["This feature has not yet been proposed or discussed with the product team."], "pa": ["Propose the feature to the product team and align on scope and design.", "Build the skip class option with a cut-off of one hour before class time.", "Set up automatic notifications to the teacher and admin upon a learner skipping a class."]}, {"n": "Attendance tracking", "pct": 20, "ds": ["Attendance is marked digitally by teachers, reflects in real time on the backend, and is visible to admins, teachers, and learners — with full support for guest students, compensation classes, and membership deductions where applicable."], "cs": ["Attendance marking has been built on the teacher's Android tablet with a batch-wise marking flow. However, it does not yet reflect on the backend, and admin and teacher views have not been built. The feature is not in a usable state — no data is visible to any stakeholder."], "pa": ["Connect the attendance marking flow to the backend so data reflects in real time.", "Build admin and teacher views for attendance data.", "Implement notifications, guest student tracking, the 24-hour challenge window, membership deduction logic, and the compensation class flow."]}, {"n": "Leave / Holiday intimation", "pct": 0, "ds": ["Whenever a teacher takes leave or a centre observes a holiday, all affected learners and their parents receive a clear, timely notification with exact dates, timings, and the resumption date — so no one is caught off guard."], "cs": ["This feature has not yet been discussed with the product team."], "pa": ["Discuss the feature with the product team and align on scope.", "Build a flow for centre heads to log teacher leave or centre-wide holidays.", "For centre-wide holidays: notify admin, all teachers, and all learners.", "For teacher leave: notify admin and that teacher's learners only.", "Allow selection of exact leave and resumption dates.", "Set up standard, editable message templates for notifications."], "rb": ["clh"]}]}, {"n": "Sales operations", "e": "💰", "kids": [{"n": "Pre-Purchase", "e": "🎯", "kids": [{"n": "Academic Counsellor", "e": "🧑‍💼", "i": [{"n": "Lead visibility", "pct": 100, "ds": ["Every lead generated across all channels is captured in a single platform, giving the academic counselling team complete, real-time visibility to act quickly and consistently."], "cs": ["All leads from Instagram, Facebook, Google Search, Google My Business, JustDial, and organic Google are captured and flow into Salesforce for single-platform visibility."], "pa": []}, {"n": "AI-led lead qualification", "pct": 80, "ds": ["An AI bot automatically calls every new lead on registration, qualifies them using a pre-defined script, and shares a structured summary with the team — so academic counsellors spend their time only on the most interested and relevant leads."], "cs": ["The script for the AI bot has been drafted and successfully tested. A few final steps remain before the bot goes live."], "pa": ["Complete the remaining steps to take the bot live.", "Configure the bot to auto-call leads on registration using the pre-fabricated script.", "Set up retry logic for no-connect scenarios as per agreed rules.", "On connect: share a structured call summary in the dedicated Slack group per centre.", "Configure the bot to send WhatsApp or email with trial class information after a successful call.", "Enable academic counsellors to follow up directly with AI-qualified leads."]}, {"n": "Follow-up & Nurturing", "pct": 35, "ds": ["A dedicated bot nurtures every lead who has expressed interest in visiting a centre — sharing relevant information based ive structure that rewards both the volume and value of renewals, as well as the reactivation of lapsed memberships."], "cs": ["The incentive structure is fully designed and implemented. It rewards centre heads for the volume of renewals, the value of renewal collections, and for reactivating overdue and inactive memberships from previous months. The north star metric is Renewal Collection Efficiency %."], "pa": []}, {"n": "Conversion incentive", "pct": 95, "ds": ["Academic counsellors are driven to maximise the number of admissions through a structured incentive that rewards both volume and value of fresh sales, making every centre visit a motivated conversion opportunity."], "cs": ["The incentive structure is fully designed and implemented. It rewards academic counsellors for the volume of admissions and the value of fresh sale collections. The north star metric is number of admissions."], "pa": ["Contemplate whether to add an additional incentive for reactivating prospects who visited the centre in a previous month but did not convert."]}, {"n": "Birthday gifts / rewards", "pct": 15, "ds": ["Every offline employee receives a warm birthday wish over email with their manager looped in, along with an Amazon gift card worth ₹1,000 — making them feel valued and appreciated on their special day."], "cs": ["This practice is currently live for online employees and teachers. It has not yet been extended to offline employees."], "pa": ["Propose the initiative to management for offline employees.", "HR to log birthdays of all offline employees in the system.", "On each birthday, send a warm email with the manager looped in.", "Share an Amazon gift card worth ₹1,000 with the employee."]}, {"n": "R&R Ceremony", "pct": 10, "ds": ["Offline employees have a clearly defined R&R policy with transparent KPIs, award categories, and evaluation criteria — motivating them to excel, compete, and take pride in being recognised at a dedicated ceremony."], "cs": ["Offline employees are currently included in the central R&R for online employees held during the townhall meeting. With only four sales operations employees recognised so far, the process feels more like a formality than a genuine meritocratic selection."], "pa": ["Define recognition criteria for all offline employee roles beyond sales operations.", "Identify how to evaluate business impact and other contribution types to build a comprehensive R&R policy.", "Develop a clear policy covering calculation methods, award categories, and reward structures.", "Design a ceremony format that feels meaningful and aspirational for offline employees."]}]}]}]}, {"n": "Product / Tech", "k": "pt", "s": [{"n": "Academics", "e": "🎓", "i": [{"n": "Curriculum view", "pct": 100, "ds": ["Every offline learner has a clear, structured view of their full curriculum — with notes and resources for completed topics and upcoming classes — giving them a sense of direction and progress throughout their musical journey."], "cs": ["The full curriculum view for each course and level is live. Notes and resources for completed topics and upcoming classes are accessible to learners."], "pa": []}, {"n": "Topic-wise checklist", "pct": 10, "ds": ["Learners can track their progress topic by topic within each course level — marking topics as understood, challenging their teacher's assessment if needed, and self-rating their grasp of each topic — creating a transparent and collaborative learning record."], "cs": ["This feature is available in the online world. It has not yet been discussed for the offline world."], "pa": ["Initiate discussion with the product team for the offline world.", "Build a topic list view per course level accessible to learners.", "Enable teachers to mark topics as complete.", "Allow learners to challenge incorrectly marked topics.", "Let learners assign an understanding percentage per topic via a slider or input field."]}, {"n": "Practice Tab", "pct": 5, "ds": ["Teachers can record and assign custom practi n unified."], "pa": ["Link leave penalties to the payout system.", "Share the handbook with the L&D team.", "Unify language and tonality across all sections.", "Draft eight additional sections: in-class experience best practices, classroom management best practices, learner and parent relationship management, trial conversion best practices, renewals best practices, peer and management relationship best practices, conflict management best practices, and refund prevention best practices."]}, {"n": "Alignment with HR and L&D Teams", "pct": 0, "ds": ["HR and L&D teams are fully aligned with the teacher handbook and underlying policies — equipped to recommend remedial or punitive action for lapses and actively driving discipline and consistency across all offline centres."], "cs": ["Formal alignment between HR, L&D, and the offline operations team has not yet taken place."], "pa": ["Initiate a formal alignment discussion with the HR and L&D teams.", "Walk them through the handbook and all underlying policies in detail.", "Define a process for HR and L&D to recommend remedial or punitive action for policy lapses.", "Formalise a discipline management process for offline teachers."]}, {"n": "Disciplinary monitoring & feedback", "pct": 20, "ds": ["Centre heads have a clear, data-backed process to monitor teacher punctuality, class start times, and adherence to working hours — with timely feedback given to teachers and escalations handled through HR when needed."], "cs": ["Teachers currently inform their centre head before taking breaks, and centre heads communicate efficiently with learners when breaks occur. Biometric data has been requested from HR but has not yet been shared."], "pa": ["Follow up with HR to receive biometric entry and exit data for June 2026.", "Analyse entry and exit timings to assess teacher punctuality and adherence to working hours.", "Build a process for centre heads to monitor class start times on a daily basis.", "Establish a feedback mechanism for centre heads to address punctuality and conduct issues with teachers."]}]}]}, {"n": "Wellbeing", "e": "🌿", "kids": [{"n": "Rewards & Recognition", "e": "🏆", "i": [{"n": "Renewal incentive", "pct": 80, "ds": ["Teachers are motivated to invest in learner retention through a structured incentive that rewards them for renewals — with higher rewards for longer-duration packages — driving a culture of genuine care for learner progress."], "cs": ["The incentive structure is designed and implemented. Teachers are rewarded for renewing learners, with higher incentives for longer-duration packages."], "pa": ["Train teachers on how to nurture learners effectively to improve renewal outcomes.", "Include renewal skills in the upcoming teacher training programme."], "rb": ["te_training"]}, {"n": "Teacher R&R Ceremony", "pct": 65, "ds": ["Teachers are fully aware of their KPIs and the award categories linked to them — motivated to compete, excel, and take pride in winning a trophy that is celebrated on Artium's social media and their own handles."], "cs": ["The R&R ceremony is calendarised to the 2nd Tuesday of every month at 1 PM. Award categories have been expanded to appreciate teachers more fairly. The ceremony is conducted virtually on Zoom or Google Meet, with offline formats planned when the opportunity arises."], "pa": ["Place the trophy order with the shortlisted vendor.", "Ensure all teachers are clearly aware of their KPIs and how they map to award categories.", "Post winner pictures on Artium's social media after every ceremony.", "Encourage winners to re-share the post on their personal handles."]}, {"n": "Birthday gifts / rewards", "pct": 15, "ds": ["Every offline teacher receives a warm birthday wish over email with their manager looped in, along with an Amazon gift card worth ₹1,000 — making them feel valued and appreciated on their special day."], "cs": ["This practice is currently live for online employees and teachers. It has not yet been extended to offline teachers."], "pa": ["Propose the initiative to management for offline teachers.", "HR to log birthdays of all offline teachers.", "On each birthday, send a warm email with the manager looped in.", "Share an Amazon gift card worth ₹1,000 with the teacher."]}]}, {"n": "Health", "e": "❤️", "i": [{"n": "Medical Insurance", "pct": 10, "ds": ["Every offline teacher is covered under a comprehensive medical insurance plan — with slightly higher cover than regular employees — making Artium a more attractive and caring employer."], "cs": ["An initial inquiry has been completed with insurer Plum. No further steps have been taken yet."], "pa": ["Share the list of offline teachers with relevant details with Plum.", "Receive and review the quotation from Plum.", "Discuss the proposal with management and seek approval.", "Make necessary adjustments to teacher CTCs if required.", "Execute the medical insurance plan for all offline teachers."]}]}]}]}];

const chevron='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function allInits(node){return (node.i||[]).concat(...(node.kids||node.s||[]).map(allInits));}
const avg=arr=>arr.length?Math.round(arr.reduce((s,x)=>s+(x.pct||0),0)/arr.length):0;
const colour=p=>p>=100?'#1F7A4D':p>=60?'#5B2A86':p>=30?'#A8844F':'#B42318';
const status=p=>p>=100?['done','Complete']:p>0?['prog','In progress']:['none','Not started'];

function card(x){
  const p=x.pct||0,[sc,st]=status(p);
  const links=(x.rb||[]).concat(x.do||[]).map(id=>`<span class="link">${esc(DEPS[id]||id)}</span>`).join('');
  const block=(k,label)=>x[k]&&x[k].length?`<div class="block ${k}"><h4>${label}</h4><ul>${x[k].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:'';
  return`<article class="card">
    <div class="card-top"><h3>${esc(x.n)}</h3><span class="status ${sc}">${st}</span></div>
    <div class="prog"><div class="bar"><i style="width:${p}%;background:${colour(p)}"></i></div><b>${p}%</b></div>
    ${links?`<div class="links">${links}</div>`:''}
    ${block('ds','Desired state')}${block('cs','Current state')}${block('pa','Plan ahead')}
  </article>`;
}
let uid=0;
function folderBody(f,depth){
  const items=f.i||[],kids=f.kids||[];
  let h=items.length?`<div class="cards">${items.map(card).join('')}</div>`:'';
  h+=kids.map(k=>{const all=allInits(k);return`<div class="sub" id="f${++uid}">
    <div class="sub-head" onclick="this.parentNode.classList.toggle('closed')"><span class="sub-title"><span class="emoji">${k.e||''}</span>${esc(k.n)}</span><span class="rule"></span><span class="badge">${all.length} · ${avg(all)}%</span><span class="chev">${chevron}</span></div>
    <div class="sub-body">${folderBody(k,depth+1)}</div></div>`;}).join('');
  if(!items.length&&!kids.length)h='<div class="empty-note">No initiatives added yet.</div>';
  return h;
}
function render(){
  const d=D.find(x=>x.k===sel)||D[0];
  document.querySelectorAll('.dt-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===d.k));
  document.getElementById('eyebrow').textContent=d.n;
  const all=allInits(d),done=all.filter(x=>x.pct>=100).length,none=all.filter(x=>!x.pct).length;
  let h='';
  if(!all.length&&!(d.s||[]).length){document.getElementById('content').innerHTML='<div class="empty-dept">No initiatives have been added for '+esc(d.n)+' yet.</div>';return;}
  h+=`<div class="summary">
    <div class="stat"><div class="l">Overall progress</div><div class="v">${avg(all)}%</div><div class="bar"><i style="width:${avg(all)}%"></i></div></div>
    <div class="stat"><div class="l">Initiatives</div><div class="v">${all.length}</div></div>
    <div class="stat"><div class="l">Complete</div><div class="v">${done}</div></div>
    <div class="stat"><div class="l">In progress · Not started</div><div class="v">${all.length-done-none} · ${none}</div></div>
  </div>`;
  h+=(d.s||[]).map(f=>{const a=allInits(f);return`<section class="tray" id="f${++uid}">
    <div class="tray-head" onclick="this.parentNode.classList.toggle('closed')"><div class="tray-title"><span class="emoji">${f.e||''}</span>${esc(f.n)}</div>
      <div class="meta"><span class="badge">${a.length} initiative${a.length===1?'':'s'} · ${avg(a)}%</span><span class="chev">${chevron}</span></div></div>
    <div class="tray-body">${folderBody(f,0)}</div></section>`;}).join('');
  document.getElementById('content').innerHTML=h;
}
let sel=(()=>{try{const v=localStorage.getItem('artium_dept');return D.some(d=>d.k===v)?v:(D.find(d=>allInits(d).length)||D[0]).k;}catch(e){return D[0].k;}})();
document.getElementById('dept-toggle').innerHTML=D.map(d=>{const a=allInits(d);return`<button class="dt-btn${a.length?'':' empty'}" data-k="${d.k}" aria-pressed="false"><span>${esc(d.n)}</span><small>${a.length?avg(a)+'% · '+a.length+' initiative'+(a.length===1?'':'s'):'Nothing added yet'}</small></button>`;}).join('');
document.querySelectorAll('.dt-btn').forEach(b=>b.onclick=()=>{sel=b.dataset.k;try{localStorage.setItem('artium_dept',sel);}catch(e){}render();});
render();
</script>
