<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Centres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --display:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --bg:#F6F5F2;--border:#E4E1EA;--line:#EFEDF2;
    --ink:#1D1B22;--ink2:#3B3742;--muted:#6B6774;--faint:#9A96A3;--ghost:#B3AFBB;
    --accent:#5B2A86;--accent-soft:#F2ECF8;--gold:#A8844F;
    --ok:#1F7A4D;--ok-soft:#E5F4EC;--warn:#9A6200;--warn-soft:#FBF1DC;--bad:#B42318;--bad-soft:#FDECEB;
    --shadow:0 1px 2px rgba(31,26,36,.04),0 12px 28px -18px rgba(75,31,111,.28);
  }
  body{background:var(--bg);font-family:var(--body);color:var(--ink2);-webkit-font-smoothing:antialiased}
  .page{max-width:1600px;margin:0 auto;padding:36px 48px 64px}

  /* Header */
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:30px}
  .eyebrow{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  h1{font:600 38px/1.15 var(--display);letter-spacing:-.015em;color:var(--ink)}
  .subtitle{font-size:15px;color:var(--muted);margin-top:6px}

  /* Department toggle (same style as the centre toggle on the other pages) */
  .dept-toggle{display:flex;flex-wrap:wrap;gap:6px 4px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:8px;box-shadow:var(--shadow);margin-bottom:26px}
  .dt-btn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:0;background:none;border-radius:13px;padding:13px 18px 13px;cursor:pointer;white-space:nowrap;text-align:left;transition:background .15s}
  .dt-btn small{font:600 11.5px/1 var(--body);color:var(--gold)}
  .dt-btn span{font:600 14.5px/1.2 var(--display);color:var(--ink2)}
  .dt-btn:hover{background:var(--accent-soft)}
  .dt-btn[aria-pressed="true"]{background:var(--accent);box-shadow:0 6px 16px -8px rgba(91,42,134,.6)}
  .dt-btn[aria-pressed="true"] span{color:#fff}
  .dt-btn[aria-pressed="true"] small{color:#E9CF9E}
  .dt-btn.empty span{color:var(--faint)}
  .dt-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Department summary strip */
  .strip{display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:inset 0 3px 0 var(--gold),var(--shadow);margin-bottom:26px;padding:16px 8px}
  .strip>div{display:flex;align-items:center;gap:10px;padding:2px 24px;border-left:1px solid var(--line);white-space:nowrap}
  .strip>div:first-child{border-left:0}
  .strip .s-prog{flex:1;min-width:260px}
  .strip .s-prog .bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-left:6px}
  .strip .s-prog .bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
  .strip b{font:600 22px/1 var(--display);color:var(--ink)}
  .s-l{font:700 10.5px/1 var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .s-dot{width:9px;height:9px;border-radius:50%}
  .s-dot.done{background:var(--ok)}.s-dot.prog{background:#D9A23A}.s-dot.none{background:#C9C5CF}
  @media (max-width:900px){.strip{flex-wrap:wrap;row-gap:12px}.strip .s-prog{flex-basis:100%;border-left:0}.strip>div:nth-child(2){border-left:0}}
  /* Department summary */
  .summary{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:14px;margin-bottom:26px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px 20px;box-shadow:inset 0 3px 0 var(--gold),var(--shadow)}
  .stat .l{font:700 10.5px/1.4 var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font:600 28px/1.2 var(--display);color:var(--ink);margin-top:8px}
  .stat .bar{height:6px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}
  .stat .bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}

  /* Folder = section tray with show/hide */
  .tray{background:linear-gradient(180deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.45) 100%);border:1px solid #E9E5EE;border-radius:28px;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 48px -36px rgba(75,31,111,.25);padding:6px 24px 20px;margin-bottom:22px}
  .tray-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 2px 12px;cursor:pointer;user-select:none}
  .tray-title{position:relative;padding-left:16px;font:600 21px/1.3 var(--display);letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:10px}
  .tray-title::before{content:"";position:absolute;left:0;top:50%;width:4px;height:22px;transform:translateY(-50%);border-radius:4px;background:linear-gradient(180deg,#C9A66B 0%,var(--gold) 100%)}
  .emoji{font-size:19px;line-height:1}
  .meta{display:flex;align-items:center;gap:10px}
  .badge{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .chev{width:32px;height:32px;border-radius:999px;background:#fff;border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;transition:transform .2s;flex:none}
  .closed>.tray-head .chev,.closed>.sub-head .chev{transform:rotate(-90deg)}
  .closed>.tray-body,.closed>.sub-body{display:none}

  /* Sub-folder inside a section */
  .sub{margin-top:10px}
  .sub-head{display:flex;align-items:center;gap:12px;padding:12px 2px 10px;cursor:pointer;user-select:none}
  .sub-title{display:flex;align-items:center;gap:8px;font:700 11.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  .sub-title .emoji{font-size:14px}
  .sub-head .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(168,132,79,.45) 0%,rgba(168,132,79,.18) 45%,rgba(168,132,79,0) 100%)}
  .sub-head .chev{width:26px;height:26px}
  .sub .sub{margin-left:18px}

  /* Initiative cards */
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:4px}
  .cards{align-items:start}
  .card-body{display:none}
  .card.open .card-body{display:block}
  .card .prog{margin-bottom:2px}
  .card.open .prog{margin-bottom:14px}
  .card-chev{width:30px;height:30px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .2s;flex:none}
  .card-chev:hover{background:var(--accent-soft);color:var(--accent)}
  .card.open .card-chev{transform:rotate(180deg)}
  .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px 20px 16px;box-shadow:var(--shadow)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card h3{font:600 16px/1.35 var(--display);color:var(--ink)}
  .status{font:600 11.5px var(--body);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .status.done{color:var(--ok);background:var(--ok-soft)}
  .status.prog{color:var(--warn);background:var(--warn-soft)}
  .status.none{color:var(--muted);background:#EEEDF0}
  .prog{display:flex;align-items:center;gap:10px;margin:12px 0 14px}
  .prog .bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .prog .bar i{display:block;height:100%;border-radius:6px}
  .prog b{font:600 13px var(--display);color:var(--ink);min-width:38px;text-align:right}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
  .link{font:600 11px var(--body);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px}
  .block{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .block h4{font:700 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .block h4::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .block.ds h4{color:#5B2A86}.block.cs h4{color:#9A6200}.block.pa h4{color:#1F7A4D}
  .block ul{padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
  .block li{margin:3px 0}
  .empty-note{padding:26px 4px;color:var(--faint);font-size:14px}
  .empty-dept{background:#fff;border:1px dashed var(--border);border-radius:18px;padding:40px;text-align:center;color:var(--muted);font-size:15px}

  .head-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .updated{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .dot.loading{background:var(--gold);animation:pulse 1s infinite}
  .dot.error{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}
  .btn-primary{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 14px var(--display);cursor:pointer}
  .btn-primary:hover{background:#4C2272}
  .btn-primary:disabled,.btn-claude:disabled{opacity:.55;cursor:default}
  .btn-ghost{height:42px;padding:0 16px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--ink2);font:600 14px var(--display);cursor:pointer}
  .btn-link{border:0;background:none;color:var(--accent);font:600 13.5px var(--body);cursor:pointer;padding:0}
  .rec-card{background:var(--accent-soft);border:1px solid #E0D4EE;border-radius:18px;padding:22px 24px}
  .rec-l{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .rec-v{font:600 46px/1.1 var(--display);color:var(--accent);margin:10px 0 12px}
  .rec-card .bar{height:8px;border-radius:8px;background:#fff;overflow:hidden}
  .rec-card .bar i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .4s}
  .rec-why{margin-top:14px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
  .own{display:flex;align-items:flex-end;gap:14px}
  .own[hidden]{display:none}
  .own-note{font-size:13px;color:var(--muted);padding-bottom:12px}
  .edit-btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px var(--body);color:var(--accent);cursor:pointer;white-space:nowrap}
  .edit-btn:hover{background:var(--accent-soft)}
  .card-top .r{display:flex;align-items:center;gap:6px}
  .by{margin-top:10px;font-size:11.5px;color:var(--faint)}
  .modal-bg{position:fixed;inset:0;z-index:20;background:rgba(29,27,34,.42);display:grid;place-items:center;padding:20px}
  .modal-bg[hidden]{display:none}
  .modal{width:100%;max-width:760px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:#fff;border-radius:22px;box-shadow:inset 0 3px 0 var(--gold),0 30px 60px -20px rgba(29,27,34,.45)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 8px}
  .modal-head h2{font:600 20px var(--display);color:var(--ink)}
  .x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer}
  .modal-body{padding:8px 24px 8px;overflow:auto;display:flex;flex-direction:column;gap:14px}
  .modal-body label{display:flex;flex-direction:column;gap:6px;font:600 12px var(--body);color:var(--ink2);flex:1}
  .modal-body label.narrow{flex:0 0 120px}
  .row2{display:flex;gap:14px}
  .row2[hidden]{display:none}
  .modal-body input,.modal-body select,.modal-body textarea{border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:10px 12px;font:400 14px/1.5 var(--body);color:var(--ink);width:100%}
  .modal-body input,.modal-body select{height:42px;padding-top:0;padding-bottom:0}
  .modal-body textarea{resize:vertical}
  .modal-body :is(input,select,textarea):focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,42,134,.12);background:#fff}
  .pct-in{display:flex;align-items:center;gap:6px}
  .pct-in b{font:600 14px var(--display);color:var(--muted)}
  .ed-msg{min-height:18px;font-size:13px;color:var(--muted)}
  .ed-msg.err{color:var(--bad)}
  .modal-foot{display:flex;align-items:center;gap:10px;padding:14px 24px 20px;border-top:1px solid var(--line)}
  .modal-foot .sp{flex:1}
  .modal-foot[hidden],.modal-body[hidden]{display:none}
  @media (max-width:1000px){.cards{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
  @media (max-width:640px){.page{padding:24px 16px 48px}h1{font-size:28px}.tray{padding:4px 12px 14px;border-radius:22px}.tray-title{font-size:18px}}
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <div class="eyebrow" id="eyebrow">Department</div>
      <h1>Offline Centres</h1>
      <div class="subtitle">Initiatives and progress, department by department</div>
    </div>
    <div class="head-right">
      <div class="updated"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div>
      <button class="btn-primary" id="add-btn" type="button" hidden onclick="openEditor()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add initiative</button>
    </div>
  </header>
  <nav class="dept-toggle" id="dept-toggle" aria-label="Department"></nav>
  <div id="content"></div>
</div>

<!-- Add / Edit initiative -->
<div class="modal-bg" id="editor" hidden>
  <div class="modal" role="dialog" aria-labelledby="ed-title">
    <div class="modal-head"><h2 id="ed-title">Add initiative</h2><button class="x" type="button" onclick="closeEditor()" aria-label="Close">×</button></div>
    <div class="modal-body">
      <div class="row2">
        <label>Department<select id="ed-dept" onchange="fillFolders()"></select></label>
        <label>Folder<select id="ed-folder" onchange="toggleNewFolder()"></select></label>
      </div>
      <div class="row2" id="ed-newfolder" hidden>
        <label>New folder name<input id="ed-nf-name" placeholder="e.g. Referral programme"></label>
        <label class="narrow">Emoji<input id="ed-nf-emoji" placeholder="📁" maxlength="4"></label>
      </div>
      <label>Initiative<input id="ed-name" placeholder="Short name, e.g. Lamp Posts"></label>
      <label>Desired state<textarea id="ed-ds" rows="4" placeholder="Where we want to be. Rough notes are fine — one point per line."></textarea></label>
      <label>Current state<textarea id="ed-cs" rows="4" placeholder="Where things stand today."></textarea></label>
      <label>Plan ahead<textarea id="ed-pa" rows="4" placeholder="Next steps, one per line."></textarea></label>
      <div class="ed-msg" id="ed-msg"></div>
    </div>
    <!-- Step 2: recommended completion % -->
    <div class="modal-body rec" id="ed-review" hidden>
      <div class="rec-card">
        <div class="rec-l">Recommended completion</div>
        <div class="rec-v"><span id="rec-pct">0</span>%</div>
        <div class="bar"><i id="rec-bar"></i></div>
        <p class="rec-why" id="rec-why"></p>
      </div>
      <div class="own" id="own" hidden>
        <label class="narrow">Your completion %<span class="pct-in"><input id="own-pct" type="number" min="0" max="100" step="5"><b>%</b></span></label>
        <span class="own-note" id="own-note"></span>
      </div>
      <div class="ed-msg" id="rv-msg"></div>
    </div>
    <div class="modal-foot" id="foot-edit">
      <span class="sp"></span>
      <button class="btn-ghost" type="button" onclick="closeEditor()">Cancel</button>
      <button class="btn-primary" type="button" id="ed-save" onclick="reviewDraft()">Save</button>
    </div>
    <div class="modal-foot" id="foot-review" hidden>
      <button class="btn-link" type="button" onclick="backToEdit()">← Back to edit</button>
      <span class="sp"></span>
      <button class="btn-ghost" type="button" id="rv-reject" onclick="rejectRec()">Reject</button>
      <button class="btn-primary" type="button" id="rv-approve" onclick="publish(true)">Approve &amp; publish</button>
    </div>
  </div>
</div>

<script>
/* Initiatives come from the "Offline Centres – Initiatives" Google Sheet through the data service (see auth.js).
   Departments → folders (paths like "Digital marketing › Meta") → initiatives. */
let DATA=null,D=[],DEPS={},CAN_EDIT=false;

const chevron='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function allInits(node){return (node.i||[]).concat(...(node.kids||node.s||[]).map(allInits));}
const avg=arr=>arr.length?Math.round(arr.reduce((s,x)=>s+(x.pct||0),0)/arr.length):0;
const colour=p=>p>=100?'#1F7A4D':p>=60?'#5B2A86':p>=30?'#A8844F':'#B42318';
const status=p=>p>=100?['done','Complete']:p>0?['prog','In progress']:['none','Not started'];

/* Turn the sheet's flat lists into departments → folder tree */
function buildTree(){
  D=DATA.departments.map(d=>{
    const nodes={},top=[];
    DATA.folders.filter(f=>f.k===d.k).forEach(f=>{
      const n={n:f.path.split(' › ').pop(),e:f.e,path:f.path,i:[],kids:[]};nodes[f.path]=n;
      const parent=f.path.split(' › ').slice(0,-1).join(' › ');
      (parent&&nodes[parent]?nodes[parent].kids:top).push(n);
    });
    DATA.initiatives.filter(x=>x.k===d.k).forEach(x=>{
      if(!nodes[x.path]){const n={n:x.path.split(' › ').pop(),e:'📁',path:x.path,i:[],kids:[]};nodes[x.path]=n;top.push(n);}
      nodes[x.path].i.push(x);
    });
    return{k:d.k,n:d.n,s:top};
  });
  DEPS=DATA.links||{};
}

function card(x){
  const p=x.pct||0,[sc,st]=status(p);
  const links=(x.rb||[]).concat(x.do||[]).map(id=>`<span class="link">${esc(DEPS[id]||id)}</span>`).join('');
  const block=(k,label)=>x[k]&&x[k].length?`<div class="block ${k}"><h4>${label}</h4><ul>${x[k].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:'';
  const isOpen=openCards.has(x.id);
  return`<article class="card${isOpen?' open':''}" data-id="${x.id}">
    <div class="card-top"><h3>${esc(x.n)}</h3><div class="r"><span class="status ${sc}">${st}</span>${CAN_EDIT?`<button class="edit-btn" type="button" onclick="openEditor('${x.id}')">Edit</button>`:''}
      <button class="card-chev" type="button" aria-expanded="${isOpen}" aria-label="Show details" onclick="toggleCard(this)">${chevron}</button></div></div>
    <div class="prog"><div class="bar"><i style="width:${p}%;background:${colour(p)}"></i></div><b>${p}%</b></div>
    <div class="card-body">
      ${links?`<div class="links">${links}</div>`:''}
      ${block('ds','Desired state')}${block('cs','Current state')}${block('pa','Plan ahead')}
      ${x.at?`<div class="by">Updated ${esc(x.at)}</div>`:''}
    </div>
  </article>`;
}
let uid=0;
const openCards=new Set();   // cards you've opened stay open while you work
function toggleCard(btn){const c=btn.closest('.card'),o=!c.classList.contains('open');c.classList.toggle('open',o);btn.setAttribute('aria-expanded',o);o?openCards.add(c.dataset.id):openCards.delete(c.dataset.id);}
const open={};   // remembers which sections are closed while you work
function folderBody(f){
  const items=f.i||[],kids=f.kids||[];
  let h=items.length?`<div class="cards">${items.map(card).join('')}</div>`:'';
  h+=kids.map(k=>{const all=allInits(k);return`<div class="sub${open[k.path]===false?' closed':''}" data-path="${esc(k.path)}">
    <div class="sub-head" onclick="toggleFolder(this)"><span class="sub-title"><span class="emoji">${k.e||''}</span>${esc(k.n)}</span><span class="rule"></span><span class="badge">${all.length} · ${avg(all)}%</span><span class="chev">${chevron}</span></div>
    <div class="sub-body">${folderBody(k)}</div></div>`;}).join('');
  if(!items.length&&!kids.length)h='<div class="empty-note">No initiatives added yet.</div>';
  return h;
}
function toggleFolder(head){const el=head.parentNode;el.classList.toggle('closed');open[el.dataset.path]=!el.classList.contains('closed');}
function buildToggle(){
  document.getElementById('dept-toggle').innerHTML=D.map(d=>{const a=allInits(d);return`<button class="dt-btn${a.length?'':' empty'}" data-k="${d.k}" aria-pressed="false"><span>${esc(d.n)}</span><small>${a.length?avg(a)+'% · '+a.length+' initiative'+(a.length===1?'':'s'):'Nothing added yet'}</small></button>`;}).join('');
  document.querySelectorAll('.dt-btn').forEach(b=>b.onclick=()=>{sel=b.dataset.k;try{localStorage.setItem('artium_dept',sel);}catch(e){}render();});
}
function render(){
  if(!D.length)return;
  const d=D.find(x=>x.k===sel)||D[0];
  document.querySelectorAll('.dt-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===d.k));
  document.getElementById('eyebrow').textContent=d.n;
  const all=allInits(d),done=all.filter(x=>x.pct>=100).length,none=all.filter(x=>!x.pct).length;
  if(!all.length&&!(d.s||[]).length){document.getElementById('content').innerHTML='<div class="empty-dept">No initiatives have been added for '+esc(d.n)+' yet.</div>';return;}
  const prog=all.length-done-none;
  let h=`<div class="strip">
    <div class="s-prog"><span class="s-l">Overall progress</span><b>${avg(all)}%</b><div class="bar"><i style="width:${avg(all)}%"></i></div></div>
    <div class="s-item"><b>${all.length}</b><span class="s-l">Initiatives</span></div>
    <div class="s-item"><i class="s-dot done"></i><b>${done}</b><span class="s-l">Complete</span></div>
    <div class="s-item"><i class="s-dot prog"></i><b>${prog}</b><span class="s-l">In progress</span></div>
    <div class="s-item"><i class="s-dot none"></i><b>${none}</b><span class="s-l">Not started</span></div>
  </div>`;
  h+=(d.s||[]).map(f=>{const a=allInits(f);return`<section class="tray${open[f.path]===false?' closed':''}" data-path="${esc(f.path)}">
    <div class="tray-head" onclick="toggleFolder(this)"><div class="tray-title"><span class="emoji">${f.e||''}</span>${esc(f.n)}</div>
      <div class="meta"><span class="badge">${a.length} initiative${a.length===1?'':'s'} · ${avg(a)}%</span><span class="chev">${chevron}</span></div></div>
    <div class="tray-body">${folderBody(f)}</div></section>`;}).join('');
  document.getElementById('content').innerHTML=h;
}
let sel=(()=>{try{return localStorage.getItem('artium_dept')||'';}catch(e){return'';}})();

async function load(){
  try{
    DATA=await ArtiumAuth.call('initiatives');
    CAN_EDIT=!!DATA.canEdit;
    buildTree();
    if(!D.some(d=>d.k===sel))sel=(D.find(d=>allInits(d).length)||D[0]||{}).k;
    buildToggle();render();
    document.getElementById('add-btn').hidden=!CAN_EDIT;
    const t=new Date();
    document.getElementById('updated').textContent='Updated '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('dot').className='dot';
  }catch(e){
    document.getElementById('updated').textContent='Error — '+e.message;
    document.getElementById('dot').className='dot error';
  }
}

/* ── Add / Edit ── */
let editing=null;
const $=id=>document.getElementById(id);
function fillDepts(k){$('ed-dept').innerHTML=D.map(d=>`<option value="${d.k}"${d.k===k?' selected':''}>${esc(d.n)}</option>`).join('');}
function fillFolders(path){
  const k=$('ed-dept').value;
  const paths=DATA.folders.filter(f=>f.k===k).map(f=>f.path);
  $('ed-folder').innerHTML=paths.map(p=>`<option${p===path?' selected':''}>${esc(p)}</option>`).join('')+'<option value="__new">+ New folder…</option>';
  if(!paths.length)$('ed-folder').value='__new';
  toggleNewFolder();
}
function toggleNewFolder(){$('ed-newfolder').hidden=$('ed-folder').value!=='__new';}
function openEditor(id){
  editing=id?DATA.initiatives.find(x=>x.id===id):null;
  const x=editing||{k:sel,path:'',n:'',pct:0,ds:[],cs:[],pa:[]};
  $('ed-title').textContent=editing?'Edit initiative':'Add initiative';
  fillDepts(x.k);fillFolders(x.path);
  $('ed-nf-name').value='';$('ed-nf-emoji').value='';
  $('ed-name').value=x.n;
  $('ed-ds').value=x.ds.join('\n');$('ed-cs').value=x.cs.join('\n');$('ed-pa').value=x.pa.join('\n');
  backToEdit();msg('');$('editor').hidden=false;$('ed-name').focus();
}
function closeEditor(){$('editor').hidden=true;editing=null;draft=null;}
function msg(t,cls){$('ed-msg').textContent=t;$('ed-msg').className='ed-msg'+(cls?' '+cls:'');}
function folderPath(){
  if($('ed-folder').value!=='__new')return $('ed-folder').value;
  const n=$('ed-nf-name').value.trim();return n;
}
/* Recommend a completion % by reading an initiative's text — no AI, just rules.
   1. Each sentence of the Current state is placed on a stage (discussed → designed → built/piloted → live).
      The furthest stage reached sets the starting range.
   2. Sentences saying something is missing ("not yet", "does not", "paused"…) pull it down.
   3. Each step still in Plan ahead pulls it down further; nothing left to do = complete. */
const REC_STAGES=[
  {k:4,label:'is live or implemented',lo:50,hi:100,n:5,re:/\b(is available|are available|is accessible|fully (built|implemented|optimised|designed)|is live|are live|now live|went live|gone live|running successfully|implemented|rolled out|launched|in place|delivered|captured and flow)/},
  {k:3,label:'has been built, piloted or run',lo:35,hi:75,n:6,re:/\b(built|piloted|pilot|tested|trial|in development|being built|conducted|executed|calendarised|running|expanded|partnered|identified relevant)/},
  {k:2,label:'has groundwork done (drafted, designed or planned)',lo:10,hi:40,n:6,re:/\b(exists|drafted|designed|finalised|prd|prepared|defined|agreed|shortlisted|requested|inquiry|enquiry|identified|informally)/},
  {k:1,label:'has only been discussed or proposed',lo:5,hi:10,n:6,re:/\b(discussed|proposed|initiated|idea)/}
];
const REC_NEG=/\b(not yet|has not|have not|does not|did not|do not|is not|are not|no structured|no formal|not in a|lacks?|missing|paused|pending|incomplete|no further)\b/;
const REC_NONE=/\b(not yet (been )?(proposed|discussed|set up|started|taken place|picked up)|yet to (start|begin))/;
function recommendPct(x){
  const sentences=(x.cs||[]).join(' ').split(/(?<=[.!?])\s+/).map(s=>s.trim().toLowerCase()).filter(Boolean)
    .filter(s=>!/\bonline (world|employees|counterparts|learners)\b/.test(s)||/\boffline\b/.test(s)&&!/\bonline\b/.test(s));   // ignore what exists only in the online world
  const steps=(x.pa||[]).filter(s=>String(s).trim()).length;
  if(!sentences.length)return{pct:0,reason:'Nothing is written under Current state yet, so this is treated as not started.'};
  let best=null,neg=0;
  sentences.forEach(s=>{
    const isNeg=REC_NEG.test(s);
    if(isNeg){neg++;if(REC_NONE.test(s))return;}
    let st=REC_STAGES.find(t=>t.re.test(s));
    if(st&&/\b(initial|preliminary|first)\b/.test(s)&&st.k>2)st=REC_STAGES[2];   // e.g. "an initial inquiry has been completed"
    if(st&&isNeg&&st.k>1)st=REC_STAGES.find(t=>t.k===st.k-1);                  // "built but not yet live" counts one stage lower
    if(st&&(!best||st.k>best.k))best=st;
  });
  if(!best){
    if(sentences.every(s=>REC_NEG.test(s)))return{pct:0,reason:'The current state says work has not started yet.'};
    best=steps?{label:'has some work done',lo:10,hi:40,n:6}:REC_STAGES[0];
  }
  if(!steps&&!neg)return{pct:100,reason:`The current state says it ${best.label}, and nothing is left in Plan ahead.`};
  let lo=best.lo;
  if(/\b(final steps|few (final )?steps remain|nearly (done|complete)|almost (done|complete))/.test(sentences.join(' '))){lo=Math.max(lo,70);best={...best,hi:Math.max(best.hi,90)};}
  let pct=best.hi-(best.hi-lo)*Math.min(steps,best.n)/best.n-neg*5;
  pct=Math.max(lo,Math.min(steps?95:100,pct));
  pct=Math.round(pct/5)*5;
  const bits=[];
  if(neg)bits.push(`${neg} point${neg===1?'':'s'} say${neg===1?'s':''} something is still missing`);
  bits.push(steps?`${steps} step${steps===1?' is':'s are'} still in Plan ahead`:'nothing is left in Plan ahead');
  return{pct,reason:`The current state says it ${best.label}; ${bits.join(', and ')}.`};
}

/* Save → recommended % → Approve (publish with it) or Reject (enter your own) */
let draft=null,rec=null;
function show(step){
  const review=step==='review';
  document.querySelector('#editor .modal-body:not(.rec)').hidden=review;$('ed-review').hidden=!review;
  $('foot-edit').hidden=review;$('foot-review').hidden=!review;
  $('ed-title').textContent=review?'Review completion %':(editing?'Edit initiative':'Add initiative');
}
function backToEdit(){show('edit');}
function reviewDraft(){
  const path=folderPath(),name=$('ed-name').value.trim();
  if(!name)return msg('Give the initiative a name.','err');
  if(!path)return msg('Choose a folder or type a new folder name.','err');
  const split=t=>t.split('\n').map(s=>s.replace(/^[-•*\s]+/,'').trim()).filter(Boolean);
  draft={id:editing&&editing.id,k:$('ed-dept').value,path,emoji:$('ed-nf-emoji').value.trim(),n:name,ds:split($('ed-ds').value),cs:split($('ed-cs').value),pa:split($('ed-pa').value)};
  rec=recommendPct(draft);
  $('rec-pct').textContent=rec.pct;$('rec-bar').style.width=rec.pct+'%';$('rec-why').textContent=rec.reason;
  $('own').hidden=true;$('own-pct').value='';$('rv-msg').textContent='';
  $('own-note').textContent=editing?'Currently '+editing.pct+'% on the page.':'';
  $('rv-reject').hidden=false;$('rv-approve').textContent='Approve & publish';$('rv-approve').onclick=()=>publish(true);
  show('review');
}
function rejectRec(){
  $('own').hidden=false;$('own-pct').value=editing?editing.pct:rec.pct;$('own-pct').focus();
  $('rv-reject').hidden=true;$('rv-approve').textContent='Publish with my %';$('rv-approve').onclick=()=>publish(false);
}
async function publish(useRec){
  let pct=rec.pct;
  if(!useRec){pct=Number($('own-pct').value);if($('own-pct').value===''||isNaN(pct)||pct<0||pct>100){$('rv-msg').textContent='Enter a percentage between 0 and 100.';$('rv-msg').className='ed-msg err';return;}}
  const b=$('rv-approve');b.disabled=true;$('rv-msg').className='ed-msg';$('rv-msg').textContent='Publishing…';
  try{
    await ArtiumAuth.call('saveInitiative',{item:{...draft,pct:Math.round(pct)}});
    sel=draft.k;closeEditor();
    document.getElementById('dot').className='dot loading';document.getElementById('updated').textContent='Published · refreshing…';
    await load();
  }catch(err){$('rv-msg').textContent=err.message;$('rv-msg').className='ed-msg err';}
  b.disabled=false;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('editor').hidden)closeEditor();});
load();
</script>
