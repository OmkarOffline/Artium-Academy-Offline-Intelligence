<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artium Class Culture</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/emblem-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="brand/emblem-64.png">
<link rel="apple-touch-icon" href="brand/emblem-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
  /* Colours (Colour Foundations), one job each:
     Ember           → where you are (the principle you're reading)
     Progress Violet → what to do (the numbered steps)
     Passion Pink    → what to ask (the questions to put to a learner)
     Live green      → done (the Success Check ticks) */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --f:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
    --ink:#01073C;--ink2:#4A4466;--ink3:#6A6488;--line:#ECE6F6;
    --vio:#6601FD;--blue:#4101F7;--pink:#DD30B1;--live:#3DDC97;
    --ember:linear-gradient(135deg,#C9502A,#F5906F);--ember-x:linear-gradient(90deg,#C9502A,#F5906F);--ember-t:#A8431E;--ember-glow:rgba(245,144,111,.45);
  }
  body{background:#FBFAFF;font-family:var(--f);color:var(--ink2);-webkit-font-smoothing:antialiased}
  .page{max-width:1240px;margin:0 auto;padding:40px 48px 80px}
  button{font-family:inherit}
  .eb{font:700 12px/18px var(--f);letter-spacing:1.68px;text-transform:uppercase;color:var(--ink3)}
  h1{font:700 50px/1.06 var(--f);letter-spacing:-1.6px;margin-top:6px;padding-bottom:4px;background:linear-gradient(90deg,#4101F7 0%,#6601FD 35%,#DD30B1 75%,#F1B6FA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}

  /* The three principles: the brand's segmented tabs */
  .track{display:flex;gap:4px;background:#EFEAF9;border-radius:22px;padding:6px;margin-top:24px}
  .pt{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 16px;border:0;border-radius:17px;background:transparent;position:relative;text-align:left;cursor:pointer;transition:background .15s}
  .pt:hover{background:rgba(255,255,255,.55)}
  .pt .n{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--ember-t);font:800 14px var(--f)}
  .pt b{display:block;font:700 16px/1.25 var(--f);color:var(--ink)}.pt small{display:block;font:500 12.5px/1.35 var(--f);color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt[aria-selected="true"]{background:#fff;box-shadow:0 1px 2px rgba(1,7,60,.06),0 14px 30px -18px rgba(201,80,42,.55)}
  .pt[aria-selected="true"] .n{background:var(--ember);color:#fff;box-shadow:0 8px 16px -8px rgba(201,80,42,.8)}
  .pt[aria-selected="true"]::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ember-x)}
  .pt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* Principle: the one line to remember */
  .hero{position:relative;overflow:hidden;margin-top:22px;border-radius:30px;background:linear-gradient(115deg,#FFF1E8 0%,#FBF6F6 42%,#F3F0FF 100%);padding:44px 48px 40px;animation:rise .35s ease both}
  .hero::before{content:"";position:absolute;right:-90px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--ember-glow),rgba(245,144,111,0) 70%)}
  .hero::after{content:"";position:absolute;left:30%;bottom:-170px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,247,.35),rgba(201,162,247,0) 70%)}
  .hero>*{position:relative;z-index:1}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .ptag{display:inline-flex;align-items:center;gap:10px;font:700 12px/18px var(--f);letter-spacing:1.68px;text-transform:uppercase;color:var(--ember-t)}
  .ptag i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--ember);color:#fff;font-style:normal}
  .ptag i svg{width:16px;height:16px}
  .quote{font:700 46px/1.12 var(--f);letter-spacing:-1.3px;color:var(--ink);margin-top:18px;max-width:900px;text-wrap:balance}
  .obj{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;margin-top:30px;padding-top:24px;border-top:1px solid rgba(168,67,30,.18)}
  .obj h2{font:700 12px/24px var(--f);letter-spacing:1.68px;text-transform:uppercase;color:var(--ember-t)}
  .obj p{font:400 19px/30px var(--f);color:var(--ink);max-width:820px}

  /* Sections */
  .sec{margin-top:52px}
  .sh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .sh .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}.sh .ic svg{width:17px;height:17px}
  .sh h2{font:700 28px var(--f);letter-spacing:-.6px;color:var(--ink)}
  .intro{font:500 16px/24px var(--f);color:var(--ink3);margin:2px 0 10px 46px}
  b,strong{font-weight:700;color:var(--ink)}

  /* What Teachers Should Do: numbered steps */
  .do .ic{background:linear-gradient(135deg,#4101F7,#6601FD);box-shadow:0 8px 16px -8px #6601FD}
  .steps{list-style:none;counter-reset:s;margin-top:8px}
  .steps li{counter-increment:s;position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:20px 0;font:400 17px/27px var(--f);color:var(--ink2)}
  .steps li+li::before{content:"";position:absolute;left:64px;right:0;top:0;height:1px;background:linear-gradient(90deg,var(--line),var(--line) 70%,transparent)}
  .steps li::after{content:counter(s,decimal-leading-zero);grid-column:1;grid-row:1;font:800 30px/1 var(--f);letter-spacing:-1px;background:linear-gradient(135deg,#4101F7,#9B6BFF);-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:3px}
  .steps li>div{grid-column:2;grid-row:1}
  .steps .lead{display:block;font:700 19px/27px var(--f);color:var(--ink);margin-bottom:2px}

  /* Good Practices */
  .gp .ic{background:var(--ember);box-shadow:0 8px 16px -8px #C9502A}
  .gpl{list-style:none;margin-top:8px}
  .gpl>li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:16px;padding:16px 0;font:400 17px/27px var(--f);color:var(--ink2);position:relative}
  .gpl>li+li::before{content:"";position:absolute;left:46px;right:0;top:0;height:1px;background:linear-gradient(90deg,var(--line),var(--line) 70%,transparent)}
  .gpl .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#FFEDE4;color:var(--ember-t)}.gpl .dot svg{width:15px;height:15px}
  /* Questions to ask a learner: speech bubbles */
  .asks{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .ask{position:relative;background:#FCEAF7;color:#8E1570;border-radius:18px 18px 18px 6px;padding:10px 16px;font:600 15.5px/22px var(--f)}
  .ask::before{content:"“";font:800 22px/0 var(--f);color:var(--pink);margin-right:4px;vertical-align:-6px}

  /* Success Check: tick as you go (only on this screen, nothing is saved) */
  .sc .ic{background:linear-gradient(135deg,#1F9E6A,#3DDC97);box-shadow:0 8px 16px -8px #1F9E6A}
  .check{margin-top:12px;background:#fff;border-radius:28px;box-shadow:0 1px 2px rgba(1,7,60,.05),0 40px 80px -50px rgba(1,7,60,.35);padding:12px 28px 26px}
  .check .ask-y{font:600 15px var(--f);color:var(--ink3);padding:12px 0 4px}
  .ci{display:flex;align-items:flex-start;gap:16px;width:100%;border:0;background:none;text-align:left;padding:15px 0;font:500 18px/27px var(--f);color:var(--ink);cursor:pointer;position:relative}
  .ci+.ci::before{content:"";position:absolute;left:48px;right:0;top:0;height:1px;background:var(--line)}
  .ci .tk{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid #D9D1EA;display:grid;place-items:center;transition:all .2s;margin-top:-2px}
  .ci .tk svg{width:16px;height:16px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
  .ci:hover .tk{border-color:var(--live)}
  .ci[aria-pressed="true"] .tk{background:var(--live);border-color:var(--live);box-shadow:0 0 0 5px rgba(61,220,151,.18)}.ci[aria-pressed="true"] .tk svg{opacity:1}
  .ci:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:12px}
  .yes{display:flex;gap:14px;align-items:center;margin-top:14px;padding:18px 20px;border-radius:20px;background:#F6F3FC;font:500 17px/26px var(--f);color:var(--ink2);transition:background .3s,color .3s}
  .yes .bar{flex:none;width:60px;height:8px;border-radius:8px;background:#E6E0F3;overflow:hidden}.yes .bar i{display:block;height:100%;border-radius:8px;background:var(--live);transition:width .3s}
  .yes.all{background:linear-gradient(110deg,#E3FAF0,#F2FCF7);color:#0F5E3D}
  .reset{border:0;background:none;color:var(--ink3);font:600 13px var(--f);cursor:pointer;margin-top:10px}.reset:hover{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){.hero{animation:none}}
  @media (max-width:760px){
    .page{padding:24px 16px 56px}h1{font-size:34px;letter-spacing:-1px}
    .track{flex-direction:column}.pt small{white-space:normal}
    .hero{padding:28px 22px;border-radius:24px}.quote{font-size:31px;letter-spacing:-.8px}
    .obj{grid-template-columns:1fr;gap:6px}.obj p{font-size:17px;line-height:27px}
    .sh h2{font-size:23px}.intro{margin-left:0}
    .steps li{grid-template-columns:44px minmax(0,1fr);font-size:16px}.steps li::after{font-size:24px}.steps li+li::before{left:44px}
    .gpl>li{font-size:16px}.check{padding:8px 16px 18px;border-radius:22px}.ci{font-size:16.5px}
  }
</style>
</head>
<body>
<div class="page">
  <div class="eb">Teachers</div>
  <h1>Artium Class Culture</h1>
  <div class="track" role="tablist" aria-label="Principles" id="track"></div>
  <div id="content"></div>
</div>
<script>
/* The text comes word for word from the "Artium Class Culture" Google Doc (one tab per principle).
   Each run is [text, bold]. Only the layout is new: nothing in the wording has been changed. */
const P=[{"title":"Individual Attention","sections":[{"h":"Principle","intro":[[["“No Learner Must Feel Invisible.”",false]]],"items":[],"after":[]},{"h":"Objective","intro":[[["Every learner should feel that their learning journey is being personally guided, even within a group class. Teachers should ensure that every learner receives individual attention, understands their improvement areas, and feels supported in achieving their musical goals.",false]]],"items":[],"after":[]},{"h":"What Teachers Should Do","intro":[[["During every group class:",false]]],"items":[{"runs":[["Give every learner individual attention. Allocate dedicated time to observe, listen, and guide each learner based on their current level and learning needs.",false]],"sub":[]},{"runs":[["Balance individual needs with the group agenda. While following the planned lesson, ensure that no learner is left unattended or overlooked.",false]],"sub":[]},{"runs":[["Support every type of learner. High-performing learners should receive opportunities to progress further, while learners who need more support should receive the guidance required to improve.",false]],"sub":[]},{"runs":[["Understand each learner's journey. Regularly discuss their strengths, improvement areas, musical goals, and progress to make learning more personalised.",false]],"sub":[]}],"after":[]},{"h":"Good Practices","intro":[],"items":[{"runs":[["Spend approximately 5–10 minutes with each learner during the class, wherever possible.",false]],"sub":[]},{"runs":[["Ask questions to understand their challenges:",false]],"sub":[[["What part feels difficult?",false]],[["What are you currently working on?",false]],[["What would you like to improve?",false]]]},{"runs":[["Remember important details about each learner's progress and goals.",false]],"sub":[]},{"runs":[["Use individual feedback moments to make learners feel noticed and encouraged.",false]],"sub":[]}],"after":[]},{"h":"Success Check","intro":[[["Before the learner leaves, ask yourself:",false]]],"items":[{"runs":[["Did every learner receive individual attention today?",false]],"sub":[]},{"runs":[["Did I understand what each learner is currently working on?",false]],"sub":[]},{"runs":[["Did each learner receive feedback relevant to their level?",false]],"sub":[]},{"runs":[["Does every learner feel that their progress matters?",false]],"sub":[]}],"after":[[["If the answer is Yes, the learner will feel personally supported despite being part of a group class.",false]]]}]},{"title":"Sense of Progress","sections":[{"h":"Principle","intro":[[["“Every Learner Must Leave With a Win.”",false]]],"items":[],"after":[]},{"h":"Objective","intro":[[["Every learner should leave every class feeling that they have learnt something meaningful, made visible progress, and know what they are working towards next.",false]]],"items":[],"after":[]},{"h":"What Teachers Should Do","intro":[[["At the end of every class:",false]]],"items":[{"runs":[["Ask the learner what they learnt.",true],[" Use guided questions to help them reflect, rather than summarising the learning yourself.",false]],"sub":[]},{"runs":[["Help the learner recognise their progress.",true],[" Encourage them to explain the concept, technique, or skill they improved during the class.",false]],"sub":[]},{"runs":[["Connect today's learning to the learner's monthly goal.",true],[" Help them understand how today's class contributes to their overall musical journey.",false]],"sub":[]},{"runs":[["End with a clear next step.",true],[" The learner should leave knowing what they achieved today and what they will build on in the next class.",false]],"sub":[]}],"after":[]},{"h":"Good Practices","intro":[],"items":[{"runs":[["Ask open-ended questions such as:",false]],"sub":[[["What did you learn today?",false]],[["What became easier today?",false]],[["What was your biggest achievement today?",false]],[["What would you like to improve further?",false]]]},{"runs":[["Let the learner do most of the talking. The more they articulate their own learning, the stronger their sense of progress becomes.",false]],"sub":[]},{"runs":[["Be specific while appreciating progress. Instead of saying \"Good job,\" tell the learner exactly what they improved.",false]],"sub":[]}],"after":[]},{"h":"Success Check","intro":[[["Before the learner leaves, ask yourself:",false]]],"items":[{"runs":[["Can the learner clearly explain what they learnt today?",false]],"sub":[]},{"runs":[["Do they understand what they improved?",false]],"sub":[]},{"runs":[["Do they know how today's class contributes to their monthly goal?",false]],"sub":[]},{"runs":[["Do they know what they will work on next?",false]],"sub":[]}],"after":[[["If the answer to all four questions is Yes, the learner is likely to leave the class with a strong sense of progress.",false]]]}]},{"title":"Ownership","sections":[{"h":"Principle","intro":[[["“Every learner should be building something they are proud of.”",false]]],"items":[],"after":[]},{"h":"Why It Matters","intro":[[["Learners become more motivated when they feel they are working towards something that belongs to them. Whether it is a favourite song, a technical exercise, an exam piece, or any other musical goal, having something to build over time creates ownership, encourages regular practice, and makes learning more meaningful.",false]]],"items":[],"after":[]},{"h":"What Teachers Should Do","intro":[],"items":[{"runs":[["At the beginning of every month, help every learner choose one musical project to work on throughout the month.",false]],"sub":[]},{"runs":[["The project should match the learner's age, ability, interests, and current level of progress. Guide the learner in choosing an appropriate project. A project that is too easy offers little growth, while one that is too difficult may discourage the learner.",false]],"sub":[]},{"runs":[["A project could be a song, a technical exercise, a performance piece, an exam piece, a composition, or any other meaningful musical outcome. The objective is not to create something new, but to steadily improve something over time.",false]],"sub":[]},{"runs":[["Spend a few minutes in every class reviewing the learner's progress, celebrating improvements, resolving challenges, and agreeing on the next milestone.",false]],"sub":[]},{"runs":[["Once the learner is ready, create an opportunity for them to perform, demonstrate, or otherwise showcase what they have built.",false]],"sub":[]}],"after":[]},{"h":"Good Practices","intro":[],"items":[{"runs":[["Let the learner participate in choosing their project.",false]],"sub":[]},{"runs":[["Break larger projects into smaller milestones so that progress feels achievable.",false]],"sub":[]},{"runs":[["Celebrate improvement throughout the journey, not just the final outcome.",false]],"sub":[]},{"runs":[["Refer back to the learner's project regularly so that it remains active in their mind between classes.",false]],"sub":[]}],"after":[]},{"h":"Success Check","intro":[[["Before the learner leaves, ask yourself:",false]]],"items":[{"runs":[["Does the learner have a clear musical project they are working towards?",false]],"sub":[]},{"runs":[["Is the project appropriately challenging for their current ability?",false]],"sub":[]},{"runs":[["Did we review its progress today?",false]],"sub":[]},{"runs":[["Does the learner know what they should work on before the next class?",false]],"sub":[]}],"after":[[["If the answer is Yes, the learner is likely to remain engaged and take greater ownership of their musical journey.",false]]]}]}];
const ICON={
  'Individual Attention':'<circle cx="12" cy="12" r="3"/><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>',
  'Sense of Progress':'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"/>',
  'Ownership':'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'
};
const SI={do:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',gp:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',sc:'<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>'};
const svg=(d,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2.2}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=runs=>runs.map(r=>r[0]).join('');
const html=runs=>runs.map(r=>r[1]?`<b>${esc(r[0])}</b>`:esc(r[0])).join('');
const $=id=>document.getElementById(id);
let cur=(()=>{try{return +localStorage.getItem('artium_culture')||0;}catch(e){return 0;}})();
const ticks={};   // ticks only last while the page is open

/* A step's lead: its bold opening if the Doc has one, otherwise its first sentence (shown bolder, words unchanged) */
function step(runs){
  if(runs[0]&&runs[0][1])return`<span class="lead">${esc(runs[0][0].trim())}</span>${esc(text(runs.slice(1)).trim())}`;
  const t=text(runs),m=t.match(/^(.+?[.!?])\s+(.+)$/);
  return m?`<span class="lead">${esc(m[1])}</span>${esc(m[2])}`:esc(t);
}
const sec=(P,h)=>P.sections.find(s=>s.h===h);
function render(){
  if(!(cur>=0&&cur<P.length))cur=0;
  $('track').innerHTML=P.map((p,i)=>{const q=text(sec(p,'Principle').intro[0]);return`<button type="button" role="tab" class="pt" data-i="${i}" aria-selected="${i===cur}"><span class="n">${String(i+1).padStart(2,'0')}</span><span style="min-width:0"><b>${esc(p.title)}</b><small>${esc(q)}</small></span></button>`;}).join('');
  const p=P[cur],pr=sec(p,'Principle'),ob=p.sections.find(s=>s.h==='Objective'||s.h==='Why It Matters');
  const doS=sec(p,'What Teachers Should Do'),gp=sec(p,'Good Practices'),sc=sec(p,'Success Check');
  const t=ticks[cur]=ticks[cur]||{};
  let h=`<section class="hero"><div class="ptag"><i>${svg(ICON[p.title]||'',2)}</i>Principle ${String(cur+1).padStart(2,'0')} · ${esc(p.title)}</div>
    <p class="quote">${html(pr.intro[0])}</p>
    ${ob?`<div class="obj"><h2>${esc(ob.h)}</h2><div>${ob.intro.map(r=>`<p>${html(r)}</p>`).join('')}</div></div>`:''}</section>`;
  if(doS)h+=`<section class="sec do"><div class="sh"><span class="ic">${svg(SI.do,2.6)}</span><h2>${esc(doS.h)}</h2></div>${doS.intro.map(r=>`<p class="intro">${html(r)}</p>`).join('')}
    <ol class="steps">${doS.items.map(it=>`<li><div>${step(it.runs)}</div></li>`).join('')}</ol>${doS.after.map(r=>`<p class="intro">${html(r)}</p>`).join('')}</section>`;
  if(gp)h+=`<section class="sec gp"><div class="sh"><span class="ic">${svg(SI.gp,2.2)}</span><h2>${esc(gp.h)}</h2></div>${gp.intro.map(r=>`<p class="intro">${html(r)}</p>`).join('')}
    <ul class="gpl">${gp.items.map(it=>`<li><span class="dot">${svg('<path d="M5 12l5 5L20 7"/>',3)}</span><div>${html(it.runs)}${it.sub.length?`<div class="asks">${it.sub.map(s=>`<span class="ask">${html(s)}</span>`).join('')}</div>`:''}</div></li>`).join('')}</ul></section>`;
  if(sc){const n=sc.items.length,dn=sc.items.filter((_,i)=>t[i]).length;
    h+=`<section class="sec sc"><div class="sh"><span class="ic">${svg(SI.sc,2.4)}</span><h2>${esc(sc.h)}</h2></div>
    <div class="check">${sc.intro.map(r=>`<p class="ask-y">${html(r)}</p>`).join('')}
      ${sc.items.map((it,i)=>`<button type="button" class="ci" data-t="${i}" aria-pressed="${!!t[i]}"><span class="tk">${svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>',3.2)}</span><span>${html(it.runs)}</span></button>`).join('')}
      ${sc.after.map(r=>`<div class="yes${dn===n?' all':''}"><span class="bar"><i style="width:${dn/n*100}%"></i></span><span>${html(r)}</span></div>`).join('')}
      ${dn?'<button type="button" class="reset" data-reset="1">Clear the ticks</button>':''}</div></section>`;}
  $('content').innerHTML=h;
}
$('track').addEventListener('click',e=>{const b=e.target.closest('.pt');if(!b)return;cur=+b.dataset.i;try{localStorage.setItem('artium_culture',cur);}catch(err){}render();window.scrollTo({top:0,behavior:'smooth'});});
$('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t!=null){const t=ticks[cur];t[b.dataset.t]=!t[b.dataset.t];b.setAttribute('aria-pressed',!!t[b.dataset.t]);
    const n=document.querySelectorAll('.ci').length,dn=document.querySelectorAll('.ci[aria-pressed="true"]').length,y=document.querySelector('.yes');
    if(y){y.classList.toggle('all',dn===n);y.querySelector('.bar i').style.width=dn/n*100+'%';}
    let r=document.querySelector('.reset');if(dn&&!r){document.querySelector('.check').insertAdjacentHTML('beforeend','<button type="button" class="reset" data-reset="1">Clear the ticks</button>');}else if(!dn&&r)r.remove();return;}
  if(b.dataset.reset){ticks[cur]={};render();}});
render();
</script>
