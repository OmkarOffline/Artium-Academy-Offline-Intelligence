<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrument Sales</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/emblem-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="brand/emblem-64.png">
<link rel="apple-touch-icon" href="brand/emblem-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--v:#4101f7;--pk:#DD30B1;--em:#C9502A;--ink:#01073C;--ink2:#4A4466;--ink3:#6A6488;--ink4:#8A84A3;--line:#F1EDF9;--f:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
body{font-family:var(--f);background:#FBFAFF;color:var(--ink2);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.hero{max-width:1600px;margin:0 auto;padding:40px 48px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
h1{font:700 50px/1.06 var(--f);letter-spacing:-1.6px;padding-bottom:4px;background:linear-gradient(90deg,#4101F7 0%,#6601FD 35%,#DD30B1 75%,#F1B6FA 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:14px;color:var(--ink3);margin-top:6px}
.right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.badge{font:600 12px var(--f);padding:6px 12px;border-radius:999px;background:#F4F0FF;color:var(--v)}
.sw{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--v);background:#fff;color:var(--v);border-radius:999px;padding:11px 22px;font:700 14px var(--f);box-shadow:0 2px 10px #4101f710;transition:background .15s,color .15s}
.sw svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw:hover{background:#F4F0FF}
.sw[aria-pressed="true"]{background:var(--v);color:#fff}.sw[aria-pressed="true"]:hover{background:#3500d0}
.cf{position:fixed;inset:0;z-index:60;background:rgba(1,7,60,.55);display:grid;place-items:center;padding:20px}
.cfb{background:#fff;border-radius:26px;max-width:460px;width:100%;padding:30px 30px 26px;box-shadow:0 40px 90px -30px rgba(1,7,60,.6)}
.cfb h3{font:700 24px/1.2 var(--f);color:var(--ink);letter-spacing:-.4px}
.cfb p{margin-top:10px;font-size:14.5px;line-height:1.5;color:var(--ink2)}
.cfa{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.cfa button{flex:1 1 160px;border-radius:999px;padding:12px 18px;font:700 14px var(--f);border:1.5px solid var(--v)}
.cfa .keep{background:var(--v);color:#fff}.cfa .go{background:#fff;color:var(--v)}
.page{max-width:1600px;margin:0 auto;padding:0 48px 90px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 18px}
.pill{padding:9px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);font:600 13px var(--f);color:var(--ink2)}
.pill[aria-pressed="true"]{border-color:var(--v);color:var(--v);background:#F4F0FF}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.kpi small{display:block;font:600 11px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--ink4)}
.kpi b{display:block;font:700 24px/1.2 var(--f);color:var(--ink);margin-top:6px}
.kpi.warn b{color:var(--pk)}
.tw{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto;box-shadow:0 30px 70px -50px rgba(1,7,60,.3)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:1100px}
th{text-align:right;font:600 11px var(--f);text-transform:uppercase;letter-spacing:.05em;color:var(--ink4);padding:14px 10px;background:#FAF8FF;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;white-space:nowrap}
td{text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);color:var(--ink2);white-space:nowrap}
tr:last-child td{border:0}
th:first-child,td:first-child{text-align:left;padding-left:18px;position:sticky;left:0;background:#fff;z-index:1}
th:first-child{background:#FAF8FF;z-index:3}
.mc{display:flex;align-items:center;gap:12px}
.th{flex:none;width:52px;height:40px;border-radius:10px;background:#F4F0FF;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;padding:0}
.th img{width:100%;height:100%;object-fit:cover}
.th.none{cursor:default;color:var(--ink4);font:700 10px var(--f)}
.mn{font:700 15px var(--f);color:var(--ink);text-align:left}
.mn small{display:block;font:500 11px var(--f);color:var(--ink4)}
.low{color:var(--pk);font-weight:700}
.fl{font:700 10px var(--f);background:#FDE8F8;color:var(--pk);padding:2px 7px;border-radius:99px;margin-left:6px}
.note{margin-top:14px;font-size:12px;color:var(--ink4)}
/* customer cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px 18px 22px;box-shadow:0 6px 24px #4101f70d}
.cat{font:600 12px var(--f);color:var(--ink4);text-transform:uppercase;letter-spacing:.06em;margin-top:16px}
.nm{font:700 26px/1.15 var(--f);color:var(--ink);letter-spacing:-.01em;margin:2px 0 10px}
.pr b{font:700 30px var(--f);color:var(--v)}.pr s{margin-left:10px;color:var(--ink4);font-size:15px}
.dl{font-size:12px;color:var(--ink3);margin-top:3px}
.save{display:inline-block;margin-top:10px;font:700 12px var(--f);color:#0F7B4B;background:#E3F6EC;padding:6px 12px;border-radius:99px}
.foot{margin-top:22px;color:var(--ink3);font-size:13px;display:flex;gap:24px;flex-wrap:wrap}
/* gallery */
.gal{position:relative;border-radius:16px;box-shadow:inset 0 0 0 1px #E9E2F7;background:linear-gradient(135deg,#F4F0FF,#FFE9F8);aspect-ratio:4/3;overflow:hidden;touch-action:pan-y;user-select:none}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in;-webkit-user-drag:none}
.gal.empty{display:grid;place-items:center;color:var(--ink4);font:600 13px var(--f)}
.ga{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(1,7,60,.18);display:grid;place-items:center;color:var(--v)}
.ga:hover{background:#fff}.ga.l{left:10px}.ga.r{right:10px}
.ga svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(65,1,247,.22)}.dots i.on{background:var(--v)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(1,7,60,.82);display:grid;place-items:center;padding:24px}
.lbc{position:relative;width:min(1100px,100%);}
.lbc .gal{aspect-ratio:16/10;background:#fff;border-radius:22px;max-height:82vh}
.lbc .gal img{cursor:default;object-fit:contain;padding:18px}
.lbc .ga{width:48px;height:48px}.lbc .ga svg{width:22px;height:22px}
.lbt{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:12px;font:700 20px var(--f)}
.lbt button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:8px 18px;font:600 14px var(--f)}
.msg{padding:60px 0;text-align:center;color:var(--ink3)}
@media(max-width:820px){
  .hero{padding:24px 16px 4px}h1{font-size:36px}.page{padding:0 16px 70px}
  .kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="hero">
  <div><h1>Instrument Sales.</h1><div class="sub" id="sub">Pricing 2026-27</div></div>
  <div class="right"><span class="badge" id="badge"></span>
    <button class="sw" id="sw" type="button" aria-pressed="false"></button>
  </div>
</div>
<div class="page">
  <div class="pills" id="pills"></div>
  <div id="out"><div class="msg">Loading prices.</div></div>
</div>
<div class="lb" id="lb" hidden></div>
<div class="cf" id="cf" hidden></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const GROUPS=[['all','All'],['kb','Keyboards & pianos'],['gt','Guitars'],['ac','Accessories']];
const groupOf=c=>/guitar/i.test(c)?'gt':/keyboard stand|stand|accessor/i.test(c)?'ac':'kb';
const slug=m=>String(m).replace(/\s*-\s*/g,'-').replace(/\s+/g,'-');
let ROWS=[],MAN={},VIEW='int',GRP='all';
const AUTO=[];
try{if(sessionStorage.getItem('instrView')==='cus')VIEW='cus';}catch(e){}
/* the photos change by themselves every 2 seconds, in a loop, while they are on screen */
setInterval(()=>{if(document.hidden||VIEW!=='cus')return;for(let k=AUTO.length-1;k>=0;k--){const g=AUTO[k];if(!g.isConnected){AUTO.splice(k,1);continue;}if(g._vis&&!g._hold&&Date.now()-g._t>=1900)g.show(g.idx()+1);}},500);

/* ── photos ── */
const photos=m=>{const n=MAN[slug(m)]||0;return Array.from({length:n},(_,i)=>'instruments/'+slug(m)+'/'+(i+1)+'.jpg');};
const ARW={l:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',r:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>'};
function gallery(host,model,opts){
  opts=opts||{};const list=photos(model);let i=0;
  const g=document.createElement('div');g.className='gal';
  if(!list.length){g.classList.add('empty');g.textContent='Photo coming soon';host.appendChild(g);return g;}
  const img=document.createElement('img');img.alt=model;img.draggable=false;g.appendChild(img);
  let dots=null;
  if(list.length>1){
    g.insertAdjacentHTML('beforeend','<button class="ga l" aria-label="Previous photo">'+ARW.l+'</button><button class="ga r" aria-label="Next photo">'+ARW.r+'</button><div class="dots">'+list.map(()=>'<i></i>').join('')+'</div>');
    dots=[...g.querySelectorAll('.dots i')];
  }
  const show=n=>{i=(n+list.length)%list.length;img.src=list[i];g._t=Date.now();if(dots)dots.forEach((d,k)=>d.classList.toggle('on',k===i));};
  g.show=show;show(0);
  if(list.length>1){
    g.querySelector('.l').onclick=e=>{e.stopPropagation();show(i-1);};
    g.querySelector('.r').onclick=e=>{e.stopPropagation();show(i+1);};
    let x0=null;
    g.addEventListener('pointerdown',e=>{if(e.target.closest('.ga'))return;x0=e.clientX;});
    g.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40){show(i+(dx<0?1:-1));g._sw=1;setTimeout(()=>g._sw=0,50);}});
    g.addEventListener('pointercancel',()=>x0=null);
  }
  if(!opts.big)img.onclick=()=>{if(!g._sw)openLb(model,i);};
  host.appendChild(g);g.idx=()=>i;
  if(opts.auto&&list.length>1){g._vis=false;g._hold=false;g._t=Date.now();g.addEventListener('pointerenter',()=>g._hold=true);g.addEventListener('pointerleave',()=>g._hold=false);
    if('IntersectionObserver' in window){new IntersectionObserver(es=>{g._vis=es[es.length-1].isIntersecting;}).observe(g);}else g._vis=true;
    AUTO.push(g);}
  return g;
}
function openLb(model,start){
  const lb=$('#lb');lb.hidden=false;lb.innerHTML='<div class="lbc"><div class="lbt"><span></span><button id="lbx">Close</button></div><div id="lbh"></div></div>';
  lb.querySelector('.lbt span').textContent=model;
  const g=gallery($('#lbh'),model,{big:true});if(g.show)g.show(start||0);
  const close=()=>{lb.hidden=true;lb.innerHTML='';document.removeEventListener('keydown',key);};
  const key=e=>{if(e.key==='Escape')close();else if(g.show&&e.key==='ArrowLeft')g.show(g.idx()-1);else if(g.show&&e.key==='ArrowRight')g.show(g.idx()+1);};
  document.addEventListener('keydown',key);
  $('#lbx').onclick=close;lb.onclick=e=>{if(e.target===lb)close();};
}

/* ── views ── */
function pills(){
  const have=new Set(ROWS.map(r=>groupOf(r.cat)));
  $('#pills').innerHTML=GROUPS.filter(g=>g[0]==='all'||have.has(g[0])).map(g=>'<button class="pill" data-g="'+g[0]+'" aria-pressed="'+(GRP===g[0])+'">'+g[1]+'</button>').join('');
  $('#pills').querySelectorAll('.pill').forEach(b=>b.onclick=()=>{GRP=b.dataset.g;render();});
}
const rowsNow=()=>ROWS.filter(r=>GRP==='all'||groupOf(r.cat)===GRP);
function internal(){
  const L=rowsNow();if(!L.length)return '<div class="msg">No models here.</div>';
  const pct=r=>r.mrp?r.ma/r.mrp*100:0;
  const best=L.reduce((a,b)=>b.ma>a.ma?b:a),low=L.reduce((a,b)=>pct(b)<pct(a)?b:a);
  const avg=L.reduce((s,r)=>s+r.ma,0)/L.length;
  let h='<div class="kpis"><div class="kpi"><small>Models</small><b>'+L.length+'</b></div><div class="kpi"><small>Average margin after tax</small><b>'+inr(avg)+'</b></div><div class="kpi"><small>Best margin</small><b>'+esc(best.model)+' · '+inr(best.ma)+'</b></div><div class="kpi'+(pct(low)<5?' warn':'')+'"><small>'+(pct(low)<5?'Needs a look':'Lowest margin')+'</small><b>'+esc(low.model)+' · '+inr(low.ma)+'</b></div></div>';
  h+='<div class="tw"><table><thead><tr><th>Model</th><th>MRP</th><th>Discount</th><th>Net purchase</th><th>Amazon price</th><th>Gross selling</th><th>Customer pays</th><th>Extra vs Amazon</th><th>Margin pre-tax</th><th>Margin after tax</th><th>% of MRP</th></tr></thead><tbody>';
  L.forEach((r,k)=>{const p=pct(r),lo=p<5;
    h+='<tr><td><div class="mc"><button class="th'+(photos(r.model).length?'':' none')+'" data-k="'+ROWS.indexOf(r)+'" aria-label="Photos of '+esc(r.model)+'">'+(photos(r.model).length?'<img src="'+photos(r.model)[0]+'" alt="">':'—')+'</button><div class="mn">'+esc(r.model)+'<small>'+esc(r.maker)+' · '+esc(r.cat)+'</small></div></div></td>'
     +'<td>'+inr(r.mrp)+'</td><td>'+r.disc+'%</td><td>'+inr(r.netp)+'</td><td>'+inr(r.online)+'</td><td>'+inr(r.gross)+'</td><td>'+inr(r.net)+'</td><td>'+(r.addl>=0?'+':'−')+inr(Math.abs(r.addl))+'</td><td>'+inr(r.mb)+'</td>'
     +'<td class="'+(lo?'low':'')+'">'+inr(r.ma)+(lo?'<span class="fl">Low margin</span>':'')+'</td><td class="'+(lo?'low':'')+'">'+p.toFixed(1)+'%</td></tr>';});
  h+='</tbody></table></div><div class="note">Internal view. Margins come from the Pricing - DMPL tab. Customer pays is the net selling price, which includes the ₹300 delivery.</div>';
  return h;
}
function customer(){
  const L=rowsNow();if(!L.length)return '<div class="msg">No models here.</div>';
  const host=document.createElement('div');host.className='grid';
  L.forEach(r=>{
    const c=document.createElement('div');c.className='card';
    const gh=document.createElement('div');c.appendChild(gh);gallery(gh,r.model,{auto:true});
    const mrp=Math.round(r.net/0.8/10)*10,off=mrp-r.net;
    c.insertAdjacentHTML('beforeend','<div class="cat">'+esc(r.maker)+' · '+esc(r.cat)+'</div><div class="nm">'+esc(r.model)+'</div><div class="pr"><b>'+inr(r.net)+'</b>'+'<s>'+inr(mrp)+'</s>'+'</div><div class="dl">Inclusive of all taxes and delivery. Collect it from our academy.</div>'+(off?'<span class="save">You save '+inr(off)+'</span>':''));
    host.appendChild(c);
  });
  const w=document.createElement('div');w.appendChild(host);
  w.insertAdjacentHTML('beforeend','<div class="foot"><span>Everything is taken care of: the price includes all taxes and delivery.</span><span>Straight from the official distributor’s warehouse to our academy. Collect it from here.</span></div>');
  return w;
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const sw=$('#sw');sw.setAttribute('aria-pressed',VIEW==='cus');
  sw.innerHTML='<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/></svg>'+(VIEW==='cus'?'Catalog view':'Switch to catalog');
  $('#badge').hidden=VIEW==='cus';$('#badge').textContent='Internal only. Do not show customers';
  try{parent.document.documentElement.classList.toggle('cat-mode',VIEW==='cus');}catch(e){}
  $('#sub').textContent=VIEW==='int'?'Pricing 2026-27. Every figure, for the team only.':'Genuine Yamaha instruments, procured directly from Yamaha’s official distributor, always from the latest production batch.';
  pills();
  const out=$('#out');out.innerHTML='';
  if(!ROWS.length){out.innerHTML='<div class="msg">No prices found.</div>';return;}
  const v=VIEW==='int'?internal():customer();
  if(typeof v==='string')out.innerHTML=v;else out.appendChild(v);
  out.querySelectorAll('.th[data-k]').forEach(b=>{if(!b.classList.contains('none'))b.onclick=()=>openLb(ROWS[+b.dataset.k].model,0);});
}
const setView=v=>{VIEW=v;try{sessionStorage.setItem('instrView',v);}catch(e){}render();};
function askInternal(){
  const cf=$('#cf');cf.hidden=false;
  cf.innerHTML='<div class="cfb" role="alertdialog" aria-modal="true"><h3>Switch to the internal view?</h3><p>The internal view shows purchase prices, discounts and margins. Please check that no customer is looking at the screen.</p><div class="cfa"><button class="keep" id="cfk">Stay in catalog view</button><button class="go" id="cfg">Yes, switch to internal view</button></div></div>';
  const close=()=>{cf.hidden=true;cf.innerHTML='';document.removeEventListener('keydown',key);};
  const key=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',key);
  $('#cfk').onclick=close;$('#cfg').onclick=()=>{close();setView('int');};cf.onclick=e=>{if(e.target===cf)close();};$('#cfk').focus();
}
$('#sw').onclick=()=>{if(VIEW==='int')setView('cus');else askInternal();};

(async function(){
  try{
    const [d,m]=await Promise.all([ArtiumAuth.call('instruments',{}),fetch('instruments/manifest.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).catch(()=>({}))]);
    ROWS=(d&&d.rows)||[];MAN=m||{};
  }catch(e){$('#out').innerHTML='<div class="msg">Could not load the prices. '+esc(e&&e.message||'')+'</div>';return;}
  render();
})();
})();
</script>
</body>
</html>
