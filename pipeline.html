<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

}
body{font-family:var(--f);background:#F6F3FC;color:var(--ink2);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.hero{background:radial-gradient(120% 140% at 85% -20%,#4101f7 0%,rgba(65,1,247,0) 55%),linear-gradient(135deg,#2B0256 0%,#160240 55%,#01064c 100%);padding:34px 48px 92px;color:#fff}

.sh .ct{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;font:800 12px var(--f)}
.ct.r{background:var(--rose);color:var(--bad)}.ct.b{background:var(--tbbg);color:var(--tbfg)}

button{font:inherit}

.vt button{display:flex;align-items:center;gap:8px;padding:9px 18px;border:0;border-radius:10px;background:none;font:600 14px var(--f);color:#cec8ea;cursor:pointer}
.vt button[aria-pressed="true"]{background:#fff;color:var(--violet2)}
.per .t button{border:0;background:none;padding:7px 13px;border-radius:9px;font:600 13px var(--f);color:var(--ink2);cursor:pointer}.per .t button[aria-pressed="true"]{background:#fff;color:var(--violet2);box-shadow:0 1px 3px rgba(18,14,43,.12)}

#prange[hidden]{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}.dot.loading{background:#F1B6FA;animation:pulse 1s infinite}.dot.error{background:#ff6b6b}@keyframes pulse{50%{opacity:.35}}
.sh{width:100%;border:0;background:#fff;text-align:left;cursor:pointer;font:inherit}
.sec.closed .sb{display:none}.sec.closed .sh{border-bottom:0}.sec.closed>.sh .cv,.wc.closed .cv{transform:rotate(-90deg)}
.wh{width:100%;border:0;background:#fff;text-align:left;cursor:pointer;font:inherit}
.tw{overflow-x:auto}
.wb table{min-width:900px}table.lt{min-width:980px}
.empty{padding:28px 24px;text-align:center;color:var(--ink3);font-size:14px}.empty.big{padding:56px 24px;font-size:15px}

.sec .sh span.ct{display:inline-grid}

/* List view */
.pkbars{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.pkbar{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 20px;box-shadow:var(--sh);max-width:100%;overflow-x:auto}
.pkl{font:700 10.5px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4);white-space:nowrap}
.lsub{display:inline-flex;gap:2px;background:#F4F1FB;border-radius:12px;padding:3px}
.lsub button{border:0;background:none;padding:8px 14px;border-radius:9px;font:600 13px var(--f);color:var(--ink2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.lsub button i{font-style:normal;font:700 11.5px var(--f);color:var(--ink4);background:#fff;border-radius:999px;padding:1px 8px}
.lsub button[aria-pressed="true"]{background:#fff;color:var(--violet2);box-shadow:0 1px 3px rgba(18,14,43,.12)}

.pks button{min-width:46px;justify-content:center}
.pks button[aria-pressed="true"]{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 6px 14px -8px rgba(65,1,247,.8)}
.sb>.lsub{margin:16px 24px 6px}
.lgrp{display:flex;align-items:center;gap:10px;font:800 11px var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--violet2);margin:6px 4px 12px}
.lgrp::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#6601fd,#dd30b1)}
.lgrp::after{content:"";flex:1;height:1px;background:var(--line)}
.ct.v{background:var(--tvbg);color:var(--tvfg)}
table.lt td.pk{font-weight:700;color:var(--ink)}
table.lt td.ex small{color:var(--ink4);font-weight:400}
.pl{display:inline-block;padding:3px 10px;border-radius:999px;font:700 12px var(--f);white-space:nowrap}
.pl.ok{background:var(--okbg);color:var(--ok)}.pl.vi{background:var(--tvbg);color:var(--tvfg)}.pl.rd{background:var(--rose);color:var(--bad)}
.pl.bl{background:var(--tbbg);color:var(--tbfg)}.pl.gy{background:#EFEDF4;color:#6a6488}
table.lt td.c{text-align:right}table.lt th:first-child,table.lt td.who{position:sticky;left:0;z-index:1;background:#fff;box-shadow:8px 0 10px -8px rgba(18,14,43,.12)}table.lt th:first-child{background:#FBFAFE}
.more{display:block;width:100%;border:0;border-top:1px solid var(--edge);background:#FAF8FE;padding:13px;font:700 13px var(--f);color:var(--violet2);cursor:pointer}.more:hover{background:#F4EFFE}
table.lt th,table.lt td{padding-left:16px;padding-right:16px}table.lt td.ds{max-width:320px;min-width:240px}

<body>
<div class="hero"><div class="hin"><div><h1>Renewal Pipeline</h1><div class="sub" id="psub"></div></div>
<div class="hr"><div class="upd"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div>
<div class="vt" id="vt" role="group" aria-label="View"><button type="button" data-v="glance" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Glance</button><button type="button" data-v="list" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</button></div></div></div></div>
<div class="page">
<div class="bar"><nav class="seg" id="centre-toggle" aria-label="Centre"></nav>
<div class="per"><div class="t" id="mode"><button type="button" data-m="month" aria-pressed="true">Month</button><button type="button" data-m="range" aria-pressed="false">Date range</button></div>
<div id="pmonth" style="display:flex;align-items:center;gap:6px"><button class="m" id="prev" aria-label="Previous month">‹</button><div class="l" id="mlabel">—</div><button class="m" id="next" aria-label="Next month">›</button></div>
<div id="prange" class="range" hidden><input type="date" id="from" aria-label="From"><span>to</span><input type="date" id="to" aria-label="To"></div></div></div>
<div id="out"></div>
</div>
<script>
const CENTRES=[{city:'Chennai',name:'Alwarpet'},{city:'Chennai',name:'Thoraipakkam'},{city:'Bangalore',name:'Borewell Road'}];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function parseDate(str){
  if(!str)return null;const s=String(str).trim();
  const a=s.match(/^(\d{1,2})-([A-Za-z]+)-(\d{2,4})$/);
  if(a){const m=MON.findIndex(x=>x.toLowerCase()===a[2].slice(0,3).toLowerCase());const y=a[3].length===2?2000+ +a[3]:+a[3];if(m>=0)return new Date(y,m,+a[1]);}
  const b=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(b){const y=b[3].length===2?2000+ +b[3]:+b[3];return new Date(y,+b[2]-1,+b[1]);}
  const d=new Date(s);return isNaN(d)?null:d;
}
const parseNum=s=>s?parseFloat(String(s).replace(/[^0-9.\-]/g,''))||0:0;
const inr=x=>'₹'+Math.round(x).toLocaleString('en-IN');
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>d?String(d.getDate()).padStart(2,'0')+'-'+MON[d.getMonth()]+'-'+String(d.getFullYear()).slice(2):'—';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const NOW=new Date(),TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const days=(a,b)=>Math.round((b-a)/864e5);
const valid=d=>d&&d.getFullYear()>=2020?d:null;
async function fetchTab(centre,tab){const rows=await ArtiumAuth.fetchRows(centre,tab);return rows.slice(2).filter(r=>r[0]&&r[0].toLowerCase()!=='date');}
let DATA={},ITEMS=null,GAPS=[],ALL=[],TARGETS={};   // TARGETS['2026-10']['Alwarpet']={renewed, rncol, …} from the Targets page   // ALL: every membership row, for the renewal totals

/* Columns used: A Date · D Learner ID · E Name · H Mobile · I Course · M No. of months · Q / R amount paid · X Membership end date · Z Renewal Status · AD Teacher
   and, sent by the data service after AD: 33 Description · 34 Next Call Date (promised payment date) · 35 Expected (promised amount) · 36 Probability of Conversion.
   Every row is one membership. A row with a promised date and amount is one promised renewal. It counts as renewed when the same Learner ID
   has a later payment (or its Renewal Status says Renewed); as "won't renew" when the status says so; otherwise it is still to come. */
function build(){
  const T=[];
  CENTRES.forEach(c=>{const d=DATA[c.name];if(!d)return;
    [['fs',d.fs,17],['rn',d.rn,16]].forEach(([tab,rows,amt])=>rows.forEach(r=>{const date=parseDate(r[0]);if(!date)return;
      T.push({r,centre:c.name,tab,date,id:String(r[3]||'').trim().toUpperCase(),paid:parseNum(r[amt]),m:parseNum(r[12]),end:valid(parseDate(r[23])),newEnd:valid(parseDate(r[36])),ext:parseNum(r[37])||0,status:String(r[25]||'').trim(),
        desc:String(r[32]||'').trim(),ncd:valid(parseDate(r[33])),exp:parseNum(r[34]),prob:String(r[35]||'').trim()});}));});
  const byId=new Map();T.forEach(t=>{if(t.id)(byId.get(t.id)||byId.set(t.id,[]).get(t.id)).push(t);});
  byId.forEach(l=>l.sort((a,b)=>a.date-b.date));
  // For every renewal: when was the membership it renews due? (the end date of the same Learner ID's previous entry)
  byId.forEach(l=>l.forEach((t,i)=>{if(t.tab==='rn'&&i>0)t.prevEnd=l[i-1].end;}));
  ALL=T;
  // Due for renewal: the latest membership of each Learner ID that hasn't been renewed yet (no later Renewals entry), and isn't marked Won't renew.
  // Those with a promised date and amount are in the pipeline; the rest are listed by what is missing.
  GAPS=[];byId.forEach(l=>{const t=l[l.length-1];if(!t.end||/will not renew|discontinu|refund|^renewed$/i.test(t.status))return;
    const miss=!t.ncd&&!(t.exp>0)?'none':t.ncd&&!(t.exp>0)?'noamt':!t.ncd?'nodate':'';if(!miss)return;
    const phone=String(t.r[7]||'').replace(/\D/g,'').slice(-10);
    GAPS.push({...t,miss,phone,name:String(t.r[4]||'').trim(),course:String(t.r[8]||'').trim(),teacher:String(t.r[29]||'').trim()});});
  return T.filter(t=>t.ncd&&t.exp>0).map(t=>{
    const later=(byId.get(t.id)||[]).find(x=>x!==t&&x.date>t.date&&x.tab==='rn');
    let state='wait',paidOn=null,paidAmt=0;
    if(later){state='paid';paidOn=later.date;paidAmt=later.paid;}
    else if(/^renewed$/i.test(t.status)){state='paid';paidOn=valid(parseDate(t.r[26]));}
    else if(/will not renew|discontinu|refund/i.test(t.status))state='lost';
    if(state==='wait'&&t.ncd<TODAY)state='late';
    const phone=String(t.r[7]||'').replace(/\D/g,'').slice(-10);
    return {...t,state,paidOn,paidAmt,phone,name:String(t.r[4]||'').trim(),course:String(t.r[8]||'').trim(),teacher:String(t.r[29]||'').trim(),age:String(t.r[6]||'').trim(),pack:t.m?Math.round(t.m)+'M':''};
  });
}


function buildDue(){
  const byId=new Map();ALL.forEach(t=>{if(t.id)(byId.get(t.id)||byId.set(t.id,[]).get(t.id)).push(t);});
  return ALL.filter(t=>t.end).map(t=>{const r=t.r,later=(byId.get(t.id)||[]).filter(x=>x!==t&&x.tab==='rn'&&x.date>t.date).sort((a,b)=>a.date-b.date)[0];
    let st='due';if(later||/^renewed$/i.test(t.status))st='paid';else if(/will not renew|won'?t renew|discontinu|refund/i.test(t.status))st='lost';else if(t.end<TODAY)st='late';
    return{...t,st,paidOn:later?later.date:null,name:String(r[4]||'').trim(),phone:String(r[7]||'').replace(/\D/g,'').slice(-10),age:String(r[6]||'').trim(),course:String(r[8]||'').trim(),
      level:String(r[9]||'').trim(),pack:t.m?Math.round(t.m)+'M':'',start:valid(parseDate(r[22])),teacher:String(r[29]||'').trim(),reason:String(r[28]||'').trim(),comp:parseNum(r[38])||0};});
}

function period(){
  if(mode==='month')return{a:new Date(viewY,viewM,1),b:new Date(viewY,viewM+1,0),label:MONTH_FULL[viewM]+' '+viewY};
  const a=rFrom||new Date(viewY,viewM,1),b=rTo||new Date(viewY,viewM+1,0);

}


/* ── State ── */
let DUE=null;
let selCentre=(()=>{try{const v=localStorage.getItem('artium_rp_centre');return CENTRES.some(c=>c.name===v)?v:'All';}catch(e){return'All';}})();
let view=(()=>{try{return localStorage.getItem('artium_rp_view')==='list'?'list':'glance';}catch(e){return'glance';}})();
let FOLD=(()=>{try{return JSON.parse(localStorage.getItem('artium_rp_fold')||'{}')||{};}catch(e){return{};}})();   // sections folded by the viewer
let mode='month',viewY=NOW.getFullYear(),viewM=NOW.getMonth(),rFrom=null,rTo=null;
const n=v=>Math.round(v).toLocaleString('en-IN');
const pc=(a,b)=>b?Math.round(a/b*100)+'%':'–';
const inP=(d,P)=>d&&d>=P.a&&d<=P.b;
const CHEV='<span class="cv" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>';

/* Weeks of the period: Tuesday to Sunday. Monday is the weekly off, so a Monday belongs to the week before it (the week ends on Monday).
   The first and last weeks can be short. */
function weeksOf(P){
  const W=[];let s=new Date(P.a);
  while(s<=P.b){const e=new Date(s);while(e.getDay()!==1&&e<P.b)e.setDate(e.getDate()+1);
    W.push({a:new Date(s),b:new Date(e)});s=new Date(e);s.setDate(s.getDate()+1);}
  return W;
}
const span=w=>w.a.getMonth()===w.b.getMonth()?(w.a.getDate()===w.b.getDate()?`${w.a.getDate()} ${MON[w.a.getMonth()]}`:`${w.a.getDate()}–${w.b.getDate()} ${MON[w.b.getMonth()]}`)
  :`${w.a.getDate()} ${MON[w.a.getMonth()]}–${w.b.getDate()} ${MON[w.b.getMonth()]}`;

/* The current month cohort: every membership whose Package Expiry Date falls in the period. Each learner lands in one outcome only,
   in this order: renewed, pipeline (promised date in the period and an expected amount), will not renew, extended (extension days above 0),
   and anyone left is yet to connect. First-time = a Fresh Sales membership, repeated = a Renewals one. */
function outcome(x,P){
  if(x.st==='paid')return'ren';
  if(x.ncd&&x.exp>0&&inP(x.ncd,P))return'pipe';
  if(x.st==='lost')return'wnr';
  if(x.ext>0)return'ext';
  return'ytc';
}

/* ── Building blocks ── */
function fold(key,def=false){return key in FOLD?FOLD[key]:def;}
function section(key,title,extra,body,cls=''){
  return`<section class="sec ${cls}${fold(key)?' closed':''}" data-k="${key}"><button type="button" class="sh" aria-expanded="${!fold(key)}"><b>${title}</b>${extra||''}${CHEV}</button><div class="sb">${body}</div></section>`;
}
function wtable(W,P,rows){
  const tl=mode==='month'?MONTH_FULL[viewM]:'Period';
  const cur=W.findIndex(w=>TODAY>=w.a&&TODAY<=w.b),cc=i=>(i===cur?'cw':'')+(i===W.length?' tt':'');
  let h='<div class="tw"><table><thead><tr><th></th>'+W.map((w,i)=>`<th class="${cc(i)}"><b>Week ${i+1}</b>${i===cur?'<em>This week</em>':''}<small>${span(w)}</small></th>`).join('')
    +`<th class="tt"><b>${tl}</b><small>Total</small></th></tr></thead><tbody>`;
  rows.forEach(r=>{
    if(r.h){h+=`<tr class="grp2"><th colspan="${W.length+2}">${r.h}</th></tr>`;return;}
    if(r.opt&&!r.v[r.v.length-1])return;
    const dot=r.cls&&/wnr/.test(r.cls)?'<i class="dt r"></i>':r.cls&&/ytc/.test(r.cls)?'<i class="dt g"></i>':'';
    h+=`<tr class="${r.cls||''}"><th scope="row">${dot}${r.l}</th>`+r.v.map((x,i)=>`<td class="${cc(i)}">${x}</td>`).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function part(key,L,title,summary,body){
  return`<div class="wc${fold(key)?' closed':''}" data-k="${key}"><button type="button" class="wh" aria-expanded="${!fold(key)}"><span class="lb">${L}</span><span class="wt">${title}</span><span class="ws">${summary}</span>${CHEV}</button><div class="wb">${body}</div></div>`;
}
const SUM=(...kv)=>kv.map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join('');

function learnerList(list,ext){
  if(!list.length)return'<div class="empty">No learners here.</div>';

  let h=`<div class="tw"><table class="lt"><thead><tr><th>Learner</th><th>Course</th><th>Age group</th><th>Course level</th><th>Teacher</th>${ext?'<th>Extension</th>':''}<th>Latest discussion</th></tr></thead><tbody>`;
  list.slice().sort((a,b)=>a.end-b.end||a.name.localeCompare(b.name)).forEach(x=>{
    h+=`<tr><td class="who"><b>${esc(x.name)||'—'}</b><span class="tg ${x.tab==='rn'?'rr':'ft'}">${x.tab==='rn'?'RR':'FTR'}</span><small>${esc(x.id)}${sel?'':' · '+esc(x.centre)} · due ${fmtD(x.end)}</small></td>
      <td>${esc(x.course)||'—'}</td><td>${esc(x.age)||'—'}</td><td>${esc(x.level)||'—'}</td><td>${esc(x.teacher)||'—'}</td>
      ${ext?`<td class="ex">${Math.round(x.ext)} day${Math.round(x.ext)===1?'':'s'}${x.newEnd?' · to '+fmtD(x.newEnd):''}</td>`:''}
      <td class="ds">${esc(x.desc)||'<span class="mut">—</span>'}</td></tr>`;});

/* ── The page ── */
function render(){
  const sel=CENTRES.find(c=>c.name===selCentre);
  document.querySelectorAll('.ct-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===selCentre));
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  document.querySelectorAll('#vt button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  document.getElementById('pmonth').style.display=mode==='month'?'flex':'none';document.getElementById('prange').hidden=mode!=='range';
  const P=period();document.getElementById('mlabel').textContent=P.label;document.getElementById('psub').textContent=P.label;   // the selected period, under the title
  if(mode==='range'){document.getElementById('from').value=iso(P.a);document.getElementById('to').value=iso(P.b);}
  const out=document.getElementById('out');
  if(!DUE){out.innerHTML='<section class="sec"><div class="empty big">Loading…</div></section>';return;}
  const mine=x=>!sel||x.centre===sel.name;
  const isCur=mode==='month'&&viewY===NOW.getFullYear()&&viewM===NOW.getMonth();
  if(view==='list'){out.innerHTML=listView(P,mine,sel);bindList(out);return;}

  /* At a glance (as on Monthly Performance Analysis): due = memberships whose package expires in the period;
     achieved = every renewal paid in the period, whenever it was due; pipeline = promised payments in the period not paid yet */
  const due=DUE.filter(x=>mine(x)&&inP(x.end,P));
  const rnl=ALL.filter(x=>mine(x)&&x.tab==='rn'&&inP(x.date,P));
  const col=rnl.reduce((s,x)=>s+x.paid,0),atv=rnl.length?col/rnl.length:null;
  const prom=(ITEMS||[]).filter(x=>mine(x)&&inP(x.ncd,P)),pipe=prom.filter(x=>x.state==='wait'||x.state==='late'),late=pipe.filter(x=>x.state==='late');
  const expAmt=pipe.reduce((s,x)=>s+x.exp,0),lateAmt=late.reduce((s,x)=>s+x.exp,0);
  // Targets (monthly, from the Targets page): Month view only. Actual and target both cover the centres that have a target.
  const tg=mode==='month'?(TARGETS[viewY+'-'+String(viewM+1).padStart(2,'0')]||{}):{},cs=(sel?[sel]:CENTRES).map(c=>c.name);
  const tgt=key=>{const has=cs.filter(c=>tg[c]&&tg[c][key]!=null);return has.length?{v:has.reduce((s,c)=>s+tg[c][key],0),has}:null;};
  const Tn=tgt('renewed'),Ta=tgt('rncol');
  const act=(T,f)=>T?rnl.filter(x=>T.has.includes(x.centre)).reduce((s,x)=>s+f(x),0):0;
  const pip=(T,f)=>T?pipe.filter(x=>T.has.includes(x.centre)).reduce((s,x)=>s+f(x),0):0;
  const prog=(T,actual,money)=>{if(!T||!T.v)return'';const p=actual/T.v*100;
    return`<div class="pg"><div class="x"><span>Target – ${money?inr(T.v):n(T.v)}</span><b>${Math.round(p)}%</b></div><div class="tr"><i style="width:${Math.min(100,p)}%"></i></div></div>`;};
  // ATV target: the renewal collections target ÷ the renewals target, for centres that have both
  const Tatv=(()=>{const has=cs.filter(c=>tg[c]&&tg[c].renewed&&tg[c].rncol!=null);if(!has.length)return null;
    const nn=has.reduce((s,c)=>s+tg[c].renewed,0),aa=has.reduce((s,c)=>s+tg[c].rncol,0),l=rnl.filter(x=>has.includes(x.centre));
    return{v:aa/nn,act:l.length?l.reduce((s,x)=>s+x.paid,0)/l.length:0};})();
  const card=(t,v,extra,cls='')=>`<div class="k ${cls}"><div class="t">${t}</div><div class="v">${v}</div>${extra||''}</div>`;
  const rrN=rnl.length+pipe.length,rrAmt=col+expAmt;
  const glance=`<div class="rw"><div class="rl">Achieved so far</div><div class="cards">
      ${card('Renewals due',n(due.length))}
      ${card('Renewals achieved',n(rnl.length),prog(Tn,act(Tn,()=>1)))}
      ${card('Collections – Renewals',inr(col),prog(Ta,act(Ta,x=>x.paid),true))}
      ${card('ATV – Renewals',atv==null?'–':inr(atv),Tatv?prog({v:Tatv.v},Tatv.act,true):'')}</div></div>
    <div class="rw"><div class="rl">Pipeline and run-rate</div><div class="cards">
      ${card('Expected payments',n(pipe.length),`<div class="s"><b>${n(pipe.length-late.length)}</b> yet to pay${late.length?` · <span class="bd">${n(late.length)} overdue</span>`:''}</div>`)}
      ${card('Expected collections',inr(expAmt),lateAmt?`<div class="s"><span class="bd">${inr(lateAmt)} overdue</span></div>`:'')}
      ${card('Run-rate · renewals',n(rrN),prog(Tn,act(Tn,()=>1)+pip(Tn,()=>1)),'rr')}
      ${card('Run-rate · collections',inr(rrAmt),prog(Ta,act(Ta,x=>x.paid)+pip(Ta,x=>x.exp),true),'rr')}</div></div>`;

  /* Week on Week view */
  const W=weeksOf(P),wi=d=>W.findIndex(w=>d>=w.a&&d<=w.b);
  const zero=()=>W.map(()=>0).concat(0);
  const put=(arr,d)=>{const i=wi(d);if(i>=0){arr[i]++;arr[W.length]++;}};
  const cohort=due.map(x=>({...x,oc:outcome(x,P)}));
  // A: renewals paid in the period, by the week they were paid, split by when the renewed membership was due
  const rCur=zero(),rPrev=zero(),rAdv=zero(),rUnk=zero(),dueW=zero();
  cohort.forEach(x=>put(dueW,x.end));
  rnl.forEach(x=>put(inP(x.prevEnd,P)?rCur:x.prevEnd&&x.prevEnd<P.a?rPrev:x.prevEnd&&x.prevEnd>P.b?rAdv:rUnk,x.date));
  const ach=dueW.map((_,i)=>rCur[i]+rPrev[i]+rAdv[i]+rUnk[i]),effW=ach.map((a,i)=>pc(a,dueW[i]));
  const byOc=(list,oc)=>{const a=zero();list.filter(x=>x.oc===oc).forEach(x=>put(a,x.end));return a;};
  const A=[{l:'Renewals due',v:dueW,cls:'key'},{l:'Renewed – current month cohort',v:rCur},{l:"Renewed – previous months' cohorts",v:rPrev},
    {l:'Renewed – in advance',v:rAdv,opt:1},{l:'Renewed – earlier entry not found',v:rUnk,opt:1},
    {l:'Total renewals achieved',v:ach,cls:'acc strong'},{l:'Renewal collection efficiency',v:effW,cls:'acc'},{l:'Yet to renew',v:dueW.map((d,i)=>d-ach[i]),cls:'ytr'},   // renewals due − total renewals achieved
    
    {h:(mode==='month'?'Current month cohort':'Cohort due in this period')+' · where the rest stand'},
    {l:'Pipeline',v:byOc(cohort,'pipe')},{l:'Extended',v:byOc(cohort,'ext')},{l:'Will not renew',v:byOc(cohort,'wnr'),cls:'wnr'},{l:'Yet to connect',v:byOc(cohort,'ytc'),cls:'ytc'}];
  // B and C: first-time and repeated renewals of the cohort, by the week the package expires
  const typ=tab=>{const L=cohort.filter(x=>x.tab===tab),d=zero(),r=byOc(L,'ren'),p=byOc(L,'pipe');L.forEach(x=>put(d,x.end));
    const rr=r.map((x,i)=>x+p[i]);
    return{rows:[{l:'Due',v:d,cls:'key'},{l:'Renewed',v:r},{l:'Renewal %',v:r.map((x,i)=>pc(x,d[i])),cls:'acc'},{l:'Yet to renew',v:d.map((x,i)=>x-r[i]),cls:'ytr'},{h:'Pipeline and run-rate'},
      {l:'Pipeline',v:p},{l:'Run-rate',v:rr,cls:'acc strong'},{l:'Projected renewal %',v:rr.map((x,i)=>pc(x,d[i])),cls:'acc'},{h:'Other outcomes'},
      {l:'Extended',v:byOc(L,'ext')},{l:'Will not renew',v:byOc(L,'wnr'),cls:'wnr'},{l:'Yet to connect',v:byOc(L,'ytc'),cls:'ytc'}],
      sum:SUM(['Due',n(d[W.length])],['Renewed',n(r[W.length])],['Run-rate',n(rr[W.length])])};};
  const B=typ('fs'),C=typ('rn');
  // D: the pipeline (promised payments in the period, not paid yet), by the week of the promised date, split by when the membership fell due
  const pm=new Date(P.a.getFullYear(),P.a.getMonth()-1,1);
  const DK=[['xprev','Extended from previous month'],['cur',mode==='month'?'Due in current month':'Due in this period'],['prev','Due in previous month',1],
    ['past','Due in past months'],['xpast','Extended in past months'],['fut','Due in future months',1],['none','Package expiry not recorded',1]];
  const dv={};DK.forEach(([k])=>dv[k]=zero());
  pipe.forEach(x=>{const e=x.end;const k=!e?'none':inP(e,P)?'cur':e>P.b?'fut':e>=pm?(x.ext>0?'xprev':'prev'):(x.ext>0?'xpast':'past');put(dv[k],x.ncd);});
  const dt=zero();Object.values(dv).forEach(a=>a.forEach((x,i)=>dt[i]+=x));
  const D=DK.map(([k,l,o])=>({l,v:dv[k],opt:o})).concat([{l:'Total pipeline',v:dt,cls:'acc strong tline'}]);
  const wow=`<div class="wvb">
    ${part('wA','A','Renewal breakdown',SUM(['Due',n(due.length)],['Achieved',n(rnl.length)],['Efficiency',pc(rnl.length,due.length)]),wtable(W,P,A))}
    ${part('wB','B','First-time renewals',B.sum,wtable(W,P,B.rows))}
    ${part('wC','C','Repeated renewals',C.sum,wtable(W,P,C.rows))}
    ${part('wD','D','Pipeline breakdown',SUM(['Total pipeline',n(pipe.length)]),wtable(W,P,D))}</div>`;

  const wnr=cohort.filter(x=>x.oc==='wnr'),ext=cohort.filter(x=>x.oc==='ext');
  const coh=mode==='month'?'current month cohort':'cohort due in this period';
  out.innerHTML=section('glance','At a glance',`<span>${esc(P.label)}${isCur?' · so far':''}</span>`,glance)
    +section('wow','Week on Week view','',wow,'wowsec')
    +section('wnr','Will not renew',`<span class="ct r">${wnr.length}</span><span>${coh}</span>`,learnerList(wnr,false))
    +section('ext','Extended',`<span class="ct b">${ext.length}</span><span>${coh}</span>`,learnerList(ext,true));
  out.querySelectorAll('[data-k]>button').forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.k;FOLD[k]=!fold(k);try{localStorage.setItem('artium_rp_fold',JSON.stringify(FOLD));}catch(e){}render();});
}


/* ── List view ── Package filter (the length of the membership that falls due, or the latest one) applies to every list. */
const PKGS=['all','1','3','6','9','12','15'];
let pkg=(()=>{try{const v=localStorage.getItem('artium_rp_pkg');return PKGS.includes(v)?v:'all';}catch(e){return'all';}})();
let LSUB=(()=>{try{return Object.assign({due:'all',one:'act'},JSON.parse(localStorage.getItem('artium_rp_lsub')||'{}'));}catch(e){return{due:'all',one:'act'};}})();
let RENV=(()=>{try{const v=localStorage.getItem('artium_rp_ren');return['all','not','ren'].includes(v)?v:'all';}catch(e){return'all';}})();
const OC={ren:['Renewed','ok'],pipe:['Pipeline','vi'],wnr:['Will not renew','rd'],ext:['Extended','bl'],ytc:['Yet to connect','gy']};
const pill=(t,c)=>`<span class="pl ${c}">${t}</span>`;
function subT(key,opts){return`<div class="lsub" role="group">${opts.map(([v,l,c])=>`<button type="button" data-sub="${key}" data-v="${v}" aria-pressed="${LSUB[key]===v}">${l}<i>${c}</i></button>`).join('')}</div>`;}
function who(x,sel){return`<td class="who"><b>${esc(x.name)||'—'}</b><span class="tg ${x.tab==='rn'?'rr':'ft'}">${x.tab==='rn'?'RR':'FTR'}</span><small>${esc(x.id)}${sel?'':' · '+esc(x.centre)}${x.course?' · '+esc(x.course):''}</small></td>`;}
/* Where a learner stands now (the All time lists): renewed, will not renew, extended or paused, a promised payment, or yet to connect */
function nowOc(x){if(x.st==='paid')return'ren';if(x.st==='lost')return'wnr';if(x.ext>0||/extend|pause/i.test(x.status))return'ext';if(x.ncd&&x.exp>0)return'pipe';return'ytc';}

}
function listView(P,mine,sel){
  const okP=x=>pkg==='all'||Math.round(x.m)===+pkg;
  // Each learner's memberships in order; the latest one says where they stand now
  const byId=new Map();DUE.filter(mine).forEach(x=>{if(x.id)(byId.get(x.id)||byId.set(x.id,[]).get(x.id)).push(x);});
  const latest=[];byId.forEach(l=>{l.sort((a,b)=>a.date-b.date);latest.push(Object.assign(l[l.length-1],{hist:l}));});
  const tdc=(v,c='')=>`<td class="${c}">${v||'<span class="mut">—</span>'}</td>`;
  const stat=(x,oc)=>`<td>${pill(oc==='ext'&&/pause/i.test(x.status)?'Paused':OC[oc][0],OC[oc][1])}</td>`;
  /* The columns every list shows, after the learner and any column of its own */
  const STD=(ocf,own)=>[['Learner',x=>who(x,sel)],['Course level',x=>tdc(esc(x.level))],['Age group',x=>tdc(esc(x.age))],['Teacher',x=>tdc(esc(x.teacher))],
    ['Package',x=>tdc(x.pack,'pk')],...(own||[]),['Status',x=>stat(x,ocf(x))],
    ['Package expiry',x=>tdc(fmtD(x.end))],['Compensations due',x=>tdc(x.comp?n(x.comp):'','c')],['Extension',x=>tdc(x.ext?Math.round(x.ext)+' day'+(Math.round(x.ext)===1?'':'s'):'','ex')],
    ['New package expiry',x=>tdc(x.newEnd?fmtD(x.newEnd):'')],['Expected payment date',x=>tdc(x.ncd?fmtD(x.ncd):'')],['Expected collections',x=>tdc(x.exp>0?inr(x.exp):'','c')],
    ['Latest discussion',x=>`<td class="ds">${esc(x.desc)||'<span class="mut">—</span>'}</td>`]];
  const okR=(x,ocf)=>RENV==='all'||(RENV==='ren')===(ocf(x)==='ren');
  const dueOc=x=>outcome(x,P);

  /* Due in the period: every membership whose package expires in it */
  const due=DUE.filter(x=>mine(x)&&inP(x.end,P)&&okP(x)&&okR(x,dueOc)).sort((a,b)=>a.end-b.end||a.name.localeCompare(b.name));
  const dFT=due.filter(x=>x.tab==='fs'),dRR=due.filter(x=>x.tab==='rn'),dL=LSUB.due==='ft'?dFT:LSUB.due==='rr'?dRR:due;
  const sDue=subT('due',[['all','All renewals due',due.length],['ft','First-time renewals',dFT.length],['rr','Repeated renewals',dRR.length]])
    +ltable(dL,STD(dueOc),sel,'due');

  /* Learners with at least two 1-month renewals */
  const one=latest.filter(x=>x.hist.filter(h=>h.tab==='rn'&&Math.round(h.m)===1).length>=2&&okP(x)).map(x=>Object.assign(x,{n1:x.hist.filter(h=>h.tab==='rn'&&Math.round(h.m)===1).length}));
  // Active: the membership of theirs that falls due in the period (renewed or not)
  const oAct=one.map(x=>{const d=x.hist.find(h=>inP(h.end,P));return d?Object.assign(d,{n1:x.n1}):null;}).filter(x=>x&&okR(x,dueOc)).sort((a,b)=>a.end-b.end);
  const oIn=one.filter(x=>x.st!=='paid'&&x.end<TODAY&&okR(x,nowOc)).sort((a,b)=>b.end-a.end);
  const n1=['1-month renewals',x=>`<td class="pk">${x.n1}</td>`],why=['Reason for discontinuing',x=>tdc(esc(x.reason))];
  const sOne=subT('one',[['act','Active · due in '+P.label,oAct.length],['in','Inactive',oIn.length]])
    +(LSUB.one==='in'?ltable(oIn,STD(nowOc,[n1,why]),sel,'oin'):ltable(oAct,STD(dueOc,[n1]),sel,'oact'));

  /* Left because of affordability */
  const aff=latest.filter(x=>x.st!=='paid'&&/afford/i.test(x.reason||'')&&okP(x)&&okR(x,nowOc)).sort((a,b)=>b.end-a.end);
  const sAff=ltable(aff,STD(nowOc,[['Renewals',x=>`<td class="pk">${x.hist.filter(h=>h.tab==='rn').length}</td>`]]),sel,'aff');

  /* Extended or paused, not renewed yet */
  const ext=latest.filter(x=>x.st!=='paid'&&/extend|pause/i.test(x.status)&&okP(x)&&okR(x,nowOc)).sort((a,b)=>(a.newEnd||a.end)-(b.newEnd||b.end));
  const sExt=ltable(ext,STD(nowOc),sel,'ext');

  const bar=`<div class="pkbars"><div class="pkbar"><span class="pkl">Previous package</span><div class="lsub pks" role="group">${PKGS.map(v=>`<button type="button" data-pkg="${v}" aria-pressed="${pkg===v}">${v==='all'?'All':v+'M'}</button>`).join('')}</div></div>`
    +`<div class="pkbar"><span class="pkl">Show</span><div class="lsub pks" role="group">${[['all','All'],['not','Not renewed'],['ren','Renewed']].map(([v,l])=>`<button type="button" data-ren="${v}" aria-pressed="${RENV===v}">${l}</button>`).join('')}</div></div></div>`;
  const cnt=(n,c='')=>`<span class="ct ${c}">${n}</span>`;
  return bar
    +`<div class="lgrp">Due in ${esc(P.label)}</div>`
    +section('l_due','Renewals due',cnt(due.length,'v')+`<span>${esc(P.label)}</span>`,sDue)
    +`<div class="lgrp">All time</div>`
    +section('l_one','Repeated 1-month renewers',cnt(one.length,'v')+'<span>at least two 1-month renewals</span>',sOne)
    +section('l_aff','Left because of affordability',cnt(aff.length,'r')+'<span>latest departures first</span>',sAff)
    +section('l_ext','Extended or paused, not renewed yet',cnt(ext.length,'b'),sExt);
}
function bindList(out){
  out.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{LSHOW[b.dataset.more]=!LSHOW[b.dataset.more];render();});
  out.querySelectorAll('[data-pkg]').forEach(b=>b.onclick=()=>{pkg=b.dataset.pkg;try{localStorage.setItem('artium_rp_pkg',pkg);}catch(e){}render();});
  out.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{RENV=b.dataset.ren;try{localStorage.setItem('artium_rp_ren',RENV);}catch(e){}render();});
  out.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{LSUB[b.dataset.sub]=b.dataset.v;try{localStorage.setItem('artium_rp_lsub',JSON.stringify(LSUB));}catch(e){}render();});
  out.querySelectorAll('[data-k]>button').forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.k;FOLD[k]=!fold(k);try{localStorage.setItem('artium_rp_fold',JSON.stringify(FOLD));}catch(e){}render();});
}

/* ── Controls ── */
document.getElementById('centre-toggle').innerHTML=[{name:'All',label:'All centres',city:CENTRES.length+' centres'}].concat(CENTRES.map(c=>({name:c.name,label:c.name,city:c.city})))
  .map(o=>`<button class="ct-btn" data-c="${o.name}" aria-pressed="false"><small>${o.city}</small><span>${o.label}</span></button>`).join('');
document.querySelectorAll('.ct-btn').forEach(b=>b.onclick=()=>{selCentre=b.dataset.c;try{localStorage.setItem('artium_rp_centre',selCentre);}catch(e){}render();});
document.querySelectorAll('#vt button').forEach(b=>b.onclick=()=>{view=b.dataset.v;try{localStorage.setItem('artium_rp_view',view);}catch(e){}render();});
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;if(mode==='range'&&!rFrom){rFrom=new Date(viewY,viewM,1);rTo=new Date(viewY,viewM+1,0);}render();});
document.getElementById('prev').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--;}render();};
document.getElementById('next').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++;}render();};
['from','to'].forEach(id=>document.getElementById(id).onchange=e=>{const d=fromIso(e.target.value);if(!d)return;if(id==='from')rFrom=d;else rTo=d;if(rFrom&&rTo&&rFrom>rTo)[rFrom,rTo]=[rTo,rFrom];render();});

async function load(){
  render();
  try{
    const res=await Promise.all(CENTRES.map(c=>Promise.all([fetchTab(c.name,'Fresh Sales'),fetchTab(c.name,'Renewals')])));
    CENTRES.forEach((c,i)=>{const mine=rows=>rows.filter(x=>!(x[2]||'').trim()||(x[2]||'').trim()===c.name);DATA[c.name]={fs:mine(res[i][0]),rn:mine(res[i][1])};});
    ITEMS=build();DUE=buildDue();
    ArtiumAuth.call('targets',{}).then(j=>{if(j&&j.targets){TARGETS=j.targets;render();}}).catch(()=>{});   // monthly targets (Targets page)
    const t=new Date();
    document.getElementById('updated').textContent='Updated '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('dot').className='dot';render();
  }catch(e){document.getElementById('updated').textContent='Error — '+e.message;document.getElementById('dot').className='dot error';}
}
load();

</script>
