<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renewal Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#dd30b1;--violet:#6601fd;--violet2:#4101f7;--purple:#7b2cf0;--deep:#2B0256;--navy:#01064c;--magenta:#ff319f;--lilac:#ECE7F8;
  --ink:#120e2b;--ink2:#4a4466;--ink3:#6a6488;--ink4:#7a7196;--line:#dcd5ee;--edge:#ece4ff;
  --tvbg:#f1eafe;--tvfg:#6b3fc7;--tpbg:#fde8f1;--tpfg:#b1286a;--tbbg:#eaf0ff;--tbfg:#2f4db8;--rose:#fce2e5;
  --ok:#1f7a4d;--okbg:#e6f5ec;--bad:#B4443A;
  --f:'Onest',system-ui,sans-serif;
  --sh:0 1px 2px rgba(18,14,43,.04),0 18px 40px -26px rgba(65,1,247,.35);
}
body{font-family:var(--f);background:#F6F3FC;color:var(--ink2);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.hero{background:radial-gradient(120% 140% at 85% -20%,#4101f7 0%,rgba(65,1,247,0) 55%),linear-gradient(135deg,#2B0256 0%,#160240 55%,#01064c 100%);padding:34px 48px 92px;color:#fff}
.hin{max-width:1504px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.eb{font:700 11px var(--f);letter-spacing:.18em;text-transform:uppercase;color:#cec8ea;margin-bottom:10px}
h1{font:800 46px/1.05 var(--f);letter-spacing:-.02em;background:linear-gradient(90deg,#FFFFFF 0%,#F1B6FA 45%,#9BB6FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font:400 16px/24px var(--f);color:#cec8ea;margin-top:10px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.upd{font-size:13px;color:#cec8ea;display:flex;align-items:center;gap:8px}.upd i{width:8px;height:8px;border-radius:50%;background:#4ade80}
.vt{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:4px}
.vt b{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;font:600 14px var(--f);color:#cec8ea}
.vt b.on{background:#fff;color:var(--violet2)}
.vt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.page{max-width:1600px;margin:-64px auto 0;padding:0 48px 64px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:var(--sh)}
.seg .c{padding:9px 20px 10px;border-radius:13px}.seg .c small{display:block;font:700 9.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);margin-bottom:3px}
.seg .c span{font:700 15px var(--f);color:var(--ink)}
.seg .c.on{background:linear-gradient(135deg,var(--violet),var(--violet2));box-shadow:0 8px 18px -10px rgba(65,1,247,.8)}.seg .c.on span{color:#fff}.seg .c.on small{color:#d9ccff}
.per{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:var(--sh)}
.per .t{display:inline-flex;background:#F4F1FB;border-radius:11px;padding:3px}.per .t b{padding:7px 13px;border-radius:9px;font:600 13px var(--f);color:var(--ink2)}.per .t b.on{background:#fff;color:var(--violet2);box-shadow:0 1px 3px rgba(18,14,43,.12)}
.per .m{width:34px;height:36px;border-radius:10px;background:#F4F1FB;display:grid;place-items:center;color:var(--ink2)}
.per .l{min-width:150px;text-align:center;font:700 15px var(--f);color:var(--ink)}
.sec{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.sh{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--edge)}
.sh b{font:800 19px var(--f);color:var(--ink);letter-spacing:-.01em}.sh span{font-size:13px;color:var(--ink4)}
.cv{margin-left:auto;width:30px;height:30px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink3);flex:none;background:#fff}
.cv svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.rw{padding:16px 24px 18px}.rw+.rw{border-top:1px solid var(--edge);background:linear-gradient(180deg,#FAF8FE,#fff)}
.rl{font:700 10.5px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4);margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.k{border:1px solid var(--edge);border-radius:16px;padding:15px 18px;background:#fff;min-height:112px;display:flex;flex-direction:column}
.k .t{font:600 13px var(--f);color:var(--ink3)}
.k .v{font:800 30px/1.1 var(--f);color:var(--ink);margin-top:8px;letter-spacing:-.02em}
.k .s{font-size:13px;color:var(--ink3);margin-top:auto;padding-top:10px}.k .s b{color:var(--ink)}.k .s .bd{color:var(--bad);font-weight:700}
.pg{margin-top:auto;padding-top:10px}.pg .x{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-bottom:7px}.pg .x b{color:var(--tvfg);font-weight:800}
.pg .tr{height:6px;border-radius:6px;background:#EEE8FB;overflow:hidden}.pg .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--purple),var(--pink))}
.k.rr{background:linear-gradient(140deg,#6601fd 0%,#4101f7 60%,#2B0256 130%);border:0;color:#fff;box-shadow:0 14px 30px -18px rgba(65,1,247,.9)}
.k.rr .t{color:#d9ccff}.k.rr .v{color:#fff}.k.rr .eq{font-size:12.5px;color:#cec8ea;margin-top:6px}
.k.rr .pg .x{color:#d9ccff}.k.rr .pg .x b{color:#fff}.k.rr .pg .tr{background:rgba(255,255,255,.2)}.k.rr .pg .tr i{background:linear-gradient(90deg,#F1B6FA,#fff)}
.wvb{padding:18px;display:flex;flex-direction:column;gap:14px;background:#FAF8FE}
.wc{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.wh{display:flex;align-items:center;gap:12px;padding:14px 18px}.wc:not(.closed) .wh{border-bottom:1px solid var(--edge)}
.lb{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;display:grid;place-items:center;font:800 12px var(--f);flex:none}
.wt{font:700 15.5px var(--f);color:var(--ink)}
.ws{display:flex;gap:16px;margin-left:14px;font-size:13px;color:var(--ink3)}.ws b{color:var(--ink);font-weight:700;margin-left:3px}
.wc:not(.closed) .ws{display:none}.wc.closed .wb{display:none}.wc.closed .cv{transform:rotate(-90deg)}
.wb table,table.lt{width:100%;border-collapse:collapse}
.wb th,.wb td{padding:11px 18px;text-align:right;border-bottom:1px solid #F1EDF9;font:400 14px var(--f);color:var(--ink2)}
.wb tr:last-child th,.wb tr:last-child td{border-bottom:0}
.wb thead th{padding:12px 18px 10px;background:#FBFAFE;border-bottom:1px solid var(--edge);vertical-align:bottom}
.wb thead th b{font:700 13px var(--f);color:var(--ink)}.wb thead th small{display:block;font:400 11.5px var(--f);color:var(--ink4);margin-top:2px}
.wb thead th em{display:inline-block;font:700 9.5px var(--f);font-style:normal;color:var(--tpfg);background:var(--tpbg);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.wb th[scope=row],.wb thead th:first-child{text-align:left;width:300px;white-space:nowrap;font-weight:500;color:var(--ink2)}
.wb .cw{background:#F8F4FF}.wb td.tt,.wb th.tt{background:#F4F1FB;font-weight:700;color:var(--ink)}
.wb tr.key th,.wb tr.key td{font-weight:700;color:var(--ink)}
.wb tr.acc td{color:var(--tvfg)}.wb tr.strong th,.wb tr.strong td{font-weight:800}.wb tr.strong th{color:var(--ink)}
.wb tr.tline th,.wb tr.tline td{border-top:1px solid var(--line)}
.wb tr.ytr th,.wb tr.ytr td{font-weight:600;color:var(--ink)}
.wb tr.grp2 th{text-align:left;padding:16px 18px 6px;font:700 10px var(--f);letter-spacing:.15em;text-transform:uppercase;color:var(--ink4);background:#fff;border-bottom:0}
.wb tr.wnr th,.wb tr.wnr td{color:var(--bad);background:#FDF3F4}.wb tr.wnr td.cw{background:#FBECEE}.wb tr.wnr td.tt{background:var(--rose);font-weight:700}
.wb tr.ytc th,.wb tr.ytc td{color:var(--ink2);background:#F5F4F8;font-weight:500}.wb tr.ytc td.cw{background:#EFEDF4}.wb tr.ytc td.tt{background:#EAE8F0;font-weight:700}
.dt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;vertical-align:1px}.dt.r{background:#D9665B}.dt.g{background:#9a94b3}
table.lt th{text-align:left;padding:13px 24px 11px;font:700 10.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);background:#FBFAFE;border-bottom:1px solid var(--edge)}
table.lt td{padding:15px 24px;border-bottom:1px solid #F1EDF9;font:400 14px var(--f);color:var(--ink2);vertical-align:top}
table.lt tr:last-child td{border-bottom:0}
table.lt td b{font-weight:700;color:var(--ink)}table.lt td small{display:block;font-size:12px;color:var(--ink4);margin-top:3px}
table.lt th,table.lt td{white-space:nowrap}table.lt td.ds{white-space:normal;max-width:440px;line-height:1.5;color:var(--ink)}table.lt td.ex{color:var(--tbfg);font-weight:600}
.tg{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:6px;font:800 10px var(--f);letter-spacing:.06em;vertical-align:1px}
.tg.ft{background:var(--tpbg);color:var(--tpfg)}.tg.rr{background:var(--tbbg);color:var(--tbfg)}
.sh .ct{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;font:800 12px var(--f)}
.ct.r{background:var(--rose);color:var(--bad)}.ct.b{background:var(--tbbg);color:var(--tbfg)}

button{font:inherit}
.seg .c{border:0;background:none;cursor:pointer;text-align:left}
.ct-btn{display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;border-radius:13px;padding:9px 20px 10px;cursor:pointer;white-space:nowrap;text-align:left}
.ct-btn small{display:block;font:700 9.5px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);margin-bottom:3px}
.ct-btn span{font:700 15px var(--f);color:var(--ink)}.ct-btn:hover{background:#F4F1FB}
.ct-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--violet),var(--violet2));box-shadow:0 8px 18px -10px rgba(65,1,247,.8)}.ct-btn[aria-pressed="true"] span{color:#fff}.ct-btn[aria-pressed="true"] small{color:#d9ccff}
.vt button{display:flex;align-items:center;gap:8px;padding:9px 18px;border:0;border-radius:10px;background:none;font:600 14px var(--f);color:#cec8ea;cursor:pointer}
.vt button[aria-pressed="true"]{background:#fff;color:var(--violet2)}
.per .t button{border:0;background:none;padding:7px 13px;border-radius:9px;font:600 13px var(--f);color:var(--ink2);cursor:pointer}.per .t button[aria-pressed="true"]{background:#fff;color:var(--violet2);box-shadow:0 1px 3px rgba(18,14,43,.12)}
.per .m{border:0;cursor:pointer;font-size:16px}.per .m:hover{background:var(--tvbg);color:var(--violet2)}
.range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}.range input{font:500 14px var(--f);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
#prange[hidden]{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}.dot.loading{background:#F1B6FA;animation:pulse 1s infinite}.dot.error{background:#ff6b6b}@keyframes pulse{50%{opacity:.35}}
.sh{width:100%;border:0;background:#fff;text-align:left;cursor:pointer;font:inherit}
.sec.closed .sb{display:none}.sec.closed .sh{border-bottom:0}.sec.closed>.sh .cv,.wc.closed .cv{transform:rotate(-90deg)}
.wh{width:100%;border:0;background:#fff;text-align:left;cursor:pointer;font:inherit}
.tw{overflow-x:auto}
.wb table{min-width:900px}table.lt{min-width:980px}
.empty{padding:28px 24px;text-align:center;color:var(--ink3);font-size:14px}.empty.big{padding:56px 24px;font-size:15px}
.mut{color:#C9C3DD}
.sec .sh span.ct{display:inline-grid}
@media (max-width:1100px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.hero{padding:24px 16px 80px}.hin{flex-direction:column;align-items:flex-start}.hr{align-items:flex-start}h1{font-size:32px}.page{padding:0 16px 48px}.bar{flex-direction:column;align-items:stretch;gap:12px}.seg{overflow-x:auto}.cards{grid-template-columns:1fr}.ws{display:none!important}}
/* List view */
.pkbars{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.pkbar{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 20px;box-shadow:var(--sh);max-width:100%;overflow-x:auto}
.pkl{font:700 10.5px var(--f);letter-spacing:.16em;text-transform:uppercase;color:var(--ink4);white-space:nowrap}
.lsub{display:inline-flex;gap:2px;background:#F4F1FB;border-radius:12px;padding:3px}
.lsub button{border:0;background:none;padding:8px 14px;border-radius:9px;font:600 13px var(--f);color:var(--ink2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.lsub button i{font-style:normal;font:700 11.5px var(--f);color:var(--ink4);background:#fff;border-radius:999px;padding:1px 8px}
.lsub button[aria-pressed="true"]{background:#fff;color:var(--violet2);box-shadow:0 1px 3px rgba(18,14,43,.12)}
.lsub button[aria-pressed="true"] i{background:var(--tvbg);color:var(--tvfg)}
.pks button{min-width:46px;justify-content:center}
.pks button[aria-pressed="true"]{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 6px 14px -8px rgba(65,1,247,.8)}
.sb>.lsub{margin:16px 24px 6px}
.lgrp{display:flex;align-items:center;gap:10px;font:800 11px var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--violet2);margin:6px 4px 12px}
.lgrp::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#6601fd,#dd30b1)}
.lgrp::after{content:"";flex:1;height:1px;background:var(--line)}
.ct.v{background:var(--tvbg);color:var(--tvfg)}
table.lt td.pk{font-weight:700;color:var(--ink)}
table.lt td.ex small{color:var(--ink4);font-weight:400}
.pl{display:inline-block;padding:3px 10px;border-radius:999px;font:700 12px var(--f);white-space:nowrap}
.pl.ok{background:var(--okbg);color:var(--ok)}.pl.vi{background:var(--tvbg);color:var(--tvfg)}.pl.rd{background:var(--rose);color:var(--bad)}
.pl.bl{background:var(--tbbg);color:var(--tbfg)}.pl.gy{background:#EFEDF4;color:#6a6488}
table.lt td.c{text-align:right}table.lt th:first-child,table.lt td.who{position:sticky;left:0;z-index:1;background:#fff;box-shadow:8px 0 10px -8px rgba(18,14,43,.12)}table.lt th:first-child{background:#FBFAFE}
table.lt th,table.lt td{padding-left:16px;padding-right:16px}table.lt td.ds{max-width:320px;min-width:240px}
/* Counts in the list toggles: easier to read */
.lsub button i{font:800 13px var(--f);padding:2px 10px;background:#E9E3F8;color:var(--ink)}
.lsub button[aria-pressed="true"] i{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff}
.sec .sh .ct{min-width:30px;height:26px;padding:0 10px;font-size:13.5px}
/* Each list's own filters, top right */
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px 10px}
.sb>.lrow .lsub{margin:0}
.ltools{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.ltools .lsub button{padding:7px 11px;font-size:12.5px}.ltools .pks button{min-width:40px}
.ltools .tl{align-self:center;font:700 10px var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);padding:0 8px 0 10px}
/* About this list */
.ib{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid #B9AEDB;color:var(--tvfg);font:800 11.5px/1 Georgia,serif;font-style:italic;cursor:pointer;flex:none}
.ib:hover,.ib.open,.ib:focus-visible{background:var(--tvbg);border-color:var(--tvfg);outline:none}
.sh span.ib .ipop{display:none;position:absolute;left:-12px;top:30px;z-index:20;width:380px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 40px -18px rgba(18,14,43,.35);font:400 13.5px/1.55 var(--f);font-style:normal;color:var(--ink2);text-align:left;cursor:default;white-space:normal}
.ib:hover .ipop,.ib.open .ipop,.ib:focus-visible .ipop{display:block!important}
.sec:has(.ib){overflow:visible}.sec:has(.ib)>.sb{border-radius:0 0 24px 24px;overflow:hidden}.sec:has(.ib)>.sh{border-radius:24px 24px 0 0}.sec.closed:has(.ib)>.sh{border-radius:24px}
/* Filters (as on the Goals page) */
.filters{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);margin-bottom:22px}
.filters:not(.closed){position:relative;z-index:5}
.filters-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;cursor:pointer;user-select:none}
.filters-head .t{display:flex;align-items:center;gap:10px;font:700 16px var(--f);color:var(--ink)}.filters-head .t svg{color:var(--violet2)}
.f-badge{background:var(--tvbg);color:var(--violet2);font:600 12px var(--f);border-radius:999px;padding:3px 10px}.f-badge.on{background:var(--violet2);color:#fff}
.f-chev{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);color:var(--ink3);display:grid;place-items:center;transition:transform .2s}
.filters.closed .f-chev{transform:rotate(-90deg)}.filters.closed .filters-body{display:none}
.filters-body{border-top:1px solid var(--edge);padding:18px 22px 20px}
.f-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.f-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:700px){.f-grid{grid-template-columns:1fr}}
.f-clear{margin-top:14px;border:0;background:none;color:var(--violet2);font:600 13px var(--f);cursor:pointer;padding:0}.f-clear:disabled{color:#C9C3DD;cursor:default}
.ms{position:relative;display:flex;flex-direction:column;gap:6px}
.ms>label{font:600 12px var(--f);color:var(--ink2)}
.ms>button{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;border:1px solid var(--line);border-radius:12px;background:#F6F3FC;padding:0 12px;font:500 14px var(--f);color:var(--ink);cursor:pointer;text-align:left;width:100%}
.ms>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ms>button svg{flex:none;color:var(--ink3)}
.ms.set>button{background:var(--tvbg);border-color:#DCCFFB;color:var(--violet2);font-weight:600}
.ms .pop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(18,14,43,.35);padding:6px;max-height:320px;overflow:auto}
.ms .pop label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.ms .pop label:hover{background:var(--tvbg)}.ms .pop label .n{margin-left:auto;font-size:12px;color:var(--ink4)}.ms .pop .nil{color:var(--ink4)}
.ms .pop input{width:16px;height:16px;accent-color:#4101f7}
.ms .pop .pf{display:flex;justify-content:space-between;border-top:1px solid var(--edge);margin-top:4px;padding:6px 6px 2px}
.ms .pop .pf button{border:0;background:none;color:var(--violet2);font:600 12.5px var(--f);cursor:pointer}
table.lt td.ph{font-variant-numeric:tabular-nums}
/* Due · Renewed · % renewal, at the right of a list's title */
.sh .kst{margin-left:auto;display:inline-flex;align-items:center;gap:0;background:#FAF8FE;border:1px solid var(--edge);border-radius:12px;padding:4px}
.sh .kst>span{font:500 12.5px var(--f);color:var(--ink3);padding:5px 12px;border-right:1px solid var(--edge);white-space:nowrap}
.sh .kst>span:last-child{border-right:0}
.sh .kst b{font:800 15px var(--f);color:var(--ink);margin-left:6px}
.sh .kst .kp{background:var(--okbg);border-radius:9px;color:var(--ok);border-right:0}.sh .kst .kp b{color:var(--ok)}
.sh .kst+.cv{margin-left:12px}

<body>
<div class="hero"><div class="hin"><div><h1>Renewal Pipeline</h1><div class="sub" id="psub"></div></div>
<div class="hr"><div class="upd"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div>
<div class="vt" id="vt" role="group" aria-label="View"><button type="button" data-v="glance" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Glance</button><button type="button" data-v="list" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</button></div></div></div></div>
<div class="page">
<div class="bar"><nav class="seg" id="centre-toggle" aria-label="Centre"></nav>
<div class="per"><div class="t" id="mode"><button type="button" data-m="month" aria-pressed="true">Month</button><button type="button" data-m="range" aria-pressed="false">Date range</button></div>
<div id="pmonth" style="display:flex;align-items:center;gap:6px"><button class="m" id="prev" aria-label="Previous month">‹</button><div class="l" id="mlabel">—</div><button class="m" id="next" aria-label="Next month">›</button></div>
<div id="prange" class="range" hidden><input type="date" id="from" aria-label="From"><span>to</span><input type="date" id="to" aria-label="To"></div></div></div>
<div id="out"></div>
</div>
<script>
const CENTRES=[{city:'Chennai',name:'Alwarpet'},{city:'Chennai',name:'Thoraipakkam'},{city:'Bangalore',name:'Borewell Road'}];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function parseDate(str){
  if(!str)return null;const s=String(str).trim();
  const a=s.match(/^(\d{1,2})-([A-Za-z]+)-(\d{2,4})$/);
  if(a){const m=MON.findIndex(x=>x.toLowerCase()===a[2].slice(0,3).toLowerCase());const y=a[3].length===2?2000+ +a[3]:+a[3];if(m>=0)return new Date(y,m,+a[1]);}
  const b=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(b){const y=b[3].length===2?2000+ +b[3]:+b[3];return new Date(y,+b[2]-1,+b[1]);}
  const d=new Date(s);return isNaN(d)?null:d;
}
const parseNum=s=>s?parseFloat(String(s).replace(/[^0-9.\-]/g,''))||0:0;
const inr=x=>'₹'+Math.round(x).toLocaleString('en-IN');
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>d?String(d.getDate()).padStart(2,'0')+'-'+MON[d.getMonth()]+'-'+String(d.getFullYear()).slice(2):'—';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const NOW=new Date(),TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const days=(a,b)=>Math.round((b-a)/864e5);
const valid=d=>d&&d.getFullYear()>=2020?d:null;
async function fetchTab(centre,tab){const rows=await ArtiumAuth.fetchRows(centre,tab);return rows.slice(2).filter(r=>r[0]&&r[0].toLowerCase()!=='date');}
let DATA={},ITEMS=null,GAPS=[],ALL=[],TARGETS={};   // TARGETS['2026-10']['Alwarpet']={renewed, rncol, …} from the Targets page   // ALL: every membership row, for the renewal totals

/* Columns used: A Date · D Learner ID · E Name · H Mobile · I Course · M No. of months · Q / R amount paid · X Membership end date · Z Renewal Status · AD Teacher
   and, sent by the data service after AD: 33 Description · 34 Next Call Date (promised payment date) · 35 Expected (promised amount) · 36 Probability of Conversion.
   Every row is one membership. A row with a promised date and amount is one promised renewal. It counts as renewed when the same Learner ID
   has a later payment (or its Renewal Status says Renewed); as "won't renew" when the status says so; otherwise it is still to come. */
function build(){
  const T=[];
  CENTRES.forEach(c=>{const d=DATA[c.name];if(!d)return;
    [['fs',d.fs,17],['rn',d.rn,16]].forEach(([tab,rows,amt])=>rows.forEach(r=>{const date=parseDate(r[0]);if(!date)return;
      T.push({r,centre:c.name,tab,date,id:String(r[3]||'').trim().toUpperCase(),paid:parseNum(r[amt]),m:parseNum(r[12]),end:valid(parseDate(r[23])),newEnd:valid(parseDate(r[36])),ext:parseNum(r[37])||0,status:String(r[25]||'').trim(),
        desc:String(r[32]||'').trim(),ncd:valid(parseDate(r[33])),exp:parseNum(r[34]),prob:String(r[35]||'').trim()});}));});
  const byId=new Map();T.forEach(t=>{if(t.id)(byId.get(t.id)||byId.set(t.id,[]).get(t.id)).push(t);});
  byId.forEach(l=>l.sort((a,b)=>a.date-b.date));
  // For every renewal: when was the membership it renews due? (the end date of the same Learner ID's previous entry)
  byId.forEach(l=>l.forEach((t,i)=>{if(t.tab==='rn'&&i>0)t.prevEnd=l[i-1].end;}));
  ALL=T;
  // Due for renewal: the latest membership of each Learner ID that hasn't been renewed yet (no later Renewals entry), and isn't marked Won't renew.
  // Those with a promised date and amount are in the pipeline; the rest are listed by what is missing.
  GAPS=[];byId.forEach(l=>{const t=l[l.length-1];if(!t.end||/will not renew|discontinu|refund|^renewed$/i.test(t.status))return;
    const miss=!t.ncd&&!(t.exp>0)?'none':t.ncd&&!(t.exp>0)?'noamt':!t.ncd?'nodate':'';if(!miss)return;
    const phone=String(t.r[7]||'').replace(/\D/g,'').slice(-10);
    GAPS.push({...t,miss,phone,name:String(t.r[4]||'').trim(),course:String(t.r[8]||'').trim(),teacher:String(t.r[29]||'').trim()});});
  return T.filter(t=>t.ncd&&t.exp>0).map(t=>{
    const later=(byId.get(t.id)||[]).find(x=>x!==t&&x.date>t.date&&x.tab==='rn');
    let state='wait',paidOn=null,paidAmt=0;
    if(later){state='paid';paidOn=later.date;paidAmt=later.paid;}
    else if(/^renewed$/i.test(t.status)){state='paid';paidOn=valid(parseDate(t.r[26]));}
    else if(/will not renew|discontinu|refund/i.test(t.status))state='lost';
    if(state==='wait'&&t.ncd<TODAY)state='late';
    const phone=String(t.r[7]||'').replace(/\D/g,'').slice(-10);
    return {...t,state,paidOn,paidAmt,phone,name:String(t.r[4]||'').trim(),course:String(t.r[8]||'').trim(),teacher:String(t.r[29]||'').trim(),age:String(t.r[6]||'').trim(),pack:t.m?Math.round(t.m)+'M':''};
  });
}


function buildDue(){
  const byId=new Map();ALL.forEach(t=>{if(t.id)(byId.get(t.id)||byId.set(t.id,[]).get(t.id)).push(t);});
  return ALL.filter(t=>t.end).map(t=>{const r=t.r,later=(byId.get(t.id)||[]).filter(x=>x!==t&&x.tab==='rn'&&x.date>t.date).sort((a,b)=>a.date-b.date)[0];
    let st='due';if(later||/^renewed$/i.test(t.status))st='paid';else if(/will not renew|won'?t renew|discontinu|refund/i.test(t.status))st='lost';else if(t.end<TODAY)st='late';
    return{...t,st,paidOn:later?later.date:null,name:String(r[4]||'').trim(),phone:String(r[7]||'').replace(/\D/g,'').slice(-10),age:String(r[6]||'').trim(),course:String(r[8]||'').trim(),
      level:String(r[9]||'').trim(),pack:t.m?Math.round(t.m)+'M':'',start:valid(parseDate(r[22])),teacher:String(r[29]||'').trim(),reason:String(r[28]||'').trim(),comp:parseNum(r[38])||0};});
}

function period(){
  if(mode==='month')return{a:new Date(viewY,viewM,1),b:new Date(viewY,viewM+1,0),label:MONTH_FULL[viewM]+' '+viewY};
  const a=rFrom||new Date(viewY,viewM,1),b=rTo||new Date(viewY,viewM+1,0);
  return{a,b,label:fmtD(a)+' to '+fmtD(b)};
}


/* ── State ── */
let DUE=null;
let selCentre=(()=>{try{const v=localStorage.getItem('artium_rp_centre');return CENTRES.some(c=>c.name===v)?v:'All';}catch(e){return'All';}})();
let view=(()=>{try{return localStorage.getItem('artium_rp_view')==='list'?'list':'glance';}catch(e){return'glance';}})();
let FOLD=(()=>{try{return JSON.parse(localStorage.getItem('artium_rp_fold')||'{}')||{};}catch(e){return{};}})();   // sections folded by the viewer
let mode='month',viewY=NOW.getFullYear(),viewM=NOW.getMonth(),rFrom=null,rTo=null;
const n=v=>Math.round(v).toLocaleString('en-IN');
const pc=(a,b)=>b?Math.round(a/b*100)+'%':'–';
const inP=(d,P)=>d&&d>=P.a&&d<=P.b;
const CHEV='<span class="cv" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>';

/* Weeks of the period: Tuesday to Sunday. Monday is the weekly off, so a Monday belongs to the week before it (the week ends on Monday).
   The first and last weeks can be short. */
function weeksOf(P){
  const W=[];let s=new Date(P.a);
  while(s<=P.b){const e=new Date(s);while(e.getDay()!==1&&e<P.b)e.setDate(e.getDate()+1);
    W.push({a:new Date(s),b:new Date(e)});s=new Date(e);s.setDate(s.getDate()+1);}
  return W;
}
const span=w=>w.a.getMonth()===w.b.getMonth()?(w.a.getDate()===w.b.getDate()?`${w.a.getDate()} ${MON[w.a.getMonth()]}`:`${w.a.getDate()}–${w.b.getDate()} ${MON[w.b.getMonth()]}`)
  :`${w.a.getDate()} ${MON[w.a.getMonth()]}–${w.b.getDate()} ${MON[w.b.getMonth()]}`;

/* The current month cohort: every membership whose Package Expiry Date falls in the period. Each learner lands in one outcome only,
   in this order: renewed, pipeline (promised date in the period and an expected amount), will not renew, extended (extension days above 0),
   and anyone left is yet to connect. First-time = a Fresh Sales membership, repeated = a Renewals one. */
function outcome(x,P){
  if(x.st==='paid')return'ren';
  if(x.ncd&&x.exp>0&&inP(x.ncd,P))return'pipe';
  if(x.st==='lost')return'wnr';
  if(x.ext>0)return'ext';
  return'ytc';
}

/* ── Building blocks ── */
function fold(key,def=false){return key in FOLD?FOLD[key]:def;}
function section(key,title,extra,body,cls=''){
  return`<section class="sec ${cls}${fold(key)?' closed':''}" data-k="${key}"><button type="button" class="sh" aria-expanded="${!fold(key)}"><b>${title}</b>${extra||''}${CHEV}</button><div class="sb">${body}</div></section>`;
}
function wtable(W,P,rows){
  const tl=mode==='month'?MONTH_FULL[viewM]:'Period';
  const cur=W.findIndex(w=>TODAY>=w.a&&TODAY<=w.b),cc=i=>(i===cur?'cw':'')+(i===W.length?' tt':'');
  let h='<div class="tw"><table><thead><tr><th></th>'+W.map((w,i)=>`<th class="${cc(i)}"><b>Week ${i+1}</b>${i===cur?'<em>This week</em>':''}<small>${span(w)}</small></th>`).join('')
    +`<th class="tt"><b>${tl}</b><small>Total</small></th></tr></thead><tbody>`;
  rows.forEach(r=>{
    if(r.h){h+=`<tr class="grp2"><th colspan="${W.length+2}">${r.h}</th></tr>`;return;}
    if(r.opt&&!r.v[r.v.length-1])return;
    const dot=r.cls&&/wnr/.test(r.cls)?'<i class="dt r"></i>':r.cls&&/ytc/.test(r.cls)?'<i class="dt g"></i>':'';
    h+=`<tr class="${r.cls||''}"><th scope="row">${dot}${r.l}</th>`+r.v.map((x,i)=>`<td class="${cc(i)}">${x}</td>`).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function part(key,L,title,summary,body){
  return`<div class="wc${fold(key)?' closed':''}" data-k="${key}"><button type="button" class="wh" aria-expanded="${!fold(key)}"><span class="lb">${L}</span><span class="wt">${title}</span><span class="ws">${summary}</span>${CHEV}</button><div class="wb">${body}</div></div>`;
}
const SUM=(...kv)=>kv.map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join('');

function learnerList(list,ext){
  if(!list.length)return'<div class="empty">No learners here.</div>';
  const sel=selCentre!=='All';
  let h=`<div class="tw"><table class="lt"><thead><tr><th>Learner</th><th>Course</th><th>Age group</th><th>Course level</th><th>Teacher</th>${ext?'<th>Extension</th>':''}<th>Latest discussion</th></tr></thead><tbody>`;
  list.slice().sort((a,b)=>a.end-b.end||a.name.localeCompare(b.name)).forEach(x=>{
    h+=`<tr><td class="who"><b>${esc(x.name)||'—'}</b><span class="tg ${x.tab==='rn'?'rr':'ft'}">${x.tab==='rn'?'RR':'FTR'}</span><small>${esc(x.id)}${sel?'':' · '+esc(x.centre)} · due ${fmtD(x.end)}</small></td>
      <td>${esc(x.course)||'—'}</td><td>${esc(x.age)||'—'}</td><td>${esc(x.level)||'—'}</td><td>${esc(x.teacher)||'—'}</td>
      ${ext?`<td class="ex">${Math.round(x.ext)} day${Math.round(x.ext)===1?'':'s'}${x.newEnd?' · to '+fmtD(x.newEnd):''}</td>`:''}
      <td class="ds">${esc(x.desc)||'<span class="mut">—</span>'}</td></tr>`;});
  return h+'</tbody></table></div>';
}

/* ── The page ── */
function render(){
  const sel=CENTRES.find(c=>c.name===selCentre);
  document.querySelectorAll('.ct-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===selCentre));
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  document.querySelectorAll('#vt button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  document.getElementById('pmonth').style.display=mode==='month'?'flex':'none';document.getElementById('prange').hidden=mode!=='range';
  const P=period();document.getElementById('mlabel').textContent=P.label;document.getElementById('psub').textContent=P.label;   // the selected period, under the title
  if(mode==='range'){document.getElementById('from').value=iso(P.a);document.getElementById('to').value=iso(P.b);}
  const out=document.getElementById('out');
  if(!DUE){out.innerHTML='<section class="sec"><div class="empty big">Loading…</div></section>';return;}
  const mine=x=>!sel||x.centre===sel.name;
  const isCur=mode==='month'&&viewY===NOW.getFullYear()&&viewM===NOW.getMonth();
  if(view==='list'){out.innerHTML=listView(P,mine,sel);bindList(out);return;}

  /* At a glance (as on Monthly Performance Analysis): due = memberships whose package expires in the period;
     achieved = every renewal paid in the period, whenever it was due; pipeline = promised payments in the period not paid yet */
  const due=DUE.filter(x=>mine(x)&&inP(x.end,P));
  const rnl=ALL.filter(x=>mine(x)&&x.tab==='rn'&&inP(x.date,P));
  const col=rnl.reduce((s,x)=>s+x.paid,0),atv=rnl.length?col/rnl.length:null;
  const prom=(ITEMS||[]).filter(x=>mine(x)&&inP(x.ncd,P)),pipe=prom.filter(x=>x.state==='wait'||x.state==='late'),late=pipe.filter(x=>x.state==='late');
  const expAmt=pipe.reduce((s,x)=>s+x.exp,0),lateAmt=late.reduce((s,x)=>s+x.exp,0);
  // Targets (monthly, from the Targets page): Month view only. Actual and target both cover the centres that have a target.
  const tg=mode==='month'?(TARGETS[viewY+'-'+String(viewM+1).padStart(2,'0')]||{}):{},cs=(sel?[sel]:CENTRES).map(c=>c.name);
  const tgt=key=>{const has=cs.filter(c=>tg[c]&&tg[c][key]!=null);return has.length?{v:has.reduce((s,c)=>s+tg[c][key],0),has}:null;};
  const Tn=tgt('renewed'),Ta=tgt('rncol');
  const act=(T,f)=>T?rnl.filter(x=>T.has.includes(x.centre)).reduce((s,x)=>s+f(x),0):0;
  const pip=(T,f)=>T?pipe.filter(x=>T.has.includes(x.centre)).reduce((s,x)=>s+f(x),0):0;
  const prog=(T,actual,money)=>{if(!T||!T.v)return'';const p=actual/T.v*100;
    return`<div class="pg"><div class="x"><span>Target – ${money?inr(T.v):n(T.v)}</span><b>${Math.round(p)}%</b></div><div class="tr"><i style="width:${Math.min(100,p)}%"></i></div></div>`;};
  // ATV target: the renewal collections target ÷ the renewals target, for centres that have both
  const Tatv=(()=>{const has=cs.filter(c=>tg[c]&&tg[c].renewed&&tg[c].rncol!=null);if(!has.length)return null;
    const nn=has.reduce((s,c)=>s+tg[c].renewed,0),aa=has.reduce((s,c)=>s+tg[c].rncol,0),l=rnl.filter(x=>has.includes(x.centre));
    return{v:aa/nn,act:l.length?l.reduce((s,x)=>s+x.paid,0)/l.length:0};})();
  const card=(t,v,extra,cls='')=>`<div class="k ${cls}"><div class="t">${t}</div><div class="v">${v}</div>${extra||''}</div>`;
  const rrN=rnl.length+pipe.length,rrAmt=col+expAmt;
  const glance=`<div class="rw"><div class="rl">Achieved so far</div><div class="cards">
      ${card('Renewals due',n(due.length))}
      ${card('Renewals achieved',n(rnl.length),prog(Tn,act(Tn,()=>1)))}
      ${card('Collections – Renewals',inr(col),prog(Ta,act(Ta,x=>x.paid),true))}
      ${card('ATV – Renewals',atv==null?'–':inr(atv),Tatv?prog({v:Tatv.v},Tatv.act,true):'')}</div></div>
    <div class="rw"><div class="rl">Pipeline and run-rate</div><div class="cards">
      ${card('Expected payments',n(pipe.length),`<div class="s"><b>${n(pipe.length-late.length)}</b> yet to pay${late.length?` · <span class="bd">${n(late.length)} overdue</span>`:''}</div>`)}

  const tE=T(latest.filter(x=>x.st!=='paid'&&/extend|pause/i.test(x.status)&&okP(x,'ext')).sort((a,b)=>(a.newEnd||a.end)-(b.newEnd||b.end)),STD(nowOc),'ext',nowOc,'ext');
  const sExt=row2('','ext')+tbl(tE);

  const cnt=(n,c='')=>`<span class="ct ${c}">${n}</span>`;
  const info=t=>`<span class="ib" role="button" tabindex="0" aria-label="About this list" data-info>i<span class="ipop">${t}</span></span>`;
  return filterPanel(DUE.filter(mine))
    +`<div class="lgrp">Due in ${esc(P.label)}</div>`
    +section('l_due','Renewals due',`<span>${esc(P.label)}</span>`+kst(tD.cfd,dueOc),sDue)
    +`<div class="lgrp">All time</div>`
    +section('l_one','Repeated 1-month renewers',info('This is a list of learners who have made at least two 1-month renewal transactions in the past. It includes both active and inactive learners. It helps us focus on 1-month renewers, ensuring they continue with us. It also helps us narrow down inactive 1-month renewers who may have quit due to affordability issues.')+cnt(one.length,'v')+(LSUB.one==='in'?kn(tI.rows):kst(tA.cfd,dueOc)),sOne)
    +section('l_aff','Left because of affordability','<span>latest departures first</span>'+kn(tF.rows),sAff)
    +section('l_ext','Extended or paused, not renewed yet',kn(tE.rows),sExt);
}
/* One icon button per list: clears its package and Show choices and its column filters and sorting */
const TBL={due:['due'],one:['oact','oin'],aff:['aff'],ext:['ext']};
const busy=k=>{const f=fl(k);return f.pkg!=='all'||f.ren!=='all'||TBL[k].some(t=>CF[t]&&(CF[t].sort||Object.keys(CF[t].f||{}).length));};
function row2(left,k){const on=busy(k);
  return`<div class="lrow">${left||'<span></span>'}<div class="ltools">${tools(k)}<button type="button" class="clr" data-clr="${k}"${on?'':' disabled'} title="Clear this list's filters and sorting" aria-label="Clear this list's filters and sorting"><svg viewBox="0 0 24 24"><path d="M3 5h14l-5.5 6.5V18l-3 1.5v-8z"/><path d="M16 14l5 5M21 14l-5 5"/></svg></button></div></div>`;}
function bindList(out){
  out.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{const k=b.dataset.clr;delete FL[k];TBL[k].forEach(t=>delete CF[t]);MENU=null;saveCF();try{localStorage.setItem('artium_rp_lf',JSON.stringify(FL));}catch(e){}render();});
  out.querySelectorAll('th.hc').forEach(th=>th.onclick=e=>{e.stopPropagation();const t=th.dataset.t,c=th.dataset.c;MENU=MENU&&MENU.t===t&&MENU.c===c?null:{t,c,q:''};render();});
  const m=out.querySelector('.cmenu');
  if(m){const th=out.querySelector(`th.hc.open`);if(th){const r=th.getBoundingClientRect(),w=280;m.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';m.style.top=(r.bottom+6)+'px';}
    const t=m.dataset.t,c=m.dataset.c,C=cf(t);
    m.onclick=e=>e.stopPropagation();
    m.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{C.sort=C.sort&&C.sort.c===c&&C.sort.dir===b.dataset.dir?null:{c,dir:b.dataset.dir};saveCF();MENU=null;render();});
    const boxes=()=>[...m.querySelectorAll('.cm-l input')];
    m.querySelectorAll('[data-ca]').forEach(b=>b.onclick=()=>{if(b.dataset.ca==='all')delete C.f[c];else C.f[c]=['\u0000none'];saveCF();render();});
    m.querySelectorAll('.cm-l input').forEach(i=>i.onchange=()=>{const all=JSON.parse(m.dataset.all),sel=(C.f[c]||[]).filter(v=>v!=='\u0000none');
      const cur=new Set(C.f[c]&&C.f[c].length?sel:all);if(i.checked)cur.add(i.value);else cur.delete(i.value);
      if(all.every(v=>cur.has(v)))delete C.f[c];else C.f[c]=cur.size?[...cur]:['\u0000none'];saveCF();render();});
    const q=m.querySelector('.cm-q');q.oninput=()=>{MENU.q=q.value;const pos=q.selectionStart;render();const n=document.querySelector('.cmenu .cm-q');if(n){n.focus();n.setSelectionRange(pos,pos);}};
  }
  const saveF=()=>{try{localStorage.setItem('artium_rp_fsel',JSON.stringify(FSEL));}catch(e){}};
  const box=out.querySelector('#fbox');
  if(box){
    box.querySelector('#fhead').onclick=()=>{FOPEN=!FOPEN;OPEN_F=null;try{localStorage.setItem('artium_rp_fopen',FOPEN?'1':'0');}catch(e){}render();};
    box.addEventListener('click',e=>{
      if(e.target.id==='fclr'){FSEL={};OPEN_F=null;saveF();render();return;}
      const ms=e.target.closest('.ms');if(!ms)return;const id=ms.dataset.f;
      if(e.target.closest('.ms>button')){OPEN_F=OPEN_F===id?null:id;render();return;}
      if(e.target.closest('[data-all]')){FSEL[id]=[...ms.querySelectorAll('.pop input')].map(i=>i.value);saveF();render();return;}
      if(e.target.closest('[data-none]')){FSEL[id]=[];saveF();render();return;}
    });
    box.addEventListener('change',e=>{const ms=e.target.closest('.ms');if(!ms)return;FSEL[ms.dataset.f]=[...ms.querySelectorAll('.pop input:checked')].map(i=>i.value);saveF();render();});
  }
  out.querySelectorAll('[data-info]').forEach(b=>{b.onclick=e=>{e.stopPropagation();b.classList.toggle('open');};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();b.classList.toggle('open');}};});
  out.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{LSHOW[b.dataset.more]=!LSHOW[b.dataset.more];render();});
  const setF=(k,f)=>{FL[k]=Object.assign(fl(k),f);try{localStorage.setItem('artium_rp_lf',JSON.stringify(FL));}catch(e){}render();};
  out.querySelectorAll('[data-pkg]').forEach(b=>b.onclick=()=>setF(b.dataset.lk,{pkg:b.dataset.pkg}));
  out.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>setF(b.dataset.lk,{ren:b.dataset.ren}));
  out.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{LSUB[b.dataset.sub]=b.dataset.v;try{localStorage.setItem('artium_rp_lsub',JSON.stringify(LSUB));}catch(e){}render();});
  out.querySelectorAll('[data-k]>button').forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.k;FOLD[k]=!fold(k);try{localStorage.setItem('artium_rp_fold',JSON.stringify(FOLD));}catch(e){}render();});
}
document.addEventListener('click',e=>{if(OPEN_F&&!e.target.closest('.ms')){OPEN_F=null;render();}if(MENU&&!e.target.closest('.cmenu,th.hc')){MENU=null;render();}});
window.addEventListener('scroll',()=>{if(MENU){MENU=null;render();}},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(OPEN_F||MENU)){OPEN_F=null;MENU=null;render();}});

/* ── Controls ── */
document.getElementById('centre-toggle').innerHTML=[{name:'All',label:'All centres',city:CENTRES.length+' centres'}].concat(CENTRES.map(c=>({name:c.name,label:c.name,city:c.city})))
  .map(o=>`<button class="ct-btn" data-c="${o.name}" aria-pressed="false"><small>${o.city}</small><span>${o.label}</span></button>`).join('');
document.querySelectorAll('.ct-btn').forEach(b=>b.onclick=()=>{selCentre=b.dataset.c;try{localStorage.setItem('artium_rp_centre',selCentre);}catch(e){}render();});
document.querySelectorAll('#vt button').forEach(b=>b.onclick=()=>{view=b.dataset.v;try{localStorage.setItem('artium_rp_view',view);}catch(e){}render();});
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;if(mode==='range'&&!rFrom){rFrom=new Date(viewY,viewM,1);rTo=new Date(viewY,viewM+1,0);}render();});
document.getElementById('prev').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--;}render();};
document.getElementById('next').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++;}render();};
['from','to'].forEach(id=>document.getElementById(id).onchange=e=>{const d=fromIso(e.target.value);if(!d)return;if(id==='from')rFrom=d;else rTo=d;if(rFrom&&rTo&&rFrom>rTo)[rFrom,rTo]=[rTo,rFrom];render();});

async function load(){
  render();
  try{
    const res=await Promise.all(CENTRES.map(c=>Promise.all([fetchTab(c.name,'Fresh Sales'),fetchTab(c.name,'Renewals')])));
    CENTRES.forEach((c,i)=>{const mine=rows=>rows.filter(x=>!(x[2]||'').trim()||(x[2]||'').trim()===c.name);DATA[c.name]={fs:mine(res[i][0]),rn:mine(res[i][1])};});
    ITEMS=build();DUE=buildDue();
    ArtiumAuth.call('targets',{}).then(j=>{if(j&&j.targets){TARGETS=j.targets;render();}}).catch(()=>{});   // monthly targets (Targets page)
    const t=new Date();
    document.getElementById('updated').textContent='Updated '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('dot').className='dot';render();
  }catch(e){document.getElementById('updated').textContent='Error — '+e.message;document.getElementById('dot').className='dot error';}
}
load();

</script>
