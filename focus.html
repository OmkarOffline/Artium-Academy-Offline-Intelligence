<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="cardnav.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --display:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --bg:#F6F5F2;--border:#E4E1EA;--line:#EFEDF2;
    --ink:#1D1B22;--ink2:#3B3742;--muted:#6B6774;--faint:#9A96A3;--ghost:#B3AFBB;
    --accent:#5B2A86;--accent-soft:#F2ECF8;--gold:#A8844F;--ok:#1F7A4D;--bad:#B42318;
    --shadow:0 1px 2px rgba(31,26,36,.04),0 12px 28px -18px rgba(75,31,111,.28);
  }
  body{background:var(--bg);font-family:var(--body);color:var(--ink2);-webkit-font-smoothing:antialiased}
  .page{max-width:1600px;margin:0 auto;padding:36px 48px 64px}
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:30px}
  .eyebrow{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  h1{font:600 38px/1.15 var(--display);letter-spacing:-.015em;color:var(--ink)}
  .subtitle{font-size:15px;color:var(--muted);margin-top:6px}
  .updated{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .dot.loading{background:var(--gold);animation:pulse 1s infinite}
  .dot.error{background:var(--bad)}
  @keyframes pulse{50%{opacity:.35}}

  .centre-toggle{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:5px;box-shadow:var(--shadow);margin-bottom:26px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .centre-toggle::-webkit-scrollbar{display:none}
  .ct-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:0;background:none;border-radius:13px;padding:9px 20px 10px;cursor:pointer;white-space:nowrap;text-align:left;transition:background .15s}
  .ct-btn small{font:700 9.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .ct-btn span{font:600 15px/1.2 var(--display);color:var(--ink2)}
  .ct-btn:hover{background:var(--accent-soft)}
  .ct-btn[aria-pressed="true"]{background:var(--accent);box-shadow:0 6px 16px -8px rgba(91,42,134,.6)}
  .ct-btn[aria-pressed="true"] span{color:#fff}
  .ct-btn[aria-pressed="true"] small{color:#E9CF9E}

  .tray{background:linear-gradient(180deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.45) 100%);border:1px solid #E9E5EE;border-radius:28px;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 48px -36px rgba(75,31,111,.25);padding:8px 24px 22px;margin-bottom:28px}
  .tray-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 2px 14px}
  .tray-title{position:relative;padding-left:16px;font:600 22px/1.3 var(--display);letter-spacing:-.01em;color:var(--ink)}
  .tray-title::before{content:"";position:absolute;left:0;top:50%;width:4px;height:22px;transform:translateY(-50%);border-radius:4px;background:linear-gradient(180deg,#C9A66B 0%,var(--gold) 100%)}
  .badge{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .tray-sub{font-size:13.5px;color:var(--muted);margin:-6px 2px 14px;line-height:1.5}

  .tbl-wrap{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;border:1px solid var(--border);border-radius:18px;background:#fff;box-shadow:inset 0 3px 0 var(--gold),var(--shadow)}
  table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
  /* Many columns: the table keeps its natural width and scrolls sideways; # and Learner stay in view while scrolling */
  .tbl-wrap table{width:max-content;min-width:100%}
  .tbl-wrap th:nth-child(-n+2),.tbl-wrap td:nth-child(-n+2){position:sticky;z-index:1;background:#fff}
  .tbl-wrap th:nth-child(-n+2){background:#FAF9F7}
  .tbl-wrap th:nth-child(1),.tbl-wrap td:nth-child(1){left:0;width:52px;min-width:52px}
  .tbl-wrap th:nth-child(2),.tbl-wrap td:nth-child(2){left:52px;box-shadow:8px 0 10px -10px rgba(43,24,64,.3)}
  .tbl-wrap tbody tr:hover td:nth-child(-n+2){background:#FCFBFE}
  .scroll-hint{display:none;font-size:12px;color:var(--faint);margin:-6px 4px 10px;text-align:right}
  .scroll-hint.on{display:block}
  th,td{padding:12px 16px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle}
  th{background:#FAF9F7;font:600 11.5px/1.35 var(--body);letter-spacing:.03em;text-transform:uppercase;color:var(--ink2)}
  th.n,td.n{text-align:right}
  td{font:400 14px var(--body);color:var(--ink2)}
  td.n{font:500 14px var(--display)}
  td.key{font:600 14.5px var(--display);color:var(--accent)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#FCFBFE}
  .rk{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:#F3F1F6;color:var(--muted);font:600 12.5px var(--display)}
  td:has(>.who){white-space:normal;min-width:180px;max-width:220px}
  .who small{display:block;line-height:1.45}
  th,td{padding-left:12px;padding-right:12px}
  .who b{display:block;font:600 14px var(--body);color:var(--ink)}
  .who small{font:500 11.5px var(--body);color:var(--faint);letter-spacing:.02em}
  .multi{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.35}
  .multi small{color:var(--faint);font-size:12px}
  .ctr{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font:600 12px var(--body)}
  .st{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);border-radius:999px;padding:3px 10px}
  .st.on{background:#E5F4EC;color:var(--ok)}.st.off{background:#F3F1F6;color:var(--muted)}
  .st i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pk{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--display);color:var(--ink)}
  .pk .arr{color:var(--faint);font-weight:400}
  .pk.dn .to{color:var(--bad)}.pk.up .to{color:var(--ok)}
  .flt{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:4px;margin:0 2px 14px;box-shadow:var(--shadow)}
  .flt button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;border-radius:10px;padding:7px 14px;font:600 13px var(--body);color:var(--ink2);cursor:pointer;white-space:nowrap}
  .flt button span{font:600 11.5px var(--body);color:var(--muted);background:#F3F1F6;border-radius:999px;padding:1px 8px}
  .flt button:hover{background:var(--accent-soft)}
  .flt button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .flt button[aria-pressed="true"] span{background:rgba(255,255,255,.2);color:#fff}
  .flt .d{width:7px;height:7px;border-radius:50%}.flt .d.on{background:#2DA06A}.flt .d.off{background:#B3AFBB}
  .nw{white-space:nowrap}
  .mem{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .rel{font:600 10.5px var(--body);font-style:normal;color:var(--muted);background:#F3F1F6;border-radius:6px;padding:1px 6px;white-space:nowrap}
  .rel.first{background:#FBF1DC;color:#8A5A00}
  .src{display:inline-block;font:600 11.5px var(--body);border-radius:999px;padding:3px 9px;white-space:nowrap;margin:1px 0}
  .src.rec{background:#E5F4EC;color:var(--ok)}.src.ph{background:#F3F1F6;color:var(--muted)}
  .dnote{margin-top:14px;border:1px solid #F0DDB5;background:#FFF9EC;border-radius:14px;padding:12px 16px;font-size:13px;color:#7A5A22}
  .dnote ul{margin:6px 0 0 18px}.dnote li{margin:2px 0}
  .tel{font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .lname{border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;border-bottom:1px dashed #C9B6DE}
  .lname:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .ncount{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 7px 1px 5px;border-radius:999px;background:#FBF1DC;color:#8A5A00;font:700 11px var(--body);vertical-align:middle}
  .ncount svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
  /* Insights dialog */
  .ins-bg{position:fixed;inset:0;z-index:50;background:rgba(31,16,41,.38);backdrop-filter:blur(2px);display:grid;place-items:center;padding:24px}
  .ins-bg[hidden]{display:none}
  .ins{width:min(760px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:#fff;border-radius:24px;box-shadow:0 40px 80px -30px rgba(31,16,41,.6);overflow:hidden}
  .ins-head{position:relative;display:flex;justify-content:space-between;gap:16px;padding:24px 28px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FBF8FE,#fff)}
  .ins-head::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#C9A66B,var(--gold))}
  .ins-head h2{font:600 24px/1.2 var(--display);color:var(--ink)}
  .ins-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--muted)}
  .ins-meta .sep{color:#D3CEDA}
  .ins-x{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .ins-x:hover{background:var(--accent-soft);color:var(--accent)}
  .ins-x svg,.rm svg,.link svg,.btn-add svg,.fu svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .ins-body{overflow-y:auto;padding:20px 28px 26px}
  .ins-h{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:4px 0 12px}
  .ins-h span{color:var(--muted);margin-left:4px}
  .ins-empty{font-size:13.5px;color:var(--faint);margin-bottom:18px}
  .conv{border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;background:#FCFBFD}
  .conv-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);margin-bottom:8px}
  .conv-top b{font:600 14px var(--display);color:var(--ink)}.conv-top .by{margin-left:auto;font-size:12px;color:var(--faint)}
  .conv ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .conv li{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline;font-size:13.5px;line-height:1.45}
  .conv li .ty{justify-self:start}
  .conv li b{display:block;color:var(--ink);font-weight:600}.conv li .nt{display:block;color:var(--ink2)}
  .ty{font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .ty.pos{background:#E5F4EC;color:var(--ok)}.ty.neg{background:#FDECEB;color:var(--bad)}.ty.req{background:#FBF1DC;color:#8A5A00}
  .fu{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px;color:var(--ink2)}
  .fu svg{color:var(--accent);margin-top:2px;flex:none}
  .btn-add{display:inline-flex;align-items:center;gap:8px;border:1px dashed #CDBFE0;background:#FBF8FE;color:var(--accent);border-radius:14px;padding:12px 18px;font:600 14px var(--body);cursor:pointer;width:100%;justify-content:center}
  .btn-add:hover{background:var(--accent-soft)}
  .frow{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
  .frow label{display:flex;flex-direction:column;gap:6px;font:600 11.5px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .frow label.grow{flex:1;min-width:220px}
  .frow input,.item select,.item textarea{font:400 14px var(--body);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px 11px;background:#fff;text-transform:none;letter-spacing:0}
  .frow input:focus,.item select:focus,.item textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,42,134,.12)}
  .seg{display:inline-flex;gap:2px;background:#F4F2F7;border-radius:10px;padding:3px}
  .seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font:600 12.5px var(--body);color:var(--ink2);cursor:pointer;text-transform:none;letter-spacing:0}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(31,26,36,.15)}
  .ty-seg button.pos[aria-pressed="true"]{background:#E5F4EC;color:var(--ok)}
  .ty-seg button.neg[aria-pressed="true"]{background:#FDECEB;color:var(--bad)}
  .ty-seg button.req[aria-pressed="true"]{background:#FBF1DC;color:#8A5A00}
  .items{display:flex;flex-direction:column;gap:10px}
  .item{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff}
  .item-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
  .item select{min-width:280px}
  .item textarea{width:100%;resize:vertical;line-height:1.45}
  .rm{margin-left:auto;width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center}
  .rm:hover{background:#FDECEB;color:var(--bad)}
  .link{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:10px 2px}
  .fu-box{margin-top:4px;border-top:1px solid var(--line);padding-top:4px}
  .fu-box.open .link{cursor:default;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .ins-msg{min-height:18px;font-size:13px;color:var(--bad);margin-top:6px}
  .ins-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .btn{border:1px solid var(--border);background:#fff;border-radius:11px;padding:9px 16px;font:600 13.5px var(--body);color:var(--ink2);cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px -8px rgba(91,42,134,.6)}
  .btn:disabled{opacity:.6;cursor:default}
  @media (max-width:640px){.ins-bg{padding:0;place-items:end stretch}.ins{border-radius:22px 22px 0 0;max-height:92vh}.ins-head,.ins-body{padding-left:18px;padding-right:18px}}
  .tools{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .rib{display:inline-flex;align-items:center;gap:8px;border:1px solid #E6D3A8;background:#FFF9EC;color:#7A5A22;border-radius:12px;padding:9px 14px;font:600 13px var(--body);cursor:pointer;margin:0 2px 14px}
  .rib svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
  .rib span{background:#F3E2BC;border-radius:999px;padding:1px 8px;font-size:11.5px}
  .rib:hover:not(:disabled){background:#FBF1DC}
  .rib[aria-expanded="true"]{background:#7A5A22;border-color:#7A5A22;color:#fff}.rib[aria-expanded="true"]:hover{background:#674B1B}.rib[aria-expanded="true"] span{background:rgba(255,255,255,.22)}
  .rib:disabled{border-color:var(--border);background:#fff;color:var(--faint);cursor:default}.rib:disabled span{background:#F3F1F6}
  .rip{border:1px solid #EADCC2;background:linear-gradient(180deg,#FFFCF5,#fff);border-radius:18px;padding:16px 18px;margin:0 0 16px}
  .rip-sum{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .rip-k{font-size:13.5px;color:var(--muted)}.rip-k b{color:var(--ink)}
  .rip-types{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:3px}
  .rip-types button{border:0;background:none;border-radius:9px;padding:6px 12px;font:600 12.5px var(--body);color:var(--ink2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .rip-types button span{font-size:11px;color:var(--muted)}
  .rip-types button[aria-pressed="true"]{background:var(--accent);color:#fff}.rip-types button[aria-pressed="true"] span{color:#fff}
  .rip-types button.pos[aria-pressed="true"]{background:var(--ok)}.rip-types button.neg[aria-pressed="true"]{background:var(--bad)}.rip-types button.req[aria-pressed="true"]{background:#8A5A00}
  .rip-themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-bottom:14px}
  .thm{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit}
  .thm b{font:600 13px var(--body);color:var(--ink)}
  .thm .cnts{display:flex;gap:4px;flex-wrap:wrap}.thm .ty{font-style:normal;text-transform:none;letter-spacing:0;font-size:11px}
  .thm:hover{border-color:#CDBFE0}.thm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,42,134,.12)}
  .rip-f{font-size:13px;color:var(--muted);margin:-4px 0 10px}.link.sm{padding:0 0 0 6px;font-size:12.5px}
  .rip-list{max-height:560px;overflow-y:auto;padding-right:4px}
  .rip .conv-top .who-l{font-weight:600}.rip .conv-top .who-l .lname{font:600 14px var(--display)}
  .ty.rsn{background:#EFE7F8;color:var(--accent)}
  .rchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px}
  .rchip{display:inline-block;font:600 12px var(--body);color:var(--accent);background:#F4EEFA;border:1px solid #E3D6F2;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .rip-types button.rsn[aria-pressed="true"]{background:var(--accent)}
  .why{border:1px solid #E3D6F2;background:#FBF8FE;border-radius:14px;padding:14px;margin-bottom:16px}
  .why-h{font:600 14px var(--display);color:var(--ink);margin-bottom:10px}.why-h small,.ins-h small{font:500 12px var(--body);color:var(--faint);letter-spacing:0;text-transform:none;margin-left:6px}
  .rgrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .rbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font:500 13px var(--body);color:var(--ink2);cursor:pointer}
  .rbtn i{display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#F0ECF5;color:var(--muted);font:700 10px var(--body);font-style:normal}
  .rbtn:hover{border-color:#CDBFE0}
  .rbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.rbtn[aria-pressed="true"] i{background:rgba(255,255,255,.25);color:#fff}
  .why textarea{width:100%;font:400 14px var(--body);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:9px 11px;resize:vertical;line-height:1.45}
  .why textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,42,134,.12)}
  .ins-h.sub{margin-top:4px}
  .more{display:block;margin:14px auto 0;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 18px;font:600 13px var(--body);color:var(--accent);cursor:pointer}
  .more:hover{background:var(--accent-soft)}
  .empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}
  @media (max-width:900px){.page{padding:24px 16px 48px}h1{font-size:28px}.tray{padding:4px 12px 14px;border-radius:22px}.tray-title{font-size:19px}}
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <div class="eyebrow" id="eyebrow">All centres</div>
      <h1>Focus Groups</h1>
      <div class="subtitle" id="subtitle">Groups of learners worth a closer look</div>
    </div>
    <div class="updated"><span class="dot loading" id="dot"></span><span id="updated">Loading…</span></div>
  </header>
  <nav class="centre-toggle" id="centre-toggle" aria-label="Centre"></nav>
  <div id="groups"></div>
</div>

<script>
const CENTRES=[
  {city:'Chennai',   name:'Alwarpet'},
  {city:'Chennai',   name:'Thoraipakkam'},
  {city:'Bangalore', name:'Borewell Road'}
];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseDate(str){
  if(!str)return null;const s=String(str).trim();
  const a=s.match(/^(\d{1,2})-([A-Za-z]+)-(\d{2,4})$/);
  if(a){const m=MON.findIndex(x=>x.toLowerCase()===a[2].slice(0,3).toLowerCase());const y=a[3].length===2?2000+ +a[3]:+a[3];if(m>=0)return new Date(y,m,+a[1]);}
  const b=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(b){const y=b[3].length===2?2000+ +b[3]:+b[3];return new Date(y,+b[2]-1,+b[1]);}
  const d=new Date(s);return isNaN(d)?null:d;
}
const parseNum=s=>s?parseFloat(String(s).replace(/[^0-9.\-]/g,''))||0:0;
const inr=x=>'₹'+Math.round(x).toLocaleString('en-IN');
const fmtD=d=>d?String(d.getDate()).padStart(2,'0')+'-'+MON[d.getMonth()]+'-'+String(d.getFullYear()).slice(2):'—';
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pkg=m=>m?m+(m===1?' month':' months'):'—';
const NOW=new Date(),TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const valid=d=>d&&d.getFullYear()>=2020?d:null;   // blank end dates show up as years before 2020
/* Time between two dates as months and days, e.g. "14m 08d" */
function span(a,b){if(!a||!b||b<a)return'—';let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();}return m+'m '+String(d).padStart(2,'0')+'d';}
async function fetchTab(centre,tab){
  const rows=await ArtiumAuth.fetchRows(centre,tab);
  return rows.slice(2).filter(r=>r[0]&&r[0].toLowerCase()!=='date');
}
let DATA={};

/* Columns used: A Date · C Academy · D Learner ID · E Learner's name · H Mobile number · I Course · M No. of months · Q Net coaching fees (Renewals) · R Total receipts (Fresh Sales) · X Membership end date
   Each course gets its own Learner ID. The same person = same mobile number (last 10 digits) AND same name (letters only, any case).
   The same mobile number with a different name is a different learner, e.g. a sibling: that is how Families are found. */
const phoneOf=r=>String(r[7]||'').replace(/\D/g,'').slice(-10);
const nameKey=r=>String(r[4]||'').toLowerCase().replace(/[^a-z]/g,'');

/* Every transaction, tidied: one list per Learner ID (a course), and one record per person */
function build(names){
  const T=[];
  names.forEach(n=>{const d=DATA[n];if(!d)return;
    d.fs.forEach(r=>T.push({r,centre:n,fs:true,date:parseDate(r[0]),id:String(r[3]||'').trim().toUpperCase(),m:parseNum(r[12]),paid:parseNum(r[17]),end:valid(parseDate(r[23]))}));
    d.rn.forEach(r=>T.push({r,centre:n,fs:false,date:parseDate(r[0]),id:String(r[3]||'').trim().toUpperCase(),m:parseNum(r[12]),paid:parseNum(r[16]),end:valid(parseDate(r[23]))}));});
  const ok=T.filter(t=>t.id&&t.date);
  // Person of each Learner ID: from its admission row if there is one, else its first row
  const person={},label={};
  ok.slice().sort((a,b)=>(b.fs-a.fs)||(a.date-b.date)).forEach(t=>{if(person[t.id])return;const p=phoneOf(t.r),k=nameKey(t.r);person[t.id]=p&&k?p+'|'+k:'id:'+t.id;});
  const ids=new Map();
  ok.forEach(t=>{(ids.get(t.id)||ids.set(t.id,{id:t.id,centre:t.centre,course:'',name:'',phone:'',adm:null,ren:[],all:[]}).get(t.id)).all.push(t);});
  ids.forEach(x=>{x.all.sort((a,b)=>a.date-b.date);x.adm=x.all.find(t=>t.fs)||null;x.ren=x.all.filter(t=>!t.fs&&(!x.adm||t.date>=x.adm.date));
    const last=x.all[x.all.length-1];x.course=last.r[8]||x.all.map(t=>t.r[8]).filter(Boolean).pop()||'';x.name=(x.all.map(t=>t.r[4]).filter(Boolean).pop())||'';x.phone=phoneOf(x.adm?x.adm.r:last.r);
    x.age=x.all.map(t=>String(t.r[6]||'').trim()).filter(Boolean).pop()||'';
    const rl=x.adm?String(x.adm.r[30]||'').trim():'',fj=x.adm?String(x.adm.r[31]||'').trim().toUpperCase():'';   // Relationship · Learner ID of the 1st Joinee (Fresh Sales)
    x.rel=/^(none|na|n\/a|-|)$/i.test(rl)?'':rl;x.joinee=/^[A-Z]{2,4}-\d+$/.test(fj)?fj:'';
    x.lastEnd=x.all.map(t=>t.end).filter(Boolean).sort((a,b)=>b-a)[0]||null;x.active=!!(x.lastEnd&&x.lastEnd>=TODAY);x.person=person[x.id];});
  const P=new Map();
  ids.forEach(x=>{(P.get(x.person)||P.set(x.person,{key:x.person,ids:[]}).get(x.person)).ids.push(x);});
  P.forEach(p=>{p.name=p.ids.map(x=>x.name).filter(Boolean)[0]||'';p.centres=[...new Set(p.ids.map(x=>x.centre))];p.phone=p.ids[0].phone;
    p.all=p.ids.flatMap(x=>x.all).sort((a,b)=>a.date-b.date);p.first=(p.all.find(t=>t.fs)||p.all[0]).date;
    p.age=p.all.map(t=>String(t.r[6]||'').trim()).filter(Boolean).pop()||'';p.admDate=(p.all.find(t=>t.fs)||{}).date||null;
    p.lastEnd=p.ids.map(x=>x.lastEnd).filter(Boolean).sort((a,b)=>b-a)[0]||null;p.active=p.ids.some(x=>x.active);p.paid=p.all.reduce((s,t)=>s+t.paid,0);});
  PEOPLE=P;
  return {ids:[...ids.values()],people:[...P.values()]};
}

/* Read insights: every conversation logged for the learners in this list (follows the centre and Active filters) */
function readPanel(g,list){
  const btn=document.getElementById('rb-'+g.id),panel=document.getElementById('rp-'+g.id);
  const people=new Map();list.forEach(x=>(g.who(x)||[]).forEach(p=>{if(p)people.set(p.key,p);}));
  const owner=new Map();people.forEach(p=>p.ids.forEach(x=>owner.set(x.id,p)));
  const conv=INS.map(e=>({e,p:e.ids.map(i=>owner.get(String(i).toUpperCase())).find(Boolean)})).filter(c=>c.p).sort((a,b)=>(b.e.date+b.e.at).localeCompare(a.e.date+a.e.at));
  const n=conv.length,open=!!rOpen[g.id]&&n>0;
  btn.disabled=!n;btn.setAttribute('aria-expanded',open);
  btn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>${!insReady?'Loading insights…':n?(open?'Hide insights':'Read insights'):'No insights yet'}${n?`<span>${n}</span>`:''}`;
  btn.onclick=()=>{rOpen[g.id]=!rOpen[g.id];render();};
  panel.hidden=!open;if(!open){panel.innerHTML='';return;}
  // Summary: each theme with its positives, concerns and requests (click to focus the list on that theme / type)
  const all=conv.flatMap(c=>c.e.items),T=t=>(ALLTYPES.find(x=>x[0]===t)||['','neg'])[1];
  const th=rTheme[g.id]||'',ty=rType[g.id]||'',keep=i=>(!th||i.theme===th||reasonsOf(i).includes(th))&&(!ty||i.type===ty);
  const TY=ALLTYPES.filter(([y])=>all.some(i=>i.type===y));   // only the types that have been logged here
  const rows=REASONS.map(([t])=>{const k=all.filter(i=>reasonsOf(i).includes(t)).length;return{t,n:k,c:TY.map(([y])=>y==='Reason'?k:0)};}).filter(r=>r.n).sort((a,b)=>b.n-a.n)
    .concat(THEMES.map(t=>{const its=all.filter(i=>i.theme===t&&i.type!=='Reason');return{t,n:its.length,c:TY.map(([y])=>its.filter(i=>i.type===y).length)};}).filter(r=>r.n).sort((a,b)=>b.n-a.n));
  const people_n=new Set(conv.map(c=>c.p.key)).size,fu=conv.filter(c=>c.e.follow).length;
  panel.innerHTML=`<div class="rip-sum"><div class="rip-k"><b>${n}</b> conversation${n>1?'s':''} with <b>${people_n}</b> learner${people_n>1?'s':''} · <b>${all.length}</b> insight${all.length>1?'s':''}${fu?` · <b>${fu}</b> follow-up${fu>1?'s':''}`:''}</div>
      <div class="rip-types">${[['','All'],...TY.map(([y,c])=>[y,y==='Reason'?'Reasons':y])].map(([y,l])=>`<button type="button" data-ty="${y}" class="${y?T(y):''}" aria-pressed="${ty===y}">${l}${y?`<span>${all.filter(i=>i.type===y).length}</span>`:''}</button>`).join('')}</div></div>
    <div class="rip-themes">${rows.map(r=>`<button type="button" class="thm" data-th="${esc(r.t)}" aria-pressed="${th===r.t}"><b>${esc(r.t)}</b><span class="cnts">${r.c.map((k,i)=>k?`<i class="ty ${TY[i][1]}">${k} ${TY[i][0]==='Reason'?(k>1?'learners':'learner'):TY[i][0].toLowerCase()}</i>`:'').join('')}</span></button>`).join('')}</div>
    ${th||ty?`<div class="rip-f">Showing ${[th,ty&&(ty==='Reason'?'reasons for leaving':ty.toLowerCase()+'s')].filter(Boolean).map(esc).join(' · ')} <button type="button" class="link sm" data-clear="1">Show everything</button></div>`:''}
    <div class="rip-list">${conv.map(({e,p})=>{const its=e.items.filter(keep);if(!its.length)return'';
      return `<article class="conv"><div class="conv-top"><span class="who-l">${lname(p)}</span><b>${dShow(e.date)}</b><span>${esc(e.with)} · ${esc(e.how)}</span><span class="by">Logged by ${esc(e.byName||String(e.by).split('@')[0])}</span></div>
        <ul>${its.slice().sort((a,b)=>(b.type==='Reason')-(a.type==='Reason')).map(i=>itemHTML(i,T)).join('')}</ul>
        ${e.follow&&!th&&!ty?`<div class="fu"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg><span><b>Follow-up:</b> ${esc(e.follow.action)}${e.follow.owner?' · '+esc(e.follow.owner):''}${e.follow.due?' · by '+dShow(e.follow.due):''}</span></div>`:''}</article>`;}).join('')}</div>`;
  panel.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{rType[g.id]=b.dataset.ty;render();});
  panel.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{rTheme[g.id]=rTheme[g.id]===b.dataset.th?'':b.dataset.th;render();});
  const c=panel.querySelector('[data-clear]');if(c)c.onclick=()=>{rTheme[g.id]='';rType[g.id]='';render();};
}

async function saveIns(){

  if(!items.length){msg.textContent=ctx==='drop'?'Pick a reason for discontinuing, or write an insight.':'Write at least one insight.';return;}
  if(items.some(i=>i.type!=='Reason'&&(!i.theme||!i.type))){msg.textContent='Pick a theme and Positive / Concern / Request for each insight.';return;}
  const b=document.getElementById('f-save');b.disabled=true;b.textContent='Saving…';
  try{
    const j=await ArtiumAuth.call('saveInsight',{entry:{ids:cur.ids.map(x=>x.id),name:cur.name,centre:cur.centres.join(', '),date:draft.date,with:draft.with,how:draft.how,items,
      follow:draft.showFollow&&draft.follow.action.trim()?draft.follow:null}});
    if(!j||j.error)throw new Error(j&&j.error||'No answer from the data service');
    INS=j.insights||INS;draft=null;paintIns();render();
  }catch(e){msg.textContent='Could not save: '+(e.message==='not-allowed'?"you don't have permission to add insights":e.message);b.disabled=false;b.textContent='Save conversation';}
}
document.addEventListener('click',e=>{const n=e.target.closest('.lname');if(n){const sec=n.closest('section.tray');openIns(n.dataset.p,sec?sec.id.replace('sec-',''):'');return;}if(e.target.id==='ins'||e.target.closest('#ins-x'))closeIns();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('ins').hidden)closeIns();});
function loadInsights(){ArtiumAuth.call('insights',{}).then(j=>{if(j&&!j.error){INS=j.insights||[];STAFF=j.staff||[];ME=j.me||'';}insReady=true;render();if(cur)paintIns();}).catch(()=>{insReady=true;});}

async function load(){
  loadInsights();
  render();
  try{
    const res=await Promise.all(CENTRES.map(c=>Promise.all([fetchTab(c.name,'Fresh Sales'),fetchTab(c.name,'Renewals')])));
    CENTRES.forEach((c,i)=>{
      const mine=rows=>rows.filter(x=>!(x[2]||'').trim()||(x[2]||'').trim()===c.name);   // Academy (column C)
      DATA[c.name]={fs:mine(res[i][0]),rn:mine(res[i][1])};
    });
    const t=new Date();
    document.getElementById('updated').textContent='Updated '+t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('dot').className='dot';
    render();
  }catch(e){
    document.getElementById('updated').textContent='Error — '+e.message;
    document.getElementById('dot').className='dot error';
  }
}
load();
</script>
</body>
</html>
