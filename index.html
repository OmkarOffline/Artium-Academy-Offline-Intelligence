<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artium Academy — Offline Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--plum:#2B1840;--plum2:#1F1029;--gold:#E2C48A;--bg:#F6F5F2}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);font-family:"Poppins",sans-serif;overflow:hidden}

  /* Pages fill the whole window */
  .frames{position:fixed;inset:0}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .frames iframe[hidden]{display:none}

  /* Menu button, top left */
  .menu-btn{position:fixed;top:10px;left:10px;z-index:30;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;border:1px solid rgba(91,42,134,.14);
    background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#5B2A86;cursor:pointer;
    box-shadow:0 6px 18px -10px rgba(43,24,64,.45);transition:background .2s,color .2s,opacity .2s,transform .2s}
  .menu-btn:hover,.menu-btn:focus-visible{background:#5B2A86;color:#fff;outline:none}
  .menu-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  body.open .menu-btn{opacity:0;pointer-events:none;transform:translateX(-6px)}
  /* thin strip along the left edge: hovering it also opens the menu */
  .edge{position:fixed;left:0;top:0;bottom:0;width:10px;z-index:25}

  /* Sidebar */
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:40;width:292px;display:flex;flex-direction:column;color:#fff;
    background:linear-gradient(180deg,var(--plum) 0%,var(--plum2) 100%);visibility:hidden;
    transform:translateX(-100%);transition:transform .32s cubic-bezier(.3,.7,.2,1),box-shadow .32s,visibility 0s .32s}
  body.open .sidebar{transform:none;visibility:visible;box-shadow:24px 0 60px -30px rgba(31,16,41,.7);transition:transform .32s cubic-bezier(.3,.7,.2,1),box-shadow .32s}
  .sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;
    background:radial-gradient(60% 30% at 0% 0%,rgba(226,196,138,.18),transparent 70%),radial-gradient(70% 30% at 100% 100%,rgba(154,92,214,.22),transparent 70%)}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(31,16,41,.18);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);opacity:0;pointer-events:none;transition:opacity .3s}
  body.open .scrim{opacity:1;pointer-events:auto}
  .brand{position:relative;display:flex;align-items:center;gap:10px;padding:22px 22px 18px;font:700 15px "Poppins",sans-serif;letter-spacing:-.01em}
  .brand i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .brand small{display:block;font:600 9.5px/1 "Poppins",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(226,196,138,.8);margin-top:4px}
  /* Search, pinned pages, folding sections */
  .sb-top{position:relative;display:flex;gap:8px;padding:0 14px 12px}
  .srch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);transition:background .15s,border-color .15s}
  .srch:focus-within{background:rgba(255,255,255,.11);border-color:rgba(226,196,138,.45)}
  .srch svg{width:15px;height:15px;flex:none;fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round}
  .srch input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;color:#fff;font:400 13px "Poppins",sans-serif}
  .srch input::placeholder{color:rgba(255,255,255,.42)}
  .srch kbd{font:600 10.5px "Poppins",sans-serif;color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:1px 6px}
  .dock{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);cursor:pointer;transition:background .15s,color .15s}
  .dock:hover{background:rgba(255,255,255,.1);color:#fff}.dock[aria-pressed="true"]{color:var(--gold);background:rgba(226,196,138,.14);border-color:rgba(226,196,138,.3)}
  .dock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nav-g{display:flex;flex-direction:column;gap:2px}
  .nav-g+.nav-g{margin-top:4px}
  .nav-g:not(:has(.tab:not([hidden]))){display:none}   /* a section with no pages this person may open */
  /* Section rows: an icon, the name and how many pages; click to open or fold. Only the section you are in starts open. */
  .nav-t{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 6px 0 8px;border:0;border-radius:11px;background:none;cursor:pointer;text-align:left;
    font:600 13px "Poppins",sans-serif;color:rgba(255,255,255,.9);transition:background .15s,color .15s}
  .nav-t:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-t .si{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.07);color:rgba(226,196,138,.9)}
  .nav-t .si svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav-t .sn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-t .cnt{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:rgba(255,255,255,.08);font:600 11px/20px "Poppins",sans-serif;text-align:center;color:rgba(255,255,255,.55);padding:0 6px}
  .nav-t .ch{width:14px;height:14px;flex:none;fill:none;stroke:rgba(255,255,255,.45);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:rotate(-90deg);transition:transform .2s}
  .nav-g.open .ch,.nav-g:has(.tab[aria-selected="true"]) .ch{transform:none}
  .nav-g.open .cnt,.nav-g:has(.tab[aria-selected="true"]) .cnt{visibility:hidden}
  .nav-g:has(.tab[aria-selected="true"]) .si{background:rgba(226,196,138,.18);color:var(--gold)}
  .nav-g:has(.nav-t):not(.open):not(:has(.tab[aria-selected="true"])) .tab{display:none}
  /* pages inside a section: indented under it, with a thin guide line, no icons */
  .nav-g:not(.pins):has(.nav-t) > .tab{height:34px;padding-left:48px;font-size:13px}
  .nav-g:not(.pins):has(.nav-t) > .tab > svg:first-child{display:none}
  .nav-g:not(.pins):has(.nav-t)::after{content:"";position:absolute;left:22px;top:44px;bottom:6px;width:1px;background:rgba(255,255,255,.1);pointer-events:none}
  .nav-g{position:relative}.nav-g:not(.open):not(:has(.tab[aria-selected="true"]))::after{display:none}
  .nav-g.open,.nav-g:has(.tab[aria-selected="true"]){padding-bottom:6px}
  .pins-t{padding:6px 10px 6px 12px;font:600 11px "Poppins",sans-serif;color:rgba(226,196,138,.8);letter-spacing:.04em}
  .nav-g.pins{padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
  .home-g{padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
  .tabs{position:relative;flex:1;display:flex;flex-direction:column;gap:2px;padding:2px 12px 12px;overflow-y:auto;scrollbar-width:none;
    mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 18px),transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 10px 0 14px;border:0;border-radius:10px;background:transparent;text-align:left;
    color:rgba(255,255,255,.7);font:500 13.5px "Poppins",sans-serif;cursor:pointer;white-space:nowrap;transition:color .18s,background-color .18s}
  .tab svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .tab:hover{color:#fff;background:rgba(255,255,255,.06)}
  .tab[aria-selected="true"]{color:#fff;background:linear-gradient(90deg,rgba(226,196,138,.2),rgba(226,196,138,.05));box-shadow:inset 0 0 0 1px rgba(226,196,138,.14)}
  .tab[aria-selected="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
  .tab[aria-selected="true"] svg{color:var(--gold);opacity:1}
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  .tab[hidden]{display:none}
  .tab .star{margin-left:auto;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;color:rgba(255,255,255,.4);opacity:0;transition:opacity .15s,color .15s,background .15s}
  .tab .star svg{width:14px;height:14px;opacity:1}
  .tab:hover .star{opacity:1}.tab .star:hover{color:var(--gold);background:rgba(255,255,255,.08)}
  .tab .star.on{opacity:1;color:var(--gold)}.tab .star.on svg{fill:currentColor}
  .nav-g:not(.pins) .tab .star.on{opacity:0}.nav-g:not(.pins) .tab:hover .star.on{opacity:1}
  .tab mark{background:none;color:var(--gold);font-weight:600}
  .nores{display:none;padding:14px;font-size:12.5px;color:rgba(255,255,255,.45)}
  body.searching .nav-g .tab{display:none!important}body.searching .nav-g .tab.hit{display:flex!important}body.searching .nav-g::after{display:none}body.searching .home-g{border:0}body.searching .nav-g.pins{display:none!important}
  body.searching .nav-g:not(:has(.tab.hit)){display:none}body.searching .nav-t .ch{display:none}
  /* Kept open: the menu stays beside the page on wide screens */
  @media (min-width:1100px){
    body.docked .sidebar{transform:none;visibility:visible;box-shadow:none;transition:none}
    body.docked .frames{left:292px}
    body.docked .menu-btn,body.docked .edge,body.docked .scrim{display:none}
  }
  /* Signed-in person, at the bottom (auth.js puts the avatar here) */
  .shell-bar{position:relative;display:flex;align-items:center;gap:12px;margin:0 12px 14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
  .shell-bar .who{min-width:0;flex:1;order:2}
  .shell-bar .who b{display:block;font:600 13px "Poppins",sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shell-bar .who span{display:block;font:400 11.5px "Poppins",sans-serif;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shell-bar .user-menu{order:1;margin-left:0}
  .shell-bar .um-pop{top:auto;bottom:calc(100% + 16px);right:auto;left:-8px}
  .shell-bar .um-pop::before{top:auto;bottom:-7px;right:auto;left:20px;transform:rotate(225deg)}
  /* Notification bell, top right */
  .bell{position:fixed;top:10px;right:12px;z-index:45;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid rgba(91,42,134,.14);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);color:#5B2A86;cursor:pointer;box-shadow:0 6px 18px -10px rgba(43,24,64,.45)}
  .bell[hidden]{display:none}
  /* Refresh button, beside the bell: fetches the latest data for the page on screen */
  .rf{position:fixed;top:10px;right:12px;z-index:45;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid rgba(91,42,134,.14);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);color:#5B2A86;cursor:pointer;box-shadow:0 6px 18px -10px rgba(43,24,64,.45)}
  .rf[hidden]{display:none}.bell:not([hidden])~.rf{right:58px}
  .rf svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .rf:hover{background:#fff}.rf.spin svg{animation:rfspin .9s linear infinite}@keyframes rfspin{to{transform:rotate(360deg)}}
  .rf .tip{position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;background:#2B1840;color:#fff;font:500 12px "Poppins",sans-serif;border-radius:8px;padding:6px 9px;opacity:0;transform:translateY(-3px);transition:opacity .15s,transform .15s;pointer-events:none}
  .rf:hover .tip,.rf.show .tip{opacity:1;transform:none}
  .bell svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .bell b{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:999px;background:#5B2A86;color:#fff;font:700 10.5px/19px "Poppins",sans-serif;text-align:center;padding:0 5px;border:2px solid #F6F5F2}
  .bell b[hidden]{display:none}
  .npop{position:fixed;top:56px;right:12px;z-index:46;width:380px;max-width:calc(100vw - 24px);max-height:70vh;display:flex;flex-direction:column;background:#fff;border:1px solid #E4E1EA;border-radius:16px;box-shadow:0 24px 50px -20px rgba(31,16,41,.45);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
  .npop[hidden]{display:none}
  .npop h4{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font:600 15px "Poppins",sans-serif;color:#1D1B22;border-bottom:1px solid #EFEDF2}
  .npop h4 button{border:0;background:none;color:#5B2A86;font:600 12px inherit;cursor:pointer}
  .nlist{overflow:auto}
  .nit{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #EFEDF2;background:#fff;padding:11px 16px;font-size:13px;line-height:1.45;color:#3B3742;cursor:pointer}
  .nit:hover{background:#FBF9FD}.nit.new{background:#F8F4FC}
  .nit i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}.nit.new i{background:#5B2A86}
  .nit small{display:block;color:#9A96A3;font-size:11.5px;margin-top:2px}
  .nempty{padding:28px 16px;text-align:center;color:#9A96A3;font-size:13px}
  @media (prefers-reduced-motion:reduce){.sidebar,.scrim,.menu-btn{transition:none}}

  /* ── Brand look (Artium Colours & Typography): light lilac menu, violet accents, Onest ── */
  :root{--violet:#6601fd;--violet2:#4101f7;--pinkb:#dd30b1;--ink:#120e2b;--ink2:#4a4466;--ink3:#6a6488;--ink4:#7a7196;--hair:#dcd5ee;--edge:#e3d9fb}
  .sidebar{color:var(--ink);border-right:1px solid var(--hair);
    background:radial-gradient(140% 40% at 0% 0%,rgba(102,1,253,.10) 0%,rgba(102,1,253,0) 60%),radial-gradient(120% 30% at 100% 100%,rgba(221,48,177,.08) 0%,rgba(221,48,177,0) 70%),linear-gradient(180deg,#EFEAFB 0%,#E9E3F8 100%)}
  body.open .sidebar{box-shadow:24px 0 60px -30px rgba(43,2,86,.45)}
  .sidebar::before{display:none}
  .scrim{background:rgba(18,14,43,.18)}
  .brand{gap:12px;padding:24px 20px 20px;margin-bottom:14px;font-family:"Onest",sans-serif}
  .brand::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;background:linear-gradient(90deg,rgba(102,1,253,.35),rgba(221,48,177,.35),rgba(102,1,253,0))}
  .brand i{position:relative;overflow:hidden;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:800 18px "Onest",sans-serif;font-style:normal;color:#fff;
    background:linear-gradient(135deg,var(--violet),var(--violet2) 55%,var(--pinkb));box-shadow:0 8px 20px -8px rgba(102,1,253,.7)}
  .brand i::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%)}
  .brand b{display:block;font:800 16.5px "Onest",sans-serif;letter-spacing:-.01em;background:linear-gradient(90deg,var(--ink) 0%,var(--violet2) 75%,var(--pinkb) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{font:700 9.5px/1 "Onest",sans-serif;letter-spacing:.16em;color:var(--ink4);margin-top:5px}
  .sb-top{padding:0 16px 12px}
  .srch{height:38px;border-radius:12px;background:#fff;border:1px solid var(--hair);box-shadow:0 1px 2px rgba(18,14,43,.04),inset 0 1px 0 #fff}
  .srch:focus-within{background:#fff;border-color:#b9a4f5;box-shadow:0 0 0 3px rgba(102,1,253,.12)}
  .srch svg{stroke:var(--ink4)}
  .srch input{color:var(--ink);font:400 13.5px "Onest",sans-serif}.srch input::placeholder{color:var(--ink4)}
  .srch kbd{font-family:"Onest",sans-serif;color:var(--ink4);border-color:var(--hair)}
  .dock{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--hair);color:var(--ink3);box-shadow:0 1px 2px rgba(18,14,43,.04),inset 0 1px 0 #fff}
  .dock:hover{background:#fff;color:var(--violet2)}.dock[aria-pressed="true"]{color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet2));border-color:transparent}
  .nav-t{height:42px;font:500 14px "Onest",sans-serif;color:var(--ink2);border-radius:12px}
  .nav-t:hover{background:rgba(255,255,255,.55);color:var(--ink)}
  .nav-t .si{border-radius:9px;background:#fff;color:#6b3fc7;border:1px solid #e9e2fb;box-shadow:0 2px 6px -3px rgba(65,1,247,.25)}
  .nav-t .si svg{width:15px;height:15px}
  .nav-t .cnt{background:rgba(107,63,199,.1);color:#6b3fc7;font-family:"Onest",sans-serif}
  .nav-t .ch{stroke:var(--ink3)}
  .nav-g.open > .nav-t,.nav-g:has(.tab[aria-selected="true"]) > .nav-t{background:rgba(255,255,255,.6);color:var(--ink);font-weight:700}
  .nav-g:has(.tab[aria-selected="true"]) .si,.nav-g.open .si{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;border-color:transparent;box-shadow:0 6px 14px -6px rgba(65,1,247,.8)}
  .nav-g:not(.pins):has(.nav-t)::after{background:#d3c9ef}
  .pins-t,.lbl{display:flex;align-items:center;gap:8px;padding:10px 10px 6px;font:700 10px "Onest",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink4)}
  .pins-t::after{content:"";flex:1;height:1px;background:var(--hair)}
  .nav-g.pins,.home-g{border-bottom:1px solid var(--hair)}
  .tab{color:var(--ink2);font:500 13.5px "Onest",sans-serif}
  .tab:hover{color:var(--ink);background:rgba(255,255,255,.55)}
  .tab[aria-selected="true"]{color:var(--violet2);font-weight:700;background:linear-gradient(90deg,#fff 0%,#F7F2FF 100%);box-shadow:0 8px 20px -12px rgba(65,1,247,.55),inset 0 0 0 1px var(--edge)}
  .tab[aria-selected="true"]::before{left:-1px;width:3px;background:linear-gradient(180deg,var(--violet),var(--pinkb))}
  .tab[aria-selected="true"] svg{color:var(--violet2)}
  .tab:focus-visible{outline-color:var(--violet)}
  .tab .star{color:var(--ink4)}.tab .star:hover{color:var(--pinkb);background:#fff}.tab .star.on{color:var(--pinkb)}
  .tab mark{color:var(--violet2)}
  .nores{color:var(--ink4)}
  .home-g .tab svg,.nav-g.pins .tab svg{color:#6b3fc7;opacity:1}
  /* Account card at the bottom: the whole card opens the menu (profile photo, sign out) */
  .shell-bar{margin:10px 14px 16px;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid var(--edge);box-shadow:0 10px 24px -16px rgba(65,1,247,.45);cursor:pointer;transition:box-shadow .15s,border-color .15s}
  .shell-bar:hover{border-color:#cdbcf7;box-shadow:0 12px 28px -14px rgba(65,1,247,.55)}
  .shell-bar .who b{font:600 13.5px "Onest",sans-serif;color:var(--ink)}
  .shell-bar .who span{font:400 11.5px "Onest",sans-serif;color:var(--ink3)}
  .shell-bar .um-av{width:38px;height:38px;background:linear-gradient(135deg,var(--pinkb),#7b2cf0);font-family:"Onest",sans-serif;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #c9b6f7}
  .shell-bar .um-av:hover,.shell-bar .um-av[aria-expanded="true"]{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--violet)}
  .shell-bar .um-who .um-big{width:60px;height:60px;font-size:22px;box-shadow:0 0 0 3px #fff,0 0 0 4.5px #d9c9fb}
  .shell-bar .um-chev{order:3;margin-left:auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);flex:none}
  .shell-bar .um-chev svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .shell-bar .um-pop{left:-12px;bottom:calc(100% + 14px);width:266px;border-color:var(--edge);border-radius:18px;box-shadow:0 30px 60px -24px rgba(43,2,86,.55);cursor:default;font-family:"Onest",sans-serif}
  .shell-bar .um-pop::before{border-color:var(--edge)}

<script>
(function(){   // kept private so nothing here replaces the browser's own functions (e.g. window.open, which Google sign-in needs)
  let tabs = document.querySelectorAll(".tab");
  function show(name){
    if(!ArtiumAuth.user) return;   // nothing loads before sign-in
    const extra = String(name || "").includes("&") ? String(name).slice(String(name).indexOf("&")) : "";
    name = String(name || "").split("&")[0];
    if(!document.getElementById("frame-" + name)) name = "start";
    if(!ArtiumAuth.pages.includes(name)) name = ArtiumAuth.pages[0];   // only pages this person may open
    document.querySelectorAll(".tab[data-tab]").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name));
    document.querySelectorAll(".frames iframe").forEach(f => {
      const on = f.id === "frame-" + name;
      if(on && !f.getAttribute("src")) f.src = f.dataset.src + "?v=" + Date.now(); // load each page the first time it is opened, always the latest version
      else if(on && f.hidden && stale(f, 10)) setTimeout(() => refresh(false), 0);  // back on a page last refreshed 10+ minutes ago
      f.hidden = !on;
    });
    if(location.hash.slice(1).split("&")[0] !== name) history.replaceState(null, "", "#" + name + extra);
    const gm = extra.match(/g=(\w+)/);
    if(name === "goals" && gm){ try{ sessionStorage.setItem("artium_open_goal", gm[1]); const f = document.getElementById("frame-goals"); if(f.contentWindow && f.contentWindow.openGoal) f.contentWindow.openGoal(gm[1]); }catch(e){} }
    const tm = extra.match(/t=(\w+)/);
    if(name === "goals" && tm){ try{ const f = document.getElementById("frame-goals"); if(f.contentWindow && f.contentWindow.openTask) f.contentWindow.openTask(tm[1]); }catch(e){} }
  }

  /* Sidebar: opens when the mouse reaches the menu button or the left edge, closes when it leaves; a click or tap also toggles it */
  const body = document.body, side = document.getElementById("sidebar"), btn = document.getElementById("menu-btn");
  let closeTimer = null;
  function openMenu(){ clearTimeout(closeTimer); body.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
  function closeMenu(){ clearTimeout(closeTimer); if(document.activeElement && document.activeElement.id === "q") return; body.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
  function closeSoon(){ clearTimeout(closeTimer); closeTimer = setTimeout(() => { if(!side.querySelector(".um-pop.open")) closeMenu(); }, 260); }
  btn.addEventListener("mouseenter", openMenu);
  document.getElementById("edge").addEventListener("mouseenter", openMenu);
  side.addEventListener("mouseenter", openMenu);
  side.addEventListener("mouseleave", closeSoon);
  btn.addEventListener("click", () => body.classList.contains("open") ? closeMenu() : openMenu());
  document.getElementById("scrim").addEventListener("click", closeMenu);
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeMenu(); });
  // pages: a click anywhere in the list (pinned copies included); the star pins or unpins
  document.querySelector(".tabs").addEventListener("click", e => {
    const st = e.target.closest(".star"); if(st){ e.stopPropagation(); togglePin(st.closest(".tab").dataset.tab); return; }
    const h = e.target.closest(".nav-t"); if(h){ const g = h.parentNode; if(g.querySelector('.tab[aria-selected="true"]')) return; g.classList.toggle("open"); saveOpen(); return; }
    const t = e.target.closest(".tab[data-tab]"); if(t){ clearSearch(); show(t.dataset.tab); closeMenu(); }
  });

  /* ── Pinned pages, folded sections and "keep open": remembered in this browser ── */
  const ls = (k, v) => { try{ if(v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } };
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" stroke-linejoin="round"/></svg>';
  document.querySelectorAll(".nav-g .tab[data-tab]").forEach(t => { if(t.dataset.tab !== "start") t.insertAdjacentHTML("beforeend", `<span class="star" role="button" title="Pin to the top">${STAR}</span>`); });
  let PINS = ls("artium_nav_pins") || [];
  function renderPins(){
    const box = document.getElementById("pins");
    box.querySelectorAll(".tab").forEach(x => x.remove());
    const ok = PINS.map(k => document.querySelector(`.nav-g:not(.pins) .tab[data-tab="${k}"]`)).filter(t => t && !t.hidden);   // pinned copies keep their icon
    ok.forEach(t => { const c = t.cloneNode(true); c.removeAttribute("id"); const s = c.querySelector(".star"); s.classList.add("on"); s.title = "Unpin"; box.appendChild(c); });
    box.hidden = !ok.length;
    document.querySelectorAll(".nav-g:not(.pins) .star").forEach(s => { const on = PINS.includes(s.closest(".tab").dataset.tab); s.classList.toggle("on", on); s.title = on ? "Unpin" : "Pin to the top"; });
  }
  function togglePin(k){ PINS = PINS.includes(k) ? PINS.filter(x => x !== k) : PINS.concat(k); ls("artium_nav_pins", PINS); renderPins(); }
  // section icons
  const SI = {"Execs Call":'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',"Daily Operations":'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
    "Pipeline":'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',"Performance Tracking":'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',"Learners":'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
    "Experience":'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',"Funnel & Centres":'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    "Planner":'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M16 3v4M8 3v4M3 10h18"/>'};
  const nameOf = h => h.firstChild.textContent.trim();
  document.querySelectorAll(".nav-g .nav-t").forEach(h => { const n = nameOf(h); h.firstChild.remove(); h.insertAdjacentHTML("afterbegin", `<span class="si"><svg viewBox="0 0 24 24">${SI[n] || '<circle cx="12" cy="12" r="8"/>'}</svg></span><span class="sn"></span>`); h.querySelector(".sn").textContent = n; });
  const nameOfT = h => h.querySelector(".sn").textContent.trim();
  const saveOpen = () => ls("artium_nav_open", [...document.querySelectorAll(".nav-g.open .nav-t")].map(nameOfT));
  (ls("artium_nav_open") || []).forEach(n => document.querySelectorAll(".nav-g .nav-t").forEach(h => { if(nameOfT(h) === n) h.parentNode.classList.add("open"); }));
  function counts(){ document.querySelectorAll(".nav-g:not(.pins)").forEach(g => { const c = g.querySelector(".cnt"); if(c) c.textContent = g.querySelectorAll(".tab:not([hidden])").length; }); }
  const dock = document.getElementById("dock");
  function setDock(on){ body.classList.toggle("docked", on); dock.setAttribute("aria-pressed", on); dock.title = on ? "Hide the menu when not in use" : "Keep the menu open beside the page"; ls("artium_nav_dock", on); }
  dock.addEventListener("click", () => { setDock(!body.classList.contains("docked")); });
  setDock(!!ls("artium_nav_dock"));

  /* ── Find a page: type to filter; Enter opens the first match; "/" from anywhere opens the menu here ── */
  const q = document.getElementById("q");
  const label = t => t.textContent.trim();
  function search(){
    const v = q.value.trim().toLowerCase(), list = document.querySelectorAll(".nav-g:not(.pins) .tab[data-tab]:not([hidden])");
    body.classList.toggle("searching", !!v);
    let n = 0;
    list.forEach(t => {
      const h = t.closest(".nav-g").querySelector(".nav-t"), sec = h ? nameOfT(h).toLowerCase() : "";
      const hit = !!v && (label(t).toLowerCase().includes(v) || sec.includes(v));
      t.classList.toggle("hit", hit); if(hit) n++;
    });
    document.getElementById("nores").style.display = v && !n ? "block" : "none";
  }
  function clearSearch(){ if(q.value){ q.value = ""; search(); } }
  q.addEventListener("input", search);
  q.addEventListener("keydown", e => {
    if(e.key === "Enter"){ const t = document.querySelector(".tab.hit"); if(t){ show(t.dataset.tab); clearSearch(); q.blur(); closeMenu(); } }
    if(e.key === "Escape"){ e.stopPropagation(); if(q.value) clearSearch(); else { q.blur(); closeMenu(); } }
  });
  q.addEventListener("blur", () => setTimeout(() => { if(!side.matches(":hover")) closeSoon(); }, 150));
  function slash(e){ if(e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || "")) && !(e.target.isContentEditable)){ e.preventDefault(); openMenu(); q.focus(); } }
  document.addEventListener("keydown", slash);
  document.querySelectorAll(".frames iframe").forEach(f => f.addEventListener("load", () => { try{ f.contentWindow.document.addEventListener("keydown", slash); }catch(e){} }));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));

  // Name and email under the avatar at the bottom of the sidebar
  const esc = s => String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // Every sign-in (and every visit) starts on Home; pages are loaded only after sign-in
  ArtiumAuth.onReady(s => {
    const u = s || ArtiumAuth.user || {};
    document.getElementById("who").innerHTML = (u.name ? `<b>${esc(u.name)}</b>` : "") + `<span>${esc(u.email)}</span>`;
    const h = location.hash.slice(1);
    rf.hidden = false; renderPins(); counts();
    show(/^goals&[gt]=/.test(h) ? h : "start");   // an email link to a goal opens it; otherwise every visit starts on Home
    startBell();
  });

  /* ── Refresh: the button fetches the latest data for the page on screen (skipping the data service's short-term copy);
     the page also refreshes itself every 10 minutes while it is on screen, and when you come back to this tab after 2+ minutes away.
     An automatic refresh waits while a window is open, something is being typed or a slideshow is full screen. ── */
  const rf = document.getElementById("rf"), rfTip = document.getElementById("rf-tip");
  const LAST = new WeakMap();   // when each page last fetched its data
  const cur = () => document.querySelector(".frames iframe:not([hidden])");
  const stale = (f, min) => f && f.getAttribute("src") && Date.now() - (LAST.get(f) || 0) >= min * 60000;
  const hhmm = t => new Date(t).toLocaleTimeString("en-IN", {hour:"numeric", minute:"2-digit"});
  document.querySelectorAll(".frames iframe").forEach(f => f.addEventListener("load", () => { LAST.set(f, Date.now()); if(f === cur()) tip(); }));
  function tip(){ const f = cur(), t = f && LAST.get(f); rfTip.textContent = t ? "Refresh · updated " + hhmm(t) + "." : "Refresh."; }
  function busy(f){
    try{
      const w = f.contentWindow, d = w.document;
      if(d.fullscreenElement) return true;
      if(typeof w.artiumBusy === "function" && w.artiumBusy()) return true;
      const a = d.activeElement;
      if(a && (a.isContentEditable || a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && /^(text|number|email|search|tel|url|)$/.test(a.type)))) return true;
      return [...d.querySelectorAll('[role="dialog"],[aria-modal="true"],dialog[open],.modal,.dlg,.win')].some(e => {
        if(e.hidden || !e.getClientRects().length) return false;
        const cs = w.getComputedStyle(e); return cs.display !== "none" && cs.visibility !== "hidden" && +cs.opacity > 0.05;
      });
    }catch(e){ return true; }
  }
  let refreshing = false;
  async function refresh(manual){
    const f = cur(); if(!f || !f.getAttribute("src") || refreshing) return;
    if(busy(f) && (!manual || !confirm("Something is open or being edited on this page. Refresh anyway? Anything not saved will be lost."))) return;
    refreshing = true; rf.classList.add("spin");
    if(manual) ArtiumAuth.freshUntil = Date.now() + 60000;   // ask the data service for the newest data, not its saved copy
    try{
      const w = f.contentWindow;
      if(typeof w.artiumRefresh === "function") await w.artiumRefresh(manual);
      else if(typeof w.load === "function") await w.load(true);      // pages re-fetch their data and keep what you had selected
      else {                                                         // a page without its own refresh: reload it where you were
        const y = w.scrollY;
        await new Promise(res => { f.addEventListener("load", () => { try{ f.contentWindow.scrollTo(0, y); }catch(e){} res(); }, {once:true}); w.location.reload(); });
      }
    }catch(e){}
    LAST.set(f, Date.now()); refreshing = false; rf.classList.remove("spin"); tip();
  }
  rf.addEventListener("click", () => refresh(true));
  rf.addEventListener("mouseenter", tip);
  setInterval(() => { if(document.visibilityState === "visible" && stale(cur(), 10)) refresh(false); }, 30000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && stale(cur(), 2)) refresh(false); });

  /* Notification bell: activity on goals (updates, status changes), checked every 2 minutes */
  const bell = document.getElementById("bell"), pop = document.getElementById("npop");
  const ST = {tbp:"To be picked", inp:"In progress", cmp:"Completed"};
  const ago = s => { const m = Math.round((Date.now() - new Date(s)) / 6e4); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m/60) + " h ago" : m < 2880 ? "Yesterday" : new Date(s).toLocaleDateString("en-IN", {day:"numeric", month:"short"}); };
  function bellRender(j){
    const n = j.unread || 0, b = document.getElementById("bell-n"); b.hidden = !n; b.textContent = n > 9 ? "9+" : n;
    document.getElementById("nlist").innerHTML = (j.items || []).length ? j.items.map(a => {
      const who = esc(a.name || a.by.split("@")[0]); let t = "";
      if(a.kind === "update") t = `<b>${who}</b> posted an update on <b>${esc(a.title)}</b>: “${esc(a.text.slice(0, 90))}${a.text.length > 90 ? "…" : ""}”${a.files && a.files.length ? " 📎" : ""}`;
      else if(a.kind === "status"){ let x = {}; try{ x = JSON.parse(a.text); }catch(e){} t = `<b>${who}</b> set <b>${esc(x.what || a.title)}</b> to <b>${ST[x.s] || ""}</b> for ${esc(x.centre || "")}`; }
      else if(a.kind === "completed") t = `<b>${esc(a.title)}</b> is completed at every centre`;
      else t = `<b>${who}</b> created the goal <b>${esc(a.title)}</b>`;
      return `<button type="button" class="nit${a.unread ? " new" : ""}" data-g="${esc(a.goal)}"><i></i><span>${t}<small>${ago(a.at)}</small></span></button>`; }).join("") : '<div class="nempty">Nothing yet. Updates and status changes on goals show up here.</div>';
  }
  async function bellLoad(){ try{ bellRender(await ArtiumAuth.call("notifications", {})); }catch(e){} }
  function startBell(){
    if(!ArtiumAuth.pages.includes("goals")) return;
    bell.hidden = false; bellLoad(); setInterval(bellLoad, 120000);
  }
  bell.addEventListener("click", e => { e.stopPropagation(); pop.hidden = !pop.hidden; if(!pop.hidden) bellLoad(); });
  document.getElementById("nread").addEventListener("click", async e => { e.stopPropagation(); try{ bellRender(await ArtiumAuth.call("notifRead", {})); }catch(err){} });
  document.getElementById("nlist").addEventListener("click", e => { const b = e.target.closest(".nit"); if(!b) return; pop.hidden = true; show("goals&g=" + b.dataset.g); });
  document.addEventListener("click", e => { if(!pop.hidden && !pop.contains(e.target)) pop.hidden = true; });
  window.addEventListener("blur", () => { pop.hidden = true; });
})();
</script>
</body>
</html>
