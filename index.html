<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artium Academy — Offline Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#17213C;--blue:#2563EB;--border:#E2E8F0;--sec:#64748B;--bg:#F0F4F8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:flex;flex-direction:column;background:var(--bg);font-family:"Inter",sans-serif;overflow:hidden}
  .shell-bar{flex-shrink:0;display:flex;align-items:center;gap:24px;height:52px;padding:0 20px;background:var(--navy);color:#fff}
  .brand{font-family:"Manrope",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand span{color:#60A5FA}
  .tabs{display:flex;gap:4px;height:100%;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{position:relative;display:flex;align-items:center;padding:0 14px;height:100%;border:0;background:none;color:#CBD5E1;font:600 13px "Inter",sans-serif;cursor:pointer;white-space:nowrap}
  .tab:hover{color:#fff}
  .tab[aria-selected="true"]{color:#fff}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#60A5FA}
  .tab:focus-visible{outline:2px solid #60A5FA;outline-offset:-4px;border-radius:6px}
  .frames{flex:1;position:relative}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .frames iframe[hidden]{display:none}
  @media (max-width:640px){
    .shell-bar{gap:12px;padding:0 12px}
    .brand .full{display:none}
    .tab{padding:0 10px;font-size:12px}
  }
</style>
<script src="auth.js"></script>
</head>
<body>
  <header class="shell-bar">
    <div class="brand">Artium <span>●</span> <span class="full" style="color:inherit">Offline </span>Intelligence</div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="centres" aria-selected="true">Offline Centres</button>
      <button class="tab" role="tab" data-tab="dashboard" aria-selected="false">Lead to Purchase</button>
      <button class="tab" role="tab" data-tab="performance" aria-selected="false">Monthly Performance</button>
      <button class="tab" role="tab" data-tab="learners" aria-selected="false">Monthly Active Learners</button>
    </nav>
  </header>
  <main class="frames">
    <iframe id="frame-centres" data-src="dfd.html" title="Offline Centres"></iframe>
    <iframe id="frame-dashboard" data-src="dashboard.html" title="Lead to Purchase Dashboard" hidden></iframe>
    <iframe id="frame-performance" data-src="performance.html" title="Monthly Performance Analysis" hidden></iframe>
    <iframe id="frame-learners" data-src="learners.html" title="Monthly Active Learners" hidden></iframe>
  </main>
<script>
  const tabs = document.querySelectorAll(".tab");
  function show(name){
    if(!ArtiumAuth.user) return;   // nothing loads before sign-in
    if(!document.getElementById("frame-" + name)) name = "centres";
    if(!ArtiumAuth.pages.includes(name)) name = ArtiumAuth.pages[0];   // only pages this person may open
    tabs.forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name));
    document.querySelectorAll(".frames iframe").forEach(f => {
      const on = f.id === "frame-" + name;
      if(on && !f.getAttribute("src")) f.src = f.dataset.src + "?v=" + Date.now(); // load each page the first time it is opened, always the latest version
      f.hidden = !on;
    });
    if(location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  }
  tabs.forEach(t => t.addEventListener("click", () => show(t.dataset.tab)));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  ArtiumAuth.onReady(() => show(location.hash.slice(1) || "centres")); // pages load only after sign-in
</script>
</body>
</html>
